# [2482] A giant crevice appeared in Bifrost, the bridge between Splendide, the end of the world and the floating continent of Alfheim, and you do not know the source of the labyrinth forest.
"MSI_QUEST_INFO_01": "Una enorme grieta apareció en Bifrost, el puente que une Splendide, el fin del mundo, con el continente flotante de Alfheim, y nadie conoce el origen del bosque laberinto."
# [2483] This is a marker indicating the end of the trip, a new world is opening indicators! Guardian, such as the lyrics to the temptation was gradually losing the soul.
"MSI_QUEST_INFO_02": "Esta señal marca el final del viaje: ¡se abre un mundo nuevo! El guardián, hechizado por ese canto de tentación, perdía poco a poco su alma."
# [2484] For thousands of years, a mysterious melody has mesmerized the guardian. After a millennia of slumber, the guardian became confused about what he had been protecting all these years, and began to suspect that he might be the one who has been sealed and hidden away.
"MSI_QUEST_INFO_03": "Durante miles de años, una melodía misteriosa hechizó al guardián. Tras un milenio de letargo, el guardián olvidó qué había estado protegiendo todo ese tiempo y empezó a sospechar que quizá él mismo era el que había sido sellado y ocultado."
# [2485] When the melody reached its peak, a giant crevice appeared in Bifrost, the bridge between Splendide, the end of the world and the floating continent of Alfheim. As a result, the two worlds were cut off from each other, causing a big problem for the people.
"MSI_QUEST_INFO_04": "Cuando la melodía alcanzó su punto álgido, una enorme grieta se abrió en Bifrost, el puente que une Splendide, el fin del mundo, con el continente flotante de Alfheim. Ambos mundos quedaron incomunicados, lo que causó un grave problema a sus habitantes."
# [2486] Now, the only way to get to Bifrost is through the Labyrinth Forest. Nobody knows how the forest came to exist, and nobody has ever come out of it alive...
"MSI_QUEST_INFO_05": "Ahora, el único camino hacia Bifrost pasa por el Bosque Laberinto. Nadie sabe cómo surgió ese bosque, y nadie ha salido nunca de él con vida..."
# [2487] Swallowed countless adventurers to put a hell of confusion, wandering in the forest labyrinth of nowhere, like the heart of a woman was being extend deeper confusion.
"MSI_QUEST_INFO_06": "Ha devorado a incontables aventureros en un infierno de confusión; vagar por ese bosque laberinto sin salida, tan insondable como el corazón de una mujer, solo hunde más en el desconcierto."
