# [2485] When the melody reached its peak, a giant crevice appeared in Bifrost, the bridge between Splendide, the end of the world and the floating continent of Alfheim. As a result, the two worlds were cut off from each other, causing a big problem for the people.
"MSI_QUEST_INFO_04": "Lorsque la mélodie atteignit son apogée, une immense crevasse s'ouvrit à Bifrost, le pont reliant Splendide, la fin du monde, au continent flottant d'Alfheim. Les deux mondes se retrouvèrent coupés l'un de l'autre, au grand malheur de leurs habitants."
# [2486] Now, the only way to get to Bifrost is through the Labyrinth Forest. Nobody knows how the forest came to exist, and nobody has ever come out of it alive...
"MSI_QUEST_INFO_05": "Désormais, le seul chemin vers Bifrost passe par la Forêt-Labyrinthe. Nul ne sait comment cette forêt est apparue, et nul n'en est jamais ressorti vivant..."
# [2487] Swallowed countless adventurers to put a hell of confusion, wandering in the forest labyrinth of nowhere, like the heart of a woman was being extend deeper confusion.
