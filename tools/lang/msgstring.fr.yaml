"MSI_QUEST_INFO_01": "Une immense crevasse est apparue à Bifrost, le pont reliant Splendide, la fin du monde, au continent flottant d'Alfheim, et nul ne connaît l'origine de la forêt-labyrinthe."
# [2483] This is a marker indicating the end of the trip, a new world is opening indicators! Guardian, such as the lyrics to the temptation was gradually losing the soul.
"MSI_QUEST_INFO_02": "Ce repère marque la fin du voyage : un monde nouveau s'ouvre ! Le gardien, envoûté par ce chant de tentation, perdait peu à peu son âme."
# [2484] For thousands of years, a mysterious melody has mesmerized the guardian. After a millennia of slumber, the guardian became confused about what he had been protecting all these years, and began to suspect that he might be the one who has been sealed and hidden away.
