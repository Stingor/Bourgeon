"Affiche une ville du serveur en direct derrière cet écran, tirée au hasard à chaque connexion. Décoche si ta machine ou ta connexion préfèrent s'en passer.": "Shows one of the server's towns live behind this screen, drawn at random on every connection. Uncheck it if your machine or your connection would rather do without."
