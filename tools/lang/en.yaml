"Attaque de base + attaque d'arme (batk + atk2), plafonnée à 32767.\nC'est le dégât AVANT défense de la cible.": "Base attack + weapon attack (batk + atk2), capped at 32767.\nThis is the damage BEFORE the target's defence."
"Attaque magique MAXIMALE. Sur ce serveur HOMSET_SAME_MATK est actif :\nle minimum est égal au maximum, il n'y a donc pas de fourchette.": "MAXIMUM magic attack. On this server HOMSET_SAME_MATK is on:\nthe minimum equals the maximum, so there is no range."
"Précision = min(niveau, 600) + DEX.\nChance de toucher = 80 + HIT - FLEE de la cible, bornée à 5..100 %.": "Accuracy = min(level, 600) + DEX.\nHit chance = 80 + HIT - the target's FLEE, clamped to 5..100 %."
"/!\\ CE N'EST PAS UN TAUX DE CRITIQUE. Le serveur envoie ici LUK/3 + 1\n(option HOMSET_DISPLAY_LUK). Un homoncule ne fait JAMAIS de critique :\nenable_critical ne couvre que les joueurs et les mercenaires.\nÀ lire comme un indicateur de LUK — donc ici LUK vaut environ (valeur - 1) x 3.": "/!\\ THIS IS NOT A CRITICAL RATE. The server sends LUK/3 + 1 here\n(HOMSET_DISPLAY_LUK option). A homunculus NEVER lands a critical:\nenable_critical only covers players and mercenaries.\nRead it as a LUK gauge — so LUK is roughly (value - 1) x 3."
"Somme de DEUX choses de natures différentes : DEF dure + VIT.\n• DEF dure = réduction en POURCENTAGE (dégâts x (100 - DEF) / 100).\n• VIT alimente la DEF douce, une réduction PLATE soustraite ensuite,\n  avec une part aléatoire : DEF2 + rnd(0, (DEF2/20)²).\nLe nombre affiché ne se lit donc ni en % ni en plat — c'est un total\nd'affichage hérité d'Aegis.": "The sum of TWO different things: hard DEF + VIT.\n• Hard DEF = a PERCENTAGE cut (damage x (100 - DEF) / 100).\n• VIT feeds soft DEF, a FLAT cut subtracted afterwards,\n  with a random part: DEF2 + rnd(0, (DEF2/20)²).\nSo the number reads neither as a % nor as a flat value — it is a\ndisplay total inherited from Aegis."
"MDEF dure SEULE, en POURCENTAGE (dégâts magiques x (100 - MDEF) / 100).\n/!\\ La MDEF douce (INT + VIT/2), soustraite à plat après, n'est PAS\ncomptée ici — la résistance réelle est supérieure à ce chiffre.": "Hard MDEF ONLY, as a PERCENTAGE (magic damage x (100 - MDEF) / 100).\n/!\\ Soft MDEF (INT + VIT/2), subtracted flat afterwards, is NOT\ncounted here — the real resistance is higher than this figure."
"Esquive = min(niveau, 600) + AGI. Elle se retranche directement de la\nprécision de l'attaquant. -10 % par assaillant au-delà du deuxième.\nL'esquive parfaite (LUK) n'est pas transmise pour un homoncule.": "Dodge = min(level, 600) + AGI. It is subtracted straight from the\nattacker's accuracy. -10 % per attacker beyond the second one.\nPerfect dodge (LUK) is not sent for a homunculus."
"Vitesse d'attaque = (2000 - amotion) / 10, calculée par le client.\nDélai d'attaque brut : %d ms — c'est LUI que le serveur envoie.": "Attack speed = (2000 - amotion) / 10, computed by the client.\nRaw attack delay: %d ms — THAT is what the server sends."
"Portée d'attaque : %d": "Attack range: %d"
"En cases. 1 = corps à corps ; au-delà, l'homoncule frappe à distance sans se déplacer.": "In cells. 1 = melee; beyond that the homunculus strikes at range without moving."
"Aucune compétence reçue du serveur.": "No skill received from the server."
"Double-clic : lancer  ·  Glisser : poser dans la barre\nClic droit : description": "Double-click: cast  ·  Drag: drop onto the bar\nRight click: description"
