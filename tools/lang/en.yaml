"Tous les ids présents dans la capture, au format id×nombre.\nAttendu : l'id concret de l'effet spawné. Une valeur DIFFÉRENTE\nsignifie que le nœud porte un autre id que celui résolu par Lua.\n-1 = famille CEffectMgr.": "Every id present in the capture, as id×count.\nExpected: the concrete id of the spawned effect. A DIFFERENT value\nmeans the node carries another id than the one Lua resolved.\n-1 = CEffectMgr family."
