"Pas de réponse : la fabrication a probablement ÉCHOUÉ. La cuisine ne renvoie aucun message quand elle rate - seulement un effet visuel. Les matériaux sont consommés et la maîtrise culinaire baisse. Regarde les chances annoncées avant de recommencer. (Une demande refusée à la revalidation aurait le même silence, mais n'aurait rien consommé.)": "No answer: the craft probably FAILED. Cooking sends no message when it fails - only a visual effect. The materials are consumed and cooking mastery drops. Look at the announced odds before starting again. (A request refused at revalidation would be just as silent, but would have consumed nothing.)"
"Pas de réponse : la fabrication a probablement ÉCHOUÉ - ces compétences ne renvoient aucun message, ni en cas de succès ni en cas d'échec. Autre possibilité : une demande refusée à la revalidation des matériaux, qui elle n'aurait rien consommé.": "No answer: the craft probably FAILED - these skills send no message, neither on success nor on failure. The other possibility is a request refused at material revalidation, which would have consumed nothing."
