"Le client d'origine refuse d'ouvrir la fiche des cinq Gardiens\n(Archer, Knight, Soldier, Sword, Bow) : leurs PV resteraient cachés\npendant la Guerre d'Emperium. Coché, la fiche s'ouvre quand même.": "The original client refuses to open the sheet of the five Guardians\n(Archer, Knight, Soldier, Sword, Bow): their HP would stay hidden\nduring the War of Emperium. Ticked, the sheet opens anyway."
