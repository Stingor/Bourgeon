"Emotes et emoji.\nUne emote part à %s aussitôt, seule ; un emoji s'ajoute à ta réponse.": "Emotes and emoji.\nAn emote goes straight to %s, on its own; an emoji is added to your reply."
"Répondre à %s": "Reply to %s"
"Clic droit : options du log de « %s »\nGlisser : réordonner, ou vers une autre fenêtre, ou dehors": "Right click: log options for « %s »\nDrag: reorder, or to another window, or outside"
"Exporter en GIF": "Export as GIF"
"Ecrit un GIF par emote dans « emotes_export »,\na cote de l'executable. Pour Discord.": "Writes one GIF per emote into « emotes_export »,\nnext to the executable. For Discord."
"Destinataire du chuchotement.\nClic droit : les récents.": "Whisper recipient.\nRight click: the recent ones."
"Où part ce que tu écris.\nEn tête de phrase, sans toucher au réglage :\n  %c groupe (ou Ctrl)   %c guilde (ou Alt)   %c alliés (ou Verr.Maj)\nLe préfixe RENVOIE au public quand c'est déjà le canal choisi.": "Where what you type goes.\nAt the start of a sentence, without touching the setting:\n  %c party (or Ctrl)   %c guild (or Alt)   %c allies (or Caps Lock)\nThe prefix sends it BACK to public when that channel is already the one selected."
"%s\nLecture seule.": "%s\nRead only."
"Emotes et emoji.\nUne emote part SEULE, en clair (« :smile: ») : tout le monde la lit.\nUn emoji, lui, s'ajoute à ta phrase.": "Emotes and emoji.\nAn emote goes out ON ITS OWN, in plain text (« :smile: »): everyone reads it.\nAn emoji, on the other hand, is added to your sentence."
"Renommer le canal — Entrée pour valider.": "Rename the channel — Enter to confirm."
"Rattacher à la fenêtre principale": "Reattach to the main window"
"Détacher dans sa propre fenêtre": "Detach into its own window"
"Le dernier onglet ne peut pas être détaché.": "The last tab cannot be detached."
"Fige la position et la taille de cette fenêtre-là. Les onglets, les menus et l'arrachage continuent de fonctionner —\nc'est la géométrie qui est verrouillée, pas la fenêtre.\n\nChaque fenêtre a le sien : une flottante qu'on détache naît libre.": "Freezes the position and size of that particular window. Tabs, menus and tearing off keep working —\nit is the geometry that is locked, not the window.\n\nEach window has its own: a floating one you tear off is born free."
"Nouvel onglet": "New tab"
"Maximum atteint : %d canaux, onglets et fenêtres détachées confondus.\nC'est la limite du client, pas la nôtre.": "Maximum reached: %d channels, tabs and detached windows together.\nThat is the client's limit, not ours."
"Fermer l'onglet": "Close the tab"
"Fermer l'onglet ?###chat_close_confirm": "Close the tab?###chat_close_confirm"
"Fermer la conversation ?###chat_close_confirm": "Close the conversation?###chat_close_confirm"
"Fermer l'onglet « %s » ?": "Close the tab \"%s\"?"
"Fermer la conversation avec %s ?": "Close the conversation with %s?"
"Rien n'est perdu : le journal garde les messages, et\nrouvrir la conversation les remontrera.": "Nothing is lost: the log keeps the messages, and\nreopening the conversation will show them again."
"Ses réglages partent avec lui : les filtres du log, son\napparence propre, son nom. Un onglet ne se rouvre pas —\nil faudra le recréer et le régler à nouveau.": "Its settings go with it: the log filters, its own\nappearance, its name. A tab does not reopen —\nyou will have to recreate it and set it up again."
"Les messages, eux, RESTENT : ils vivent dans un journal\ncommun à toutes les fenêtres, et les autres onglets\ncontinuent de les afficher.": "The messages themselves REMAIN: they live in a log\nshared by every window, and the other tabs\nkeep showing them."
"Il doit rester au moins un onglet dans la fenêtre principale.": "At least one tab must remain in the main window."
"propre à cet onglet": "specific to this tab"
"générale": "general"
"Tout cocher": "Tick everything"
"Tout décocher": "Untick everything"
"Vider cet onglet": "Clear this tab"
"Masque ce que cet onglet affiche aujourd'hui ; la suite s'affichera normalement.\n\nRien n'est détruit : les autres onglets gardent ces lignes, l'historique enregistré aussi,\net « Réafficher tout » les ramène ici.": "Hides what this tab shows right now; whatever comes next shows normally.\n\nNothing is destroyed: the other tabs keep those lines, so does the saved history,\nand \"Show everything again\" brings them back here."
"Réafficher tout": "Show everything again"
"Annule le vidage : cet onglet remontre tout ce que ses filtres acceptent.\n\nSauf ce que l'éviction a évacué entre-temps — le tampon ne garde qu'un nombre de lignes borné.": "Undoes the clearing: this tab shows again everything its filters accept.\n\nExcept what eviction has dropped in the meantime — the buffer only keeps a bounded number of lines."
"Aucun destinataire récent": "No recent recipient"
"Vider la liste": "Empty the list"
"Remplacement de la chatbox : mêmes canaux, mêmes filtres et même chemin d'envoi que le client. La fenêtre native reste ouverte à côté tant que la bascule complète n'est pas faite.": "A replacement for the chatbox: same channels, same filters and same send path as the client. The native window stays open alongside until the switch is complete."
"Une adresse postée dans le chat vient d'un autre joueur, et le texte affiché n'a aucun rapport obligé avec la destination réelle. La confirmation montre l'adresse COMPLÈTE avant d'ouvrir le navigateur.\n\nEn la décochant, un clic sur un lien ouvre directement le navigateur.": "An address posted in the chat comes from another player, and the text shown bears no necessary relation to the real destination. The confirmation shows the FULL address before opening the browser.\n\nUnticking it, a click on a link opens the browser straight away."
"Survoler un lien d'image en montre le contenu, sans ouvrir le navigateur.\n\nLes images ne sont chargées que depuis des hébergeurs connus (Discord, imgur, le site Moonlight). C'est ce qui rend l'aperçu sûr : sur ces serveurs-là, celui qui a posté le lien ne peut pas savoir qui l'a regardé. Un lien vers n'importe quel autre site reste un lien ordinaire, à ouvrir soi-même.": "Hovering an image link shows its content, without opening the browser.\n\nImages are only loaded from known hosts (Discord, imgur, the Moonlight site). That is what makes the preview safe: on those servers, whoever posted the link cannot know who looked at it. A link to any other site stays an ordinary link, to be opened yourself."
"  Vos sites autorisés :": "  Your allowed sites:"
"Police du fil de discussion. « Système » garde celle du reste de l'interface.\n\nLes autres sont latines : un caractère coréen y apparaîtrait en carré. Sans effet en jeu, où tout est en français ou en anglais.": "Font of the conversation feed. « System » keeps the one used by the rest of the interface.\n\nThe others are Latin: a Korean character would show as a square. No effect in game, where everything is in French or in English."
"Affiche les images et les emotes du fil sous forme de vignettes.\n\nDécoché, un lien reste une adresse cliquable et une emote son « :nom: » — et rien n'est téléchargé.": "Shows the feed's images and emotes as thumbnails.\n\nUnticked, a link stays a clickable address and an emote its « :name: » — and nothing is downloaded."
"Hauteur des vignettes, de 24 à 128 pixels.\n\nAu-delà d'une hauteur de ligne, la ligne s'agrandit pour accueillir l'image : le fil reste lisible, il s'aère.": "Thumbnail height, from 24 to 128 pixels.\n\nBeyond one line height, the line grows to hold the image: the feed stays readable, it just breathes more."
"Fait apparaître un bouton au bas de la grille d'emotes.\n\nIl écrit un GIF par emote dans « emotes_export », à côté de l'exécutable, sous le nom que le relais Discord attend. À déposer ensuite dans images/smilies/ du site.\n\nRéservé au staff, et éteint à chaque session : c'est une manipulation ponctuelle, pas un réglage.": "Makes a button appear at the bottom of the emote grid.\n\nIt writes one GIF per emote into « emotes_export », next to the executable, under the name the Discord relay expects. To be dropped afterwards into the site's images/smilies/.\n\nStaff only, and off every session: it is a one-off operation, not a setting."
"Ouvre une fenêtre de conversation séparée quand un joueur chuchote.\n\nCe sont les réglages du CLIENT (Alt+I, « Friend Setup ») : les changer ici les change là-bas, et inversement.\n\nDécochés, les chuchotements restent de simples lignes dans le chat.": "Opens a separate conversation window when a player whispers you.\n\nThese are the CLIENT's settings (Alt+I, « Friend Setup »): changing them here changes them there, and the other way round.\n\nUnticked, whispers stay plain lines in the chat."
"Ignore les filtres de canal et préfixe chaque ligne du type que le client nous a transmis (t00 à t24). Une ligne visible ici mais absente d'un onglet a été écartée par un filtre ; une ligne absente même ici n'est jamais arrivée jusqu'à nous.": "Ignores the channel filters and prefixes every line with the type the client passed us (t00 to t24). A line visible here but missing from a tab was set aside by a filter; a line missing even here never reached us at all."
"Lignes vues par le détour : %u · retenues : %u · en mémoire : %d": "Lines seen through the hook: %u · kept: %u · in memory: %d"
"Compté PAR TYPE de message — parole, combat, guilde, groupe, chuchotement… — et non pour l'ensemble du chat.\n\nC'est ce qui empêche un donjon d'effacer vos conversations : une rafale de lignes de dégâts n'évince que des lignes de dégâts, et ce qui a été dit il y a dix minutes reste là.\n\nLe tampon est commun à tous les onglets — une même ligne s'affiche dans plusieurs à la fois — mais chaque type y garde sa place.": "Counted PER MESSAGE TYPE — speech, combat, guild, party, whisper… — and not for the chat as a whole.\n\nThat is what stops a dungeon from wiping your conversations: a burst of damage lines only evicts damage lines, and what was said ten minutes ago stays put.\n\nThe buffer is shared by every tab — the same line shows in several at once — but each type keeps its own room in it."
"Réaffiche les dernières lignes de la session précédente à la reconnexion, précédées d'un séparateur.\n\nATTENTION : elles sont écrites en clair dans SaveData\\bourgeon_chat_history.yaml, CHUCHOTEMENTS COMPRIS. Sur une machine partagée, n'importe qui peut les lire.": "Shows the last lines of the previous session again on reconnection, preceded by a separator.\n\nBEWARE: they are written in plain text into SaveData\\bourgeon_chat_history.yaml, WHISPERS INCLUDED. On a shared machine, anyone can read them."
"Apparence de la chatbox ImGui": "Appearance of the ImGui chatbox"
"Réglages généraux — un onglet peut avoir les siens": "General settings — a tab may have its own"
"Clic droit sur un onglet → « Apparence ». Un onglet qui n'a pas ses propres réglages SUIT ceux-ci : le changer ici le déplace aussi.": "Right-click a tab → « Appearance ». A tab without its own settings FOLLOWS these: changing it here moves it too."
"Onglets, boutons et ligne de saisie. Séparée de la taille du chat : grossir le texte qu'on lit ne doit pas faire enfler la bande d'onglets, qui mangerait la fenêtre.": "Tabs, buttons and the input line. Kept separate from the chat size: enlarging the text you read must not swell the tab strip, which would eat the window."
"Autoriser les chuchotements": "Allow whispers"
"Bloquer les chuchotements": "Block whispers"
"Copier l'AID": "Copy the AID"
"Copier le GID": "Copy the GID"
"%s | AID %u (0x%08X) | job %u": "%s | AID %u (0x%08X) | job %u"
"Le client n'ouvrait de menu que sur un joueur, son pet, son homoncule ou son mercenaire. Coché, le menu s'ouvre aussi sur les monstres, les NPC et les objets au sol (ramasser, description, ramassage automatique).": "The client only opened a menu on a player, their pet, their homunculus or their mercenary. Ticked, the menu also opens on monsters, NPCs and items on the ground (pick up, description, auto-loot)."
"Le menu sur son propre personnage ne porte que « Copier mon nom » (plus les identifiants sous « Outils du staff »). Décoché, le clic droit sur soi-même repart au client sans rien ouvrir ni rien avaler.\nSans « Sur toutes les entités », ce menu ne s'ouvre de toute façon jamais : le client n'en a jamais eu sur soi.": "The menu on your own character only carries \"Copy my name\" (plus the identifiers under \"Staff tools\"). Unticked, right-clicking yourself goes back to the client without opening anything or swallowing the click.\nWithout \"On every entity\" that menu never opens anyway: the client never had one on yourself."
"Carte introuvable": "Card not found"
"Impossible de retrouver les équipements proposés par le serveur.": "Could not retrieve the equipment offered by the server."
"Aucun équipement compatible avec un emplacement libre.": "No equipment compatible with a free slot."
"Choisissez l'équipement à sertir :": "Pick the equipment to socket:"
"ON : inventaire ImGui moderne (grille d'icônes, onglets, recherche, double-clic utiliser/équiper, clic-droit, drag) et la fenêtre native est cachée.\nOFF (défaut) : inventaire natif classique, aucun viewer.\n\nInclut la fenêtre de SERTISSAGE de cartes (double-clic sur une carte) : elle remplace le popup natif « Insert Card ». La liste des équipements compatibles reste calculée par le serveur, donc identique au natif.": "ON: modern ImGui inventory (icon grid, tabs, search, double-click to use/equip, right click, drag), and the native window is hidden.\nOFF (default): classic native inventory, no viewer.\n\nIncludes the card SOCKETING window (double-click a card): it replaces the native « Insert Card » popup. The list of compatible equipment is still computed by the server, so it is identical to the native one."
"ON (défaut) : onglets en colonne à gauche de la grille, comme la fenêtre native (images tab_*).\nOFF : rangée horizontale au-dessus de la grille (images tabh_*).": "ON (default): tabs in a column left of the grid, like the native window (tab_* images).\nOFF: horizontal row above the grid (tabh_* images)."
"Placement libre des items": "Free item placement"
"Glisse un item sur une case vide pour l'y fixer ; sur une case occupée, les deux s'échangent. Les items sans case attribuée remplissent les trous restants, donc un nouvel objet ramassé ne bouscule plus ta disposition.\n\nL'onglet « Tout » n'est PAS concerné : il mélange les catégories, donc une case n'y désigne pas le même emplacement que dans l'onglet d'origine de l'item. Il garde le remplissage automatique.\n\nNécessite « Verrouiller la taille » : les cases sont repérées par un index absolu, qu'un changement de largeur décalerait.": "Drag an item onto an empty slot to pin it there; onto an occupied one, the two swap. Items with no assigned slot fill the remaining gaps, so a newly picked-up object no longer disturbs your layout.\n\nThe « All » tab is NOT concerned: it mixes categories, so a slot there does not designate the same place as in the item's own tab. It keeps automatic filling.\n\nRequires « Lock size »: slots are identified by an absolute index, which a change of width would shift."
