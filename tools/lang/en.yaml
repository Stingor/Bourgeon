"Décharger ce NPC…": "Unload this NPC…"
"Retire ce NPC du monde pour TOUS les joueurs connectés, avec ses duplicates. Il faudra recharger son fichier pour le faire revenir.": "Removes this NPC from the world for EVERY connected player, along with its duplicates. Its file will have to be reloaded to bring it back."
