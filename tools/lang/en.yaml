"Le FXAA plein écran adoucit aussi le texte de l'UI.\nPlafonné à 0.5 — au-delà le texte devient illisible.\nAvec la chatbox ImGui, le plafond monte à 1.0.": "Full-screen FXAA also softens UI text.\nCapped at 0.5 - beyond that, text becomes unreadable.\nWith the ImGui chatbox, the cap rises to 1.0."
"Le FXAA plein écran adoucit aussi le texte de l'UI.\nChatbox ImGui allumée : le chat est dessiné dans l'overlay,\nque le post-traitement ne touche pas — le plafond monte donc\nà 1.0. Il reste du texte natif (noms au-dessus des personnages,\nfenêtres natives) : au-delà de 0.5, lui aussi s'adoucit.": "Full-screen FXAA also softens UI text.\nImGui chatbox on: the chat is drawn in the overlay, which the\npost-processing never touches - so the cap rises to 1.0.\nSome native text remains (names above characters, native\nwindows): past 0.5 it softens too."
