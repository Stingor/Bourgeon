"Le client annonce déjà le sort dans une bulle au-dessus de la tête — pour les joueurs, pas pour les monstres. « Si pas déjà annoncé » ne l'écrit donc que là où l'information manque.\nLe nom lui-même vient du paquet d'incantation, que le client jette sans le transmettre à sa barre : sans paquet capté, seul le temps s'affiche.": "The client already announces the skill in a balloon above the head — for players, not for monsters. \"Only if not already announced\" therefore writes it only where the information is missing.\nThe name itself comes from the cast packet, which the client throws away without passing it to its bar: with no packet caught, only the time shows."
