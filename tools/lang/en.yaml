"Cet objet n'a pas de recette, n'entre dans aucune et ne se transforme pas en flèches. Le fichier de recettes ne couvre que la fabrication : quêtes, échanges et butin de monstres n'y sont pas.": "This item has no recipe, is used in none, and does not turn into arrows. The recipe file only covers crafting: quests, trades and monster drops are not in it."
"L'Atlas répertorie tout ce que le serveur sait fabriquer : par métier, par produit, par matériau, et les flèches. Le client ne peut pas le faire seul — sa table de recettes ne s'interroge que par produit connu, et le serveur n'envoie une liste qu'après un lancement de compétence.": "The Atlas lists everything the server can craft: by job, by product, by material, and arrows. The client cannot do this on its own - its recipe table can only be queried by known product, and the server only sends a list after a skill is cast."
"Ouvrir l'Atlas": "Open the Atlas"
"Aperçu de l'objet au survol": "Item preview on hover"
"Ne montrer que ce qui est réalisable": "Only show what is craftable"
"Montrer aussi les recettes injouables sur ce serveur": "Also show recipes unplayable on this server"
"produce_db contient des recettes dont aucune classe de ce serveur n'apprend la compétence. Elles sont masquées par défaut : le serveur les refuserait. Le critère est l'arbre des compétences, pas le mode renewal — ce serveur est pre-renewal et ouvre pourtant les classes de 3e, dont les recettes sont bien jouables.": "produce_db contains recipes whose skill no class on this server learns. They are hidden by default: the server would refuse them. The criterion is the skill tree, not the renewal mode - this server is pre-renewal yet still opens the 3rd classes, whose recipes are playable."
