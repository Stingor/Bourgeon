# ── Party/Friends window, party grid HUD, and three modal titles ─────────────
"Afficher la grille de groupe": "Show the party grid"
"Remplace le HUD de groupe du client par une grille de tuiles : la barre de vie EST le fond de la tuile, et sa couleur dit l'état du membre. Le HUD d'origine est masqué tant que cette grille est active.": "Replaces the client's party HUD with a grid of tiles: the health bar IS the tile's background, and its colour tells you the member's state. The original HUD stays hidden while this grid is on."
"Verrouiller la position": "Lock the position"
"Fige le cadre et laisse passer les clics vers le jeu.\n\nMaintenir MAJ le déverrouille le temps d'un déplacement : pas besoin de revenir décocher ici.\n\nÀ savoir : MAJ+clic est l'attaque forcée du jeu. Tant que la touche est tenue, un clic sur le cadre le déplace au lieu de frapper ce qu'il y a dessous.": "Freezes the frame and lets clicks through to the game.\n\nHolding SHIFT unlocks it for the length of one move: no need to come back and untick this.\n\nWorth knowing: SHIFT+click is the game's forced attack. While the key is held, a click on the frame moves it instead of hitting whatever is underneath."
"Disposition": "Layout"
"1 colonne donne une liste, comme le HUD d'origine ; 2 ou 3 donnent la grille compacte des raid frames.": "1 column gives a list, like the original HUD; 2 or 3 give the compact raid-frame grid."
"Largeur des tuiles": "Tile width"
"Hauteur des tuiles": "Tile height"
"Contenu": "Content"
"Icône de classe": "Class icon"
"L'art du client. C'est ce qui rend une grille lisible d'un coup d'œil : on reconnaît le soigneur à sa silhouette, pas à son nom.": "The client's own art. It is what makes a grid readable at a glance: you recognise the healer by their silhouette, not by their name."
"M'inclure dans la grille": "Include me in the grid"
"Garder les membres hors ligne": "Keep offline members"
"Afficher le niveau": "Show the level"
"Afficher les PV chiffrés": "Show HP as numbers"
"Barre de SP": "SP bar"
"Le SP d'un autre joueur ne circule dans AUCUN paquet du jeu : il est demandé au serveur membre par membre. Il n'apparaît donc que pour ceux qui sont à portée de vue.": "Another player's SP travels in NO packet of the game: it is asked of the server member by member. It therefore only shows for those within sight."
"Hauteur de la barre de SP": "SP bar height"
"Le panneau qui porte les tuiles. Sans lui, une grille sombre sur une carte sombre devient impossible à distinguer du décor.": "The panel the tiles sit on. Without it, a dark grid on a dark map becomes impossible to tell apart from the scenery."
"Fond d'une tuile": "Tile background"
"Vie — haute": "Health — high"
"Vie — moyenne": "Health — medium"
"Vie — basse": "Health — low"
"Liseré de ma tuile": "My tile's outline"
"Seuil « vie moyenne »": "Medium health threshold"
"Seuil « vie basse »": "Low health threshold"
"En dessous de ces pourcentages, la tuile change de couleur. C'est ce qui permet de repérer un blessé sans lire un seul chiffre.": "Below these percentages, the tile changes colour. That is what lets you spot a wounded member without reading a single number."
"Hors ligne": "Offline"
"Hors de portée": "Out of range"
"Client Update Required###bourgeon_integrity_outdated": "Client Update Required###bourgeon_integrity_outdated"
"Repartir de zéro###bourgeon_style_reset": "Start over###bourgeon_style_reset"
"Supprimer mon style###bourgeon_style_delete": "Delete my style###bourgeon_style_delete"
"Oublier ce corps###bourgeon_style_forget_body": "Forget this body###bourgeon_style_forget_body"
"Groupe / Amis": "Party / Friends"
"Groupe (grille)": "Party (grid)"
"[État: %s]": "[Status: %s]"
"La case s'assombrit à mesure que l'état s'écoule : on voit d'un coup d'œil lesquels sont près de tomber.\n\n⚠ Un état sans échéance n'est jamais voilé : il n'a pas de part écoulée, et le griser à moitié le ferait croire à mi-course.": "The cell darkens as the state elapses: you see at a glance which ones are about to drop.\n\n⚠ A state with no expiry is never shaded: it has no elapsed part, and shading it halfway would make it look half spent."
"Le cadre « États » est décoché dans Cadres, ci-dessus.": "The “States” frame is unchecked in Frames, above."
"Le cadre se replie déjà sur sa largeur : ce réglage force en plus un nombre fixe par rangée, pour un cadre haut et étroit plutôt que long et plat.": "The frame already wraps on its width; this setting additionally forces a fixed number per row, for a tall narrow frame rather than a long flat one."
"Haut gauche": "Top left"
"Haut droite": "Top right"
"Bas gauche": "Bottom left"
"Bas droite": "Bottom right"
"Le coin du cadre d'où les icônes se rangent, et donc le sens dans lequel la barre grandit.\n\n⚠ Ancrée du mauvais côté, la rangée RECULE quand un état tombe et toutes les icônes glissent. Une barre posée à droite de l'écran veut pousser vers la gauche, celle du bas vers le haut.": "The corner of the frame the icons stack from, and therefore the direction the bar grows in.\n\n⚠ Anchored on the wrong side, the row RECEDES when a state drops and every icon shifts. A bar placed on the right of the screen wants to push left, one at the bottom upwards."
"Remplit l'affichage de faux états, aux durées étagées, le temps de le régler — sans attendre d'en avoir de vrais.\n\nNe se garde pas d'une session à l'autre.": "Fills the display with fake states, at staggered durations, while you set it up — without waiting to actually have some.\n\nNot kept from one session to the next."
"Remplit la barre de faux états, aux durées étagées, le temps de la régler — sans attendre d'en avoir de vrais.\n\nNe se garde pas d'une session à l'autre.": "Fills the bar with fake states, at staggered durations, while you set it up — without waiting to actually have some.\n\nNot kept from one session to the next."
"Barre d'états moderne": "Modern status bar"
"Remplace la barre d'icônes du client par la nôtre : durée, grisage de la part écoulée, infobulle complète, tri et lignes.\n\nÉteinte, la barre d'origine revient telle quelle.": "Replaces the client's icon bar with ours: duration, shading of the elapsed part, full tooltip, sorting and rows.\n\nTurned off, the original bar comes back unchanged."
"Vaut pour les DEUX barres : la moderne comme celle du client.": "Applies to BOTH bars: the modern one and the client's."
"Verrouillée, la barre est figée et laisse passer les clics. Maintenez MAJ au-dessus d'elle pour la déplacer sans la déverrouiller.": "Locked, the bar is frozen and lets clicks through. Hold SHIFT over it to move it without unlocking."
"Lignes": "Rows"
"Nombre maximum": "Maximum count"
"La barre se replie DÉJÀ sur sa largeur ; ce réglage force en plus un nombre fixe par rangée, pour une barre haute et étroite plutôt que longue et plate.": "The bar ALREADY wraps on its width; this setting additionally forces a fixed number per row, for a tall narrow bar rather than a long flat one."
"« Bientôt fini d'abord » met en tête ce qu'il faudra relancer.\n\n⚠ Un état sans durée n'a pas de place dans un tri par durée : il va toujours en fin, quel que soit le sens.": "“Ending soon first” puts what you will need to recast at the top.\n\n⚠ A state with no duration has no place in a sort by duration: it always goes last, whichever the direction."
"La case s'assombrit à mesure que l'état s'écoule : on voit d'un coup d'œil ce qui est près de tomber.\n\n⚠ Un état sans échéance n'est jamais voilé — il n'a pas de part écoulée, et le griser à moitié le ferait croire à mi-course.": "The cell darkens as the state elapses: you see at a glance what is about to drop.\n\n⚠ A state with no expiry is never shaded — it has no elapsed part, and shading it halfway would make it look half spent."
"La tête du personnage à la place de l'icône de classe, comme la fenêtre des membres de guilde.\n\nPour qui est à l'écran, elle vient de son sprite et suit un changement de coiffure aussitôt. Pour les autres, le serveur la donne sur demande — un joueur HORS LIGNE n'en a pas, et dans l'onglet Amis la ligne reste alors sans vignette.": "The character's head instead of the class icon, like the guild member window.\n\nFor those on screen it comes from their sprite and follows a hairstyle change at once. For the others the server provides it on request — a player who is OFFLINE has none, and in the Friends tab the row then stays without a thumbnail."
"Aucune": "None"
"Tête du personnage": "Character head"
"Fenêtre": "Window"
"Empêche le redimensionnement, PAS le déplacement : la fenêtre se déplace toujours par sa barre de titre.\n\nUne fois la largeur réglée, viser le bord au lieu du titre la dérègle d'un pixel et recompose les lignes sous la souris.": "Prevents resizing, NOT moving: the window still moves by its title bar.\n\nOnce the width is set, aiming at the edge instead of the title shifts it by a pixel and reflows the rows under the mouse."
"Affiche le groupe en grille de tuiles, à la place du HUD du client. Le réglage est le même que dans Interface de jeu.": "Shows the party as a grid of tiles instead of the client's HUD. Same setting as in Game interface."
