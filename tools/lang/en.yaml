"%s consommé sans effet : une session de fabrication est déjà ouverte, le serveur n'en garde qu'une. Terminez-la ou fermez-la d'abord.": "%s consumed to no effect: a crafting session is already open, and the server keeps only one. Finish it or close it first."
"Emplacement %d vidé : plus de %s en réserve.": "Slot %d emptied: no %s left in reserve."
"Emplacement %d vidé : plus d'objet #%u en réserve.": "Slot %d emptied: no item #%u left in reserve."
