"Propriétés…": "Properties…"
"Tout ce que le client sait de cette entité : plaque de nom, acteur, position, adresses mémoire.": "Everything the client knows about this entity: nameplate, actor, position, memory addresses."
"Ajoute au menu les actions et les identifiants réservés au staff, dont « Propriétés… » — tout ce que le client sait d'une entité.\nCoché, le menu s'ouvre alors sur TOUTES les entités sans attendre le réglage du dessus : monstres, NPC, unités de compétence, objets au sol. C'est justement sur les cibles inattendues qu'un inspecteur sert.\nCertaines entrées exigent en plus que l'AID du compte figure dans le clientinfo.xml du client : elles n'apparaissent que dans ce cas.": "Adds to the menu the actions and identifiers reserved for staff, including \"Properties…\" — everything the client knows about an entity.\nWhen ticked, the menu then opens on ALL entities without waiting for the setting above: monsters, NPCs, skill units, ground items. Unexpected targets are exactly what an inspector is for.\nSome entries also require the account AID to be listed in the client's clientinfo.xml: they only appear in that case."
