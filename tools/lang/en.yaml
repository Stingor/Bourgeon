"Chiffres": "Numbers"
"Points de vie": "Health points"
"Indépendante de la police des fenêtres : une grille se lit en périphérie de l'écran, pas de face.": "Independent from the window font: a grid is read at the edge of the screen, not head-on."
"Infobulle au survol": "Tooltip on hover"
"Clic gauche : cibler le membre": "Left click: target the member"
"Buffs et debuffs": "Buffs and debuffs"
