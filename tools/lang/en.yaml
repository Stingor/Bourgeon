# GreyWorld (Gameplay > GreyWorld) - the stripped-down world: decor hidden,
# walkable cells shown, flat ground, no fog.
"Le monde dépouillé, comme les GRF « greyworld » que la communauté RO se passe pour la WoE — mais réglable, réversible, et sans rien installer : plus rien ne cache les monstres, et le sol dit où l'on peut marcher.": "The world stripped bare, like the « greyworld » GRFs the RO community passes around for WoE - but adjustable, reversible, and with nothing to install: nothing hides monsters any more, and the ground tells you where you can walk."
"Activer GreyWorld": "Enable GreyWorld"
"Un seul interrupteur pour les quatre leviers ci-dessous.\nRien n'est modifié dans tes fichiers : tout se fait à l'exécution, donc sur toutes les cartes, même celles ajoutées après coup.": "One switch for the four levers below.\nNothing in your files is modified: it all happens at runtime, so it works on every map, including those added later."
"Décors": "Decor"
"Masquer les décors 3D": "Hide 3D decor"
"Arbres, murs, ponts, rochers, mobilier : tout ce que la carte pose par-dessus le sol.\nLes monstres et PNJ en 3D ne sont PAS concernés — ils passent par un autre chemin de rendu.": "Trees, walls, bridges, rocks, furniture: everything the map puts on top of the ground.\n3D monsters and NPCs are NOT affected - they go through a different render path."
"Quadrillage du sol": "Ground grid"
"Afficher les cellules": "Show cells"
"Une case par cellule de la carte, colorée selon ce qu'on peut y faire. Le dessin épouse le relief : c'est la fonction dont le client se sert déjà pour ton curseur de destination.": "One tile per map cell, coloured by what you can do there. The drawing follows the terrain: it is the very function the client already uses for your destination cursor."
"Portée (cellules)": "Range (cells)"
"Demi-côté du carré dessiné autour de toi. C'est LE réglage qui coûte : le nombre de cases croît au carré (24 en vaut 2401, 60 en vaut 14 641). Baisse-le si tu perds des images par seconde.": "Half-width of the square drawn around you. This is THE setting that costs: the number of tiles grows with the square (24 means 2401, 60 means 14,641). Lower it if you lose frames per second."
"Cellule marchable": "Walkable cell"
"Mets son opacité à zéro pour ne garder que les obstacles : c'est aussi la façon la moins chère d'afficher le quadrillage, puisque les cases invisibles ne sont plus dessinées du tout.": "Set its opacity to zero to keep obstacles only: that is also the cheapest way to show the grid, since invisible tiles are no longer drawn at all."
"Mur": "Wall"
"Ni marche, ni tir : la cellule est fermée.": "No walking, no shooting: the cell is closed."
"Infranchissable mais tirable": "Impassable but shootable"
"Un vide ou une dénivellation : on ne peut pas y aller, mais les sorts et les flèches passent.": "A gap or a drop: you cannot go there, but spells and arrows go through."
"Sol": "Ground"
"Sol d'une seule couleur": "Single-colour ground"
"Repeint le terrain sans toucher à sa géométrie : l'occlusion par le relief reste correcte.": "Repaints the terrain without touching its geometry: occlusion by the relief stays correct."
"Le « Sol uni » des Staff Tools est actif : c'est SA couleur qui s'affiche.": "The Staff Tools « Flat ground » is on: ITS colour is the one being shown."
"Dessin": "Drawing"
"Carrelage (cadre de case)": "Tiling (cell frame)"
"Cases dessinées": "Cells drawn"
"Toutes les cases": "Every cell"
"Contour des obstacles": "Outline of obstacles"
"« Contour des obstacles » ne garde que les cases qui touchent un terrain différent : on lit la SILHOUETTE des murs, et il reste dix fois moins de cases à dessiner.\nC'est donc aussi le réglage le moins cher, avant même la portée — et il ne peut pas cacher un obstacle, puisqu'il garde toujours les bords.": "« Outline of obstacles » keeps only the cells that touch different ground: you read the SILHOUETTE of the walls, and ten times fewer cells are left to draw.\nSo it is also the cheapest setting, ahead of range itself - and it cannot hide an obstacle, since it always keeps the edges."


# Libellés venus de TABLES statiques (barre d'action, panneaux de réglages,
# grille d'icônes) : l'extracteur ne lit que les littéraux passés à Tr, seul
# l'export du jeu les remonte.
"Carnet de chasse MVP": "MVP Hunting Log"
"GreyWorld": "GreyWorld"
"Carreau plein (avec joint)": "Solid tile (with grout)"
"Joint (%)": "Grout (%)"
"Largeur de la bordure, en pourcentage du côté de la case. À zéro, les carreaux se touchent et le quadrillage disparaît.": "Width of the border, as a percentage of the cell side. At zero the tiles touch and the grid disappears."
"Anneau (curseur du jeu)": "Ring (the game's cursor)"
"L'anneau et le cadre sont des textures du client — celle de ton curseur de destination et celle des sorts de zone.\n« Carreau plein » emploie la nôtre : la case devient un aplat, un peu plus petit qu'elle, et c'est le sol laissé visible tout autour qui trace la bordure.": "The ring and the frame are textures from the client - your destination cursor's and the one used by area spells.\n« Solid tile » uses ours: the cell becomes a flat wash, slightly smaller than the cell itself, and it is the ground left visible all around that draws the border."
"Aplatir le relief": "Flatten the terrain"
"Met toute la carte à une seule altitude — la moyenne de son relief — comme le fait un GRF greyworld, sols et personnages ensemble.\nLes décors ne sont alors plus chargés du tout : ils garderaient leur hauteur d'origine et flotteraient au-dessus du sol, et même invisibles ils arrêteraient ton curseur.\n🔴 Tout cela est figé au chargement de la carte. Cocher ou décocher demande donc au serveur de te faire recharger, sur la case où tu es : tu vois l'écran de chargement, tu ne bouges pas.\nLe niveau de l'eau n'est pas touché : sur une carte qui en a, le sol peut passer dessous.": "Puts the whole map at a single altitude - the average of its relief - the way a greyworld GRF does, ground and characters together.\nDecor is then not loaded at all: it would keep its original height and float above the ground, and even invisible it would stop your cursor.\n🔴 All of this is settled when the map loads. Ticking or unticking therefore asks the server to reload you, on the very cell you stand on: you get the loading screen, you do not move.\nThe water level is untouched: on a map that has water, the ground may end up below it."
"Rechargement de la carte demandé…": "Map reload requested…"
"Le serveur n'a pas rechargé la carte : les décors ne suivront qu'au prochain changement de carte.": "The server did not reload the map: decor will only follow on the next map change."
"Il refuse tant que tu sors du combat, ou qu'une fenêtre lui reste ouverte (PNJ, échange, entrepôt) — il te le dit alors dans le chat.\nC'est la commande « @refreshmap » : tu peux la taper toi-même, et n'importe quel warp fait la même chose.": "It refuses while you are leaving combat, or while a window of its own is open (NPC, trade, storage) - it then tells you so in the chat.\nThis is the « @refreshmap » command: you can type it yourself, and any warp does the same thing."
"Les sorts de zone dessinent au sol les cases qu'ils toucheront. Le client sait déjà le faire pour les monstres ; ici tu décides s'il le fait aussi pour le sort que tu tiens en main, et pour ceux des autres joueurs.": "Area spells draw on the ground the cells they will hit. The client already does it for monsters; here you decide whether it does it for the spell you are holding too, and for other players' spells."
"Montrer la zone du sort que je tiens en main": "Show the area of the spell I am holding"
"Dès qu'un sort de zone est armé et attend ton clic, sa zone suit le curseur : tu vois où il tombera avant de le lâcher.\nPersonne d'autre ne la voit — rien n'est envoyé au serveur.": "As soon as an area spell is armed and waiting for your click, its area follows the cursor: you see where it will land before you let it go.\nNobody else sees it - nothing is sent to the server."
"Largeur de la bordure, en pourcentage du côté de la case. À zéro, les carreaux se touchent et la zone devient un aplat d'un seul tenant.": "Border width, as a percentage of the cell side. At zero the tiles touch and the area becomes one solid block."
"Couleur et opacité": "Colour and opacity"
"L'opacité est le curseur « A » du sélecteur. À zéro, plus rien n'est dessiné — et rien n'est soumis au rendu non plus.": "Opacity is the 'A' slider in the picker. At zero nothing is drawn - and nothing is submitted to the renderer either."
"Montrer la zone des sorts en cours d'incantation": "Show the area of spells being cast"
"Celle des JOUEURS — la tienne comprise — pendant qu'ils incantent. C'est le serveur qui l'annonce, et elle est déjà visible par tout le monde autour : tu ne dévoiles rien en l'affichant.\nLes monstres, eux, la montrent déjà et ce réglage n'y change rien : un MVP qui annonce son sort est une information de jeu, pas un confort.": "PLAYERS' areas - yours included - while they cast. The server announces it, and it is already visible to everyone around: showing it reveals nothing.\nMonsters already show theirs, and this setting does not change that: an MVP announcing its spell is game information, not a comfort."
"Tous les sorts n'ont pas de zone déclarée : c'est le serveur qui dit lesquels en ont une, et de quelle taille.": "Not every spell has a declared area: the server decides which ones do, and how large."

