"Trace un rectangle à la souris, comme l'outil de capture de Windows. La zone est mémorisée : ensuite, la touche ci-dessous suffit. Une seconde touche rouvre le tracé en jeu, pour recadrer sans rouvrir ce panneau.\n\nL'image enregistrée est celle que tu vois — monde, interface native ET fenêtres Bourgeon. Le cadre et le témoin, eux, sont dessinés en dehors de la zone : ils n'apparaissent jamais dans le GIF.\n\nUn second appui sur la touche arrête avant la fin.": "Drag a rectangle with the mouse, like the Windows snipping tool. The area is remembered: after that, the key below is enough. A second key reopens the outline in game, to reframe without reopening this panel.\n\nThe recorded image is the one you see — world, native interface AND Bourgeon windows. The frame and the indicator, however, are drawn outside the area: they never appear in the GIF.\n\nPressing the key a second time stops before the end."
