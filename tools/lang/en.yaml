"Copier dans le presse-papier à la fin": "Copy to the clipboard when done"
"Copie automatique impossible : une autre application retient le presse-papier. Le bouton ci-dessous réessaie.": "Automatic copy failed: another application is holding the clipboard. The button below retries."
"Dès que le GIF est écrit, il part dans le presse-papier comme fichier : un Ctrl+V dans Discord le poste, animation comprise.\n\nUn message le confirme à l'écran, panneau fermé compris. Ce que tu avais copié auparavant est perdu.": "As soon as the GIF is written it goes to the clipboard as a file: Ctrl+V in Discord posts it, animation included.\n\nA message confirms it on screen, even with this panel closed. Whatever you had copied before is lost."
"Rouvre le tracé à la souris sans passer par ce panneau — qui recouvre justement ce que tu cherches à cadrer.\n\nUn second appui annule le tracé, comme Échap. Pendant un décompte, la touche renonce au départ et rouvre le tracé ; pendant un enregistrement ou un encodage, elle refuse et le dit à l'écran (les images d'un GIF doivent toutes avoir la même taille).": "Reopens the mouse outline without going through this panel — which covers exactly what you are trying to frame.\n\nA second press cancels the outline, like Esc. During a countdown, the key gives up the start and reopens the outline; during a recording or an encoding it refuses and says so on screen (the frames of a GIF must all be the same size)."
"Images / s": "Frames / s"
"● REC  %.1f / %d s  (%d img)": "● REC  %.1f / %d s  (%d frames)"

