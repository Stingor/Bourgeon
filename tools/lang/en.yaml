"Le client n'ouvrait de menu que sur un joueur, son pet, son homoncule ou son mercenaire. Coché, le menu s'ouvre aussi sur les monstres et les NPC.": "The client only opened a menu on a player, their pet, their homunculus or their mercenary. Ticked, the menu also opens on monsters and NPCs."
"Le menu sur son propre personnage ne porte que « Copier mon nom » (plus les identifiants sous « Outils du staff »). Décoché, le clic droit sur soi-même repart au client sans rien ouvrir ni rien avaler.\nSans « Sur toutes les entités », ce menu ne s'ouvre de toute façon jamais : le client n'en a jamais eu sur soi.": "The menu on your own character only carries \"Copy my name\" (plus the identifiers under \"Staff tools\"). Unticked, right-clicking yourself goes back to the client without opening anything or swallowing the click.\nWithout \"On every entity\" that menu never opens anyway: the client never had one on yourself."
"Ajoute au menu les actions et les identifiants réservés au staff, et ouvre le menu sur les entités de diagnostic (unités de compétence, objets au sol). Certaines entrées exigent en plus que l'AID du compte figure dans le clientinfo.xml du client : elles n'apparaissent que dans ce cas.": "Adds the staff-only actions and identifiers to the menu, and opens the menu on diagnostic entities (skill units, items on the ground). Some entries additionally require the account's AID to appear in the client's clientinfo.xml: they only show in that case."
