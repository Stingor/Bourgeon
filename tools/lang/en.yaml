"Remplace la fenêtre « Monster Info » qu'ouvre la compétence Sense. Elle ajoute ce que le paquet du skill ne transporte pas : nom fiable, EXP, ATK/MATK, stats de base, modes, drops, lieux d'apparition et compétences. Le nom d'un monstre dans la table des sources d'une fiche d'objet l'ouvre d'un clic.": "Replaces the \"Monster Info\" window opened by the Sense skill. It adds what the skill packet does not carry: reliable name, EXP, ATK/MATK, base stats, modes, drops, spawn locations and skills. A monster's name in the source table of an item sheet opens it in one click."
"Remplace le menu du clic droit sur une entité. Les actions ne sont pas réécrites : elles repassent par le dispatcher du client, donc ses vérifications et ses confirmations restent jouées. Le menu du client n'existait que sur un joueur, son pet, son homoncule et son mercenaire — ici il peut aussi s'ouvrir sur les monstres et les NPC.": "Replaces the right-click menu on an entity. The actions are not rewritten: they go back through the client's dispatcher, so its checks and confirmations still play. The client's menu only existed on a player, their pet, their homunculus and their mercenary — here it can also open on monsters and NPCs."
"Règles du serveur": "Server rules"
"Règlements généraux": "General rules"
"Les règles du serveur doivent être appliquées à la lettre.\nToute personne ne respectant pas la charte sera sanctionnée dans les plus brefs délais.": "The server rules must be followed to the letter.\nAnyone not respecting the charter will be sanctioned as soon as possible."
"Les joueurs doivent se respecter et garder un langage propre et courtois.": "Players must respect each other and keep their language clean and courteous."
"Les propos visant à rejeter un nouveau joueur sont interdits.": "Remarks meant to push away a new player are forbidden."
"L'utilisation de programmes tels que bots ou hacks = ban définitif sans hésitation.": "Using programs such as bots or hacks = permanent ban, no hesitation."
"Le flood est strictement interdit.": "Flooding is strictly forbidden."
"Vous êtes entièrement responsable de votre compte.": "You are entirely responsible for your own account."
"Le staff ne rend pas les items perdus (vente NPC, deslotage raté, refine raté).": "The staff does not give back lost items (NPC sale, failed de-slotting, failed refine)."
"Le staff peut exceptionnellement rendre un item perdu si les logs prouvent un bug serveur.": "The staff may exceptionally give back a lost item if the logs prove a server bug."
"Ne partagez jamais votre compte ou votre mot de passe.": "Never share your account or your password."
"La demande de support pour créer un serveur privé est non recommandée.": "Asking for support to set up a private server is not recommended."
"Le plagiat volontaire d'un membre du staff est puni.": "Deliberately impersonating a staff member is punished."
"Tout ce qui se rapporte au serveur est la propriété exclusive des administrateurs.": "Everything related to the server is the exclusive property of the administrators."
"Le langage SMS est à proscrire.": "Text-speak is to be avoided."
"L'exploitation d'un bug ou abus = sanction. Prévenez immédiatement un administrateur.": "Exploiting a bug or abusing it = sanction. Warn an administrator immediately."
"Si vous abusez du Vote Shop en votant avec plusieurs comptes forum… \ngare à vous c'est comme avec les impôts, \ntant qu'on est pas contrôlé c'est la fête, mais quand ils vous tombent dessus...": "If you abuse the Vote Shop by voting with several forum accounts… \nwatch out, it is like taxes: \nas long as you are not audited it is a party, but when they come down on you..."
