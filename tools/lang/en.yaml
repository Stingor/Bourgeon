"Lignes d'icônes": "Icon rows"
"Une rangée unique s'allonge jusqu'à manger la place du nom ; en deux lignes, le même nombre d'états tient sur moitié moins de largeur.\n\nLe compte maximum se répartit entre les lignes — six icônes sur deux lignes font trois par ligne.": "A single row stretches until it eats the name's space; on two rows the same number of states fits in half the width.\n\nThe maximum count is split between the rows — six icons on two rows make three per row."
"La barre se replie déjà sur sa largeur : ce réglage force en plus un nombre fixe par rangée, pour une barre haute et étroite plutôt que longue et plate.": "The bar already wraps on its width: this setting additionally forces a fixed number per row, for a bar that is tall and narrow rather than long and flat."
"Temps restant sous l'icône": "Time left under the icon"
"La case s'assombrit à mesure que l'état s'écoule.\n\n⚠ La durée d'origine n'est portée par AUCUN paquet : elle est exacte quand on a vu l'état commencer, et repart de « plein » quand on le découvre en route.": "The cell darkens as the state elapses.\n\n⚠ The original duration is carried by NO packet: it is exact when the state was seen starting, and restarts from « full » when discovered midway."
"États de la cible": "Target's states"
"Afficher la barre": "Show the bar"
"Écoulement": "Elapsing"
"Grisage de la case": "Cell shading"
"Balayage horaire": "Clockwise sweep"
"Voile descendant": "Falling veil"
"Voile": "Veil"
"La case s'assombrit à mesure que l'état s'écoule : on voit lesquels vont tomber sans lire un seul nombre.\n\n⚠ La durée d'origine n'est PORTÉE PAR AUCUN paquet. Elle est exacte quand on a vu l'état commencer ; découvert en route, il repart de « plein » et décroît ensuite au bon rythme.\n\nUn état permanent n'est jamais grisé : il n'a pas de part écoulée.": "The cell darkens as the state elapses: you see which ones are about to drop without reading a single number.\n\n⚠ The original duration is CARRIED BY NO packet. It is exact when the state was seen starting; discovered midway, it restarts from « full » and then decreases at the right pace.\n\nA permanent state is never shaded: it has no elapsed part."
"État": "State"
"Sans durée": "No duration"
"Liseré": "Outline"
"Nombre au plus": "At most"
"Rangement": "Ordering"
"Ordre d'arrivée": "Order of arrival"
"Bientôt fini d'abord": "Ending soonest first"
"Compte à rebours": "Countdown"
"Écart": "Spacing"
"Une barre à elle, qu'on place et dimensionne où l'on veut : les états de la cible ne se regardent pas au même endroit que ses points de vie.\n\nElle suit le CIBLAGE : mode éteint, pas de barre.\n\n⚠ Ne montre RIEN sur un joueur qui n'est pas de votre groupe : ses états sont une information de jeu, et le serveur ne les donne pas. Les monstres, eux, sont lisibles.": "A bar of its own, placed and sized wherever you want: a target's states are not read in the same spot as its hit points.\n\nIt follows TARGETING: mode off, no bar.\n\n⚠ Shows NOTHING for a player who is not in your party: their states are game information, and the server does not give them. Monsters, however, are readable."
"Fige la barre et laisse passer les clics vers le jeu.\n\nMaintenir MAJ, CURSEUR SUR LA BARRE, la déverrouille le temps d'un déplacement. Ailleurs à l'écran, MAJ garde son rôle habituel (attaque forcée).\n\n⚠ Une barre VIDE est invisible : déverrouillez-la pour la placer quand la cible n'a aucun état.": "Freezes the bar and lets clicks through to the game.\n\nHolding SHIFT, CURSOR OVER THE BAR, unlocks it for one move. Elsewhere on screen SHIFT keeps its usual role (forced attack).\n\n⚠ An EMPTY bar is invisible: unlock it to place it while the target has no states."
"Au-delà, les états en trop sont écartés — ce sont les DERNIERS du rangement ci-dessous, qui décide donc de ce qu'on perd.": "Beyond that, extra states are dropped — they are the LAST ones of the ordering below, which therefore decides what you lose."
"« Bientôt fini d'abord » met en tête ce qu'il faudra relancer, ou ce qu'il suffit d'attendre.\n\nUn état SANS durée (permanent) n'a pas sa place dans un tri par durée : il va en fin dans les deux sens, pour ne pas chasser de l'écran ce qui presse.": "« Ending soonest first » puts up front what you will have to recast, or what you only need to wait out.\n\nA state with NO duration (permanent) has no place in a duration sort: it goes last either way, so it never pushes the urgent ones off screen."
"Sous chaque icône. Un état permanent n'en porte pas : un « 0 » sous un buff qui ne finit jamais le ferait croire terminé.": "Under each icon. A permanent state carries none: a « 0 » under a buff that never ends would read as finished."
"Sans fond, des icônes sombres sur une carte sombre se confondent avec le décor.": "Without a background, dark icons on a dark map blend into the scenery."
"Icônes au plus": "At most icons"
"Les icônes d'état du membre, à gauche de sa pastille.\n\n⚠ Une ligne SANS icône ne veut pas dire « aucun buff ». Le serveur ne diffuse ces états qu'aux joueurs qui VOIENT le personnage, et seulement au moment où ils COMMENCENT : un joueur déjà béni quand il entre à l'écran arrive sans rien.\n\nCe qui s'affiche ici est donc ce qui est TOMBÉ sous vos yeux, pas l'état complet du personnage.": "The member's status icons, left of their badge.\n\n⚠ A row with NO icon does not mean « no buff ». The server only broadcasts these states to players who SEE the character, and only when they START: a player already blessed when they walk on screen shows up with nothing.\n\nWhat you see here is therefore what DROPPED before your eyes, not the character's full state."
"Les icônes d'état du membre, calées à droite de sa tuile. Le nom se découpe sur ce qu'elles laissent.\n\n⚠ Une tuile SANS icône ne veut pas dire « aucun buff ». Le serveur ne diffuse ces états qu'aux joueurs qui VOIENT le personnage, et seulement au moment où ils COMMENCENT : un joueur déjà béni quand il entre à l'écran arrive sans rien.\n\nCe qui s'affiche ici est donc ce qui est TOMBÉ sous vos yeux, pas l'état complet du personnage.": "The member's status icons, aligned to the right of their tile. The name is clipped to what they leave.\n\n⚠ A tile with NO icon does not mean « no buff ». The server only broadcasts these states to players who SEE the character, and only when they START: a player already blessed when they walk on screen shows up with nothing.\n\nWhat you see here is therefore what DROPPED before your eyes, not the character's full state."
"Comme une tuile du HUD en grille : la ligne devient une cible cliquable, et un liseré blanc marque la cible courante.\n\nSans effet sur un membre hors ligne ou hors de portée — ses PV et sa position viennent de son sprite, et il n'y en a pas.\n\nDemande le mode Ciblage, qui a son propre panneau : c'est lui qui décide qu'une cible existe.": "Like a tile of the grid HUD: the row becomes a clickable target, and a white outline marks the current target.\n\nNo effect on a member who is offline or out of range — their HP and position come from their sprite, and there is none.\n\nRequires the Targeting mode, which has its own panel: it is what decides that a target exists."
"Le texte d'une tuile est DÉCOUPÉ à ses bords : sur une grille serrée, il ne reste parfois que les premières lettres d'un nom. L'infobulle le redonne en entier, avec la classe, la carte et les PV/SP chiffrés.": "A tile's text is CLIPPED to its edges: on a tight grid, sometimes only the first letters of a name remain. The tooltip gives it back in full, with the class, the map and the HP/SP figures."
"Interaction": "Interaction"
"Lancer les sorts de soutien sur la tuile survolée": "Cast support skills on the hovered tile"
"Une compétence de soutien (soin, buff) part sur le membre dont la tuile est sous le curseur : la touche arme, la tuile désigne. Le liseré blanc montre qui sera visé.\n\nLa grille ne prend PAS le clic : marcher et frapper restent possibles curseur dessus.\n\nLes sorts d'ATTAQUE ne sont jamais concernés — viser un allié relève du PVP, que le jeu réserve au clic manuel.": "A support skill (heal, buff) is cast on the member whose tile is under the cursor: the key arms it, the tile picks the target. The white outline shows who will be hit.\n\nThe grid does NOT take the click: walking and attacking still work with the cursor over it.\n\nATTACK skills are never affected — targeting an ally is PVP, which the game keeps on manual clicks."
"(éteint)": "(off)"
"Cliquer les tuiles (cibler, menu du groupe)": "Click tiles (target, party menu)"
"Clic gauche : cibler le membre, comme un clic sur son personnage — sans effet si le mode Ciblage est éteint.\nClic droit : le menu du personnage, celui de son sprite. Sur un membre qu'aucun sprite ne représente, un menu de repli propose ce qui voyage par nom : chuchoter, expulser.\n\n⚠ La grille PREND alors la souris sur toute sa surface : impossible de marcher ou de frapper en cliquant dessous. C'est le prix des gestes sur les tuiles — décoché, la grille se contente d'afficher et laisse tout passer.": "Left click: target the member, like clicking their character — no effect if the Targeting mode is off.\nRight click: the character menu, the one of their sprite. On a member no sprite stands for, a fallback menu offers what travels by name: whisper, expel.\n\n⚠ The grid then TAKES the mouse over its whole surface: you cannot walk or strike by clicking underneath. That is the price of gestures on tiles — unchecked, the grid only displays and lets everything through."
"Texte — hors de portée": "Text — out of range"
"Le membre est EN JEU, simplement trop loin pour que le client connaisse ses PV : il peut revenir à portée d'un instant à l'autre. À ne pas confondre avec un membre déconnecté.": "The member is IN GAME, just too far for the client to know their HP: they can come back into range at any moment. Not to be confused with a disconnected member."
"Texte — hors ligne": "Text — offline"
"Réglages Groupe / Amis": "Party / Friends settings"
"Cibler": "Target"
"Ajouter à mes amis": "Add to my friends"
"Contenu d'une ligne": "Row contents"
"L'art du client, à gauche du nom. Éteinte, la ligne se resserre — utile sur une fenêtre étroite.": "The client's own art, left of the name. Turned off, the row tightens up — handy in a narrow window."
"Niveau devant le nom": "Level before the name"
"Barre de vie": "Health bar"
"Le SP d'un autre joueur ne circule dans AUCUN paquet du jeu : il est demandé au serveur, membre par membre. Il n'apparaît donc que pour ceux qui sont à portée de vue, et coûte un peu de réseau — d'où le défaut éteint.": "Another player's SP travels in NO packet of the game: it is requested from the server, member by member. It therefore only shows for those within sight, and costs a little network traffic — hence the default being off."
"Nom complet": "Full name"
"Nom court": "Short name"
"Masquée": "Hidden"
"Le client écrit « Gonryun, the Hermit Land (Kunlun) » là où « Gonryun » suffit à se repérer — et le nom complet pousse le reste de la ligne hors d'une fenêtre étroite.\n\nMasquée, la ligne ne porte plus que le nom. L'infobulle au survol continue de donner la carte entière.": "The client writes « Gonryun, the Hermit Land (Kunlun) » where « Gonryun » is enough to find your way — and the full name pushes the rest of the row out of a narrow window.\n\nHidden, the row carries only the name. The hover tooltip still gives the map in full."
"Au survol d'une ligne : la classe, la carte complète, la position et les PV/SP chiffrés — ce qui ne tient pas dans la ligne.": "On hovering a row: the class, the full map, the position and the HP/SP figures — what does not fit in the row."
"Densité": "Density"
"Jauges collées l'une sous l'autre": "Bars stacked one under the other"
"Jauges": "Bars"
"Taille de l'icône": "Icon size"
"Espace entre les lignes": "Space between rows"
"À zéro, les lignes se touchent : c'est le réglage qui gagne le plus de hauteur sur un groupe nombreux.": "At zero the rows touch: this is the setting that saves the most height on a large party."
"Largeur des jauges": "Bar width"
"Hauteur d'une jauge": "Height of one bar"
"PV au-dessus, SP juste dessous, sans rien entre les deux.\n\nLe texte passe alors DANS les jauges : à côté, il pousserait la seconde d'une hauteur de ligne et elles ne seraient plus collées.": "HP on top, SP right below, with nothing in between.\n\nThe text then goes INSIDE the bars: beside them it would push the second one down by a line height and they would no longer be stacked."
"Texte dans les jauges": "Text inside the bars"
"Centré sur la jauge, avec une ombre pour rester lisible sur le vert comme sur le fond. La ligne ne s'allonge pas — mais il faut une jauge assez haute.": "Centred on the bar, with a shadow so it stays readable over the green as well as over the background. The row does not grow — but the bar must be tall enough."
"Taille du texte des jauges": "Bar text size"
"À zéro, celle de l'interface.": "At zero, the interface's own."
"Texte du SP": "SP text"
"Texte des PV": "HP text"
"Détacher : Échap referme la fenêtre": "Unpin: Escape closes the window again"
"Épingler : Échap ne ferme plus": "Pin: Escape no longer closes it"

# Commandes de chat interceptees (features/systems/chat_commands.cc) :
# la reponse donnee au joueur qui tape une commande qui n'existe pas ici.
"Pas d'auto-attaque sur ce serveur, ici il faut jouer soi-même.": "There is no auto-attack on this server - here, you play it yourself."
"La Warp Agent est là pour vous servir.": "The Warp Agent is here to serve you."
"Recherche de PNJ, de monstre ou de carte : c'est la fenêtre Navigation.": "Looking for an NPC, a monster or a map: that is the Navigation window."
"Ramassage automatique : @autoloot, @autolootitem <objet>, @autoloottype <type>. Pour savoir qui lâche quoi : @whodrops <objet>, ou la fiche du monstre.": "Automatic looting: @autoloot, @autolootitem <item>, @autoloottype <type>. To find out who drops what: @whodrops <item>, or the monster's info sheet."

