"(À vous de voir si vous voulez passer pour un gros connard selfish en KSant le MVP)": "(Up to you whether you want to look like a big selfish arsehole by KSing the MVP)"
"Si vous ne voulez pas vous faire KS, faites @noks <3": "If you do not want to get KSed, use @noks <3"
"Le staff": "The staff"
"Si vous cassez les couilles du staff ban/delete non temporaire.": "If you bust the staff's balls: ban/delete, and not a temporary one."
"Aucun membre du staff ne vous demandera votre mot de passe.": "No staff member will ever ask you for your password."
"Aucun membre du staff ne vous demandera votre login.": "No staff member will ever ask you for your login."
"Aucun membre du staff ne vous demandera votre email.": "No staff member will ever ask you for your email."
"Seuls les admins peuvent rendre des items perdus suite à un bug serveur.": "Only admins can give back items lost to a server bug."
"Le staff ne rend pas les items prêtés à un joueur disparu/banni.": "The staff does not give back items lent to a vanished/banned player."
"Le staff ne donne pas d'items (hors events).": "The staff does not hand out items (outside events)."
"Les membres du staff ne sont pas des robots. Soyez courtois, cherchez avant de demander.": "Staff members are not robots. Be polite, search before you ask."
"Les questions dont la réponse est sur une database = évitez.": "Questions whose answer sits in a database = please avoid."
