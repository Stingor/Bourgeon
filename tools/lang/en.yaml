"La zone est réduite à cette largeur (proportions gardées) avant d'entrer dans le GIF. C'est le réglage qui pèse le plus lourd : la mémoire et la taille du fichier montent avec le CARRÉ de la largeur.": "The area is scaled down to this width (aspect ratio kept) before entering the GIF. This is the heaviest setting: memory and file size grow with the SQUARE of the width."
