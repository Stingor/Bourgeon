"Je vais être clair : oui, j'autorise les scripts AHK, les macros clavier/souris, les trucs qui bouclent un sort… tant que ça reste :": "Let me be clear: yes, I allow AHK scripts, keyboard/mouse macros, things that loop a spell… as long as it stays:"
"Pas un tableau de bord de la NASA": "Not a NASA control room"
"Vous bouclez le spell, éventuellement un clic en plus pour les AOE type Storm Gust, et basta.": "You loop the spell, maybe one extra click for AOEs like Storm Gust, and that is it."
