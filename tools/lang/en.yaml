"La fourchette couvre toute la plage de maîtrise culinaire, de zéro au maximum : votre valeur exacte place le résultat quelque part entre ces deux bornes.\n\nElle n'a pas été transmise. C'est une donnée que le client ne peut pas deviner - elle vit côté serveur et ne circule dans aucun paquet du jeu d'origine ; ce serveur doit la pousser explicitement. Une maîtrise de zéro, elle, s'afficherait normalement : c'est une valeur comme une autre.": "The range covers the whole span of cooking mastery, from zero to maximum: your exact value places the result somewhere between those two bounds.\n\nIt was not sent. This is data the client cannot guess - it lives server-side and travels in no packet of the original game; this server has to push it explicitly. A mastery of zero would display normally: it is a value like any other."
