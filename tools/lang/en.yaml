"- Arrows / mouse wheel adjust value (Shift = larger step)\n- Ctrl-Click for direct input.": "- Arrows / mouse wheel adjust value (Shift = larger step)\n- Ctrl-Click for direct input."
"Police de toute l'UI ImGui. Le gras et l'italique suivent la famille choisie, ainsi que la chatbox réglée sur « Système ».\n\nMalgun Gothic est la seule à couvrir le coréen : avec une autre, les chemins de fichiers du jeu (réglage de débogage) sortent en carrés.\nProggyClean est la police intégrée d'ImGui, minuscule et sans accents élégants.": "Font for the whole ImGui UI. Bold and italic follow the chosen family, and so does the chatbox set to « System ».\n\nMalgun Gothic is the only one covering Korean: with any other, the game's file paths (debug setting) come out as squares.\nProggyClean is ImGui's built-in font, tiny and with plain accents."
"Agrandit TOUTE l'interface Bourgeon — texte, fenêtres, boutons, cadres — sans toucher au jeu lui-même. Pour les grands écrans très définis (ultrawide, 4K), où une interface calibrée en pixels devient minuscule.\n\nLes fenêtres déjà ouvertes gardent la taille qu'on leur avait donnée : les redimensionner une fois suffit.\n\nSans effet en DirectX 7 (le réglage y est grisé) : ce mode ne sait pas redessiner les lettres à une autre taille, il ne ferait que les étirer.": "Enlarges the WHOLE Bourgeon interface — text, windows, buttons, frames — without touching the game itself. For large high-definition screens (ultrawide, 4K), where an interface calibrated in pixels turns tiny.\n\nWindows already open keep the size you gave them: resizing them once is enough.\n\nNo effect in DirectX 7 (the setting is greyed out there): that mode cannot redraw letters at another size, it would only stretch them."
"Sauvegarde les couleurs/luminosité/opacité actuelles sous un nom.\n« Appliquer » recharge un préréglage ; on peut se faire plusieurs thèmes.": "Saves the current colours/brightness/opacity under a name.\n« Apply » reloads a preset; you can build yourself several themes."
