"Copie automatique impossible : une autre application retient le presse-papier. Le bouton ci-dessous réessaie.": "Automatic copy failed: another application is holding the clipboard. The button below retries."
"Dès que le fichier est écrit — le GIF comme l'image fixe — il part dans le presse-papier : un Ctrl+V dans Discord le poste, animation comprise.\n\nUn message le confirme à l'écran, panneau fermé compris. Ce que tu avais copié auparavant est perdu.": "As soon as the file is written — the GIF as well as the still image — it goes to the clipboard: Ctrl+V in Discord posts it, animation included.\n\nA message confirms it on screen, even with this panel closed. Whatever you had copied before is lost."
"Rouvre le tracé à la souris sans passer par ce panneau — qui recouvre justement ce que tu cherches à cadrer.\n\nUn second appui annule le tracé, comme Échap. Pendant un décompte, la touche renonce au départ et rouvre le tracé ; pendant un enregistrement ou un encodage, elle refuse et le dit à l'écran (les images d'un GIF doivent toutes avoir la même taille).": "Reopens the mouse outline without going through this panel — which covers exactly what you are trying to frame.\n\nA second press cancels the outline, like Esc. During a countdown, the key gives up the start and reopens the outline; during a recording or an encoding it refuses and says so on screen (the frames of a GIF must all be the same size)."
"Images / s": "Frames / s"
"● REC  %.1f / %d s  (%d img)": "● REC  %.1f / %d s  (%d frames)"
# Zone recorder: single still capture (screenshot key).
"Capturer une image :": "Capture a still image:"
"Un PNG de la MÊME zone, pris à l'instant de l'appui : ni décompte, ni durée, rien à arrêter.\n\nL'image sort à la taille réelle de la zone — la « largeur max » ci-dessus ne concerne que le GIF, où elle sert à contenir le poids d'une animation.\n\nElle contient elle aussi ce que tu vois, fenêtres Bourgeon comprises. Ce panneau, donc, s'il est ouvert : c'est en jeu, panneau fermé, que la touche sert.": "A PNG of the SAME area, taken the instant you press the key: no countdown, no duration, nothing to stop.\n\nThe image comes out at the area's real size — the \"max width\" above only concerns the GIF, where it keeps an animation's weight down.\n\nIt too holds what you see, Bourgeon windows included. So this panel, if it is open: the key is meant for in game, with the panel closed."
"la capture d'image de la zone": "capturing a still of the area"
"Capture impossible : un enregistrement est en cours": "Cannot capture: a recording is under way"
"Capture indisponible en DirectX 7": "Capture unavailable in DirectX 7"
"Aucune zone définie — trace-la d'abord": "No area defined — draw it first"
"capture abandonnée : le jeu n'a rien affiché": "capture given up: the game displayed nothing"
"Capture abandonnée": "Capture given up"
"échec de l'écriture de l'image": "could not write the image"
"Échec de la capture": "Capture failed"
"image enregistrée": "image saved"
"Capture enregistrée": "Capture saved"
"Image copiée — Ctrl+V dans Discord pour la poster.": "Image copied — Ctrl+V in Discord to post it."
"Capture copiée dans le presse-papier": "Capture copied to the clipboard"
"Copié — Ctrl+V dans Discord pour le poster.": "Copied — Ctrl+V in Discord to post it."

