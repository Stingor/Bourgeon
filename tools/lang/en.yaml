"Désactivé = disposition d'origine du jeu (inchangée).": "Disabled = the game's original layout (unchanged)."
"Affiche un cadre sur la barre ; glissez-le pour la déplacer.\nLa position met à jour Marge X / Marge Y.\nSi la grille d'alignement (aimantation) est active, le cadre s'y aligne.": "Shows a frame on the bar; drag it to move the bar.\nThe position updates Margin X / Margin Y.\nIf the alignment grid (snapping) is on, the frame lines up with it."
