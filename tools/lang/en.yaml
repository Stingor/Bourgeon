"Décoché : la carte est cliquable — la glisser la déplace, les poignées\ndes deux coins du bas la redimensionnent en gardant son carré, la\nmolette zoome, et le bouton de réglages reste affiché.\n\nCoché : la souris passe au travers, la carte n'est plus qu'un décor.\nMaintenir Maj au-dessus la réveille alors le temps du geste, bouton\nde réglages compris.": "Unchecked: the map is clickable — drag it to move it, the grips in the\ntwo bottom corners resize it while keeping it square, the wheel zooms,\nand the settings button stays visible.\n\nChecked: the mouse passes through, the map is just scenery.\nHolding Shift over it then wakes it for the duration of the gesture,\nsettings button included."
