"Adresses de retour des fonctions qui soumettent des primitives, avec leur\nnombre d'appels sur la dernière frame.\nMéthode : relève la liste effet ÉTEINT, puis effet ACTIF —\nl'adresse qui APPARAÎT est celle qui dessine l'effet.": "Return addresses of the functions submitting primitives, with their\ncall count over the last frame.\nMethod: take the list with the effect OFF, then with it ON —\nthe address that APPEARS is the one drawing the effect."
