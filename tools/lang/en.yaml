"Tous les ids présents dans la capture, au format id×nombre.\nAttendu : l'id concret de l'effet spawné. Une valeur DIFFÉRENTE\nsignifie que le nœud porte un autre id que celui résolu par Lua.\n-1 = famille CEffectMgr.": "Every id present in the capture, as id×count.\nExpected: the concrete id of the spawned effect. A DIFFERENT value\nmeans the node carries another id than the one Lua resolved.\n-1 = CEffectMgr family."
"effect_id capturés : aucun (rien n'est capturé)": "captured effect_id: none (nothing is captured)"
"Appelants du puits (diag)": "Sink callers (diag)"
"Adresses de retour des fonctions qui soumettent des primitives, avec leur\nnombre d'appels sur la dernière frame.\nMéthode : relève la liste effet ÉTEINT, puis effet ACTIF —\nl'adresse qui APPARAÎT est celle qui dessine l'effet.": "Return addresses of the functions submitting primitives, with their\ncall count over the last frame.\nMethod: take the list with the effect OFF, then with it ON —\nthe address that APPEARS is the one drawing the effect."
"0x%08X  ×%d": "0x%08X  ×%d"
