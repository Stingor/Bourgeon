"Toutes les stats du personnage joué TELLES QUE LE CLIENT LES CONNAÎT, y compris les valeurs techniques que l'interface du jeu ne montre jamais : le délai d'attaque en millisecondes (amotion) derrière l'ASPD, le recul encaissé (dmotion) lu sur les paquets de coups, la vitesse de déplacement, et la cadence réelle du .act en train d'être joué.\n\nSous déguisement, elle montre le sprite RÉELLEMENT joué et la durée que ses animations donnent à l'attaque — c'est-à-dire ce que le personnage subit à l'écran, pas ce que la classe laisserait croire.": "Every stat of the character you play AS THE CLIENT KNOWS IT, including the technical values the game interface never shows: the attack delay in milliseconds (amotion) behind ASPD, the recoil you take (dmotion) read off the hit packets, the movement speed, and the real pace of the .act being played.\n\nUnder a disguise it shows the sprite ACTUALLY played and how long its animations make the attack last — that is, what the character undergoes on screen, not what the class would suggest."
