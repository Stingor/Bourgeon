"Redessine la fenêtre de lecture des livres en ImGui (texte sélectionnable, pages à la molette).\nOFF : fenêtre native, qui s'affiche SOUS l'interface moderne.": "Redraws the book reading window in ImGui (selectable text, pages on the wheel).\nOFF: native window, which displays UNDER the modern interface."
"Livres : ouvrir à la première page": "Books: open on the first page"
"ON : un livre s'ouvre toujours page 1.\nOFF : comportement d'origine du client, qui reprend à la dernière page lue (signet enregistré par personnage dans le registre Windows).": "ON: a book always opens on page 1.\nOFF: the client's original behaviour, which resumes on the last page read (a bookmark saved per character in the Windows registry)."
"Ouvrir près de la souris": "Open near the mouse"
"ON : la description apparaît près du curseur à chaque ouverture.\nOFF : elle réapparaît à sa dernière position connue.": "ON: the description appears near the cursor every time it opens.\nOFF: it reappears at its last known position."
