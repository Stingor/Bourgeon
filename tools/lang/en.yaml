"Remplace la fiche du pet, le menu de commandes qu'elle ouvrait et la fenêtre d'évolution, en une seule fenêtre flottante — ainsi que la liste d'éclosion. Les commandes ne sont pas réécrites : elles repassent par le dispatcher du client, donc son refus « pas de nourriture en sac » reste joué. S'y ajoute ce que le client gardait pour lui : le sens de variation de la faim, le nom de l'accessoire porté, les matériaux d'évolution qu'on possède déjà, les œufs vides que le serveur refusera d'éclore, et la raison pour laquelle une action est indisponible plutôt que sa disparition.": "Replaces the pet sheet, the command menu it used to open and the evolution window, all in a single floating window — plus the hatching list. Commands are not rewritten: they still go through the client's dispatcher, so its « no food in bag » refusal is still played. On top of that comes what the client kept to itself: which way hunger is heading, the name of the worn accessory, the evolution materials you already own, the empty eggs the server will refuse to hatch, and the reason an action is unavailable instead of making it vanish."

