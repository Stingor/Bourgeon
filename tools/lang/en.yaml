"Change le log en texte sélectionnable : glisser pour sélectionner,\nCtrl+A tout prendre, Ctrl+C copier. Les couleurs et les icônes\ndisparaissent le temps de la sélection — c'est du texte nu.": "Turns the log into selectable text: drag to select,\nCtrl+A to take it all, Ctrl+C to copy. Colours and icons\ndisappear for the duration of the selection — it is bare text."
