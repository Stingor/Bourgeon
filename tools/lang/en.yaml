"Déverrouillé, une poignée apparaît à l'emplacement du bandeau : glisse-la où tu veux. Un exemple s'affiche tant que rien n'a été ramassé.\nVerrouillé, le bandeau ne capte plus aucun clic.": "Unlocked, a handle appears where the banner sits: drag it wherever you want. A sample line shows while nothing has been picked up.\nLocked, the banner no longer catches any click."
"Fond libre": "Free background"
"Interligne": "Line spacing"
"L'espace entre deux lignes. À 0 elles se touchent.": "The space between two lines. At 0 they touch."
"La marge au-dessus et au-dessous du contenu d'une ligne.\nSans effet tant que le cadre RO est affiché : sa hauteur est imposée par la taille de ses tuiles.": "The margin above and below a line's content.\nNo effect while the RO frame is shown: its height is set by the size of its tiles."
"Le cadre clair du client. Décoché, le fond libre ci-dessous prend sa place.": "The client's light frame. Unchecked, the free background below takes its place."
"Le centrage survit à un déplacement VERTICAL de la poignée ; un déplacement horizontal en sort.": "Centering survives a VERTICAL drag of the handle; a horizontal drag turns it off."
"Marge verticale": "Vertical padding"
"Objet obtenu — glisser pour placer": "Item obtained — drag to place"
"Opacité de la bordure": "Border opacity"
"Épaisseur de la bordure": "Border thickness"
"%d,%d s": "%d.%d s"
"Barre d'incantation": "Cast bar"
"Ce que tu veux VOIR. Décocher ne rend pas la barre du client : le remplacement reste global, seule la barre affichée disparaît.": "What you want to SEE. Unchecking does not give the client's bar back: the replacement stays global, only the displayed bar goes away."
"La barre du client fait 60×6 pixels, sans nom de compétence ni durée. Elle n'est pas détruite mais masquée : c'est son horloge qui alimente celle-ci.": "The client's bar is 60×6 pixels, with no skill name and no duration. It is not destroyed but hidden: its clock is what feeds this one."
"Masquer la mienne au-dessus de ma tête": "Hide mine above my head"
"Nom de la compétence": "Skill name"
"Pour qui préfère la suivre dans son interface. La barre « Cast » se règle avec les autres barres, dans la section « Basic Info ».": "For those who prefer to follow it in their HUD. The \"Cast\" bar is set up with the other bars, in the \"Basic Info\" section."
"Remplacer les barres d'incantation": "Replace cast bars"
"Remplissage": "Fill"
"Remplissage (monstres)": "Fill (monsters)"
"Temps restant": "Time left"
"Jamais": "Never"
"Le client annonce déjà le sort dans une bulle au-dessus de la tête — pour les joueurs, pas pour les monstres. « Si pas déjà annoncé » ne l'écrit donc que là où l'information manque.\nLe nom lui-même vient du paquet d'incantation, que le client jette sans le transmettre à sa barre : sans paquet capté, seul le temps s'affiche.": "The client already announces the skill in a balloon above the head — for players, not for monsters. \"Only if not already announced\" therefore writes it only where the information is missing.\nThe name itself comes from the cast packet, which the client throws away without passing it to its bar: with no packet caught, only the time shows."
"Si pas déjà annoncé": "Only if not already announced"
"Sous une bulle, l'étiquette passe à droite de la barre : la bulle occupe exactement la place au-dessus.": "Under a balloon, the label moves to the right of the bar: the balloon takes exactly the space above."
"Toujours": "Always"

# Blocage du clic gauche sur les NPC a identifiant fixe (entity_context_menu.cc).
"Le NPC %u": "NPC %u"
"%s : vous avez bloqué le clic gauche sur ce NPC. Clic droit dessus pour le débloquer.": "%s: you blocked left-click on this NPC. Right-click it to unblock."
"%s : le clic gauche est de nouveau actif.": "%s: left-click works again."
"%s : le clic gauche ne fait plus rien sur lui. Clic droit pour le débloquer ou lui parler.": "%s: left-click no longer does anything on it. Right-click to unblock it or to talk to it."
"Bloquer le clic gauche###ctxmenu_npcblock": "Block left-click###ctxmenu_npcblock"
"Coché, le clic gauche sur ce NPC ne fait plus rien du tout : ni dialogue, ni déplacement. Le menu du clic droit reste disponible, « Interagir » compris, et viser une zone avec un sort continue de marcher par-dessus lui.\nRéglage du client, gardé sur cette machine : il ne suit pas le personnage, et un script déclenché en MARCHANT dessus s'exécutera toujours.": "When ticked, left-clicking this NPC does nothing at all: no dialogue, no movement. The right-click menu stays available, \"Interact\" included, and ground-targeting a spell still works over it.\nA client setting, kept on this machine: it does not follow the character, and a script triggered by WALKING onto it will still run."
"Blocage du clic sur les NPC de service###ctxmenu_npcblock_opt": "Block clicks on service NPCs###ctxmenu_npcblock_opt"
"Les NPC de la capitale (kafra, job master, styliste, warpers…) se tiennent au milieu du passage et s'ouvrent quand on cherchait à marcher. Clic droit sur l'un d'eux, puis « Bloquer le clic gauche » : il devient une zone morte, le clic ne déclenche plus rien.\nDécoché ici, la case n'est plus proposée et les NPC déjà bloqués redeviennent cliquables — la liste, elle, est conservée.": "The capital's NPCs (kafra, job master, stylist, warpers…) stand right in the way and open up when you were only trying to walk. Right-click one of them, then \"Block left-click\": it becomes a dead zone, the click no longer triggers anything.\nUnticked here, the box is no longer offered and NPCs already blocked become clickable again — the list itself is kept."
"Aucun NPC bloqué.": "No blocked NPC."
