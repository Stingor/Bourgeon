# Raccourcis entre les trois fenêtres d'objets (barre de titre).
"Raccourcis vers les autres fenêtres": "Shortcuts to the other windows"
"Ouvrir cette fenêtre": "Open this window"
"Refermer cette fenêtre": "Close this window"
"L'entrepôt répond encore à la demande précédente.": "The storage is still answering the previous request."
"Ajoute dans la barre de titre deux boutons vers les autres fenêtres d'objets — inventaire, chariot, entrepôt — pour les ouvrir et les refermer sans quitter celle-ci.\nLe bouton « Storage » DEMANDE l'entrepôt au serveur, comme @storage : il le refuse si votre compte n'en a pas le droit, si vous échangez, ou si l'entrepôt de guilde est ouvert.\nLe réglage est propre à chaque fenêtre.": "Adds two buttons in the title bar leading to the other item windows — inventory, cart, storage — to open and close them without leaving this one.\nThe \"Storage\" button ASKS the server for the storage, just like @storage: it is refused if your account lacks the right, if you are trading, or if the guild storage is open.\nThe setting is per window."
"Ce personnage ne pousse pas de chariot.": "This character is not pushing a cart."
