"Précision : comparée au FLEE de la cible pour déterminer si vous touchez.\n\nHIT = niveau de base + DEX. La part du niveau s'arrête au niveau 600 : au-delà, seule la DEX fait encore monter le HIT.": "Accuracy: compared with the target's FLEE to decide whether you hit.\n\nHIT = base level + DEX. The level's share stops at level 600: beyond that, only DEX still raises HIT."
"Esquive : comparée au HIT de la cible, réduit la probabilité d'être touché.\n\nFLEE = niveau de base + AGI. La part du niveau s'arrête au niveau 600 : au-delà, seule l'AGI fait encore monter le FLEE.": "Dodge: compared with the target's HIT, lowers the chance of being hit.\n\nFLEE = base level + AGI. The level's share stops at level 600: beyond that, only AGI still raises FLEE."
