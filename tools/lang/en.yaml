"L'id concret vient de GetHatEffectID(ordinal), le getter du jeu.\nOrdinal 87 = Digital_Space -> 1240. Aucun hardcode.": "The concrete id comes from GetHatEffectID(ordinal), the game's own getter.\nOrdinal 87 = Digital_Space -> 1240. Nothing hardcoded."
