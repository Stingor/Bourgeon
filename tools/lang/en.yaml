"Kill Steal STRICTEMENT interdit.": "Kill Stealing STRICTLY forbidden."
"Si la personne meurt ou se hide les mobs sont à vous.": "If the person dies or hides, the mobs are yours."
"Guild Dungeon": "Guild Dungeon"
"Libre de tuer les guildiens adverses.": "Free to kill members of opposing guilds."
"WoE Castles": "WoE Castles"
"Interdiction d'apporter de l'aide via un perso non participant (multi-account/perso).": "Bringing help through a non-participating character (multi-account/character) is forbidden."
"Les ententes entre guildes sont informelles, non officielles, non sanctionnables.": "Agreements between guilds are informal, unofficial and not sanctionable."
"Elles doivent être discutées entre guildes dominantes, dans le respect.": "They are to be discussed between dominant guilds, respectfully."
"Logiciels tiers": "Third-party software"
"Je vais être clair : oui, j'autorise les scripts AHK, les macros clavier/souris, les trucs qui bouclent un sort… tant que ça reste :": "Let me be clear: yes, I allow AHK scripts, keyboard/mouse macros, things that loop a spell… as long as it stays:"
"Pas un tableau de bord de la NASA": "Not a NASA control room"
"Vous bouclez le spell, éventuellement un clic en plus pour les AOE type Storm Gust, et basta.": "You loop the spell, maybe one extra click for AOEs like Storm Gust, and that is it."
"Quality of Life :": "Quality of Life:"
"Le but, c'est du Q.O.L": "The point is Q.O.L"
"Vous préservez votre clavier, votre souris, vos doigts, vos poignets, vos oreilles, et celles de vos voisins qui n'ont rien demandé.": "You spare your keyboard, your mouse, your fingers, your wrists, your ears, and your neighbours' ears, who never asked for any of this."
"Bref : du confort, pas du cheat.": "In short: comfort, not cheating."
"Les trucs interdits (et je rigole zéro) :": "The forbidden stuff (and I am not laughing at all):"
"Si vous me sortez :": "If you pull out:"
"un auto-buffer": "an auto-buffer"
"un auto-pot": "an auto-pot"
"un super TP/SG de physicien quantique": "some quantum-physicist super TP/SG"
"un script qui ferait rougir Tony Stark": "a script that would make Tony Stark blush"
"Alors là :": "Then:"
