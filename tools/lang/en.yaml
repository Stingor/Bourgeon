"Survoler un item affiche un aperçu SIMPLIFIÉ (nom, illustration, texte) dans un panneau au skin RO, posé au curseur et effacé dès que la souris quitte la ligne.\nLa description COMPLÈTE reste accessible au Ctrl + clic droit / menu contextuel.": "Hovering an item shows a SIMPLIFIED preview (name, illustration, text) in an RO-skinned panel, placed at the cursor and cleared as soon as the mouse leaves the row.\nThe FULL description stays available through Ctrl + right click / context menu."
"Dispose les catégories en liste verticale à gauche, comme la fenêtre native.\nOFF (défaut) : onglets horizontaux en haut.\nDécide aussi de l'orientation des onglets de storage, qui restent toujours PERPENDICULAIRES aux catégories.": "Lays the categories out as a vertical list on the left, like the native window.\nOFF (default): horizontal tabs at the top.\nIt also decides the orientation of the storage tabs, which always stay PERPENDICULAR to the categories."
"Images d'onglet": "Tab images"
"ON : tuiles images du client — jeu tab_* en disposition verticale, tabh_* en horizontale (all/use/wea/ammo/card/fav/cash/cos/etc). Les catégories sans art propre réutilisent celui de leur famille et portent alors un sigle (Am, Cs, Et).\nOFF : onglets texte — TabBar classique en horizontal, libellé écrit à la verticale en vertical.": "ON: the client's image tiles — the tab_* set in vertical layout, tabh_* in horizontal (all/use/wea/ammo/card/fav/cash/cos/etc). Categories without art of their own reuse their family's and then carry a sigil (Am, Cs, Et).\nOFF: text tabs — a classic TabBar horizontally, the label written vertically in vertical mode."
"Affiche la barre de recherche par nom au-dessus de la liste.\nDécoche pour gagner une ligne (le filtre est alors vidé).": "Shows the search-by-name bar above the list.\nUntick to gain a line (the filter is then cleared)."
"Filtres par type d'item": "Filters by item type"
"Affiche les onglets de catégorie (Tout, Favoris, Consos, Armes...) et le combo « Sous-type » qui en dépend.\nDécoche pour une liste unique, sans filtre de type : la vue repasse à « Tout » (rien ne reste masqué derrière) et « Images d'onglet » n'a plus d'objet. « Onglets verticaux », lui, continue de décider de l'orientation des onglets de STORAGE.\nLes favoris restent marquables (Ctrl + clic gauche, menu contextuel) : seul l'onglet qui les isole disparaît.": "Shows the category tabs (All, Favourites, Consumables, Weapons...) and the « Subtype » combo that depends on them.\nUntick for a single list, with no type filter: the view goes back to « All » (nothing stays hidden behind) and « Tab images » loses its purpose. « Vertical tabs », for its part, keeps deciding the orientation of the STORAGE tabs.\nFavourites stay markable (Ctrl + left click, context menu): only the tab isolating them disappears."
"Onglets de storage": "Storage tabs"
"Affiche un onglet par entrepôt auquel vous avez accès (principal et alternatifs) : un clic bascule de l'un à l'autre sans repasser par @storage / @storagealtN.\nLes onglets se placent PERPENDICULAIREMENT à ceux des catégories — en colonne à gauche si les catégories sont horizontales, en rangée en haut si elles sont verticales.\nLa liste vient du serveur : elle ne montre que ce que votre compte a le droit d'ouvrir, et n'apparaît qu'à partir de deux entrepôts.\nChaque onglet porte son NUMÉRO par défaut ; clic droit dessus pour lui donner un nom à vous et une icône d'item (ou glissez-y un item du storage pour reprendre la sienne).": "Shows one tab per storage you have access to (main and alternates): a click switches from one to the other without going through @storage / @storagealtN.\nThe tabs sit PERPENDICULAR to the category ones — in a column on the left if the categories are horizontal, in a row at the top if they are vertical.\nThe list comes from the server: it only shows what your account is allowed to open, and only appears from two storages onwards.\nEach tab carries its NUMBER by default; right-click it to give it a name of your own and an item icon (or drag an item from the storage onto it to take its own)."
