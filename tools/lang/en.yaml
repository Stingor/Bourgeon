"Je m'en bats les couilles.": "I could not care less."
"Je vous dégage plus vite que Thanos avec son finger snap. *Snap*": "I will get rid of you faster than Thanos with his finger snap. *Snap*"
"Les excuses bidon :": "The rubbish excuses:"
"\"Mais les autres serveurs le font...\"": "\"But the other servers allow it...\""
"\"Mais j'étais pas AFK, je regardais Naruto à côté...\"": "\"But I was not AFK, I was watching Naruto on the side...\""
"Résultat :": "Result:"
"Vous étiez sur Moon.": "You were on Moon."
"Vous ne l'êtes plus.": "You are not any more."
"Et il ne restera de vous que des ruines numériques sur Wayback Machine.": "And all that will be left of you is digital ruins on the Wayback Machine."
"Masquer la fenêtre Basic Info d'origine": "Hide the original Basic Info window"
"Masque la fenêtre native \"Basic Info\".": "Hides the native \"Basic Info\" window."
"Barres d'info": "Info bars"
"Afficher les barres": "Show the bars"
"Affiche/cache chaque barre indépendamment.": "Shows/hides each bar independently."
"Verrouiller les barres": "Lock the bars"
"Verrouillée : les barres ne bougent plus et laissent passer les clics au jeu.\nDéverrouillée : glissez-les pour les déplacer, tirez le coin pour redimensionner.": "Locked: the bars no longer move and let clicks through to the game.\nUnlocked: drag them to move them, pull a corner to resize."
"Aimanter les barres (snap)": "Snap the bars"
"Quand tu glisses une barre près d'une autre, ses bords s'alignent et se collent automatiquement (~10px).\nÉloigne-la pour la détacher. Les barres restent indépendantes.": "When you drag a bar near another one, their edges line up and stick automatically (~10px).\nMove it away to detach it. The bars stay independent."
"Remplissage vertical des barres. \nDécoche pour les barres horizontales.": "Vertical fill for the bars. \nUntick for horizontal bars."
"Bordure des barres": "Bar border"
"Trait sombre 1px autour de chaque barre (HP/SP/EXP...). \nDécoche pour des barres sans contour.": "A 1px dark line around each bar (HP/SP/EXP...). \nUntick for bars without an outline."
"Texte des barres": "Bar text"
"Ce qui est écrit sur les barres : rien, le pourcentage, les valeurs brutes (courant / max) ou les deux.": "What is written on the bars: nothing, the percentage, the raw values (current / max) or both."
"Arrondi des coins des barres.": "Corner rounding of the bars."
"Tailles rapides de barres (toutes) :": "Quick bar sizes (all):"
"Portrait personnage": "Character portrait"
"Afficher le portrait et les étiquettes": "Show the portrait and the labels"
"Portrait de statut : la tête du personnage, le pseudo, la classe et le niveau sont des éléments INDÉPENDANTS — chacun déplaçable, redimensionnable, avec sa couleur/opacité de fond, son arrondi et sa taille de texte.": "Status portrait: the character's head, the nickname, the class and the level are INDEPENDENT elements — each one movable, resizable, with its own background colour/opacity, rounding and text size."
"Verrouiller le portrait": "Lock the portrait"
"Si les éléments sont déverrouillés et en contact les uns avec les autres, ils sont déplaçables en maintenant Ctrl.": "If the elements are unlocked and touching one another, they can be moved by holding Ctrl."
"Verrouillé : les éléments ne bougent plus et laissent passer les clics au jeu.\nDéverrouillé : glisse pour déplacer, tire un bord/coin pour redimensionner (aimantage à la grille d'alignement).": "Locked: the elements no longer move and let clicks through to the game.\nUnlocked: drag to move, pull an edge/corner to resize (snapping to the alignment grid)."
"Tête seule (sans le corps)": "Head only (no body)"
"Ne génère que la tête (visage/cheveux/coiffes) et retire le corps.\nDécoche pour le personnage entier.": "Generates only the head (face/hair/headgear) and removes the body.\nUntick for the whole character."
"Affiche la cape/garment équipée (seulement en mode corps entier — décoche \"Tête seule\" pour la voir).": "Shows the equipped cape/garment (whole-body mode only — untick \"Head only\" to see it)."
"Ajuster avec le zoom.": "Adjust with the zoom."
"Décalage horiz.": "Horiz. offset"
"Décale le portrait horizontalement (0 = centré).\nSert à cadrer la tête/le corps ; le zoom reste centré.": "Shifts the portrait horizontally (0 = centred).\nUseful to frame the head/body; the zoom stays centred."
"Décalage vert.": "Vert. offset"
"Décale le portrait verticalement (0 = centré).\nOptionnel — le zoom reste centré ; laisse à 0 si tu n'en as pas besoin.": "Shifts the portrait vertically (0 = centred).\nOptional — the zoom stays centred; leave at 0 if you do not need it."
"Pose animée du portrait (Combat = posture prête au combat).\nLe nombre d'images de l'animation s'ajuste automatiquement.": "Animated pose of the portrait (Combat = combat-ready stance).\nThe animation's frame count adjusts automatically."
"Oriente le portrait. 0 = face. Essaie les valeurs pour trouver l'angle voulu (le rendu se met à jour en direct).": "Orients the portrait. 0 = facing you. Try values to find the angle you want (the render updates live)."
"Joue les images de l'animation (ex. le balayage de la posture Combat). Décoche pour figer une pose calme (image 0).": "Plays the animation frames (e.g. the sweep of the Combat stance). Untick to freeze a calm pose (frame 0)."
"Couleurs, arrondis et taille de texte du portrait et des étiquettes": "Colours, rounding and text size of the portrait and the labels"
