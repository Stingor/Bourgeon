"Les instances CEZ2STREffect sont normalement écartées (autre pipeline).\nCoche pour vérifier si un effet non capturé appartient à cette famille :\ns'il apparaît alors dans « effect_id capturés », c'est le cas.\n/!\\ Peut provoquer un double dessin ailleurs : diagnostic uniquement.": "CEZ2STREffect instances are normally set aside (different pipeline).\nTick to check whether an uncaptured effect belongs to that family:\nif it then appears under \"captured effect_id\", it does.\n/!\\ May cause double drawing elsewhere: diagnostics only."
"Sert à isoler une régression : coche, puis regarde si le rendu NATIF\n(z-order des chapeaux/costumes) redevient correct.\nCoché = la famille aura/statut n'est plus ni capturée ni composée\nsur le doll (Perm_Frost & co disparaîtront de l'aperçu).": "Useful to isolate a regression: tick, then check whether NATIVE rendering\n(z-order of headgear/costumes) becomes correct again.\nTicked = the aura/status family is no longer captured nor composed\nonto the doll (Perm_Frost & co will vanish from the preview)."
"état: %s (%d prim : %d tri, %d quad)": "state: %s (%d prim: %d tri, %d quad)"
"éteint": "off"
"-> nœud jamais dessiné (non créé ?)": "-> node never drawn (not created?)"
"-> dessiné mais n'émet RIEN (ressource ?)": "-> drawn but emits NOTHING (missing resource?)"
"-> émis mais REJETÉ par nous (bug)": "-> emitted but REJECTED by us (bug)"
"dessins  = appels d'EzEffect_Draw sur NOTRE nœud\ninserts  = primitives soumises pendant ce dessin (avant nos filtres)\ncapturés = ce qu'on garde après filtres de forme\n\n0 dessin        -> le nœud n'existe pas : problème AMONT du rendu.\ndessins, 0 ins. -> le sous-rendu n'émet rien : ressource absente\n                   (le chargeur échoue en silence) ou condition non remplie.\nins. mais 0 cap.-> le jeu émet et NOUS rejetons : là c'est notre bug.": "draws    = EzEffect_Draw calls on OUR node\ninserts  = primitives submitted during that draw (before our filters)\ncaptured = what we keep after shape filtering\n\n0 draw          -> the node does not exist: problem UPSTREAM of rendering.\ndraws, 0 ins.   -> the sub-render emits nothing: missing resource\n                   (the loader fails silently) or condition not met.\nins. but 0 cap. -> the game emits and WE reject: that one is our bug."
