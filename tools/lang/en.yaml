"Clic gauche      monter d'un niveau (envoyé aussitôt au serveur)\nDouble-clic      lancer la compétence\nClic droit       description de la compétence\nGlisser          pose la compétence sur une barre d'action\nSurvol           flèches de prérequis (ambre) et de suites (bleu)\n\nPas de « Appliquer » ici : contrairement au Grimoire, une compétence de\nguilde se monte immédiatement.": "Left click       level up once (sent to the server at once)\nDouble-click     cast the skill\nRight click      the skill's description\nDrag             puts the skill on an action bar\nHover            prerequisite (amber) and follow-up (blue) arrows\n\nNo « Apply » here: unlike the Grimoire, a guild skill\nlevels up immediately."
