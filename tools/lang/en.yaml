# HUD de cible (mode Ciblage + HUD)
"(modèle 3D)": "(3D model)"
"inconnus": "unknown"
"Activer le mode Ciblage + HUD": "Enable Targeting + HUD mode"
"La cible est la dernière entité cliquée. Le HUD s'allume dessus et y reste quand on cesse de l'attaquer ; la flèche de ciblage du jeu la suit aussi longtemps. Tout s'éteint si la cible change, si elle s'éloigne hors de vue, ou par « Masquer la fenêtre de cible » dans le menu contextuel de l'entité.\n\nDécoché, TOUT ce qui suit s'arrête : le HUD, la flèche, les raccourcis de ciblage, le clic sans attaque, les cadres qui agissent et les sorts qui partent sur la cible.": "The target is the last entity you clicked. The HUD lights up on it and stays there when you stop attacking; the game's targeting arrow follows it just as long. Everything goes off if the target changes, if it moves out of sight, or through \"Hide the target window\" in the entity's context menu.\n\nUnchecked, EVERYTHING below stops: the HUD, the arrow, the targeting shortcuts, clicking without attacking, the frames that act and the skills that fire at the target."
"Fige les cadres et laisse passer les clics vers le jeu. À décocher pour les déplacer : on saisit un cadre n'importe où, ses BORDS le redimensionnent.": "Freezes the frames and lets clicks through to the game. Uncheck it to move them: grab a frame anywhere, its EDGES resize it."
"Mode placement (garder les cadres sans cible)": "Layout mode (keep the frames with no target)"
"Sans cible il n'y a rien à attraper : ce mode garde les cadres à l'écran le temps de les poser. À décocher une fois le HUD en place.": "With no target there is nothing to grab: this mode keeps the frames on screen while you place them. Uncheck it once the HUD is set."
"Liseré autour des cadres": "Outline around the frames"
"Aimanter les cadres entre eux": "Snap the frames to each other"
"Pendant un déplacement, les bords s'alignent sur ceux des autres cadres. CTRL + déplacement emmène en bloc tous les cadres qui se touchent.": "While dragging, edges line up with those of the other frames. CTRL + drag moves every frame that touches, as one block."
"Orientation": "Facing"
"0 = de face, comme le portrait du personnage.": "0 = facing you, like the character portrait."
"Action": "Action"
"Un monstre est un sprite, un joueur est un assemblage (corps, tête, coiffes, cape) monté par le composeur de pantin. Les classes rendues par un modèle 3D (Emperium, gardiens, coffres) n'ont pas de sprite : le cadre le dit.": "A monster is a sprite, a player is an assembly (body, head, headgear, cape) built by the doll composer. Classes drawn as a 3D model (Emperium, guardians, treasure chests) have no sprite: the frame says so."
"Ciblage": "Targeting"
"Flèche de ciblage du jeu sur la cible": "Game's targeting arrow on the target"
"Le petit triangle blanc au-dessus de l'entité. Le jeu ne l'affiche que tant que la souris engage la cible : il disparaît dès qu'on regarde ailleurs, et le ciblage au clavier ne l'allume pas du tout. Coché, il suit la cible du HUD aussi longtemps qu'elle.": "The little white triangle above the entity. The game only shows it while the mouse is engaging the target: it disappears as soon as you look elsewhere, and keyboard targeting does not light it at all. Checked, it follows the HUD's target for just as long."
"Le clic cible sans attaquer": "Clicking targets without attacking"
"Cliquer une entité la prend pour cible, mais n'engage rien : le personnage ne se déplace pas vers elle et ne frappe pas.\n\nPour attaquer, DOUBLE-CLIQUE — ou passe par « Attaquer » du menu contextuel. Le délai du double-clic est celui de Windows.\n\nLes compétences ne sont pas concernées, ni les ordres au pet, à l'homoncule ou au mercenaire, ni s'asseoir.": "Clicking an entity takes it as your target, but engages nothing: your character neither walks to it nor hits it.\n\nTo attack, DOUBLE-CLICK — or use \"Attack\" in the context menu. The double-click delay is the one Windows uses.\n\nSkills are not affected, nor orders to your pet, homunculus or mercenary, nor sitting down."
"Les sorts ciblés partent sur la cible": "Targeted skills fire at your target"
"Une compétence ciblée demande normalement deux gestes : la touche arme la visée, le clic désigne qui. Coché, c'est la cible du HUD qui répond — la souris n'a plus à être sur l'entité.\n\nElle garde la priorité quand elle désigne vraiment quelqu'un : ce réglage comble un vide, il ne détourne pas une visée. Les sorts de zone ne sont pas concernés, ils visent une case.\n\nComme tout QuickCast, maintenir la touche relance la compétence sur la cible.": "A targeted skill normally takes two gestures: the key arms the aim, the click says who. Ticked, the HUD's target answers — the mouse no longer has to be on the entity.\n\nThe mouse keeps priority whenever it really points at someone: this setting fills a gap, it does not hijack an aim. Ground skills are not affected, they aim at a cell.\n\nLike the rest of QuickCast, holding the key relaunches the skill on the target."
"Les cadres agissent comme la cible": "Frames act as the target"
"Sans effet : les cadres ne sont pas verrouillés, le clic sert à les déplacer.": "No effect: the frames are not locked, the click moves them instead."
"Cliquer un cadre du HUD revient à cliquer l'entité elle-même : attaque, compétence ciblée armée — c'est le même chemin du client qui est rejoué.\n\nUn SEUL clic attaque, même si « le clic cible sans attaquer » est coché : ce réglage lève l'ambiguïté d'un clic dans le monde, et il n'y en a aucune sur un cadre — la cible est déjà désignée.\n\n⚠ Un cadre qui agit REPREND LA SOURIS au jeu tant que le curseur est dessus : ni clic vers le sol derrière, ni rotation de caméra. Il ne le fait que quand il y a une cible ET que le clic aurait un sens — un sort de zone vise une case, le cadre lui laisse alors le passage.\n\nSans effet tant que les cadres ne sont pas verrouillés : le clic sert alors à les poser.": "Clicking a HUD frame is the same as clicking the entity itself: attack, armed targeted skill — the very same client path is replayed.\n\nA SINGLE click attacks, even with \"Click targets without attacking\" ticked: that setting resolves the ambiguity of a click in the world, and there is none on a frame — the target is already designated.\n\n⚠ A frame that acts TAKES THE MOUSE back from the game while the cursor is over it: no click through to the ground behind, no camera rotation. It only does so when there is a target AND the click would mean something — a ground skill aims at a cell, so the frame lets it through.\n\nNo effect while the frames are unlocked: the click then serves to place them."
"Ciblage au clavier": "Keyboard targeting"
"Deux actions à lier dans l'écran des raccourcis : « Cible suivante » et « Cible précédente ». Elles passent d'un monstre à l'autre parmi ceux qui sont à l'écran, du plus proche au plus loin. Tab et Maj+Tab conviennent bien, et restent au chat tant que la barre de saisie a le focus.": "Two actions to bind in the shortcuts screen: \"Next target\" and \"Previous target\". They step from one on-screen monster to the next, nearest first. Tab and Shift+Tab suit them well, and stay with the chat as long as the input bar has focus."
"Boucler après la dernière cible": "Wrap around after the last target"
"Cadres": "Frames"
"Race / élément": "Race / element"
"États": "Status"
"Réinitialiser la disposition": "Reset the layout"
"Repose les cinq cadres à leur place d'origine, en haut à gauche. Les couleurs et les interrupteurs ne bougent pas.": "Puts the five frames back where they started, at the top left. Colors and switches are left alone."
"Cible suivante": "Next target"
"Cible précédente": "Previous target"
"Cible la plus proche": "Nearest target"
"Cycler entre les fenêtres": "Cycle through the windows"
"Reprendre au plus proche après (ms)": "Back to nearest after (ms)"
"Passé ce délai sans cycler, le prochain appui repart du monstre le plus proche au lieu de continuer où le cycle en était.\n\nC'est ce qui sépare les deux usages du cyclage : enchaîner les appuis pour PARCOURIR ce qu'il y a autour, ou appuyer une fois pour PRENDRE une cible. Sans ce délai, le second héritait de la position laissée par le premier — on rappuyait après un combat et on repartait au cinquième monstre.\n\n0 = jamais : le cycle se souvient indéfiniment.": "Past this delay without cycling, the next press starts again from the nearest monster instead of carrying on where the cycle left off.\n\nThat is what separates the two uses of cycling: pressing repeatedly to BROWSE what is around, or pressing once to TAKE a target. Without this delay the second inherited the position left by the first — you pressed again after a fight and started at the fifth monster.\n\n0 = never: the cycle remembers indefinitely."
"Trois actions à lier dans l'écran des raccourcis : « Cible suivante », « Cible précédente » et « Cible la plus proche ». Les deux premières passent d'un monstre à l'autre parmi ceux qui sont à l'écran, du plus proche au plus loin ; la troisième prend directement le plus proche, sans rien parcourir. Tab et Maj+Tab conviennent bien, et restent au chat tant que la barre de saisie a le focus.": "Three actions to bind in the shortcut screen: \"Next target\", \"Previous target\" and \"Nearest target\". The first two move from one on-screen monster to the next, nearest first; the third takes the nearest one directly, without browsing. Tab and Shift+Tab work well, and stay with the chat as long as the input bar has focus."
"Quatre actions à lier dans l'écran des raccourcis : « Cible suivante », « Cible précédente », « Cible la plus proche » et « Effacer la cible ». Les deux premières passent d'un monstre à l'autre parmi ceux qui sont à l'écran, du plus proche au plus loin ; la troisième prend directement le plus proche, sans rien parcourir ; la quatrième lâche la cible. Tab et Maj+Tab conviennent bien, et restent au chat tant que la barre de saisie a le focus.": "Four actions to bind in the shortcut screen: \"Next target\", \"Previous target\", \"Nearest target\" and \"Clear the target\". The first two move from one on-screen monster to the next, nearest first; the third takes the nearest one directly, without browsing; the fourth drops the target. Tab and Shift+Tab work well, and stay with the chat as long as the input bar has focus."
"Effacer la cible": "Clear the target"
"Échap efface la cible": "Escape clears the target"
"Échap lâche d'abord la cible, et n'ouvre le menu du jeu que s'il n'y en avait pas.\n\nLa touche n'est prise que si le déciblage a vraiment eu lieu : sans cible, Échap fait ce qu'il a toujours fait.\n\nElle passe en dernier, après les fenêtres qu'Échap referme et la barre de chat — un même appui ne fait jamais deux choses.": "Escape drops the target first, and only opens the game menu when there was none.\n\nThe key is taken only if something was really untargeted: with no target, Escape does what it has always done.\n\nIt comes last, after the windows Escape closes and the chat bar — one press never does two things."
"Masquer la fenêtre de cible": "Hide the target window"
"Pour cette cible seulement : elle revient dès que tu en désignes une autre.": "For this target only: it comes back as soon as you pick another one."

# Outillage JOUEUR du staff (entity_context_menu.cc) : le port du NPC cache
# #gmclicdroit dans le sous-menu « Outils du staff » — faire venir, asseoir,
# points d'event, mute, jail, nuke, ban, + les deux modales.
"Le faire venir ici": "Bring them here"
"Il MARCHE jusqu'à vous — il n'est pas téléporté : le trajet reste visible pour lui comme pour les autres.\nSur votre carte seulement, et seulement s'il existe un chemin. Le serveur le relève d'abord s'il est assis.": "They WALK to you — they are not teleported: the trip stays visible to them and to everyone else.\nOn your map only, and only if a path exists. The server stands them up first if they are sitting."
"L'asseoir ou le relever": "Sit them down or stand them up"
"Une bascule : le serveur regarde dans quelle position il est et pose l'autre.": "A toggle: the server looks at the posture they are in and sets the other one."
"Points d'event…": "Event points…"
"Donne ou retire des points d'event (la monnaie kafra), au plus 50 à la fois.\nLe solde actuel n'est PAS ici : il se lit dans « Propriétés… », que le serveur renseigne.": "Grants or takes event points (the kafra currency), at most 50 at a time.\nThe current balance is NOT here: it is read in \"Properties…\", which the server fills in."
"Le rendre muet (60 min)": "Mute them (60 min)"
"Ajoute 60 minutes de silence. Appliqué deux fois, il prolonge — ce n'est pas un interrupteur.": "Adds 60 minutes of silence. Applied twice it extends — it is not a switch."
"Lui rendre la parole": "Let them speak again"
"Le foudroyer": "Nuke them"
"@nuke : une explosion sur sa case. Il meurt, avec la pénalité de mort habituelle.": "@nuke: an explosion on their tile. They die, with the usual death penalty."
"Bannir le compte…": "Ban the account…"
"@block : bannissement DÉFINITIF du compte, pas du personnage. Tous ses personnages tombent avec lui.": "@block: PERMANENT ban of the ACCOUNT, not of the character. Every character on it falls with them."
"Outils du staff": "Staff tools"
"Bannir ce compte###bourgeon_ctxmenu_confirm": "Ban this account###bourgeon_ctxmenu_confirm"
"Points d'event###bourgeon_ctxmenu_confirm": "Event points###bourgeon_ctxmenu_confirm"
"Bannir le compte de %s ?": "Ban the account of %s?"
"C'est le COMPTE qui tombe, pas ce personnage : tous\nles autres personnages du même compte deviennent\ninaccessibles, et le bannissement n'a pas de fin.": "It is the ACCOUNT that falls, not this character: every\nother character on the same account becomes\nunreachable, and the ban has no end."
"Pour le lever : @unblock <nom du personnage>.\nPour une sanction qui expire, préférez @ban.": "To lift it: @unblock <character name>.\nFor a sanction that expires, prefer @ban."
"Bannir": "Ban"
"Points d'event de %s": "Event points of %s"
"à donner###ctxmenu_points": "to grant###ctxmenu_points"
"Négatif pour retirer. Ctrl+clic sur la barre pour taper\nla valeur. Le serveur reborne, et refuse de faire\ndescendre le solde sous zéro.\nLe solde actuel se lit dans « Propriétés… ».": "Negative to take away. Ctrl+click the bar to type\nthe value. The server clamps again, and refuses to\npush the balance below zero.\nThe current balance is read in \"Properties…\"."
"L'emprisonner ou le libérer": "Jail them or release them"
"Une bascule : le serveur regarde s'il est déjà en prison et fait l'inverse.\nUn joueur emprisonné vit sur sec_pri — hors de cette carte, cette entrée ne peut que l'y envoyer. Sans durée : pour une peine bornée, @jailfor.": "A toggle: the server looks at whether they are already in jail and does the opposite.\nA jailed player lives on sec_pri — outside that map this entry can only send them there. No duration: for a bounded sentence, @jailfor."

