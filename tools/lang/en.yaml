"Nom de la compétence": "Skill name"
"Pour qui préfère la suivre dans son interface. La barre « Cast » se règle avec les autres barres, dans la section « Basic Info ».": "For those who prefer to follow it in their HUD. The \"Cast\" bar is set up with the other bars, in the \"Basic Info\" section."
