"Heure illisible.": "Unreadable time."
"%s (%s) entre dans sa fenêtre.": "%s (%s) is entering its window."
"Activer le carnet de chasse MVP": "Enable the MVP hunting log"
"Éteint, le serveur cesse de t'envoyer ce que ton groupe observe — mais tes propres kills continuent de l'alimenter. Ce n'est donc pas un mode dégradé : tu nourris le groupe sans rien recevoir.": "Off, the server stops sending you what your group observes — but your own kills keep feeding it. So this is not a degraded mode: you feed the group without receiving anything."
"Ouvrir le carnet": "Open the log"
"ou une touche à lier : « Carnet de chasse MVP »": "or a key to bind: \"MVP hunting log\""
"Alerte sonore sur un favori": "Sound alert on a favorite"
"Préavis d'alerte (min)": "Alert lead time (min)"
"Combien de minutes AVANT l'ouverture de la fenêtre de retour l'alerte se déclenche.\n\nLes favoris eux-mêmes sont enregistrés sur le serveur : ils suivent ton compte, donc tous tes personnages et tous tes postes. Seuls ce préavis et le son restent locaux.": "How many minutes BEFORE the respawn window opens the alert fires.\n\nThe favorites themselves are stored on the server: they follow your account, so all of your characters and all of your machines. Only this lead time and the sound stay local."
"Tombes sur la minimap": "Tombs on the minimap"
"Marque l'endroit exact où chaque MVP connu de ton groupe est tombé, sur la carte concernée. Doré quand l'instant du retour a été mérité au Convex Mirror, orangé quand on n'a qu'une fenêtre.\n\nIndépendant du marqueur « Boss (Convex Mirror) » de la minimap, qui vient du client.": "Marks the exact spot where each MVP known to your group fell, on the map concerned. Gold when the return time was earned with a Convex Mirror, orange when only a window is known.\n\nIndependent from the minimap's \"Boss (Convex Mirror)\" marker, which comes from the client."
"Réglages du carnet": "Log settings"
"Sprite du MVP dans la liste": "MVP sprite in the list"
"Reconnaître un monstre à sa silhouette va plus vite que lire son nom anglais dans une table de quatre-vingts lignes.\n\nSurvoler son nom donne la fiche compacte, un clic droit ouvre les mêmes actions que sur un lien de monstre du chat — fiche, bestiaire, « où le trouver », @mobinfo, @whereis. Et survoler la carte montre le plan avec la tombe pointée.": "Recognizing a monster by its silhouette is faster than reading its English name in a table of eighty rows.\n\nHovering its name gives the compact sheet, a right click opens the same actions as on a monster link in the chat — sheet, bestiary, \"where to find it\", @mobinfo, @whereis. And hovering the map shows the plan with the tomb pinned on it."
"Aucune tombe connue.": "No tomb known."
"Taille du sprite (px)": "Sprite size (px)"
"C'est aussi la hauteur des rangs : la table s'étire avec.\n\n⚠ Un sprite n'est jamais AGRANDI au-delà de sa taille réelle — sa taille dit son gabarit, et l'étirer mentirait. Les MVP étant de grosses bêtes, le curseur agit sur presque tous ; un petit monstre, lui, s'arrête à sa taille native au lieu de devenir flou.": "It is also the row height: the table stretches with it.\n\n⚠ A sprite is never ENLARGED beyond its real size — its size tells its build, and stretching it would lie. MVPs being big beasts, the slider acts on nearly all of them; a small monster stops at its native size instead of turning blurry."
"Animer les sprites": "Animate the sprites"
"Éteint par défaut : quatre-vingts silhouettes qui bougent en même temps font de la table un aquarium, et le regard n'accroche plus la ligne qu'on cherche.": "Off by default: eighty silhouettes moving at once turn the table into an aquarium, and the eye no longer catches the row you are looking for."
"MVP : %s possible###bourgeon_mvp_tracker": "MVP: %s possible###bourgeon_mvp_tracker"
"MVP : %s dans %s###bourgeon_mvp_tracker": "MVP: %s in %s###bourgeon_mvp_tracker"
"Lignes détachées": "Detached lines"
"Glisser une ligne du carnet par sa poignée, à gauche, et la lâcher HORS de la fenêtre : elle reste à l'écran et survit à la fermeture du carnet. Les lignes s'aimantent entre elles. Clic droit sur une ligne pour la remettre au carnet.": "Drag a row out of the log by its grip, on the left, and drop it OUTSIDE the window: it stays on screen and survives the log being closed. Lines snap to each other. Right-click a line to put it back in the log."
"Ligne — texte": "Line — text"
"Ligne — fond": "Line — background"
"Le canal alpha de chaque couleur EST son opacité — les deux sont réglables séparément, précisément pour obtenir ce qu'on veut d'une ligne discrète : un fond presque transparent sous un texte resté lisible.": "Each color's alpha channel IS its opacity — both are set separately, precisely to get what a discreet line needs: an almost transparent background under text that stays readable."
"Tout remettre au carnet (%d)": "Put them all back in the log (%d)"
"possible": "possible"
"Glisser hors du carnet pour détacher la ligne.": "Drag out of the log to detach the row."
"Ce compte de jeu n'est rattaché à aucun compte Moonlight.": "This game account is not tied to any Moonlight account."
"Vous êtes déjà dans un groupe : quittez-le d'abord.": "You are already in a group: leave it first."
"Seul le propriétaire du groupe peut faire cela.": "Only the group owner can do that."
"Personnage introuvable : vérifiez l'orthographe.": "Character not found: check the spelling."
"Pas sur vous-même.": "Not on yourself."
"Le groupe est complet.": "The group is full."
"Nom de groupe invalide (1 à 31 caractères).": "Invalid group name (1 to 31 characters)."
"Aucune invitation en attente.": "No pending invitation."
"Cette personne appartient déjà à un autre groupe.": "This person already belongs to another group."
"Erreur de base de données : rien n'a été changé.": "Database error: nothing was changed."
"Ce personnage est déjà dans votre groupe : son compte Moonlight y est, avec tous ses personnages.": "This character is already in your group: their Moonlight account is in it, with all of their characters."
"Ce personnage n'est ni dans votre guilde ni dans vos amis.": "This character is neither in your guild nor in your friend list."
"Ajoute une barre de recherche au-dessus de la table, qui filtre sur le nom du MVP comme sur celui de la carte.\n\nLe filtre lui-même n'est pas enregistré : on filtre pour trouver quelque chose maintenant, pas pour rouvrir demain sur une table amputée sans se rappeler pourquoi.\n\n⚠ Les COLONNES, elles, se règlent au clic droit sur la ligne d'en-tête — on y montre « Délai », le temps de retour habituel, masqué par défaut.": "Adds a search bar above the table, filtering on the MVP name as well as the map name.\n\nThe filter itself is not saved: you filter to find something now, not to reopen tomorrow on a truncated table without remembering why.\n\n⚠ The COLUMNS are set by right-clicking the header row — that is where \"Delay\", the usual return time, is shown; hidden by default."
"Filtrer : nom ou carte": "Filter: name or map"
"%d min": "%d min"
"Le délai écrit dans le script de spawn : au plus tôt, au plus tard.\n\nC'est une donnée publique, et la seule que le serveur ait le droit de publier — le tirage exact à l'intérieur de cette plage, lui, ne sort que si un membre l'a payé avec un Convex Mirror.": "The delay written in the spawn script: earliest, latest.\n\nIt is public data, and the only thing the server is allowed to publish — the exact draw inside that range only comes out if a member paid for it with a Convex Mirror."
"Inviter dans mon carnet MVP": "Invite to my MVP log"
"Sprite dans les lignes détachées": "Sprite in detached lines"
"Réglage à part de celui de la table, et c'est voulu : une ligne posée sur le décor du jeu cherche la discrétion, là où la table cherche à faire reconnaître un monstre d'un coup d'œil.": "A setting of its own, separate from the table's, and deliberately so: a line laid over the game world seeks discretion, where the table seeks to let you recognize a monster at a glance."
"Le carnet de chasse MVP est éteint dans les réglages.": "The MVP hunting log is switched off in the settings."
"Il faut appartenir à un groupe de chasse pour y inviter quelqu'un — créez-en un depuis le carnet.": "You must belong to a hunting group to invite anyone to it — create one from the log."
"Seuls vos amis et vos compagnons de guilde peuvent rejoindre votre carnet de chasse.": "Only your friends and your guild mates can join your hunting log."
"Déjà dans votre carnet : son compte Moonlight y est, avec tous ses personnages.": "Already in your log: their Moonlight account is in it, with all of their characters."
"Invitation reçue": "Invitation received"
"Le groupe de chasse « %s » vous invite à partager son carnet MVP.": "The hunting group \"%s\" invites you to share its MVP log."
"Quittez d'abord votre groupe actuel pour pouvoir accepter.": "Leave your current group first to be able to accept."
"Le carnet se remplit de ce que VOTRE GROUPE observe : ses kills, les tombes qu'il lit, les Convex Mirror qu'il porte. Sans groupe, aucune ligne ne se remplira.": "The log fills up with what YOUR GROUP observes: its kills, the tombs it reads, the Convex Mirrors it carries. Without a group, no row will ever fill."
"Créez-en un ci-dessus — vous pouvez y chasser seul, et inviter plus tard vos amis et vos compagnons de guilde.": "Create one above — you can hunt alone in it, and invite your friends and guild mates later."
