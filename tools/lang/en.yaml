"Vous préservez votre clavier, votre souris, vos doigts, vos poignets, vos oreilles, et celles de vos voisins qui n'ont rien demandé.": "You spare your keyboard, your mouse, your fingers, your wrists, your ears, and your neighbours' ears, who never asked for any of this."
