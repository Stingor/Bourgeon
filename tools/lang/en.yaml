"…": "…"
"Fige le cadre et laisse passer les clics vers le jeu.\n\nMaintenir MAJ, CURSEUR SUR LA GRILLE, la déverrouille le temps d'un déplacement : pas besoin de revenir décocher ici.\n\nAilleurs à l'écran, MAJ garde son rôle habituel (attaque forcée) — la grille ne reprend la souris que sous le curseur.": "Locks the frame and lets clicks through to the game.\n\nHolding SHIFT WITH THE CURSOR OVER THE GRID unlocks it long enough to move it: no need to come back and untick this.\n\nElsewhere on screen, SHIFT keeps its usual role (forced attack) — the grid only takes the mouse under the cursor."
"La taille du cadre se DÉDUIT de ces valeurs : c'est la tuile qui commande.\n\nTirer le cadre par sa poignée n'agit donc pas sur sa taille mais sur le nombre de COLONNES : l'élargir en ajoute, le rétrécir en retire. La hauteur, elle, suit le nombre de membres.": "The frame size is DERIVED from these values: the tile decides.\n\nDragging the frame by its handle therefore does not resize it but changes the number of COLUMNS: widening adds some, narrowing removes some. The height follows the number of members."
"Rien": "None"
