"Remplace les DEUX listes natives : « LIST » (flèches, convertisseurs, poison, leurres, cuisine, bombes) et « Manufacturing List » (pharmacie, runes, forge).": "Replaces BOTH native lists: « LIST » (arrows, converters, poison, lures, cooking, bombs) and « Manufacturing List » (pharmacy, runes, forging)."
"Clic droit : description · double-clic ou Entrée : fabriquer.": "Right click: description · double-click or Enter: craft."
"En-têtes de colonne : trier (3e clic = ordre du serveur).": "Column headers: sort (3rd click = the server's order)."
"Colonnes « Possédé » et « Faisable »": "« Owned » and « Craftable » columns"
"Le stock en inventaire, et le nombre de fabrications possibles déduit de la recette du client.\n\n« — » signifie « on ne sait pas » : la recette manque au fichier client, ou un nom de matériau n'a pas pu être résolu. Jamais « 0 » — le serveur n'aurait pas proposé le produit s'il n'y avait pas de quoi en faire au moins un.": "The stock in the inventory, and the number of crafts possible, deduced from the client's recipe.\n\n« — » means « unknown »: the recipe is missing from the client file, or a material name could not be resolved. Never « 0 » — the server would not have offered the product if there were not enough for at least one."
"Aperçu au survol": "Preview on hover"
"Journal de session": "Session log"
"Horodater le journal": "Timestamp the log"
"Entrée lance la fabrication": "Enter starts the craft"
"Décoché (défaut), la touche Entrée reste au CHAT pendant que la fenêtre est ouverte.\n\nCochée, elle déclenche la fabrication du produit sélectionné — et la maintenir enchaîne. Mais la fenêtre confisque alors la touche tant qu'elle est ouverte : impossible d'ouvrir la saisie du chat.\n\nDepuis que le champ Quantité existe, marteler Entrée n'a plus grand intérêt : « ×20 » fait le même travail sans occuper le clavier.": "Unticked (default), the Enter key stays with the CHAT while the window is open.\n\nTicked, it triggers the craft of the selected product — and holding it chains. But the window then confiscates the key for as long as it is open: opening the chat input becomes impossible.\n\nSince the Quantity field exists, hammering Enter has little point any more: « ×20 » does the same work without tying up the keyboard."
"Relancer la compétence automatiquement": "Recast the skill automatically"
"Le serveur n'autorise qu'UNE fabrication par lancement de compétence (clif_menuskill_clear). Sans ça, enchaîner impose de retourner à la barre de raccourcis à chaque fois.\n\nCe qui se relance seul, c'est le LANCEMENT DE LA COMPÉTENCE — jamais la fabrication : le choix du produit et le déclenchement restent des clics. Aucune tentative ne part sans un geste de ta part.\n\nLa chaîne s'arrête d'elle-même sur une liste vide (le serveur dit qu'il n'y a plus rien) ou sur un refus de compétence.\n\nNE S'APPLIQUE PAS aux listes ouvertes par un OBJET (Mini Furnace, marteaux de forge : leur script fait « produce N; »). Ces objets sont CONSOMMÉS à chaque usage : ils ont leur propre réglage, juste en dessous.": "The server allows only ONE craft per skill cast (clif_menuskill_clear). Without this, chaining means going back to the shortcut bar every single time.\n\nWhat recasts on its own is the SKILL CAST — never the craft: picking the product and triggering it stay clicks. No attempt goes off without a gesture from you.\n\nThe chain stops by itself on an empty list (the server says there is nothing left) or on a skill refusal.\n\nDOES NOT APPLY to lists opened by an ITEM (Mini Furnace, forging hammers: their script does « produce N; »). Those items are CONSUMED on every use: they have their own setting, just below."
"Ré-utiliser l'OBJET automatiquement (le consomme)": "Re-use the ITEM automatically (consumes it)"
"Pour les listes ouvertes par un objet — Mini Furnace, marteaux de forge — dont le script fait « produce N; ».\n\n/!\\ CHAQUE RELANCE DÉTRUIT UN EXEMPLAIRE. Le serveur supprime l'objet (pc_delitem, LOG_TYPE_CONSUME) AVANT d'exécuter son script : l'exemplaire est perdu même si tu annules ensuite, et même si la fabrication rate.\n\nComme pour la compétence, ce qui se relance est l'OUVERTURE de la liste, jamais la fabrication : choisir le produit et déclencher restent des clics.\n\nLa chaîne s'arrête sur une liste vide, sur un refus du serveur, dès qu'il ne te reste plus l'objet, ou si tu fermes la fenêtre. Le nombre d'exemplaires consommés reste affiché pendant toute la chaîne.": "For lists opened by an item — Mini Furnace, forging hammers — whose script does « produce N; ».\n\n/!\\ EVERY CHAIN STEP DESTROYS ONE COPY. The server deletes the item (pc_delitem, LOG_TYPE_CONSUME) BEFORE running its script: the copy is lost even if you cancel afterwards, and even if the craft fails.\n\nAs with the skill, what is chained is the OPENING of the list, never the craft: picking the product and triggering it stay clicks.\n\nThe chain stops on an empty list, on a server refusal, as soon as you run out of the item, or if you close the window. The number of copies consumed stays displayed throughout the chain."
"Sans limite (jusqu'à épuisement du stock)": "No limit (until the stock runs out)"
"Sans limite, la chaîne va jusqu'à épuisement du stock. C'est le défaut — consommer toute une pile est ton choix.\n\nLe plafond n'existe que pour le seul cas qu'il couvre vraiment : avoir oublié ce réglage coché. Il ne protège de rien d'autre.\n\nUne chaîne illimitée ne peut pas s'emballer : chaque tour exige un résultat du serveur pour armer le suivant. Si le serveur ignore l'usage (objet en cooldown, condition non remplie), aucune liste n'arrive et la chaîne s'arrête d'elle-même.": "With no limit, the chain runs until the stock runs out. That is the default — consuming a whole stack is your choice.\n\nThe cap only exists for the one case it truly covers: having forgotten this box ticked. It protects against nothing else.\n\nAn unlimited chain cannot run away: every round needs a result from the server to arm the next one. If the server ignores the use (item on cooldown, condition not met), no list arrives and the chain stops by itself."
