"Le staff ne donne pas d'items (hors events).": "The staff does not hand out items (outside events)."
"Les membres du staff ne sont pas des robots. Soyez courtois, cherchez avant de demander.": "Staff members are not robots. Be polite, search before you ask."
"Les questions dont la réponse est sur une database = évitez.": "Questions whose answer sits in a database = please avoid."
