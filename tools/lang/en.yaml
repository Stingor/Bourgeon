"%d Star Crumb : +%d ATK, -%d %% de réussite": "%d Star Crumb: +%d ATK, -%d %% success"
"Le compromis que le natif ne montre jamais.\n\nChaque Star Crumb ajoute +5 ATK à l'arme forgée (card[1] = ((sc*5) << 8) + élément) et retranche 1500 au taux de réussite — lequel se compte sur 10000, donc 15 points de pourcentage (make_per -= sc * 1500 ; le tirage est rnd()%10000 < make_per).\n\nTrois Star Crumb, c'est donc +15 ATK contre 45 points de réussite en moins. L'écran natif aligne trois emplacements et n'en dit rien.": "The trade-off the native never shows.\n\nEach Star Crumb adds +5 ATK to the forged weapon (card[1] = ((sc*5) << 8) + element) and takes 1500 off the success rate — which counts out of 10000, so 15 percentage points (make_per -= sc * 1500; the roll is rnd()%10000 < make_per).\n\nThree Star Crumbs are therefore +15 ATK against 45 points of success lost. The native screen lines up three slots and says nothing about it."
"Élément %s : -%d %% de réussite": "%s element: -%d %% success"
"Une seule pierre élémentaire par arme : le serveur ne retient que la première (`ele == 0` en garde) et ne consomme même pas les suivantes.\n\nC'est pourquoi les autres emplacements n'en proposent plus dès qu'une est posée — un second choix n'aurait aucun effet.\n\nElle coûte 25 points de réussite (make_per -= 2500 sur une échelle de 10000), soit plus qu'un Star Crumb. Le natif ne le dit nulle part.": "One elemental stone per weapon only: the server keeps the first one alone (`ele == 0` as a guard) and does not even consume the others.\n\nThat is why the other slots stop offering any as soon as one is placed — a second choice would have no effect.\n\nIt costs 25 points of success (make_per -= 2500 on a scale of 10000), so more than a Star Crumb. The native says so nowhere."
"Total : -%d %% de réussite": "Total: -%d %% success"
"Enclume retenue : %s (+%d %%)": "Anvil used: %s (+%d %%)"
"(%d autre%s en sac, sans effet)": "(%d other%s in the bag, no effect)"
"Aucune enclume en sac.": "No anvil in the bag."
"L'enclume n'est PAS un matériau : elle n'entre dans aucune recette et n'est jamais consommée. Le serveur vérifie seulement que tu en portes une (pc_search_inventory) et ajoute au taux de réussite :\n\n  Emperium Anvil  +10 %\n  Golden Anvil    +5 %\n  Oridecon Anvil  +2,5 %\n  Anvil           +0 %\n\nSeule la MEILLEURE compte (chaîne de « else if » côté serveur) : en cumuler plusieurs n'apporte rien de plus.": "The anvil is NOT a material: it enters no recipe and is never consumed. The server only checks that you carry one (pc_search_inventory) and adds to the success rate:\n\n  Emperium Anvil  +10 %\n  Golden Anvil    +5 %\n  Oridecon Anvil  +2.5 %\n  Anvil           +0 %\n\nOnly the BEST one counts (a chain of « else if » server-side): stacking several brings nothing more."
"%s : %d demandés, %d en sac": "%s: %d requested, %d in the bag"
"Il ne te reste plus l'objet qui a ouvert cette liste.": "You no longer have the item that opened this list."
"Compétence d'origine inconnue : relance impossible.": "Original skill unknown: cannot chain."
"Ré-utilise %s pour rouvrir une liste.\n\nL'objet est CONSOMMÉ : le serveur le détruit avant d'exécuter son script, même si tu annules ensuite.": "Use %s again to reopen a list.\n\nThe item is CONSUMED: the server destroys it before running its script, even if you cancel afterwards."
"Relance la compétence pour obtenir une nouvelle liste.\n\nLe serveur n'autorise qu'une fabrication par lancement : après chaque objet produit, il faut relancer.": "Casts the skill again to get a new list.\n\nThe server allows only one craft per cast: after each item produced, it must be cast again."
"Quantité": "Quantity"
"Combien de fabrications partent TOUTES SEULES.\n\nÀ ne pas confondre avec « relancer automatiquement », qui rouvre la liste après chaque fabrication : à 1 avec cette case cochée, une fabrication part seule, la liste revient, et le clic suivant est à toi.\n\nLe serveur n'accepte AUCUNE quantité : une liste = une fabrication (clif_menuskill_clear). « ×20 » signifie donc vingt tours complets — relance, nouvelle liste, nouvelle demande.\n\nIl faut par conséquent que la relance automatique correspondante soit active, sinon aucune liste ne revient et la série s'arrête au premier tour. La fenêtre le dit si le cas se présente.\n\nMême effet qu'Entrée maintenue, mais la cible est CHIFFRÉE : on peut lâcher le clavier, et ça s'arrête au compte demandé plutôt qu'au moment où l'on pense à relâcher.": "How many crafts go off ON THEIR OWN.\n\nNot to be confused with « chain automatically », which reopens the list after each craft: at 1 with that box ticked, one craft goes off alone, the list comes back, and the next click is yours.\n\nThe server accepts NO quantity: one list = one craft (clif_menuskill_clear). « ×20 » therefore means twenty full rounds — recast, new list, new request.\n\nThe matching automatic chaining must consequently be on, otherwise no list comes back and the series stops at the first round. The window says so if the case arises.\n\nSame effect as holding Enter, but the target is a NUMBER: you can let go of the keyboard, and it stops at the requested count rather than when you think to release."
"Série sans effet : la relance par OBJET est désactivée, aucune nouvelle liste ne reviendra après la première fabrication.": "Series with no effect: chaining by ITEM is disabled, no new list will come back after the first craft."
"Série sans effet : la relance automatique de la compétence est désactivée, aucune nouvelle liste ne reviendra après la première fabrication.": "Series with no effect: automatic recasting of the skill is disabled, no new list will come back after the first craft."
