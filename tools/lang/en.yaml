"Priorité du jeu": "Game priority"
"Haute": "High"
"Normale": "Normal"
"Basse": "Low"
"Règle la part de temps PROCESSEUR que Windows accorde au jeu face aux autres programmes.\n\nHaute : le jeu passe avant le reste. Utile seulement si la machine est déjà chargée ; sur un PC au repos, aucun gain.\nNormale : à égalité avec les autres programmes. C'est le défaut.\nBasse : le jeu ne tourne que quand rien d'autre ne réclame le processeur — à réserver aux calculs de fond, il devient vite saccadé.\n\nSans effet sur la carte graphique : des ralentissements dus au GPU ne bougeront pas d'un cran.\nLe réglage ne vaut que fenêtre active — en arrière-plan, le client se met de lui-même en priorité basse.\nConservé d'une session à l'autre.": "Sets the share of PROCESSOR time Windows grants the game against other programs.\n\nHigh: the game comes first. Only useful if the machine is already busy; on an idle PC, no gain.\nNormal: on a par with other programs. This is the default.\nLow: the game only runs when nothing else needs the processor — keep it for background computing, it quickly stutters.\n\nNo effect on the graphics card: slowdowns caused by the GPU will not budge.\nThe setting only applies while the window is active — in the background, the client drops to low priority on its own.\nKept from one session to the next."
"Skin": "Skin"
