"Ce qu'il vous rapporte": "What it earns you"
"Ce que ce monstre vous donnerait VRAIMENT, et non la valeur de la base de données affichée plus haut.\n\nLe serveur applique tout ce qui pèse sur le gain : le taux du serveur, le malus de haut niveau, vos cartes et objets qui augmentent l'EXP contre cette race ou cette classe, un Battle Manual actif, le statut VIP et un éventuel événement d'EXP.\n\nEstimation pour un monstre que vous tuez SEUL, en lui ayant infligé la totalité des dégâts. En groupe, ou en partageant les dégâts, votre part est plus petite ; certaines ZONES ont au contraire un multiplicateur d'EXP qui leur est propre.": "What this monster would REALLY give you, and not the database value shown above.\n\nThe server applies everything that weighs on the gain: the server rate, the high-level malus, your cards and items that raise EXP against this race or this class, an active Battle Manual, VIP status and any ongoing EXP event.\n\nEstimate for a monster you kill ALONE, having dealt all of the damage yourself. In a party, or when sharing the damage, your share is smaller; some ZONES on the contrary carry an EXP multiplier of their own."
