"Suit la chatbox ImGui : allume-la pour remplacer les bulles. Avec la chatbox native, le client résout ses propres liens et sa bulle est correcte — la remplacer n'apporterait rien.": "Follows the ImGui chatbox: turn it on to replace balloons. With the native chatbox the client resolves its own links and its balloon is correct, so replacing it would gain nothing."

