"Place restante dans le message, en octets tels qu'ils partent au serveur (limite %d) : une lettre accentuée compte 1, un emoji 4, un lien d'objet sa balise entière.\nAu-delà, le serveur jette le message sans un mot — la barre le retient.": "Room left in the message, in bytes as they are sent to the server (limit %d): an accented letter counts 1, an emoji 4, an item link its whole tag.\nBeyond that, the server drops the message without a word — the bar holds it back."
