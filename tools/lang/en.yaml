"Me donne la MÊME classe (@job).\n⚠ Sur moonlight cette commande enchaîne aussi @blvl 999, @jlvl 100, @allskills et @allstats.\nUn joueur monté ou déguisé sera refusé : sa classe affichée est une classe factice.": "Gives me the SAME class (@job).\n⚠ On moonlight this command also chains @blvl 999, @jlvl 100, @allskills and @allstats.\nA mounted or disguised player will be refused: their displayed class is a dummy one."

