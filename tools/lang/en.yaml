"Lisse les textures vues de loin. Coût négligeable sur une carte moderne.\nLe filtre est figé dans chaque texture au moment où elle est créée : le changement se voit tout de suite sur l'interface, et sur le reste au fur et à mesure des rechargements.": "Smooths textures seen from afar. Negligible cost on a modern card.\nThe filter is baked into each texture when it is created: the change shows on the interface right away, and on everything else as textures are reloaded."
