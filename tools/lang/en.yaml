"Interrupteur GLOBAL — ces fenêtres s'activent ENSEMBLE, pas de mixe (tout ImGui ou tout natif) :\n  • Inventaire (et le sertissage de cartes)\n  • Cart\n  • Storage (Kafra, guilde, premium)\n  • Barres d'action\n  • Échange joueur-joueur\n  • Courrier (RODEX)\n  • Shop joueur (vending, buying store et achat chez un vendeur)\n  • Feuille de personnage (Alt+F), grimoire compris : l'icône « Skill » et\n    Alt+S ouvrent son onglet Grimoire au lieu de la fenêtre native\n  • Cash shop et shops PNJ\n  • Banque de zeny (Ctrl+B), ouverte aussi par le sac de zeny du footer\n    de l'inventaire\n  • Refine d'arme (compétence Upgrade Weapon du Whitesmith)\n  • Fiche de monstre (compétence Sense), avec sprite animé, drops et\n    lieux d'apparition\n  • Menu du clic droit sur une entité\nLa case des autres sections reflète donc le même état.\n\n": "GLOBAL switch — these windows turn on TOGETHER, no mixing (all ImGui or all native):\n  • Inventory (and card socketing)\n  • Cart\n  • Storage (Kafra, guild, premium)\n  • Action bars\n  • Player-to-player trade\n  • Mail (RODEX)\n  • Player shop (vending, buying store and buying from a vendor)\n  • Character sheet (Alt+F), grimoire included: the « Skill » icon and\n    Alt+S open its Grimoire tab instead of the native window\n  • Cash shop and NPC shops\n  • Zeny bank (Ctrl+B), also opened by the zeny bag in the inventory\n    footer\n  • Weapon refine (the Whitesmith's Upgrade Weapon skill)\n  • Monster sheet (the Sense skill), with animated sprite, drops and\n    spawn locations\n  • Right-click menu on an entity\nThe box in the other sections therefore mirrors the same state.\n\n"
