"Clic gauche          réserve un point (et ses prérequis manquants)\nCtrl + clic gauche   réserve jusqu'au niveau maximum\nDouble-clic          lance la compétence (aucun point réservé)\nClic droit           menu (monter, lancer, niveau d'utilisation, description)\nCtrl + clic droit    description de la compétence\nGlisser              pose la compétence sur une barre d'action\nSurvol               flèches de prérequis (ambre) et de suites (bleu)\n\nRien n'est envoyé au serveur tant que « Appliquer » n'est pas cliqué.": "Left click          reserves a point (and its missing prerequisites)\nCtrl + left click   reserves up to the maximum level\nDouble-click        casts the skill (no point reserved)\nRight click         menu (level up, cast, use level, description)\nCtrl + right click  the skill's description\nDrag                puts the skill on an action bar\nHover               prerequisite (amber) and follow-up (blue) arrows\n\nNothing is sent to the server until « Apply » is clicked."
