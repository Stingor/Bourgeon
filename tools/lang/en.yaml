"Dès que la phrase dépasse la largeur du champ, il gagne des lignes au lieu de défiler : tout le message reste sous les yeux, et la place restante s'affiche à sa gauche.\n\nLa limite est celle du serveur : %d octets tels qu'ils partent — une lettre accentuée compte 1, un emoji 4, un lien d'objet sa balise entière. Au-delà le serveur jette le message sans un mot ; la barre le retient et le dit.\n\nDécoché, le champ garde une seule ligne, qui défile.": "As soon as the sentence outgrows the field, it gains lines instead of scrolling: the whole message stays in view, and the remaining room is shown to its left.\n\nThe limit is the server's: %d bytes as they are sent — an accented letter counts 1, an emoji 4, an item link its whole tag. Beyond that the server drops the message without a word; the bar holds it back and says so.\n\nUnchecked, the field keeps a single scrolling line."
