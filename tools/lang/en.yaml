"Repeint tout le terrain .gnd d'une couleur unie, sans toucher au reste\nde la scène : la géométrie et le z-buffer du sol restent intacts, donc\nl'occlusion par le terrain reste correcte.\nL'eau, le ciel et le brouillard ne sont PAS affectés.\nDX9 uniquement (le chemin de rendu DX7 est une autre famille de fonctions).": "Repaints the whole .gnd terrain in a solid colour, without touching the rest\nof the scene: the ground geometry and z-buffer stay intact, so\nocclusion by the terrain remains correct.\nWater, sky and fog are NOT affected.\nDX9 only (the DX7 render path is a different family of functions)."
"(DX7 : non supporté)": "(DX7: not supported)"
