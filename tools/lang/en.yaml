"Staff": "Staff"
"Vitesse normale": "Normal speed"
"Reset": "Reset"
"Tout apprendre": "Learn all"
"Cooldowns": "Cooldowns"
"@%s : ajoute ou retire le montant saisi à %s.\nC'est un AJUSTEMENT, pas une valeur cible.": "@%s: adds or removes the entered amount to %s.\nThis is an ADJUSTMENT, not a target value."
"@resetstat : remet les six stats à leur base et rend tous les points de statut dépensés.": "@resetstat: resets all six stats to their base and refunds every status point spent."
"@allstat : monte les six stats à leur maximum.": "@allstat: raises all six stats to their maximum."
"@job : change de classe.\n\n⚠ Sur ce serveur la commande enchaîne d'elle-même @blvl 999, @jlvl 100, @allskills et @allstats — changer de classe MAXE le personnage, ce n'est pas un simple changement d'apparence.": "@job: changes class.\n\n⚠ On this server the command chains @blvl 999, @jlvl 100, @allskills and @allstats on its own — changing class MAXES the character out, it is not a mere change of appearance."
"@speed : vitesse de marche. PLUS BAS = PLUS RAPIDE ; 150 est la vitesse normale, 20 le plancher du serveur.\nEnvoyé au relâchement du curseur.": "@speed: walking speed. LOWER = FASTER; 150 is normal speed, 20 the server's floor.\nSent when the slider is released."
"@speed -1 : rend au personnage sa vitesse par défaut (150).": "@speed -1: gives the character back its default speed (150)."
"@blvl : gagne ou perd le nombre de niveaux de BASE saisi.": "@blvl: gains or loses the entered number of BASE levels."
"@jlvl : gagne ou perd le nombre de niveaux de JOB saisi.": "@jlvl: gains or loses the entered number of JOB levels."
"@stpoint : donne le nombre de points de statut saisi — de quoi essayer les boutons « + » du volet stats.": "@stpoint: grants the entered number of status points — enough to try out the “+” buttons of the stats pane."
"@resetskill : oublie toutes les compétences et rend les points.": "@resetskill: forgets every skill and refunds the points."
"@allskills : apprend toutes les compétences de la classe.": "@allskills: learns every skill of the class."
"@resetcooltime : remet à zéro le temps de recharge de toutes les compétences (homoncule et mercenaire compris).": "@resetcooltime: clears the cooldown of every skill (homunculus and mercenary included)."
"@skpoint : donne le nombre de points de compétence saisi.": "@skpoint: grants the entered number of skill points."
