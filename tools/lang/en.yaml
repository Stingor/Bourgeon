"Déverrouillé, une poignée apparaît à l'emplacement du bandeau : glisse-la où tu veux. Un exemple s'affiche tant que rien n'a été ramassé.\nVerrouillé, le bandeau ne capte plus aucun clic.": "Unlocked, a handle appears where the banner sits: drag it wherever you want. A sample line shows while nothing has been picked up.\nLocked, the banner no longer catches any click."
