"Coché = présent. Le reste est retiré.": "Ticked = present. Everything else is removed."
"Emplacement visé par le raffinage. « Toutes les pièces » couvre tout ce qui est porté (c'est la position 0 de @refine).": "Slot the refining applies to. “All worn gear” covers everything equipped (that is @refine's position 0)."
"@refine : ajoute ou retire des niveaux de raffinage sur l'emplacement choisi. Le maximum est +10 sur ce serveur (pré-renewal).": "@refine: adds or removes refine levels on the chosen slot. The maximum is +10 on this server (pre-renewal)."
"@zeny : donne ou retire le montant saisi. Un retrait plus grand que la bourse la vide sans passer en négatif.": "@zeny: grants or removes the entered amount. Taking away more than you carry empties the purse without going negative."
"@heal : rend tous les PV et les SP.": "@heal: restores all HP and SP."
"@repairall : répare toutes les pièces endommagées de l'inventaire.": "@repairall: repairs every damaged piece in the inventory."
"@hide : bascule l'invisibilité GM. Retaper la commande (ou recliquer) redevient visible.": "@hide: toggles GM invisibility. Typing the command again (or clicking again) turns you visible."
"@itemreset : SUPPRIME tous les objets de l'inventaire. Irréversible, et le serveur ne demande rien — la confirmation est ici.": "@itemreset: DELETES every item in the inventory. Irreversible, and the server asks nothing — the confirmation lives here."
"@option : pose l'état visuel du personnage (monture, faucon, Hiding, Ruwach…).\n\n⚠ La commande REMPLACE l'état complet : ce qui n'est pas coché est RETIRÉ. Les cases sont amorcées sur l'état connu du client pour ne pas perdre la monture ou le cart en chemin.\nElle remet aussi à zéro les statuts (pétrifié, gelé, maudit…).": "@option: sets the character's visual state (mount, falcon, Hiding, Ruwach…).\n\n⚠ The command REPLACES the whole state: anything left unticked is REMOVED. The boxes are seeded from the state the client knows about, so the mount or the cart is not lost along the way.\nIt also clears the status effects (petrified, frozen, cursed…)."

# Ecran de veille (AfkScreen) : la caméra tourne, l'interface s'efface.
"Écran de veille": "Screen saver"
"Activer l'écran de veille": "Enable the screen saver"

# Prevenir l'entourage : ce que les AUTRES voient d'une absence.
"Prévenir mon entourage": "Let others know"
"Signaler mon absence aux autres joueurs": "Show other players that I am away"
"Passé le délai ci-dessous, les autres joueurs voient que tu n'es plus là. Rien ne change pour toi : tu bouges, tu attaques et tu te défends exactement comme d'habitude — c'est un signe donné aux autres, pas une altération.\n\nIndépendant de l'écran de veille : tu peux prévenir sans que ta caméra ne bouge, comme tu peux te regarder tourner sans le dire à personne.": "Once the delay below has passed, other players can see that you are no longer there. Nothing changes for you: you move, you attack and you defend exactly as usual — it is a sign given to others, not an ailment.\n\nIndependent from the screen saver: you can let people know without your camera moving an inch, just as you can watch yourself turn without telling anyone."
"Délai d'absence": "Away after"
"Temps sans toucher au clavier ni à la souris avant que ton absence ne soit annoncée. Le premier geste la retire aussitôt.": "How long without touching the keyboard or the mouse before your absence is announced. The first move takes it back at once."
"Effet de sommeil (zzz)": "Sleeping effect (zzz)"
"Le sommeil du jeu flotte au-dessus de ton personnage — le même « zzz » que sur un monstre endormi. Tu le vois toi aussi : c'est ainsi que tu sais que ton absence est bien annoncée.\n\nPurement visuel, pour toi comme pour les autres : tu bouges, tu attaques et tu te défends exactement comme d'habitude.": "The sleep of the game floats above your character — the very zzz you see on a sleeping monster. You see it too: that is how you know your absence is really being announced.\n\nPurely visual, for you as for everyone else: you move, you attack and you defend exactly as usual."
"Ajouter « [AFK] » devant mon nom": "Put « [AFK] » in front of my name"
"Ton pseudo s'affiche « [AFK] Nom » dans l'étiquette au-dessus de ton personnage.\n\nLe champ du jeu ne fait que vingt-trois caractères : un pseudo de plus de dix-sept perd sa fin le temps de l'absence, et la retrouve au retour.": "Your name shows up as « [AFK] Name » in the label above your character.\n\nThe field of the game is only twenty-three characters wide: a name longer than seventeen loses its tail for as long as you are away, and gets it back on your return."
"Passé un moment sans toucher au clavier ni à la souris, l'interface s'efface et la caméra recule pour tourner lentement autour de ton personnage.\n\nLe premier geste rend tout comme c'était. Le clic qui te réveille ne part pas dans le jeu : le décor a changé d'angle, il tomberait ailleurs que là où tu crois viser.": "After a while without touching the keyboard or the mouse, the interface fades out and the camera pulls back to slowly orbit your character.\n\nThe first move puts everything back. The click that wakes you never reaches the game: the scenery has turned, so it would land somewhere other than where you think you are aiming."
"Caméra": "Camera"
"Rotation": "Rotation"
"Vitesse de l'orbite autour du personnage. Une valeur négative tourne dans l'autre sens ; zéro fige la vue, ce qui donne un simple plan large.": "How fast the camera orbits your character. A negative value turns the other way; zero holds the view still, giving a plain wide shot."
"Plongée": "Pitch"
"Hauteur du regard au-dessus de l'horizon. Le jeu se joue à 45° ; plus haut, la caméra domine la scène, et tout en haut elle est presque à la verticale.": "How high the camera looks from, above the horizon. The game is played at 45°; higher up it overlooks the scene, and right at the top it is almost straight down."
"Recul": "Pull-back"
"De combien la caméra s'éloigne, en multiples de ta distance habituelle. Le moteur ne laisse pas aller plus loin que sa propre limite de vue : au-delà, on verrait le bord du monde et le brouillard.": "How far the camera pulls back, in multiples of your usual distance. The engine will not go past its own view limit: beyond it, you would see the edge of the world and the fog."
"Transition": "Transition"
"Masquer toute l'interface": "Hide the whole interface"
"L'interface Bourgeon ET celle du client — fenêtres, noms au-dessus des personnages, bulles de chat. Rien n'est fermé pour autant : tout ce qui était ouvert l'est encore au réveil.": "The Bourgeon interface AND the client's own — windows, names above characters, chat bubbles. Nothing is closed for all that: whatever was open is still open when you come back."
"Noir et blanc": "Black and white"
"Vignette, noir et blanc et grain demandent le rendu DirectX 9.": "Vignette, black and white and grain require the DirectX 9 renderer."
"Essayer maintenant": "Try it now"
"Entre en veille tout de suite, sans attendre le délai. Bouge la souris pour en sortir.": "Goes to sleep right away, without waiting for the delay. Move the mouse to come back."
"Absent à l'instant": "Away just now"
"Absent depuis %u min": "Away for %u min"
"Absent depuis %uh%02u": "Away for %uh%02u"

# Horloge de l'écran de veille (les positions sont des items de RoCombo).
"Horloge": "Clock"
"Afficher l'heure": "Show the time"
"Afficher la durée d'absence": "Show how long you have been away"
"Marge": "Margin"
"Distance au bord de l'écran. Sans effet sur une position centrée, qui n'a pas de bord dont s'écarter.": "Distance from the edge of the screen. No effect on a centred position, which has no edge to stand away from."
"Taille de l'heure. La ligne d'absence suit, en plus petit.": "Size of the time. The away line follows, smaller."
"Une ombre d'un pixel sous le texte. C'est elle qui le garde lisible quand la caméra passe devant un décor clair.": "A one-pixel shadow under the text. It is what keeps it readable when the camera drifts across bright scenery."
"Haut-centre": "Top-centre"
"Milieu-gauche": "Middle-left"
"Milieu-droite": "Middle-right"
"Bas-centre": "Bottom-centre"
"Masquer le curseur": "Hide the cursor"
"La flèche de la souris disparaît aussi. Elle revient dès le premier geste, en même temps que l'interface.": "The mouse pointer goes away too. It comes back on the first move, together with the interface."
"Temps sans toucher au clavier ni à la souris avant que la veille ne commence.": "How long without touching the keyboard or the mouse before the screen saver starts."
"Durée du basculement en veille. Le retour, lui, va trois fois plus vite : il répond à un geste que tu viens de faire.": "How long it takes to drop into the screen saver. Coming back is three times faster: it answers a move you have just made."
"Réveil": "Wake on"
"Clavier et souris": "Keyboard and mouse"
"Clavier seulement": "Keyboard only"
"Souris seulement": "Mouse only"
"Ce qui met fin à la veille. « Clavier seulement » évite qu'une souris frôlée ne la réveille sans arrêt.\n\nCe réglage ne change PAS ce qui repousse la mise en veille : tant que tu joues, tout compte. Et ce qui n'a pas le droit de te réveiller n'agit pas non plus dans le jeu — sinon une touche partirait sur un décor que tu ne vois pas.": "What ends the screen saver. «Keyboard only» keeps a brushed mouse from waking it over and over.\n\nThis does NOT change what holds the screen saver off: while you play, everything counts. And whatever is not allowed to wake you does not act in the game either — otherwise a key would fire at scenery you cannot see."

