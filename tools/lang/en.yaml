# Diagnostic du personnage — sondes par direction, cadence mesurée
"action %d": "action %d"
"images %s  × %.2f → de %.0f à %.0f ms selon la DIRECTION": "frames %s  × %.2f → from %.0f to %.0f ms depending on the DIRECTION"
"images %s  × %.2f → %.0f ms": "frames %s  × %.2f → %.0f ms"
"Les huit directions de cette action n'ont pas le même nombre d'images. Comme la direction jouée est choisie par l'angle de la CAMÉRA, l'animation dure plus ou moins longtemps selon la façon dont on regarde le personnage — et comme l'état d'attaque bloque l'envoi des compétences, la cadence des skills change avec la caméra.\n\nC'est un défaut du fichier de sprite, pas du serveur.": "The eight directions of this action do not have the same frame count. Since the direction played is chosen by the CAMERA angle, the animation lasts longer or shorter depending on how you look at the character — and since the attack state blocks skill sending, the skill rate changes with the camera.\n\nThat is a sprite file defect, not a server one."
"%.2f coup(s)/s — mesuré sur %d coups en %.1f s": "%.2f hit(s)/s — measured over %d hits in %.1f s"
"Cadence observée": "Observed rate"
"— (pas assez de coups récents)": "— (not enough recent hits)"
"Les coups que VOUS portez, comptés sur les paquets reçus et non sur les images affichées : le chiffre est donc comparable à ce que montre le journal de combat, et indépendant du nombre d'images par seconde.\n\nUn coup multiple compte pour UN : ce qui est mesuré est le rythme des envois, pas le nombre de lignes de dégâts.": "The hits YOU deal, counted off the received packets and not off the rendered frames: the figure is therefore comparable to what the battle log shows, and independent of the frame rate.\n\nA multi-hit counts as ONE: what is measured is the rhythm of the sends, not the number of damage lines."
"Classe RÉSOLUE (sprite)": "RESOLVED class (sprite)"
"Trois valeurs, trois sources qui ne mentent pas pareil :\n\n· Classe (serveur) = g_Own_JobId, ce que le serveur dit que vous ÊTES ;\n· Classe AFFICHÉE = acteur+0x25c, la classe portée par votre acteur — c'est elle que change un @disguise ;\n· Classe RÉSOLUE = la précédente passée par les masques d'option (monture, mado, invisibilité). C'est elle qui décide du fichier de sprite.\n\nSi les trois sont égales alors que le personnage n'a pas son apparence normale, la transformation ne passe par AUCUNE des trois : regarder alors le chemin du .act, plus bas — c'est la seule source qui ne puisse pas se tromper, puisque c'est le fichier réellement joué.": "Three values, three sources that lie in different ways:\n\n· Class (server) = g_Own_JobId, what the server says you ARE;\n· DISPLAYED class = actor+0x25c, the class your actor carries — that is what an @disguise changes;\n· RESOLVED class = the previous one passed through the option masks (mount, mado, invisibility). That is what picks the sprite file.\n\nIf all three match while the character does not have its normal look, the transformation goes through NONE of them: look at the .act path below instead — it is the only source that cannot be wrong, since it is the file actually played."
"   ⛔ bloque l'envoi des compétences": "   ⛔ blocks skill sending"
"%d — non étiqueté (pas de RE)%s": "%d — unlabelled (no RE)%s"
"Actor_ProcessPendingAction_Tick (0x00d43400) n'émet CZ_USE_SKILL que si cet état vaut 0, 1, 4 ou ≥ 16. Dans tout autre état — 2 et 9 en tête, les attaques — la requête reste en file et est réessayée à la frame suivante.\n\nDonc : plus l'animation d'attaque est longue, plus le personnage reste dans un état bloquant, et moins vite les compétences partent. La durée de cette animation se lit plus bas, direction par direction.": "Actor_ProcessPendingAction_Tick (0x00d43400) only emits CZ_USE_SKILL when this state is 0, 1, 4 or >= 16. In any other state — 2 and 9 first of all, the attacks — the request stays queued and is retried on the next frame.\n\nSo: the longer the attack animation, the longer the character stays in a blocking state, and the slower skills go out. The length of that animation is shown below, direction by direction."
"Entrées du fichier": "Entries in the file"
"%d  (= %d action(s) × 8 directions)": "%d  (= %d action(s) × 8 directions)"
"Un .act range action × 8 + direction : les huit directions sont huit entrées INDÉPENDANTES, chacune avec son propre nombre d'images.\n\n13 actions = 104 entrées = un jeu de sprites JOUEUR. Beaucoup moins (5 à 8 actions) = un sprite de MONSTRE, donc un déguisement.": "A .act is indexed by action × 8 + direction: the eight directions are eight INDEPENDENT entries, each with its own frame count.\n\n13 actions = 104 entries = a PLAYER sprite set. Far fewer (5 to 8 actions) = a MONSTER sprite, hence a disguise."
"L'entrée %d est demandée alors que le fichier n'en a que %d : le client rend 1 image, l'animation se termine tout de suite.": "Entry %d is requested while the file only has %d: the client returns 1 frame, so the animation ends immediately."

# Diagnostic du personnage — histogramme d'états, slot 0
"%.0f %% du temps — sur %u images en %.1f s": "%.0f %% of the time — over %u frames in %.1f s"
"États bloquants": "Blocking states"
"Part du temps passée dans un état de motion qui EMPÊCHE le client d'émettre la compétence en attente (tout sauf 0, 1, 4 et ≥ 16).\n\nÉlevé : c'est le client qui bride, et la cause est la durée de l'animation.\nBas alors que les compétences partent mal quand même : la requête POUVAIT partir — le frein est ailleurs (refus du serveur, portée, ciblage).\n\nÉchantillonné une fois par image, tant que cette fenêtre est ouverte. Le bouton « Remettre les mesures à zéro » redémarre le comptage : à faire juste avant chaque essai.": "Share of time spent in a motion state that PREVENTS the client from emitting the queued skill (anything but 0, 1, 4 and >= 16).\n\nHigh: the client is the limiter, and the cause is the animation length.\nLow while skills still go out badly: the request COULD have been sent — the brake is elsewhere (server refusal, range, targeting).\n\nSampled once per frame, while this window is open. The 'Reset the measurements' button restarts the count: do it right before each run."
"États dominants": "Dominant states"
"slot 0 (corps dessiné)": "slot 0 (body drawn)"
"Le corps DESSINÉ n'est pas celui sur lequel l'animation compte ses images.": "The body DRAWN is not the one the animation counts its frames on."
"Remettre les mesures à zéro": "Reset the measurements"

# Diagnostic du personnage — compteurs d'envois
"%u skill(s) + %u attaque(s) — soit %.2f et %.2f par seconde": "%u skill(s) + %u attack(s) — that is %.2f and %.2f per second"
"Paquets ÉMIS": "Packets SENT"
"CZ_USE_SKILL (+ variante au sol) et CZ_REQUEST_ACT réellement partis du client, comptés sur le hook d'envoi — donc avant toute réponse du serveur.\n\n· BEAUCOUP d'émis pour PEU de coups reçus : le client fait son travail, c'est le serveur qui refuse (delay d'action, portée, cible) ;\n· PEU d'émis : rien ne part, et le frein est en amont — saisie, ciblage, ou un garde du client.\n\nRemis à zéro par le bouton du bas, en même temps que les autres mesures.": "CZ_USE_SKILL (and its ground variant) and CZ_REQUEST_ACT actually sent by the client, counted on the send hook — so before any server reply.\n\n· MANY sent for FEW hits received: the client is doing its job, the server is refusing (action delay, range, target);\n· FEW sent: nothing is going out, and the brake is upstream — input, targeting, or a client guard.\n\nReset by the button at the bottom, along with the other measurements."

# Diagnostic du personnage — contour des zones cliquables
"%d zones — 1 sous le curseur": "%d zones — 1 under the cursor"
"%d zones — aucune sous le curseur": "%d zones — none under the cursor"
"Contour des zones cliquables": "Outline the clickable zones"
"Dessine les rectangles ÉCRAN dont le client se sert pour savoir sur QUOI la souris pointe — ce ne sont pas les positions au sol, et c'est le rectangle le plus « devant » qui gagne le clic, quel que soit son propriétaire.\n\nJaune épais = celui que le clic prendrait maintenant, avec son AID. Rose = le vôtre. Vert = acteur, bleu = PNJ de carte, orange = unité de compétence.\n\nÀ regarder quand une compétence part sur la mauvaise cible, ou ne part pas alors que le curseur semble bien placé.": "Draws the SCREEN rectangles the client uses to know WHAT the mouse points at — these are not ground positions, and the frontmost rectangle wins the click, whoever it belongs to.\n\nThick yellow = the one a click would take right now, with its AID. Pink = yours. Green = actor, blue = map NPC, orange = skill unit.\n\nWorth a look when a skill goes to the wrong target, or does not go out while the cursor looks well placed."

# Diagnostic du personnage — precision des zones cliquables
"Zone cliquable minimale (px)": "Minimum clickable zone (px)"
"Le client ÉLARGIT toute zone cliquable plus petite que ce nombre de pixels, pour qu'un petit sprite reste attrapable. Défaut de ce client : %d px.\n\nBaisser resserre le ciblage — deux entités voisines cessent de se disputer le même clic. Trop bas, les petits monstres deviennent difficiles à viser.\n\n⚠ Sans effet sur un GROS sprite : son rectangle vient de son dessin, pas de ce minimum.": "The client WIDENS any clickable zone smaller than this number of pixels, so that a small sprite stays catchable. This client's default: %d px.\n\nLowering it tightens targeting — two neighbouring entities stop fighting over the same click. Too low, and small monsters become hard to aim at.\n\n⚠ No effect on a BIG sprite: its rectangle comes from its artwork, not from this minimum."

# Zones cliquables : le fantome au GID negatif (pick_quad_tweaks)
"Zones cliquables : détour non posé (client inattendu).": "Clickable zones: detour not installed (unexpected client)."
"Rétrécir la zone cliquable des GID négatifs": "Shrink the clickable zone of negative GIDs"
"Un GID négatif n'existe pas dans le protocole : c'est un acteur FANTÔME, créé par le serveur (le clone d'@disguise de rAthena en envoie un, avec -bl->id).\n\nLe serveur ne connaît pas ce GID et jette sans un mot toute action envoyée vers lui. Mais sa zone cliquable, elle, est bien là et peut gagner le clic devant la vraie cible — la compétence part alors dans le vide, et le joueur ne voit qu'une cadence effondrée.\n\nCochée, sa zone est rétrécie autour de son centre : le fantôme cesse de voler le clic, sans rien changer pour les entités normales.\n\n⚠ Palliatif côté client. Le vrai correctif est de ne plus émettre ce clone côté serveur.": "A negative GID does not exist in the protocol: it is a GHOST actor, created by the server (rAthena's @disguise clone sends one, with -bl->id).\n\nThe server does not know that GID and silently discards any action sent to it. Its clickable zone, however, is very much there and can win the click ahead of the real target — the skill then goes nowhere, and the player only sees a collapsed cadence.\n\nTicked, its zone is shrunk around its centre: the ghost stops stealing the click, without changing anything for normal entities.\n\n⚠ Client-side stopgap. The real fix is to stop emitting that clone server-side."
"Taille restante (%)": "Remaining size (%)"
"Ce qui reste de la zone du fantôme, en pourcentage de sa taille d'origine, rétréci autour de son centre.\n\n0 % laisse un pixel : le fantôme devient pratiquement impossible à viser, ce qui est le but. Monter cette valeur ne sert qu'à le récupérer volontairement — pour l'observer avec le contour des zones cliquables, par exemple.": "What is left of the ghost's zone, as a percentage of its original size, shrunk around its centre.\n\n0 % leaves one pixel: the ghost becomes practically impossible to aim at, which is the point. Raising this only serves to get it back on purpose — to look at it with the clickable-zone outline, for instance."
"Aucun GID négatif rencontré.": "No negative GID encountered."
"Zones rétrécies : %u": "Zones shrunk: %u"
"Forcer la zone cliquable minimale": "Override the minimum clickable zone"
"Décochée, Bourgeon ne touche PAS à la valeur du client — c'est l'état à choisir pour mesurer le jeu tel quel, ou pour vérifier ce que fait un patch posé sur l'exécutable.\n\nCochée, la valeur du curseur est réécrite à chaque image.": "Unticked, Bourgeon does NOT touch the client's value — this is the state to pick when measuring the game as it is, or when checking what a patch applied to the executable actually does.\n\nTicked, the slider's value is rewritten every frame."
"client : %d px": "client: %d px"

# Section Gameplay du panneau joueur (precision du ciblage, quick cast, GIF)
"Gameplay": "Gameplay"
"Précision du ciblage": "Targeting precision"
"Le jeu ÉLARGIT la surface qui répond au clic de chaque entité jusqu'à un minimum qui dépend de la résolution — sur ton écran : %d px pour les monstres et joueurs, %d px pour les PNJ. Un petit monstre se défend donc sur une surface bien plus grande que lui, et deux entités proches se disputent le même clic.": "The game WIDENS the surface that answers the click of every entity up to a minimum that depends on the resolution — on your screen: %d px for monsters and players, %d px for NPCs. A small monster therefore defends a surface far larger than itself, and two nearby entities fight over the same click."
"Le jeu ÉLARGIT la surface qui répond au clic de chaque entité jusqu'à un minimum qui dépend de la résolution. Un petit monstre se défend donc sur une surface bien plus grande que lui, et deux entités proches se disputent le même clic.": "The game WIDENS the surface that answers the click of every entity up to a minimum that depends on the resolution. A small monster therefore defends a surface far larger than itself, and two nearby entities fight over the same click."
"Zone cliquable minimale": "Minimum clickable zone"
"Réglage d'origine du jeu": "Game's original setting"
"Moitié": "Half"
"Quart": "Quarter"
"Huitième": "Eighth"
"Seizième": "Sixteenth"
"Réduit ce minimum : le ciblage devient plus précis — deux entités voisines cessent de se disputer le même clic — mais les petits monstres deviennent plus exigeants à viser.\n\n« Moitié » est un bon départ. La proportion à la résolution est conservée, et le réglage s'applique aussi aux PNJ.\n\n⚠ Sans effet sur un GROS sprite : sa surface vient de son dessin, pas de ce minimum.": "Reduces that minimum: targeting becomes more precise — two neighbouring entities stop fighting over the same click — but small monsters become more demanding to aim at.\n\n“Half” is a good start. The scaling with the resolution is preserved, and the setting also applies to NPCs.\n\n⚠ No effect on a BIG sprite: its surface comes from its artwork, not from this minimum."
"En jaune : la surface qui répond au clic avec ton réglage. En gris : celle d'origine.": "Yellow: the surface that answers the click with your setting. Grey: the original one."
"Période de répétition des objets, séparée de celle des compétences parce que le frein n'est pas le même : c'est le SERVEUR qui fixe l'intervalle minimal entre deux objets — 325 ms en temps normal, davantage en PvP sur les soins.\n\nRégler plus vite que lui ne consomme rien de plus : il refuse et répond « veuillez patienter » dans le chat. Ce curseur ne descend pas sous 100 ms.": "Repeat period for items, separate from the one for skills because the brake is not the same: the SERVER sets the minimum interval between two items — 325 ms normally, more in PvP on heals.\n\nSetting it faster than the server consumes nothing more: it refuses and answers “please wait” in the chat. This slider does not go below 100 ms."
"Taille du GIF": "GIF size"
"Légère (320 px)": "Light (320 px)"
"Moyenne (480 px)": "Medium (480 px)"
"Grande (640 px)": "Large (640 px)"
"La taille du fichier : la zone filmée est réduite à cette largeur avant d'entrer dans le GIF.\n\nMoyenne passe partout. Grande donne un GIF plus net mais nettement plus lourd — le poids monte avec le CARRÉ de la taille.": "The file size: the filmed zone is shrunk to this width before entering the GIF.\n\nMedium fits everywhere. Large gives a sharper GIF but a much heavier one — the weight grows with the SQUARE of the size."

