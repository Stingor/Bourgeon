"Dans la fenêtre du storage, attrapez le TITRE d'une colonne et faites-la glisser à gauche ou à droite. L'ordre choisi est retenu d'une session à l'autre, et vaut pour les deux dispositions d'onglets.\nLe clic droit sur un en-tête propose la même remise à plat que le bouton ci-dessous.": "In the storage window, grab the TITLE of a column and drag it left or right. The chosen order is kept from one session to the next, and holds for both tab layouts.\nRight-clicking a header offers the same reset as the button below."
