"Relance jetée par le délai de lancement : nouvel essai (%d/%d).": "Recast dropped by the cast delay: trying again (%d/%d)."
"Options du refine": "Refine settings"
"Aucune arme refinable.": "No refinable weapon."
"Le serveur ne propose une arme que si TOUT est vrai :": "The server only offers a weapon if EVERYTHING is true:"
"elle est identifiée et a un niveau d'arme (1 à 4) ;": "it is identified and has a weapon level (1 to 4);"
"elle n'est PAS portée (déséquipe-la d'abord) ;": "it is NOT worn (unequip it first);"
"son refine est encore sous le plafond de ta compétence ;": "its refine is still below your skill's cap;"
"tu as le minerai correspondant à son niveau d'arme.": "you have the ore matching its weapon level."
"Session terminée : le serveur n'autorise qu'un refine par lancement de la compétence.": "Session over: the server allows only one refine per cast of the skill."
"Un échec DÉTRUIT l'arme.": "A failure DESTROYS the weapon."
"Le minerai est consommé dans tous les cas. En cas de réussite l'arme passe de +%d à +%d.": "The ore is consumed in every case. On success the weapon goes from +%d to +%d."
"Le niveau appris de la compétence Upgrade Weapon EST le plafond : le serveur refuse toute arme déjà à ce refine (et jamais au-delà de +10).": "The learnt level of the Upgrade Weapon skill IS the cap: the server refuses any weapon already at that refine (and never beyond +10)."
"Probabilité EXACTE de cette tentative, pas une estimation.\n\nLe serveur calcule per = Rate/100 + (job_level - 50) / 2, puis réussit si per > rnd()%%100. Comme le tirage est uniforme sur 0..99, la probabilité vaut exactement per.\n\nLe Rate de base vient de la table de refine du serveur (niveau d'arme × refine visé). Un job level inférieur à 50 donne un bonus NÉGATIF : ce n'est pas une erreur, le serveur fait bien cela.": "The EXACT probability of this attempt, not an estimate.\n\nThe server computes per = Rate/100 + (job_level - 50) / 2, then succeeds if per > rnd()%%100. Since the roll is uniform over 0..99, the probability is exactly per.\n\nThe base Rate comes from the server's refine table (weapon level × refine aimed at). A job level below 50 gives a NEGATIVE bonus: this is not a mistake, the server really does that."
"Tentative envoyée — en attente du serveur…": "Attempt sent — waiting for the server…"
"Refine automatique imminent… (n° %d)": "Automatic refine imminent… (no. %d)"
"Chaîne automatique… (%d)": "Automatic chain… (%d)"
"Chaîne arrêtée. Un clic sur « Refine » ou « Relancer le skill » la reprend.": "Chain stopped. A click on « Refine » or « Recast the skill » resumes it."
"Sélectionne une arme dans la liste.": "Pick a weapon from the list."
"Arrête le refine automatique tout de suite.\n\nUne tentative DÉJÀ envoyée ira à son terme : le serveur a l'arme,\nelle ne se reprend pas. Rien ne repartira ensuite.\n\nLe réglage reste coché : un clic sur « Refine » ou « Relancer le\nskill » reprend la chaîne.": "Stops the automatic refine right away.\n\nAn attempt ALREADY sent will run its course: the server has the weapon,\nit cannot be taken back. Nothing will start again afterwards.\n\nThe setting stays ticked: a click on « Refine » or « Recast the\nskill » resumes the chain."
"Relancer le skill": "Recast the skill"
"Relance la compétence Upgrade Weapon pour obtenir une nouvelle liste.\n\nLe serveur n'autorise QU'UNE tentative par lancement : après chaque\nrefine il faut relancer, et c'est ce que fait ce bouton — sans\nrepasser par la barre d'action.": "Recasts the Upgrade Weapon skill to get a new list.\n\nThe server allows ONLY ONE attempt per cast: after each refine it must\nbe recast, and that is what this button does — without going back\nthrough the action bar."
"Remplace la fenêtre « Upgradeable weapons » du skill Upgrade Weapon.": "Replaces the « Upgradeable weapons » window of the Upgrade Weapon skill."
"Clic droit : description · double-clic ou Entrée : refine.": "Right click: description · double-click or Enter: refine."
"En-têtes de colonne : trier (3e clic = ordre d'inventaire).": "Column headers: sort (3rd click = inventory order)."
"Confirmer avant un refine": "Confirm before a refine"
"Un échec DÉTRUIT l'arme, et le client affiche le MÊME message pour un succès et un échec. La confirmation rappelle l'arme visée et le risque.": "A failure DESTROYS the weapon, and the client shows the SAME message for a success and a failure. The confirmation restates the weapon aimed at and the risk."
"Cartes et emplacements": "Cards and slots"
"Le paquet du serveur porte les 4 cartes de chaque arme — la fenêtre native les jette, deux armes identiques dont une sertie y sont donc indistinguables.": "The server's packet carries the 4 cards of every weapon — the native window throws them away, so two identical weapons, one of them socketed, are indistinguishable there."
"Utile sur un gros inventaire ; sur deux ou trois armes il ne fait que prendre une ligne. Le décocher efface aussi le filtre en cours, pour qu'aucune arme ne reste masquée par un champ invisible.": "Useful on a large inventory; on two or three weapons it only takes up a line. Unticking it also clears the current filter, so no weapon stays hidden behind an invisible field."
"Entrée lance le refine": "Enter starts the refine"
"Cochée, Entrée refine l'arme sélectionnée, et la maintenir enchaîne. La fenêtre confisque alors la touche tant qu'elle est ouverte : impossible d'ouvrir la saisie du chat.\n\nDécoché (défaut), la touche Entrée reste au CHAT.\n\nLa fenêtre de CONFIRMATION garde Entrée dans tous les cas : « Entrée = OK » y est la convention, et elle valide une action qui peut détruire l'arme.": "Ticked, Enter refines the selected weapon, and holding it chains. The window then confiscates the key for as long as it is open: opening the chat input becomes impossible.\n\nUnticked (default), the Enter key stays with the CHAT.\n\nThe CONFIRMATION window keeps Enter in every case: « Enter = OK » is the convention there, and it confirms an action that can destroy the weapon."
"Après chaque tentative, relance Upgrade Weapon pour rouvrir la liste — le serveur n'en autorise qu'une par lancement.\n\nNe refine RIEN tout seul : le choix de l'arme et le déclenchement restent des clics. La chaîne s'arrête d'elle-même quand la liste revient vide, quand il n'y a plus de minerai, ou quand le serveur refuse une condition.\n\nSi la compétence est jetée par son délai de lancement, la relance est réessayée un peu plus tard (3 fois au plus) au lieu de s'arrêter en silence.": "After each attempt, recasts Upgrade Weapon to reopen the list — the server allows only one per cast.\n\nRefines NOTHING on its own: picking the weapon and triggering it stay clicks. The chain stops by itself when the list comes back empty, when there is no ore left, or when the server refuses a condition.\n\nIf the skill is dropped by its cast delay, the recast is retried a little later (3 times at most) instead of stopping silently."
"Refiner automatiquement (chaîne complète)": "Refine automatically (full chain)"
"Enchaîne TOUT SEUL : la première arme de la liste est jouée, la compétence relancée, et ainsi de suite jusqu'à ne plus pouvoir — c'est le SP qui borne la chaîne, et elle s'arrête quand il manque.\n\nImplique la relance automatique (sans elle le serveur n'enverrait plus de liste). La confirmation est IGNORÉE : une chaîne qui demande son accord à chaque tour n'en est pas une.\n\nL'arme visée est celle qui est sélectionnée si elle est encore là (on continue donc de monter la même), sinon la première ligne AFFICHÉE — filtre et tri compris. Rien n'est joué avant que la liste n'ait été affichée au moins une fois.\n\nS'arrête seule : plus de SP, plus de minerai, plus d'arme dans la liste, ou refus du serveur. Un bouton « Arrêter » apparaît dans la fenêtre pendant toute la chaîne.": "Chains ALL BY ITSELF: the first weapon of the list is played, the skill recast, and so on until it cannot go further — SP is what bounds the chain, and it stops when there is none left.\n\nImplies automatic recasting (without it the server would send no more lists). The confirmation is IGNORED: a chain asking for your approval every round is not a chain.\n\nThe weapon aimed at is the selected one if it is still there (so you keep raising the same), otherwise the first row SHOWN — filter and sorting included. Nothing is played before the list has been displayed at least once.\n\nStops on its own: no SP left, no ore left, no weapon left in the list, or a server refusal. A « Stop » button appears in the window throughout the chain."
"Chaque tentative peut DÉTRUIRE l'arme, et elles partent sans confirmation. La chaîne joue les armes de la liste jusqu'à épuisement du SP.": "Every attempt can DESTROY the weapon, and they go off without confirmation. The chain plays the weapons of the list until the SP runs out."
"Garde la trace des tentatives de la session, avec le libellé EXACT du serveur. N'apparaît qu'à partir du premier résultat — avant, il n'y a rien à montrer. C'est le seul endroit où succès et échec se distinguent : le client leur donne le MÊME texte (MsgString 911 et 912).": "Keeps track of the session's attempts, with the server's EXACT wording. Only appears from the first result onwards — before that there is nothing to show. It is the only place where success and failure can be told apart: the client gives them the SAME text (MsgString 911 and 912)."
