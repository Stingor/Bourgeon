"%s (non sauvegardé)": "%s (unsaved)"
"Lettres, chiffres, F1-F12 et Espace (avec Ctrl/Alt/Maj si tu veux).\nUne touche déjà prise par un preset d'équipement ou par la barre de skills est refusée.": "Letters, digits, F1-F12 and Space (with Ctrl/Alt/Shift if you like).\nA key already taken by an equipment preset or by the skill bar is refused."
"DPS Meter": "DPS Meter"
"Lancer DOOM (1993) dans Ragnarok": "Launch DOOM (1993) inside Ragnarok"
"Le vrai DOOM (moteur doomgeneric embarqué), rendu dans une fenêtre par-dessus le jeu.\n\nNécessite doom1.wad (shareware) à côté de l'exe du client.\nClique la fenêtre DOOM pour capturer le clavier : ZQSD (AZERTY), WASD ou flèches pour bouger, Ctrl tirer, Espace/E ouvrir, Shift courir, Échap menu.\nDécocher = pause. Quitter depuis le menu DOOM = définitif jusqu'au redémarrage du client.": "The real DOOM (embedded doomgeneric engine), rendered in a window over the game.\n\nRequires doom1.wad (shareware) next to the client exe.\nClick the DOOM window to capture the keyboard: ZQSD (AZERTY), WASD or arrows to move, Ctrl to fire, Space/E to open, Shift to run, Esc for the menu.\nUnticking = pause. Quitting from the DOOM menu = final until the client restarts."
"État : %s": "State: %s"
"Parade de Porings (login)": "Poring parade (login)"
"Porings sur l'écran de login": "Porings on the login screen"
"Fait flâner une petite bande de monstres de la famille Poring sur l'écran de login : ils sautillent d'un bord à l'autre, font des pauses, et sursautent (avec un son) si tu cliques dessus.\n\nPurement cosmétique. Ils s'estompent au-dessus du panneau de login pour ne pas gêner la saisie. Visible uniquement à l'écran de login.": "Sets a small band of Poring-family monsters wandering across the login screen: they hop from edge to edge, pause, and startle (with a sound) if you click them.\n\nPurely cosmetic. They fade above the login panel so as not to hinder typing. Only visible on the login screen."
"Ouvrir Roggle": "Open Roggle"
"Mini-jeu façon Peggle, dessiné en ImGui par-dessus le jeu.\n\nVise à la souris depuis le canon en haut, clique pour tirer la bille. Dégomme tous les pegs ORANGE pour gagner ; le seau vert en bas rattrape la bille = bille gratuite.\nFermer la fenêtre ou décocher = masquer (la partie est conservée).": "Peggle-like mini-game, drawn in ImGui over the game.\n\nAim with the mouse from the cannon at the top, click to fire the ball. Clear every ORANGE peg to win; the green bucket at the bottom catching the ball = a free ball.\nClosing the window or unticking = hide (the game is kept)."
"Ouvrir Rojeweled": "Open Rojeweled"
"Match-3 façon Bejeweled dont les gemmes sont de vrais sprites de monstres RO (famille Poring : Poring, Drops, Metaling, Poporing, Marin, Deviling).\n\nClique deux monstres voisins pour les échanger ; aligne-en 3+ pour les faire disparaître (les cascades rapportent plus). DX9 requis (sinon tuiles colorées).": "A Bejeweled-style match-3 whose gems are real RO monster sprites (Poring family: Poring, Drops, Metaling, Poporing, Marin, Deviling).\n\nClick two neighbouring monsters to swap them; line up 3+ to clear them (cascades score more). DX9 required (coloured tiles otherwise)."
"Sauter au clavier": "Jump with the keyboard"
"Appuie sur la touche de saut (Espace par défaut) pour faire bondir ton personnage : un petit arc parabolique (montée puis retombée) purement visuel.\n\nLe serveur ne voit rien — c'est un simple décalage de hauteur du sprite, ré-appliqué chaque frame (tu peux même sauter en marchant). Taper cette touche dans le chat ne déclenche PAS de saut.": "Press the jump key (Space by default) to make your character leap: a small parabolic arc (up, then down), purely visual.\n\nThe server sees nothing — it is a plain height offset on the sprite, reapplied every frame (you can even jump while walking). Typing that key in the chat does NOT trigger a jump."
"Durée (ms)": "Duration (ms)"
"Déplacement au clavier (Expérimental)": "Keyboard movement (Experimental)"
"Marcher avec ZQSD / flèches": "Walk with ZQSD / arrows"
"Déplace ton personnage au clavier : Z/S pour avancer et reculer, Q/D pour aller à gauche et à droite (les flèches font pareil). Deux touches ensemble = diagonale.\n\nRien n'est simulé côté client : le plugin envoie la MÊME demande de marche que le clic au sol, donc le serveur reste maître du déplacement (murs, vitesse, blocages). Taper dans le chat ne fait pas courir le personnage.\n\nAttention si tu as des raccourcis de compétence sur Z, Q, S ou D : ils se déclencheront aussi.": "Moves your character with the keyboard: Z/S to go forward and back, Q/D to go left and right (the arrows do the same). Two keys together = diagonal.\n\nNothing is simulated client-side: the plugin sends the SAME walk request as a click on the ground, so the server stays in charge of movement (walls, speed, blocks). Typing in the chat will not send your character running.\n\nBeware if you have skill shortcuts on Z, Q, S or D: they will fire as well."
"Suivre la rotation de la caméra": "Follow the camera rotation"
"« Haut » = le haut de l'écran, même après avoir fait pivoter la caméra. Décoché : les directions restent celles de la carte.": "\"Up\" = the top of the screen, even after rotating the camera. Unticked: directions stay those of the map."
"S'arrêter au relâchement": "Stop on key release"
"Coupe la marche dès que tu lâches la touche, au lieu de laisser le personnage finir le trajet demandé.": "Cuts the walk as soon as you release the key, instead of letting the character finish the requested path."
"Interface de jeu": "Game interface"
"Langue": "Language"
"Langue de l'interface Bourgeon. Le jeu lui-même (noms d'objets, descriptions, messages du serveur) n'est pas concerné.\nUne langue grisée est connue mais son fichier de traduction est absent de SaveData\\lang\\.": "Language of the Bourgeon interface. The game itself (item names, descriptions, server messages) is not affected.\nA greyed-out language is known but its translation file is missing from SaveData\\lang\\."
"%zu textes sans traduction": "%zu untranslated strings"
"Écrit les textes rencontrés depuis le lancement et absents du catalogue dans SaveData\\lang\\<langue>.missing.yaml, prêts à traduire. N'y figure que ce qui a été AFFICHÉ : ouvre les fenêtres concernées avant d'exporter.": "Writes the strings met since launch and missing from the catalogue into SaveData\\lang\\<language>.missing.yaml, ready to translate. Only what has been DISPLAYED appears there: open the windows concerned before exporting."
"Grille d'alignement": "Alignment grid"
"Affiche une grille plein écran pour aligner ton interface (comme les add-ons d'interface de WoW).": "Shows a full-screen grid to line up your interface (like WoW's interface add-ons)."
"Taille grille": "Grid size"
"Aimanter à la grille": "Snap to grid"
"Les barres et les icônes s'alignent sur les cellules de la grille pendant le déplacement et le redimensionnement.": "Bars and icons line up on the grid cells while being moved and resized."
"Couleur grille": "Grid colour"
"Afficher le bouton « Signaler un bug »": "Show the \"Report a bug\" button"
"Affiche le bouton de rapport de bug dans les fenêtres de description (item/skill) et le dialogue PNJ, et active le raccourci Ctrl+Alt+B. Décoche pour tout désactiver.": "Shows the bug report button in the description windows (item/skill) and the NPC dialogue, and enables the Ctrl+Alt+B shortcut. Untick to disable it all."
"Aperçu — ces réglages appartiennent à l'interface moderne, qui est désactivée.": "Preview — these settings belong to the modern interface, which is disabled."
"Activer l'interface moderne": "Enable the modern interface"
