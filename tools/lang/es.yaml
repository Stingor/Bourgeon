"Clic gauche      monter d'un niveau (envoyé aussitôt au serveur)\nDouble-clic      lancer la compétence\nClic droit       description de la compétence\nGlisser          pose la compétence sur une barre d'action\nSurvol           flèches de prérequis (ambre) et de suites (bleu)\n\nPas de « Appliquer » ici : contrairement au Grimoire, une compétence de\nguilde se monte immédiatement.": "Clic izquierdo   sube un nivel (se envía al servidor de inmediato)\nDoble clic       lanza la habilidad\nClic derecho     la descripción de la habilidad\nArrastrar        pone la habilidad en una barra de acción\nRatón encima     flechas de requisito (ámbar) y de continuación (azul)\n\nAquí no hay « Aplicar »: a diferencia del Grimorio, una habilidad de guild\nsube de nivel de inmediato."
"Aucune compétence disponible (prérequis non remplis).": "Ninguna habilidad disponible (requisitos no cumplidos)."
