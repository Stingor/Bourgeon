"Me donne la MÊME classe (@job).\n⚠ Sur moonlight cette commande enchaîne aussi @blvl 999, @jlvl 100, @allskills et @allstats.\nUn joueur monté ou déguisé sera refusé : sa classe affichée est une classe factice.": "Me da la MISMA clase (@job).\n⚠ En moonlight este comando encadena además @blvl 999, @jlvl 100, @allskills y @allstats.\nUn jugador montado o disfrazado será rechazado: su clase mostrada es una clase ficticia."

# ── Volet staff de la fiche de personnage + ligne staff du grimoire ──────────
# Des atcommands rejouées par le canal du chat : le serveur reste seul juge.
# Les en-têtes de famille de classe viennent d'une table STATIQUE (kJobList[].group
# dans character_sheet.cc), où Tr reçoit une variable : l'extracteur statique ne
# les voit pas, elles sont donc listées ici à la main. Trois d'entre elles
# (« 2e classe », « 3e classe », « 4e classe ») existent déjà dans la section du
# grimoire plus haut et ne sont pas répétées.
"Staff": "Staff"
"Vitesse normale": "Velocidad normal"
"Reset": "Reiniciar"
"Tout apprendre": "Aprender todo"
"Cooldowns": "Recargas"
"@%s : ajoute ou retire le montant saisi à %s.\nC'est un AJUSTEMENT, pas une valeur cible.": "@%s: añade o quita la cantidad indicada a %s.\nEs un AJUSTE, no un valor objetivo."
"@resetstat : remet les six stats à leur base et rend tous les points de statut dépensés.": "@resetstat: devuelve las seis estadísticas a su base y reembolsa todos los puntos de estado gastados."
"@allstat : monte les six stats à leur maximum.": "@allstat: sube las seis estadísticas a su máximo."
"@job : change de classe.\n\n⚠ Sur ce serveur la commande enchaîne d'elle-même @blvl 999, @jlvl 100, @allskills et @allstats — changer de classe MAXE le personnage, ce n'est pas un simple changement d'apparence.": "@job: cambia de clase.\n\n⚠ En este servidor el comando encadena por sí solo @blvl 999, @jlvl 100, @allskills y @allstats — cambiar de clase DEJA AL MÁXIMO al personaje, no es un simple cambio de apariencia."
"@speed : vitesse de marche. PLUS BAS = PLUS RAPIDE ; 150 est la vitesse normale, 20 le plancher du serveur.\nEnvoyé au relâchement du curseur.": "@speed: velocidad de marcha. MÁS BAJO = MÁS RÁPIDO; 150 es la velocidad normal, 20 el mínimo del servidor.\nSe envía al soltar el deslizador."
"@speed -1 : rend au personnage sa vitesse par défaut (150).": "@speed -1: devuelve al personaje su velocidad por defecto (150)."
"@blvl : gagne ou perd le nombre de niveaux de BASE saisi.": "@blvl: gana o pierde el número de niveles de BASE indicado."
"@jlvl : gagne ou perd le nombre de niveaux de JOB saisi.": "@jlvl: gana o pierde el número de niveles de CLASE indicado."
"@stpoint : donne le nombre de points de statut saisi — de quoi essayer les boutons « + » du volet stats.": "@stpoint: otorga el número de puntos de estado indicado — lo justo para probar los botones «+» del panel de estadísticas."
"@resetskill : oublie toutes les compétences et rend les points.": "@resetskill: olvida todas las habilidades y devuelve los puntos."
"@allskills : apprend toutes les compétences de la classe.": "@allskills: aprende todas las habilidades de la clase."
"@resetcooltime : remet à zéro le temps de recharge de toutes les compétences (homoncule et mercenaire compris).": "@resetcooltime: pone a cero el tiempo de recarga de todas las habilidades (homúnculo y mercenario incluidos)."
"@skpoint : donne le nombre de points de compétence saisi.": "@skpoint: otorga el número de puntos de habilidad indicado."
"Novice / 1re classe": "Novato / 1.ª clase"
"Trans. 1re classe": "Trans. 1.ª clase"
"Trans. 2e classe": "Trans. 2.ª clase"
"3e classe (trans.)": "3.ª clase (trans.)"
"Classes étendues": "Clases extendidas"
"Baby / 1re classe": "Baby / 1.ª clase"
"Baby 2e classe": "Baby 2.ª clase"
"Baby 3e classe": "Baby 3.ª clase"
"Baby étendues": "Baby extendidas"

# ── Volet staff, second bloc : équipement, zeny et état visuel ───────────────
# « Toutes les pièces » vient du même genre de table STATIQUE que les familles de
# classe plus haut (kRefinePos[0].label, lu par RefinePosLabel) : invisible à
# l'extracteur statique, donc listée à la main. Les autres noms d'emplacement sont
# des TERMES DU JEU et restent en anglais dans toutes les langues, comme les
# abréviations des cases du mannequin.
"Toutes les pièces": "Todo el equipo puesto"
"Soigner": "Curar del todo"
"Réparer tout": "Reparar todo"
"Invisible": "Invisible"
"État visuel": "Estado visual"
"Vider l'inventaire": "Vaciar el inventario"
"Coché = présent. Le reste est retiré.": "Marcado = presente. Todo lo demás se quita."
"Emplacement visé par le raffinage. « Toutes les pièces » couvre tout ce qui est porté (c'est la position 0 de @refine).": "Ranura a la que se aplica la refinación. «Todo el equipo puesto» abarca todo lo equipado (es la posición 0 de @refine)."
"@refine : ajoute ou retire des niveaux de raffinage sur l'emplacement choisi. Le maximum est +10 sur ce serveur (pré-renewal).": "@refine: añade o quita niveles de refinación en la ranura elegida. El máximo es +10 en este servidor (pre-renewal)."
"@zeny : donne ou retire le montant saisi. Un retrait plus grand que la bourse la vide sans passer en négatif.": "@zeny: da o quita la cantidad indicada. Quitar más de lo que llevas vacía la bolsa sin pasar a negativo."
"@heal : rend tous les PV et les SP.": "@heal: restaura todos los PV y los SP."
"@repairall : répare toutes les pièces endommagées de l'inventaire.": "@repairall: repara todas las piezas dañadas del inventario."
"@hide : bascule l'invisibilité GM. Retaper la commande (ou recliquer) redevient visible.": "@hide: alterna la invisibilidad de GM. Volver a escribir el comando (o pulsar de nuevo) te hace visible."
"@itemreset : SUPPRIME tous les objets de l'inventaire. Irréversible, et le serveur ne demande rien — la confirmation est ici.": "@itemreset: BORRA todos los objetos del inventario. Irreversible, y el servidor no pregunta nada — la confirmación está aquí."
"@option : pose l'état visuel du personnage (monture, faucon, Hiding, Ruwach…).\n\n⚠ La commande REMPLACE l'état complet : ce qui n'est pas coché est RETIRÉ. Les cases sont amorcées sur l'état connu du client pour ne pas perdre la monture ou le cart en chemin.\nElle remet aussi à zéro les statuts (pétrifié, gelé, maudit…).": "@option: fija el estado visual del personaje (montura, halcón, Hiding, Ruwach…).\n\n⚠ El comando REEMPLAZA el estado completo: lo que no esté marcado se QUITA. Las casillas se rellenan con el estado que el cliente conoce, para no perder la montura ni el cart por el camino.\nTambién pone a cero los estados alterados (petrificado, congelado, maldito…)."

# Ecran de veille (AfkScreen) : la caméra tourne, l'interface s'efface.
"Écran de veille": "Salvapantallas"
"Activer l'écran de veille": "Activar el salvapantallas"

# Prevenir l'entourage : ce que les AUTRES voient d'une absence.
"Prévenir mon entourage": "Avisar a los demás"
"Signaler mon absence aux autres joueurs": "Indicar mi ausencia a los demás jugadores"
"Passé le délai ci-dessous, les autres joueurs voient que tu n'es plus là. Rien ne change pour toi : tu bouges, tu attaques et tu te défends exactement comme d'habitude — c'est un signe donné aux autres, pas une altération.\n\nIndépendant de l'écran de veille : tu peux prévenir sans que ta caméra ne bouge, comme tu peux te regarder tourner sans le dire à personne.": "Pasado el tiempo indicado abajo, los demás jugadores ven que ya no estás. Para ti no cambia nada: te mueves, atacas y te defiendes exactamente como siempre — es una señal para los demás, no una alteración.\n\nIndependiente del salvapantallas: puedes avisar sin que tu cámara se mueva, igual que puedes verte girar sin decírselo a nadie."
"Délai d'absence": "Tiempo de ausencia"
"Temps sans toucher au clavier ni à la souris avant que ton absence ne soit annoncée. Le premier geste la retire aussitôt.": "Tiempo sin tocar el teclado ni el ratón antes de que se anuncie tu ausencia. El primer gesto la retira al instante."
"Effet de sommeil (zzz)": "Efecto de sueño (zzz)"
"Le sommeil du jeu flotte au-dessus de ton personnage — le même « zzz » que sur un monstre endormi. Tu le vois toi aussi : c'est ainsi que tu sais que ton absence est bien annoncée.\n\nPurement visuel, pour toi comme pour les autres : tu bouges, tu attaques et tu te défends exactement comme d'habitude.": "El sueño del juego flota sobre tu personaje — el mismo « zzz » que sobre un monstruo dormido. Tú también lo ves: así sabes que tu ausencia se está anunciando de verdad.\n\nPuramente visual, para ti como para los demás: te mueves, atacas y te defiendes exactamente como siempre."
"Ajouter « [AFK] » devant mon nom": "Añadir « [AFK] » delante de mi nombre"
"Ton pseudo s'affiche « [AFK] Nom » dans l'étiquette au-dessus de ton personnage.\n\nLe champ du jeu ne fait que vingt-trois caractères : un pseudo de plus de dix-sept perd sa fin le temps de l'absence, et la retrouve au retour.": "Tu nombre aparece como « [AFK] Nombre » en la etiqueta sobre tu personaje.\n\nEl campo del juego solo admite veintitrés caracteres: un nombre de más de diecisiete pierde el final mientras dure la ausencia, y lo recupera al volver."
"Passé un moment sans toucher au clavier ni à la souris, l'interface s'efface et la caméra recule pour tourner lentement autour de ton personnage.\n\nLe premier geste rend tout comme c'était. Le clic qui te réveille ne part pas dans le jeu : le décor a changé d'angle, il tomberait ailleurs que là où tu crois viser.": "Tras un rato sin tocar el teclado ni el ratón, la interfaz desaparece y la cámara se aleja para girar lentamente alrededor de tu personaje.\n\nEl primer gesto lo devuelve todo a su sitio. El clic que te despierta no llega al juego: el decorado ha girado, y caería en un lugar distinto del que crees apuntar."
"Caméra": "Cámara"
"Rotation": "Rotación"
"Vitesse de l'orbite autour du personnage. Une valeur négative tourne dans l'autre sens ; zéro fige la vue, ce qui donne un simple plan large.": "Velocidad de la órbita alrededor del personaje. Un valor negativo gira en sentido contrario; cero deja la vista fija, lo que da un simple plano general."
"Plongée": "Picado"
"Hauteur du regard au-dessus de l'horizon. Le jeu se joue à 45° ; plus haut, la caméra domine la scène, et tout en haut elle est presque à la verticale.": "Altura de la mirada sobre el horizonte. El juego se juega a 45°; más arriba la cámara domina la escena, y en lo más alto está casi en vertical."
"Recul": "Retroceso"
"De combien la caméra s'éloigne, en multiples de ta distance habituelle. Le moteur ne laisse pas aller plus loin que sa propre limite de vue : au-delà, on verrait le bord du monde et le brouillard.": "Cuánto se aleja la cámara, en múltiplos de tu distancia habitual. El motor no permite ir más allá de su propio límite de vista: más lejos se vería el borde del mundo y la niebla."
"Transition": "Transición"
"Masquer toute l'interface": "Ocultar toda la interfaz"
"L'interface Bourgeon ET celle du client — fenêtres, noms au-dessus des personnages, bulles de chat. Rien n'est fermé pour autant : tout ce qui était ouvert l'est encore au réveil.": "La interfaz de Bourgeon Y la del cliente — ventanas, nombres sobre los personajes, bocadillos de chat. Aun así no se cierra nada: lo que estaba abierto sigue abierto al volver."
"Noir et blanc": "Blanco y negro"
"Vignette, noir et blanc et grain demandent le rendu DirectX 9.": "El viñeteado, el blanco y negro y el grano requieren el renderizado DirectX 9."
"Essayer maintenant": "Probar ahora"
"Entre en veille tout de suite, sans attendre le délai. Bouge la souris pour en sortir.": "Entra en reposo de inmediato, sin esperar al retardo. Mueve el ratón para salir."
"Absent à l'instant": "Ausente ahora mismo"
"Absent depuis %u min": "Ausente desde hace %u min"
"Absent depuis %uh%02u": "Ausente desde hace %uh%02u"

# Horloge de l'écran de veille (les positions sont des items de RoCombo).
"Horloge": "Reloj"
"Afficher l'heure": "Mostrar la hora"
"Afficher la durée d'absence": "Mostrar el tiempo de ausencia"
"Marge": "Margen"
"Distance au bord de l'écran. Sans effet sur une position centrée, qui n'a pas de bord dont s'écarter.": "Distancia al borde de la pantalla. Sin efecto en una posición centrada, que no tiene borde del que separarse."
"Taille de l'heure. La ligne d'absence suit, en plus petit.": "Tamaño de la hora. La línea de ausencia la sigue, más pequeña."
"Une ombre d'un pixel sous le texte. C'est elle qui le garde lisible quand la caméra passe devant un décor clair.": "Una sombra de un píxel bajo el texto. Es lo que lo mantiene legible cuando la cámara pasa por un decorado claro."
"Haut-centre": "Arriba-centro"
"Milieu-gauche": "Centro-izquierda"
"Milieu-droite": "Centro-derecha"
"Bas-centre": "Abajo-centro"
"Masquer le curseur": "Ocultar el cursor"
"La flèche de la souris disparaît aussi. Elle revient dès le premier geste, en même temps que l'interface.": "El puntero del ratón también desaparece. Vuelve al primer gesto, junto con la interfaz."
"Temps sans toucher au clavier ni à la souris avant que la veille ne commence.": "Tiempo sin tocar el teclado ni el ratón antes de que empiece el salvapantallas."
"Durée du basculement en veille. Le retour, lui, va trois fois plus vite : il répond à un geste que tu viens de faire.": "Cuánto tarda en entrar en reposo. La vuelta es tres veces más rápida: responde a un gesto que acabas de hacer."
"Réveil": "Despertar"
"Clavier et souris": "Teclado y ratón"
"Clavier seulement": "Solo teclado"
"Souris seulement": "Solo ratón"
"Ce qui met fin à la veille. « Clavier seulement » évite qu'une souris frôlée ne la réveille sans arrêt.\n\nCe réglage ne change PAS ce qui repousse la mise en veille : tant que tu joues, tout compte. Et ce qui n'a pas le droit de te réveiller n'agit pas non plus dans le jeu — sinon une touche partirait sur un décor que tu ne vois pas.": "Lo que pone fin al reposo. «Solo teclado» evita que un ratón rozado lo despierte sin parar.\n\nEste ajuste NO cambia lo que retrasa el reposo: mientras juegas, todo cuenta. Y lo que no tiene derecho a despertarte tampoco actúa en el juego — si no, una tecla saldría hacia un decorado que no ves."

