"Raccourcis inventaire\n\n- Double-clic gauche : utiliser / équiper\n- Ctrl + double-clic gauche : équiper en main gauche\n- Maj + clic gauche : lien de l'item dans l'input du chat (puis Entrée)\n- Clic droit : menu contextuel\n- Ctrl + clic droit : description\n- Maj + clic droit : (dé)favori\n- Alt + clic droit : transfert rapide (storage / cart si ouvert)\n- Glisser : cart / storage / équipement / barre d'action / sol\n- Glisser un favori sur un autre onglet : le retirer des favoris": "Atajos del inventario\n\n- Doble clic izquierdo: usar / equipar\n- Ctrl + doble clic izquierdo: equipar en la mano izquierda\n- Shift + clic izquierdo: enlace del objeto en la entrada del chat (luego Intro)\n- Clic derecho: menú contextual\n- Ctrl + clic derecho: descripción\n- Shift + clic derecho: (des)marcar como favorito\n- Alt + clic derecho: transferencia rápida (storage / cart si están abiertos)\n- Arrastrar: cart / storage / equipo / barra de acción / suelo\n- Arrastrar un favorito a otra pestaña: lo quita de los favoritos"
