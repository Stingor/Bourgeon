# Lista de eclosion (sustituye a UIPetEggListWnd, id 90).
"Éclore un œuf": "Incubar un huevo"
"Faire éclore": "Incubar"
"Aucun œuf de familier dans le sac.": "No hay ningún huevo de mascota en la bolsa."
"Œuf vierge : rien à éclore.": "Huevo vacío: no hay nada que incubar."
