"-> émis mais REJETÉ par nous (bug)": "-> emitido pero RECHAZADO por nosotros (bug)"
"dessins  = appels d'EzEffect_Draw sur NOTRE nœud\ninserts  = primitives soumises pendant ce dessin (avant nos filtres)\ncapturés = ce qu'on garde après filtres de forme\n\n0 dessin        -> le nœud n'existe pas : problème AMONT du rendu.\ndessins, 0 ins. -> le sous-rendu n'émet rien : ressource absente\n                   (le chargeur échoue en silence) ou condition non remplie.\nins. mais 0 cap.-> le jeu émet et NOUS rejetons : là c'est notre bug.": "dibujos  = llamadas a EzEffect_Draw sobre NUESTRO nodo\ninserts  = primitivas enviadas durante ese dibujo (antes de nuestros filtros)\ncapturados = lo que conservamos tras filtrar por forma\n\n0 dibujos       -> el nodo no existe: problema ANTES del renderizado.\ndibujos, 0 ins. -> el subrenderizado no emite nada: falta el recurso\n                   (el cargador falla en silencio) o no se cumple la condición.\nins. pero 0 cap.-> el juego emite y NOSOTROS rechazamos: ese es nuestro bug."
