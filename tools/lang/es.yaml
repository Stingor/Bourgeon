"Cet objet n'a pas de recette, n'entre dans aucune et ne se transforme pas en flèches. Le fichier de recettes ne couvre que la fabrication : quêtes, échanges et butin de monstres n'y sont pas.": "Este objeto no tiene receta, no entra en ninguna y no se transforma en flechas. El archivo de recetas solo cubre la fabricación: misiones, intercambios y botín de monstruos no están en él."
"L'Atlas répertorie tout ce que le serveur sait fabriquer : par métier, par produit, par matériau, et les flèches. Le client ne peut pas le faire seul — sa table de recettes ne s'interroge que par produit connu, et le serveur n'envoie une liste qu'après un lancement de compétence.": "El Atlas recoge todo lo que el servidor sabe fabricar: por oficio, por producto, por material y las flechas. El cliente no puede hacerlo solo: su tabla de recetas solo se consulta por producto conocido, y el servidor únicamente envía una lista tras lanzar una habilidad."
