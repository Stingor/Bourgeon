"Tout ce que le CLIENT sait de cette entité, relu à chaque image. Les champs de la plaque de nom viennent du serveur : vides, ils veulent dire « pas encore reçu », pas « vides côté serveur ».\nLes adresses et la vtable se collent telles quelles dans IDA ou x32dbg.": "Todo lo que el CLIENTE sabe de esta entidad, releído en cada fotograma. Los campos de la placa de nombre vienen del servidor: vacíos, significan \"aún no recibido\", no \"vacíos en el servidor\".\nLas direcciones y la vtable se pegan tal cual en IDA o x32dbg."

