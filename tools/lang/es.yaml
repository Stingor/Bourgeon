"Le FXAA plein écran adoucit aussi le texte de l'UI.\nPlafonné à 0.5 — au-delà le texte devient illisible.\nAvec la chatbox ImGui, le plafond monte à 1.0.": "El FXAA a pantalla completa también suaviza el texto de la UI.\nLimitado a 0.5 - más allá, el texto se vuelve ilegible.\nCon la chatbox ImGui, el límite sube a 1.0."
"Le FXAA plein écran adoucit aussi le texte de l'UI.\nChatbox ImGui allumée : le chat est dessiné dans l'overlay,\nque le post-traitement ne touche pas — le plafond monte donc\nà 1.0. Il reste du texte natif (noms au-dessus des personnages,\nfenêtres natives) : au-delà de 0.5, lui aussi s'adoucit.": "El FXAA a pantalla completa también suaviza el texto de la UI.\nChatbox ImGui activada: el chat se dibuja en el overlay, que el\npost-procesado nunca toca, así que el límite sube a 1.0.\nQueda texto nativo (nombres sobre los personajes, ventanas\nnativas): más allá de 0.5, también se suaviza."
