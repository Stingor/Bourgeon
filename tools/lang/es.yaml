"Zeny + recette dépasse le plafond de %s z (excédent : %s z).": "Zeny + recaudación supera el límite de %s z (exceso: %s z)."
"Le client refuse d'ouvrir le shop dans ce cas. Baisse un prix ou une\nquantité, ou dépose des zeny au storage.": "El cliente se niega a abrir el shop en ese caso. Baja un precio o una\ncantidad, o mete zeny en el storage."
