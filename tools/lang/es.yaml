"Clic gauche          réserve un point (et ses prérequis manquants)\nCtrl + clic gauche   réserve jusqu'au niveau maximum\nDouble-clic          lance la compétence (aucun point réservé)\nClic droit           menu (monter, lancer, niveau d'utilisation, description)\nCtrl + clic droit    description de la compétence\nGlisser              pose la compétence sur une barre d'action\nSurvol               flèches de prérequis (ambre) et de suites (bleu)\n\nRien n'est envoyé au serveur tant que « Appliquer » n'est pas cliqué.": "Clic izquierdo        reserva un punto (y sus requisitos que falten)\nCtrl + clic izq.      reserva hasta el nivel máximo\nDoble clic            lanza la habilidad (sin reservar punto)\nClic derecho          menú (subir de nivel, lanzar, usar nivel, descripción)\nCtrl + clic derecho   la descripción de la habilidad\nArrastrar             pone la habilidad en una barra de acción\nRatón encima          flechas de requisito (ámbar) y de continuación (azul)\n\nNada se envía al servidor hasta que se pulsa « Aplicar »."
