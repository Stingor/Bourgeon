"Résistances": "Resistencias"
"Molette : tourner le monstre\nClic : le titiller": "Rueda: girar al monstruo\nClic: darle un toque"
"Poser ce monstre dans la barre de chat.": "Poner este monstruo en la barra del chat."
"%u monstres portent le nom « %s ».": "%u monstruos llevan el nombre « %s »."
"Celui-ci est": "Este es"
"Voir l'original##mi_namesake": "Ver el original##mi_namesake"
"Ouvrir la fiche du monstre #%u,\nle plus ancien à porter ce nom.": "Abrir la ficha del monstruo #%u,\nel más antiguo en llevar este nombre."
"Relevé Sense (exemplaire croisé) : niveau %u, PV %u, %s %u, %s %u": "Lectura de Sense (ejemplar contrastado): nivel %u, HP %u, %s %u, %s %u"
"Ces chiffres viennent du monstre effectivement visé par Sense.\nIls peuvent différer de la base de données (modificateurs de serveur,\nGuerre d'Emperium, monstre invoqué par script).": "Estas cifras vienen del monstruo al que Sense apuntó realmente.\nPueden diferir de la base de datos (modificadores del servidor,\nWar of Emperium, monstruo invocado por un script)."
"Précision et esquive": "Precisión y evasión"
"Face à votre personnage": "Contra tu personaje"
"Ce qu'il vous rapporte": "Lo que te aporta"
"Ce que ce monstre vous donnerait VRAIMENT, et non la valeur de la base de données affichée plus haut.\n\nLe serveur applique tout ce qui pèse sur le gain : le taux du serveur, le malus de haut niveau, vos cartes et objets qui augmentent l'EXP contre cette race ou cette classe, un Battle Manual actif, le statut VIP et un éventuel événement d'EXP.\n\nEstimation pour un monstre que vous tuez SEUL, en lui ayant infligé la totalité des dégâts. En groupe, ou en partageant les dégâts, votre part est plus petite ; certaines ZONES ont au contraire un multiplicateur d'EXP qui leur est propre.": "Lo que este monstruo te daría DE VERDAD, y no el valor de la base de datos que se muestra arriba.\n\nEl servidor aplica todo lo que influye en la ganancia: la tasa del servidor, la penalización de alto nivel, tus cartas y objetos que aumentan la EXP contra esta raza o esta clase, un Battle Manual activo, el estado VIP y un posible evento de EXP.\n\nEstimación para un monstruo que matas SOLO, habiéndole infligido todo el daño. En grupo, o compartiendo el daño, tu parte es menor; algunas ZONAS, en cambio, tienen su propio multiplicador de EXP."
"Niveau maximum": "Nivel máximo"
"atteint": "alcanzado"
"de votre niveau": "de tu nivel"
"Job maximum": "Nivel de job máximo"
"de votre job": "de tu nivel de job"
"Pour un niveau": "Para un nivel"
"Nombre de ces monstres à tuer pour un niveau COMPLET, pas pour terminer celui que vous avez entamé.": "Cuántos de estos monstruos hay que matar para un nivel COMPLETO, no para terminar el que ya has empezado."
"Pour un job": "Para un nivel de job"
"Calculé par le serveur pour votre personnage, en supposant que vous le tuez seul. Hors partage de groupe et hors bonus de zone.": "Calculado por el servidor para tu personaje, suponiendo que lo matas solo. Sin reparto de grupo ni bonificación de zona."
"Élément du monstre : %s niveau %u": "Elemento del monstruo: %s nivel %u"
"Monstre inconnu du serveur (#%u).": "Monstruo desconocido para el servidor (#%u)."
"Chargement de la fiche…": "Cargando la ficha…"
"Récompense MVP": "Recompensa MVP"
"Animer le sprite du monstre": "Animar el sprite del monstruo"
"La fenêtre native n'affiche que la première image de l'animation d'attente.\nDécoché, on la reproduit à l'identique.": "La ventana nativa solo muestra el primer fotograma de la animación de reposo.\nSin marcar, la reproducimos exactamente."
"Afficher les Gardiens de forteresse": "Mostrar los Guardianes de fortaleza"
"Le client d'origine refuse d'ouvrir la fiche des cinq Gardiens\n(Archer, Knight, Soldier, Sword, Bow) : leurs PV resteraient cachés\npendant la Guerre d'Emperium. Coché, la fiche s'ouvre quand même.": "El cliente original se niega a abrir la ficha de los cinco Guardianes\n(Archer, Knight, Soldier, Sword, Bow): sus HP quedarían ocultos\ndurante la War of Emperium. Marcado, la ficha se abre igualmente."
"Dialogue NPC ImGui": "Diálogo de NPC en ImGui"
"Remplace le dialogue / menu / prompt NPC natif par un overlay ImGui (texte en couleur, menu à navigation clavier : flèches + Entrée, touches 1-9). Opt-in ; la fenêtre native est cachée quand c'est actif.": "Sustituye el diálogo / menú / entrada de NPC nativo por un overlay ImGui (texto coloreado, menú navegable con el teclado: flechas + Intro, teclas 1-9). Opt-in; la ventana nativa se oculta mientras está activo."
"Barre de recherche du menu": "Barra de búsqueda del menú"
"Affiche un champ de recherche au-dessus des longs menus (plus de 8 choix) pour filtrer les options. Décoche pour un menu épuré.": "Muestra un campo de búsqueda encima de los menús largos (más de 8 opciones) para filtrar las opciones. Desmarca para un menú más sencillo."
