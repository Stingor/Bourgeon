"Votre carte graphique a cessé de répondre : le jeu ne peut plus rien afficher.\n\nIl va se fermer, merci de le relancer.\n\nSi cela se reproduit souvent, fermez ce qui sollicite la carte graphique pendant que vous jouez : un second client, un logiciel de capture ou de streaming, une IA locale.": "Tu tarjeta gráfica ha dejado de responder: el juego ya no puede mostrar nada.\n\nSe va a cerrar, por favor vuelve a iniciarlo.\n\nSi ocurre a menudo, cierra lo que esté cargando la tarjeta gráfica mientras juegas: un segundo cliente, un programa de captura o streaming, una IA local."
