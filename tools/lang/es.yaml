"En mode édition : glisse chaque icône pour la repositionner.\nAimantage aux autres icônes et à la grille d'alignement.\nDésactive le mode pour cliquer les icônes normalement.": "En modo edición: arrastra cada icono para recolocarlo.\nImantado a los demás iconos y a la rejilla de alineación.\nDesactiva el modo para hacer clic en los iconos con normalidad."
