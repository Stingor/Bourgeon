"Affiche le sprite/l'animation PROPRE à chaque arme quand tu portes deux armes (assassin, kagerou/oboro) ou une seule arme en main gauche.\n\nOFF (défaut) : le client fond les deux armes en un sprite générique. ON : chaque arme garde son apparence d'origine.": ""
