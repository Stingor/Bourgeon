"Affiche la valeur de vitesse de déplacement et d'attaque\ndans le chat lors d'un changement comme après\nun buff style AgiUP ou Card. (@showspeed)": "Muestra los valores de velocidad de movimiento y de ataque\nen el chat cuando cambian, por ejemplo tras\nun buff tipo AgiUP o una Card. (@showspeed)"
