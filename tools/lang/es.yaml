"Défense physique : réduction en % (VIT/équip, def1) + réduction plate (def2). « refine » = part du refine des armures (dans la réduction %).": "Defensa física: reducción en % (VIT/equipo, def1) + reducción fija (def2). « refine » = la parte del refine de la armadura (dentro de la reducción en %)."
