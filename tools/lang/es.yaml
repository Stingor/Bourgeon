"Matériaux optionnels": "Materiales opcionales"
"%d Star Crumb : +%d ATK, -%d %% de réussite": "%d Star Crumb: +%d ATK, -%d %% de éxito"
"Le compromis que le natif ne montre jamais.\n\nChaque Star Crumb ajoute +5 ATK à l'arme forgée (card[1] = ((sc*5) << 8) + élément) et retranche 1500 au taux de réussite — lequel se compte sur 10000, donc 15 points de pourcentage (make_per -= sc * 1500 ; le tirage est rnd()%10000 < make_per).\n\nTrois Star Crumb, c'est donc +15 ATK contre 45 points de réussite en moins. L'écran natif aligne trois emplacements et n'en dit rien.": "El compromiso que el nativo nunca muestra.\n\nCada Star Crumb añade +5 ATK al arma forjada (card[1] = ((sc*5) << 8) + elemento) y quita 1500 a la tasa de éxito — que cuenta sobre 10000, o sea 15 puntos porcentuales (make_per -= sc * 1500; la tirada es rnd()%10000 < make_per).\n\nTres Star Crumb son, pues, +15 ATK a cambio de 45 puntos de éxito perdidos. La pantalla nativa alinea tres ranuras y no dice nada de ello."
"Élément %s : -%d %% de réussite": "Elemento %s: -%d %% de éxito"
"Une seule pierre élémentaire par arme : le serveur ne retient que la première (`ele == 0` en garde) et ne consomme même pas les suivantes.\n\nC'est pourquoi les autres emplacements n'en proposent plus dès qu'une est posée — un second choix n'aurait aucun effet.\n\nElle coûte 25 points de réussite (make_per -= 2500 sur une échelle de 10000), soit plus qu'un Star Crumb. Le natif ne le dit nulle part.": "Solo una piedra elemental por arma: el servidor conserva únicamente la primera (`ele == 0` como guarda) y ni siquiera consume las demás.\n\nPor eso las otras ranuras dejan de ofrecerlas en cuanto se coloca una — una segunda elección no tendría efecto.\n\nCuesta 25 puntos de éxito (make_per -= 2500 sobre una escala de 10000), o sea más que un Star Crumb. El nativo no lo dice en ninguna parte."
"Total : -%d %% de réussite": "Total: -%d %% de éxito"
"Enclume retenue : %s (+%d %%)": "Yunque usado: %s (+%d %%)"
"(%d autre%s en sac, sans effet)": "(%d otro%s en la bolsa, sin efecto)"
"Aucune enclume en sac.": "Ningún yunque en la bolsa."
"L'enclume n'est PAS un matériau : elle n'entre dans aucune recette et n'est jamais consommée. Le serveur vérifie seulement que tu en portes une (pc_search_inventory) et ajoute au taux de réussite :\n\n  Emperium Anvil  +10 %\n  Golden Anvil    +5 %\n  Oridecon Anvil  +2,5 %\n  Anvil           +0 %\n\nSeule la MEILLEURE compte (chaîne de « else if » côté serveur) : en cumuler plusieurs n'apporte rien de plus.": "El yunque NO es un material: no entra en ninguna receta y nunca se consume. El servidor solo comprueba que llevas uno (pc_search_inventory) y lo suma a la tasa de éxito:\n\n  Emperium Anvil  +10 %\n  Golden Anvil    +5 %\n  Oridecon Anvil  +2,5 %\n  Anvil           +0 %\n\nSolo cuenta el MEJOR (una cadena de « else if » en el servidor): acumular varios no aporta nada más."
"%s : %d demandés, %d en sac": "%s: %d pedidos, %d en la bolsa"
"Il ne te reste plus l'objet qui a ouvert cette liste.": "Ya no tienes el objeto que abrió esta lista."
"Compétence d'origine inconnue : relance impossible.": "Habilidad original desconocida: no se puede encadenar."
"Ré-utilise %s pour rouvrir une liste.\n\nL'objet est CONSOMMÉ : le serveur le détruit avant d'exécuter son script, même si tu annules ensuite.": "Vuelve a usar %s para reabrir una lista.\n\nEl objeto se CONSUME: el servidor lo destruye antes de ejecutar su script, aunque canceles después."
"Relance la compétence pour obtenir une nouvelle liste.\n\nLe serveur n'autorise qu'une fabrication par lancement : après chaque objet produit, il faut relancer.": "Vuelve a lanzar la habilidad para obtener una lista nueva.\n\nEl servidor solo permite una fabricación por lanzamiento: tras cada objeto producido, hay que volver a lanzarla."
"Quantité": "Cantidad"
"Combien de fabrications partent TOUTES SEULES.\n\nÀ ne pas confondre avec « relancer automatiquement », qui rouvre la liste après chaque fabrication : à 1 avec cette case cochée, une fabrication part seule, la liste revient, et le clic suivant est à toi.\n\nLe serveur n'accepte AUCUNE quantité : une liste = une fabrication (clif_menuskill_clear). « ×20 » signifie donc vingt tours complets — relance, nouvelle liste, nouvelle demande.\n\nIl faut par conséquent que la relance automatique correspondante soit active, sinon aucune liste ne revient et la série s'arrête au premier tour. La fenêtre le dit si le cas se présente.\n\nMême effet qu'Entrée maintenue, mais la cible est CHIFFRÉE : on peut lâcher le clavier, et ça s'arrête au compte demandé plutôt qu'au moment où l'on pense à relâcher.": "Cuántas fabricaciones salen SOLAS.\n\nNo confundir con « encadenar automáticamente », que reabre la lista tras cada fabricación: con 1 y esa casilla marcada, sale una fabricación sola, vuelve la lista, y el siguiente clic es tuyo.\n\nEl servidor NO acepta ninguna cantidad: una lista = una fabricación (clif_menuskill_clear). « ×20 » significa, pues, veinte rondas completas — relanzar, lista nueva, petición nueva.\n\nEl encadenado automático correspondiente debe estar activado, si no no vuelve ninguna lista y la serie se para en la primera ronda. La ventana lo dice si se da el caso.\n\nMismo efecto que mantener Intro, pero el objetivo es un NÚMERO: puedes soltar el teclado, y se detiene en la cuenta pedida en vez de cuando se te ocurra soltar."
"Série sans effet : la relance par OBJET est désactivée, aucune nouvelle liste ne reviendra après la première fabrication.": "Serie sin efecto: el encadenado por OBJETO está desactivado, no volverá ninguna lista nueva tras la primera fabricación."
"Série sans effet : la relance automatique de la compétence est désactivée, aucune nouvelle liste ne reviendra après la première fabrication.": "Serie sin efecto: el relanzamiento automático de la habilidad está desactivado, no volverá ninguna lista nueva tras la primera fabricación."
"Demande envoyée — en attente du serveur…": "Petición enviada — esperando al servidor…"
"Aucune liste en cours.": "Ninguna lista en curso."
"Choisis un produit.": "Elige un producto."
"Le produit visé est masqué par le filtre.": "El producto buscado está oculto por el filtro."
"Relance automatique… %s consommé %d/%d": "Encadenado automático… %s consumido %d/%d"
"Relance automatique… %s consommé ×%d": "Encadenado automático… %s consumido ×%d"
"Relance automatique… (%d)": "Encadenado automático… (%d)"
"Remplace les DEUX listes natives : « LIST » (flèches, convertisseurs, poison, leurres, cuisine, bombes) et « Manufacturing List » (pharmacie, runes, forge).": "Sustituye AMBAS listas nativas: « LIST » (flechas, convertidores, veneno, señuelos, cocina, bombas) y « Manufacturing List » (farmacia, runas, forja)."
"Clic droit : description · double-clic ou Entrée : fabriquer.": "Clic derecho: descripción · doble clic o Intro: fabricar."
"En-têtes de colonne : trier (3e clic = ordre du serveur).": "Encabezados de columna: ordenar (3er clic = el orden del servidor)."
"Colonnes « Possédé » et « Faisable »": "Columnas « En posesión » y « Fabricable »"
"Le stock en inventaire, et le nombre de fabrications possibles déduit de la recette du client.\n\n« — » signifie « on ne sait pas » : la recette manque au fichier client, ou un nom de matériau n'a pas pu être résolu. Jamais « 0 » — le serveur n'aurait pas proposé le produit s'il n'y avait pas de quoi en faire au moins un.": "El stock del inventario, y el número de fabricaciones posibles, deducido de la receta del cliente.\n\n« — » significa « no se sabe »: la receta falta en el archivo del cliente, o no se ha podido resolver el nombre de un material. Nunca « 0 » — el servidor no habría ofrecido el producto si no hubiera bastante para al menos una."
"Aperçu au survol": "Vista previa al pasar el ratón"
"Journal de session": "Log de la sesión"
"Horodater le journal": "Marcar la hora en el log"
"Entrée lance la fabrication": "Intro lanza la fabricación"
"Décoché (défaut), la touche Entrée reste au CHAT pendant que la fenêtre est ouverte.\n\nCochée, elle déclenche la fabrication du produit sélectionné — et la maintenir enchaîne. Mais la fenêtre confisque alors la touche tant qu'elle est ouverte : impossible d'ouvrir la saisie du chat.\n\nDepuis que le champ Quantité existe, marteler Entrée n'a plus grand intérêt : « ×20 » fait le même travail sans occuper le clavier.": "Sin marcar (por defecto), la tecla Intro se queda con el CHAT mientras la ventana está abierta.\n\nMarcada, desencadena la fabricación del producto seleccionado — y mantenerla encadena. Pero la ventana confisca entonces la tecla mientras esté abierta: abrir la entrada del chat se vuelve imposible.\n\nComo existe el campo Cantidad, machacar Intro ya sirve de poco: « ×20 » hace el mismo trabajo sin acaparar el teclado."
"Relancer la compétence automatiquement": "Relanzar la habilidad automáticamente"
"Le serveur n'autorise qu'UNE fabrication par lancement de compétence (clif_menuskill_clear). Sans ça, enchaîner impose de retourner à la barre de raccourcis à chaque fois.\n\nCe qui se relance seul, c'est le LANCEMENT DE LA COMPÉTENCE — jamais la fabrication : le choix du produit et le déclenchement restent des clics. Aucune tentative ne part sans un geste de ta part.\n\nLa chaîne s'arrête d'elle-même sur une liste vide (le serveur dit qu'il n'y a plus rien) ou sur un refus de compétence.\n\nNE S'APPLIQUE PAS aux listes ouvertes par un OBJET (Mini Furnace, marteaux de forge : leur script fait « produce N; »). Ces objets sont CONSOMMÉS à chaque usage : ils ont leur propre réglage, juste en dessous.": "El servidor solo permite UNA fabricación por lanzamiento de habilidad (clif_menuskill_clear). Sin esto, encadenar significa volver a la barra de atajos cada vez.\n\nLo que se relanza solo es el LANZAMIENTO DE LA HABILIDAD — nunca la fabricación: elegir el producto y desencadenarla siguen siendo clics. Ningún intento sale sin un gesto tuyo.\n\nLa cadena se detiene sola con una lista vacía (el servidor dice que no queda nada) o con un rechazo de la habilidad.\n\nNO SE APLICA a las listas abiertas por un OBJETO (Mini Furnace, martillos de forja: su script hace « produce N; »). Esos objetos se CONSUMEN en cada uso: tienen su propio ajuste, justo debajo."
"Ré-utiliser l'OBJET automatiquement (le consomme)": "Volver a usar el OBJETO automáticamente (lo consume)"
"Pour les listes ouvertes par un objet — Mini Furnace, marteaux de forge — dont le script fait « produce N; ».\n\n/!\\ CHAQUE RELANCE DÉTRUIT UN EXEMPLAIRE. Le serveur supprime l'objet (pc_delitem, LOG_TYPE_CONSUME) AVANT d'exécuter son script : l'exemplaire est perdu même si tu annules ensuite, et même si la fabrication rate.\n\nComme pour la compétence, ce qui se relance est l'OUVERTURE de la liste, jamais la fabrication : choisir le produit et déclencher restent des clics.\n\nLa chaîne s'arrête sur une liste vide, sur un refus du serveur, dès qu'il ne te reste plus l'objet, ou si tu fermes la fenêtre. Le nombre d'exemplaires consommés reste affiché pendant toute la chaîne.": "Para las listas abiertas por un objeto — Mini Furnace, martillos de forja — cuyo script hace « produce N; ».\n\n/!\\ CADA PASO DE LA CADENA DESTRUYE UNA COPIA. El servidor borra el objeto (pc_delitem, LOG_TYPE_CONSUME) ANTES de ejecutar su script: la copia se pierde aunque canceles después, y aunque la fabricación falle.\n\nComo con la habilidad, lo que se encadena es la APERTURA de la lista, nunca la fabricación: elegir el producto y desencadenarla siguen siendo clics.\n\nLa cadena se detiene con una lista vacía, con un rechazo del servidor, en cuanto te quedas sin el objeto, o si cierras la ventana. El número de copias consumidas sigue mostrándose durante toda la cadena."
"Sans limite (jusqu'à épuisement du stock)": "Sin límite (hasta agotar el stock)"
"Sans limite, la chaîne va jusqu'à épuisement du stock. C'est le défaut — consommer toute une pile est ton choix.\n\nLe plafond n'existe que pour le seul cas qu'il couvre vraiment : avoir oublié ce réglage coché. Il ne protège de rien d'autre.\n\nUne chaîne illimitée ne peut pas s'emballer : chaque tour exige un résultat du serveur pour armer le suivant. Si le serveur ignore l'usage (objet en cooldown, condition non remplie), aucune liste n'arrive et la chaîne s'arrête d'elle-même.": "Sin límite, la cadena corre hasta agotar el stock. Ese es el comportamiento por defecto — consumir un montón entero es decisión tuya.\n\nEl límite solo existe para el único caso que realmente cubre: haber olvidado esta casilla marcada. No protege de nada más.\n\nUna cadena ilimitada no se puede desbocar: cada ronda necesita un resultado del servidor para armar la siguiente. Si el servidor ignora el uso (objeto en cooldown, condición no cumplida), no llega ninguna lista y la cadena se detiene sola."
