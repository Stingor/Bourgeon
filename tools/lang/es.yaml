"Les instances CEZ2STREffect sont normalement écartées (autre pipeline).\nCoche pour vérifier si un effet non capturé appartient à cette famille :\ns'il apparaît alors dans « effect_id capturés », c'est le cas.\n/!\\ Peut provoquer un double dessin ailleurs : diagnostic uniquement.": "Las instancias CEZ2STREffect se descartan normalmente (otra tubería).\nMarca para comprobar si un efecto no capturado pertenece a esa familia:\nsi aparece luego en \"effect_id capturados\", así es.\n/!\\ Puede provocar un doble dibujado en otro sitio: solo diagnóstico."
"Sert à isoler une régression : coche, puis regarde si le rendu NATIF\n(z-order des chapeaux/costumes) redevient correct.\nCoché = la famille aura/statut n'est plus ni capturée ni composée\nsur le doll (Perm_Frost & co disparaîtront de l'aperçu).": "Sirve para aislar una regresión: marca y mira si el renderizado NATIVO\n(z-order de sombreros/trajes) vuelve a ser correcto.\nMarcado = la familia aura/estado ya no se captura ni se compone\nsobre el muñeco (Perm_Frost y compañía desaparecerán de la vista previa)."
