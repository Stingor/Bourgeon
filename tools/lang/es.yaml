"Natif par primitive : rejoue SRCBLEND/DESTBLEND que le jeu a posés pour\nchaque primitive (record +0x18/+0x1c) — le seul mode correct, car un\neffet mélange additif et alpha dans la même frame.\nAlpha normal : les primitives additives sortent en CARRÉS NOIRS.\nAdditif global : les primitives alpha CRAMENT en blanc.\n/!\\ Le mode natif agit sur le device D3D9 : inopérant sous DX7.": "Nativo por primitiva: repite el SRCBLEND/DESTBLEND que el juego puso para\ncada primitiva (registro +0x18/+0x1c) — el único modo correcto, ya que un\nefecto mezcla aditivo y alfa en el mismo fotograma.\nAlfa normal: las primitivas aditivas salen como CUADRADOS NEGROS.\nAditivo global: las primitivas alfa SE QUEMAN en blanco.\n/!\\ El modo nativo actúa sobre el dispositivo D3D9: inoperante bajo DX7."
"Debug capture (brut + ancre)": "Captura de depuración (bruto + ancla)"
"Dessine la capture BRUTE (positions écran natives) + l'ancre (point cyan) et\nle cercle du rayon, SANS reprojection. Décoche « Cacher en jeu » pour\ncomparer les contours (vert) à l'effet natif in-world.": "Dibuja la captura EN BRUTO (posiciones de pantalla nativas) + el ancla (punto cian) y\nel círculo del radio, SIN reproyección. Desmarca \"Ocultar en el juego\" para\ncomparar los contornos (verde) con el efecto nativo en el mundo."
