"Planifie la suppression de ce personnage.\n- Il n'est PAS supprimé tout de suite : un délai serveur s'écoule d'abord\n  (le perso reste et se marque « Suppression programmée »).\n- Pendant ce délai tu peux ANNULER (bouton « Annuler suppression »).\n- Le délai écoulé, « Supprimer » finalise — IRRÉVERSIBLE.\n- Impossible si le perso est dans une GUILDE ou un GROUPE : le serveur\n  refuse, quitte-les d'abord.": "Programa el borrado de este personaje.\n- NO se borra de inmediato: primero corre un plazo del servidor\n  (el personaje sigue ahí y se marca « Borrado programado »).\n- Durante ese plazo puedes CANCELAR (botón « Cancelar el borrado »).\n- Una vez pasado el plazo, « Borrar » lo finaliza — IRREVERSIBLE.\n- Imposible si el personaje está en una GUILD o una PARTY: el servidor\n  se niega, sal de ellas primero."
