"Dès que le GIF est écrit, il part dans le presse-papier comme fichier : un Ctrl+V dans Discord le poste, animation comprise.\n\nUn message le confirme à l'écran, panneau fermé compris. Ce que tu avais copié auparavant est perdu.": "En cuanto el GIF está escrito, va al portapapeles como archivo: un Ctrl+V en Discord lo publica, animación incluida.\n\nUn mensaje lo confirma en pantalla, incluso con este panel cerrado. Lo que hubieras copiado antes se pierde."
"Rouvre le tracé à la souris sans passer par ce panneau — qui recouvre justement ce que tu cherches à cadrer.\n\nUn second appui annule le tracé, comme Échap. Pendant un décompte, la touche renonce au départ et rouvre le tracé ; pendant un enregistrement ou un encodage, elle refuse et le dit à l'écran (les images d'un GIF doivent toutes avoir la même taille).": "Vuelve a abrir el trazado con el ratón sin pasar por este panel, que tapa justamente lo que intentas encuadrar.\n\nUna segunda pulsación cancela el trazado, como Esc. Durante una cuenta atrás, la tecla renuncia a la salida y reabre el trazado; durante una grabación o una codificación, se niega y lo dice en pantalla (las imágenes de un GIF deben tener todas el mismo tamaño)."
"Images / s": "Imágenes / s"
