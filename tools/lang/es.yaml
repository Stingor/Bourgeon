# en: %d Star Crumb: +%d ATK, -%d %% success
"%d Star Crumb : +%d ATK, -%d %% de réussite": ""
# en: The trade-off the native never shows.\n\nEach Star Crumb adds +5 ATK to the forged weapon (card[1] = ((sc*5) << 8) + element) and takes 1500 off the success rate — which counts out of 10000, so 15 percentage points (make_per -= sc * 1500; the roll is rnd()%10000 < make_per).\n\nThree Star Crumbs are therefore +15 ATK against 45 points of success lost. The native screen lines up three slots and says nothing about it.
"Le compromis que le natif ne montre jamais.\n\nChaque Star Crumb ajoute +5 ATK à l'arme forgée (card[1] = ((sc*5) << 8) + élément) et retranche 1500 au taux de réussite — lequel se compte sur 10000, donc 15 points de pourcentage (make_per -= sc * 1500 ; le tirage est rnd()%10000 < make_per).\n\nTrois Star Crumb, c'est donc +15 ATK contre 45 points de réussite en moins. L'écran natif aligne trois emplacements et n'en dit rien.": ""
# en: %s element: -%d %% success
"Élément %s : -%d %% de réussite": ""
# en: One elemental stone per weapon only: the server keeps the first one alone (`ele == 0` as a guard) and does not even consume the others.\n\nThat is why the other slots stop offering any as soon as one is placed — a second choice would have no effect.\n\nIt costs 25 points of success (make_per -= 2500 on a scale of 10000), so more than a Star Crumb. The native says so nowhere.
"Une seule pierre élémentaire par arme : le serveur ne retient que la première (`ele == 0` en garde) et ne consomme même pas les suivantes.\n\nC'est pourquoi les autres emplacements n'en proposent plus dès qu'une est posée — un second choix n'aurait aucun effet.\n\nElle coûte 25 points de réussite (make_per -= 2500 sur une échelle de 10000), soit plus qu'un Star Crumb. Le natif ne le dit nulle part.": ""
