"Plus assez de SP pour relancer la compétence : chaîne arrêtée.": "No quedan SP suficientes para relanzar la habilidad: cadena detenida."
"Relance jetée par le délai de lancement : nouvel essai (%d/%d).": "Relanzamiento descartado por el retardo de lanzamiento: reintentando (%d/%d)."
"Options du refine": "Ajustes de refine"
"Aucune arme refinable.": "Ninguna arma refinable."
"Le serveur ne propose une arme que si TOUT est vrai :": "El servidor solo ofrece un arma si TODO es cierto:"
"elle est identifiée et a un niveau d'arme (1 à 4) ;": "está identificada y tiene un nivel de arma (1 a 4);"
"elle n'est PAS portée (déséquipe-la d'abord) ;": "NO está puesta (quítatela primero);"
"son refine est encore sous le plafond de ta compétence ;": "su refine sigue por debajo del límite de tu habilidad;"
"tu as le minerai correspondant à son niveau d'arme.": "tienes el mineral correspondiente a su nivel de arma."
"Session terminée : le serveur n'autorise qu'un refine par lancement de la compétence.": "Sesión terminada: el servidor solo permite un refine por lanzamiento de la habilidad."
"Un échec DÉTRUIT l'arme.": "Un fallo DESTRUYE el arma."
"Le minerai est consommé dans tous les cas. En cas de réussite l'arme passe de +%d à +%d.": "El mineral se consume en todos los casos. Si sale bien, el arma pasa de +%d a +%d."
"Le niveau appris de la compétence Upgrade Weapon EST le plafond : le serveur refuse toute arme déjà à ce refine (et jamais au-delà de +10).": "El nivel aprendido de la habilidad Upgrade Weapon ES el límite: el servidor rechaza cualquier arma que ya esté en ese refine (y nunca más allá de +10)."
"Probabilité EXACTE de cette tentative, pas une estimation.\n\nLe serveur calcule per = Rate/100 + (job_level - 50) / 2, puis réussit si per > rnd()%%100. Comme le tirage est uniforme sur 0..99, la probabilité vaut exactement per.\n\nLe Rate de base vient de la table de refine du serveur (niveau d'arme × refine visé). Un job level inférieur à 50 donne un bonus NÉGATIF : ce n'est pas une erreur, le serveur fait bien cela.": "La probabilidad EXACTA de este intento, no una estimación.\n\nEl servidor calcula per = Rate/100 + (job_level - 50) / 2, y luego acierta si per > rnd()%%100. Como la tirada es uniforme sobre 0..99, la probabilidad es exactamente per.\n\nEl Rate base viene de la tabla de refine del servidor (nivel del arma × refine buscado). Un nivel de job por debajo de 50 da una bonificación NEGATIVA: no es un error, el servidor lo hace de verdad."
"Tentative envoyée — en attente du serveur…": "Intento enviado — esperando al servidor…"
"Refine automatique imminent… (n° %d)": "Refine automático inminente… (n.º %d)"
"Chaîne automatique… (%d)": "Cadena automática… (%d)"
"Chaîne arrêtée. Un clic sur « Refine » ou « Relancer le skill » la reprend.": "Cadena detenida. Un clic en « Refinar » o « Relanzar la habilidad » la reanuda."
"Sélectionne une arme dans la liste.": "Elige un arma de la lista."
"Arrête le refine automatique tout de suite.\n\nUne tentative DÉJÀ envoyée ira à son terme : le serveur a l'arme,\nelle ne se reprend pas. Rien ne repartira ensuite.\n\nLe réglage reste coché : un clic sur « Refine » ou « Relancer le\nskill » reprend la chaîne.": "Detiene el refine automático de inmediato.\n\nUn intento YA enviado seguirá su curso: el servidor tiene el arma,\nno se puede recuperar. Después no volverá a empezar nada.\n\nEl ajuste sigue marcado: un clic en « Refinar » o « Relanzar la\nhabilidad » reanuda la cadena."
"Relancer le skill": "Relanzar la habilidad"
"Relance la compétence Upgrade Weapon pour obtenir une nouvelle liste.\n\nLe serveur n'autorise QU'UNE tentative par lancement : après chaque\nrefine il faut relancer, et c'est ce que fait ce bouton — sans\nrepasser par la barre d'action.": "Relanza la habilidad Upgrade Weapon para obtener una lista nueva.\n\nEl servidor solo permite UN intento por lanzamiento: tras cada refine hay\nque relanzarla, y eso es lo que hace este botón — sin volver a pasar\npor la barra de acción."
"Remplace la fenêtre « Upgradeable weapons » du skill Upgrade Weapon.": "Sustituye la ventana « Upgradeable weapons » de la habilidad Upgrade Weapon."
"Clic droit : description · double-clic ou Entrée : refine.": "Clic derecho: descripción · doble clic o Intro: refinar."
"En-têtes de colonne : trier (3e clic = ordre d'inventaire).": "Encabezados de columna: ordenar (3er clic = orden del inventario)."
"Confirmer avant un refine": "Confirmar antes de un refine"
"Un échec DÉTRUIT l'arme, et le client affiche le MÊME message pour un succès et un échec. La confirmation rappelle l'arme visée et le risque.": "Un fallo DESTRUYE el arma, y el cliente muestra el MISMO mensaje para un éxito y para un fallo. La confirmación recuerda el arma buscada y el riesgo."
"Cartes et emplacements": "Cards y ranuras"
"Le paquet du serveur porte les 4 cartes de chaque arme — la fenêtre native les jette, deux armes identiques dont une sertie y sont donc indistinguables.": "El paquete del servidor lleva las 4 cards de cada arma — la ventana nativa las tira, así que dos armas idénticas, una de ellas con cards, son indistinguibles ahí."
"Utile sur un gros inventaire ; sur deux ou trois armes il ne fait que prendre une ligne. Le décocher efface aussi le filtre en cours, pour qu'aucune arme ne reste masquée par un champ invisible.": "Útil con un inventario grande; con dos o tres armas solo ocupa una línea. Desmarcarlo también vacía el filtro actual, para que ningún arma quede oculta tras un campo invisible."
"Entrée lance le refine": "Intro lanza el refine"
"Cochée, Entrée refine l'arme sélectionnée, et la maintenir enchaîne. La fenêtre confisque alors la touche tant qu'elle est ouverte : impossible d'ouvrir la saisie du chat.\n\nDécoché (défaut), la touche Entrée reste au CHAT.\n\nLa fenêtre de CONFIRMATION garde Entrée dans tous les cas : « Entrée = OK » y est la convention, et elle valide une action qui peut détruire l'arme.": "Marcado, Intro refina el arma seleccionada, y mantenerlo encadena. La ventana confisca entonces la tecla mientras esté abierta: abrir la entrada del chat se vuelve imposible.\n\nSin marcar (por defecto), la tecla Intro se queda con el CHAT.\n\nLa ventana de CONFIRMACIÓN conserva Intro en todos los casos: « Intro = OK » es la convención ahí, y confirma una acción que puede destruir el arma."
"Après chaque tentative, relance Upgrade Weapon pour rouvrir la liste — le serveur n'en autorise qu'une par lancement.\n\nNe refine RIEN tout seul : le choix de l'arme et le déclenchement restent des clics. La chaîne s'arrête d'elle-même quand la liste revient vide, quand il n'y a plus de minerai, ou quand le serveur refuse une condition.\n\nSi la compétence est jetée par son délai de lancement, la relance est réessayée un peu plus tard (3 fois au plus) au lieu de s'arrêter en silence.": "Tras cada intento, relanza Upgrade Weapon para reabrir la lista — el servidor solo permite uno por lanzamiento.\n\nNo refina NADA por su cuenta: elegir el arma y desencadenarlo siguen siendo clics. La cadena se detiene sola cuando la lista vuelve vacía, cuando no queda mineral, o cuando el servidor rechaza una condición.\n\nSi la habilidad se descarta por su retardo de lanzamiento, el relanzamiento se reintenta un poco después (3 veces como máximo) en vez de pararse en silencio."
"Refiner automatiquement (chaîne complète)": "Refinar automáticamente (cadena completa)"
"Enchaîne TOUT SEUL : la première arme de la liste est jouée, la compétence relancée, et ainsi de suite jusqu'à ne plus pouvoir — c'est le SP qui borne la chaîne, et elle s'arrête quand il manque.\n\nImplique la relance automatique (sans elle le serveur n'enverrait plus de liste). La confirmation est IGNORÉE : une chaîne qui demande son accord à chaque tour n'en est pas une.\n\nL'arme visée est celle qui est sélectionnée si elle est encore là (on continue donc de monter la même), sinon la première ligne AFFICHÉE — filtre et tri compris. Rien n'est joué avant que la liste n'ait été affichée au moins une fois.\n\nS'arrête seule : plus de SP, plus de minerai, plus d'arme dans la liste, ou refus du serveur. Un bouton « Arrêter » apparaît dans la fenêtre pendant toute la chaîne.": "Encadena TOTALMENTE SOLO: se juega la primera arma de la lista, se relanza la habilidad, y así hasta no poder seguir — los SP son lo que limita la cadena, y se detiene cuando no quedan.\n\nImplica el relanzamiento automático (sin él el servidor no enviaría más listas). La confirmación se IGNORA: una cadena que pide tu aprobación en cada ronda no es una cadena.\n\nEl arma buscada es la seleccionada si sigue ahí (así sigues subiendo la misma), si no la primera fila MOSTRADA — filtro y ordenación incluidos. No se juega nada antes de que la lista se haya mostrado al menos una vez.\n\nSe detiene sola: sin SP, sin mineral, sin arma en la lista, o con un rechazo del servidor. Un botón « Detener » aparece en la ventana durante toda la cadena."
"Chaque tentative peut DÉTRUIRE l'arme, et elles partent sans confirmation. La chaîne joue les armes de la liste jusqu'à épuisement du SP.": "Cada intento puede DESTRUIR el arma, y salen sin confirmación. La cadena juega las armas de la lista hasta agotar los SP."
"Garde la trace des tentatives de la session, avec le libellé EXACT du serveur. N'apparaît qu'à partir du premier résultat — avant, il n'y a rien à montrer. C'est le seul endroit où succès et échec se distinguent : le client leur donne le MÊME texte (MsgString 911 et 912).": "Lleva la cuenta de los intentos de la sesión, con la redacción EXACTA del servidor. Solo aparece a partir del primer resultado — antes no hay nada que mostrar. Es el único sitio donde se pueden distinguir el éxito y el fallo: el cliente les da el MISMO texto (MsgString 911 y 912)."
