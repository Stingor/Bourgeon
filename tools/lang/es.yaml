# en: - Left click: use. Right click: description.\n- Drag a slot onto another: move / swap (the 3 bars\n  answer one another).\n- Drag a slot OUT of the bars and release: empty it. The preview is\n  crossed out in red as soon as you are in the removal zone.\n- Middle click on a slot: empties it too, without dragging.
"- Clic gauche : utiliser. Clic droit : description.\n- Glisser une case sur une autre : déplacer / échanger (les 3 barres\n  se répondent entre elles).\n- Glisser une case HORS des barres et relâcher : la vider. L'aperçu se\n  barre d'une croix rouge dès qu'on est en zone de retrait.\n- Clic molette sur une case : la vider aussi, sans glisser.": ""
# en: The game only drives ONE tab from the keyboard at a time.\nBourgeon routes the keys to the other visible tab:\n- SHARED key (e.g. F2 on both tabs): the OCCUPIED slot answers.\n  If both slots are occupied, only the active tab answers.\n- To drive Tab 2 in a dedicated way, rebind its slots\n  to Ctrl+/Alt+ combos (unique keys) in the game's keyboard shortcuts.\n- The item bar has no keyboard shortcut (left click = use).\n- A slot NOT SHOWN no longer answers its key: hiding a bar,\n  or lowering its \"Slot count\", also disarms the matching shortcuts.
"Le jeu ne pilote qu'UN onglet au clavier à la fois.\nBourgeon route les touches vers l'autre onglet visible :\n- Touche PARTAGEE (ex. F2 sur les 2 onglets) : la case OCCUPEE répond.\n  Si les deux cases sont occupées, seul l'onglet actif répond.\n- Pour piloter l'Onglet 2 de façon dédiée, rebinde ses cases\n  sur des combos Ctrl+/Alt+ (touches uniques) dans les raccourcis clavier du jeu.\n- La barre d'items n'a pas de raccourci clavier (clic gauche = utiliser).\n- Une case NON AFFICHÉE ne répond plus à sa touche : masquer une barre,\n  ou baisser son \"Nb slots\", désarme aussi les raccourcis correspondants.": ""
