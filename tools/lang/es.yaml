"Masque les deux petites jauges HP/SP que le client dessine sous les pieds de TON personnage dans le monde.\nCelles des autres joueurs et des monstres ne bougent pas.": "Oculta las dos pequeñas barras HP/SP que el cliente dibuja bajo los pies de TU personaje en el mundo.\nLas de los demás jugadores y de los monstruos no se tocan."
"Affiche/cache chaque barre indépendamment.": "Muestra/oculta cada barra de forma independiente."
"Verrouiller les barres": "Bloquear las barras"
"Verrouillée : les barres ne bougent plus et laissent passer les clics au jeu.\nDéverrouillée : glissez-les pour les déplacer, tirez le coin pour redimensionner.": "Bloqueadas: las barras ya no se mueven y dejan pasar los clics al juego.\nDesbloqueadas: arrástralas para moverlas, tira de una esquina para redimensionar."
"Aimanter les barres (snap)": "Imantar las barras"
"Quand tu glisses une barre près d'une autre, ses bords s'alignent et se collent automatiquement (~10px).\nÉloigne-la pour la détacher. Les barres restent indépendantes.": "Cuando arrastras una barra cerca de otra, sus bordes se alinean y se pegan automáticamente (~10px).\nAléjala para separarla. Las barras siguen siendo independientes."
"Remplissage vertical des barres. \nDécoche pour les barres horizontales.": "Relleno vertical de las barras. \nDesmarca para barras horizontales."
"Bordure des barres": "Borde de las barras"
"Trait sombre 1px autour de chaque barre (HP/SP/EXP...). \nDécoche pour des barres sans contour.": "Una línea oscura de 1px alrededor de cada barra (HP/SP/EXP...). \nDesmarca para barras sin contorno."
"Texte des barres": "Texto de las barras"
"Ce qui est écrit sur les barres : rien, le pourcentage, les valeurs brutes (courant / max) ou les deux.": "Lo que se escribe en las barras: nada, el porcentaje, los valores brutos (actual / máx) o ambos."
