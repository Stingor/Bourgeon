"Portrait personnage": "Retrato del personaje"
"Afficher le portrait et les étiquettes": "Mostrar el retrato y las etiquetas"
"Portrait de statut : la tête du personnage, le pseudo, la classe et le niveau sont des éléments INDÉPENDANTS — chacun déplaçable, redimensionnable, avec sa couleur/opacité de fond, son arrondi et sa taille de texte.": "Retrato de estado: la cabeza del personaje, el apodo, la clase y el nivel son elementos INDEPENDIENTES — cada uno movible, redimensionable, con su propio color/opacidad de fondo, redondeo y tamaño de texto."
"Verrouiller le portrait": "Bloquear el retrato"
"Si les éléments sont déverrouillés et en contact les uns avec les autres, ils sont déplaçables en maintenant Ctrl.": "Si los elementos están desbloqueados y se tocan entre sí, pueden moverse manteniendo Ctrl."
"Verrouillé : les éléments ne bougent plus et laissent passer les clics au jeu.\nDéverrouillé : glisse pour déplacer, tire un bord/coin pour redimensionner (aimantage à la grille d'alignement).": "Bloqueado: los elementos ya no se mueven y dejan pasar los clics al juego.\nDesbloqueado: arrastra para mover, tira de un borde/esquina para redimensionar (con imantado a la rejilla de alineación)."
"Tête seule (sans le corps)": "Solo la cabeza (sin cuerpo)"
