"- Clic gauche : utiliser. Clic droit : description.\n- Glisser une case sur une autre : déplacer / échanger (les 3 barres\n  se répondent entre elles).\n- Glisser une case HORS des barres et relâcher : la vider. L'aperçu se\n  barre d'une croix rouge dès qu'on est en zone de retrait.\n- Clic molette sur une case : la vider aussi, sans glisser.": "- Clic izquierdo: usar. Clic derecho: descripción.\n- Arrastrar una casilla sobre otra: mover / intercambiar (las 3 barras\n  se responden entre sí).\n- Arrastrar una casilla FUERA de las barras y soltar: vaciarla. La vista previa se\n  tacha en rojo en cuanto estás en la zona de retirada.\n- Clic central en una casilla: también la vacía, sin arrastrar."
"Le jeu ne pilote qu'UN onglet au clavier à la fois.\nBourgeon route les touches vers l'autre onglet visible :\n- Touche PARTAGEE (ex. F2 sur les 2 onglets) : la case OCCUPEE répond.\n  Si les deux cases sont occupées, seul l'onglet actif répond.\n- Pour piloter l'Onglet 2 de façon dédiée, rebinde ses cases\n  sur des combos Ctrl+/Alt+ (touches uniques) dans les raccourcis clavier du jeu.\n- La barre d'items n'a pas de raccourci clavier (clic gauche = utiliser).\n- Une case NON AFFICHÉE ne répond plus à sa touche : masquer une barre,\n  ou baisser son \"Nb slots\", désarme aussi les raccourcis correspondants.": "El juego solo controla UNA pestaña desde el teclado a la vez.\nBourgeon enruta las teclas a la otra pestaña visible:\n- Tecla COMPARTIDA (p. ej. F2 en ambas pestañas): responde la casilla OCUPADA.\n  Si ambas casillas están ocupadas, solo responde la pestaña activa.\n- Para controlar la Pestaña 2 de forma dedicada, reasigna sus casillas\n  a combinaciones Ctrl+/Alt+ (teclas únicas) en los atajos de teclado del juego.\n- La barra de objetos no tiene atajo de teclado (clic izquierdo = usar).\n- Una casilla NO MOSTRADA deja de responder a su tecla: ocultar una barra,\n  o bajar su \"Número de casillas\", también desarma los atajos correspondientes."
"Disposition personnalisée": "Disposición personalizada"
"Désactivé = disposition d'origine du jeu (inchangée).": "Desactivado = la disposición original del juego (sin cambios)."
"Affiche un cadre sur la barre ; glissez-le pour la déplacer.\nLa position met à jour Marge X / Marge Y.\nSi la grille d'alignement (aimantation) est active, le cadre s'y aligne.": "Muestra un marco sobre la barra; arrástralo para mover la barra.\nLa posición actualiza Margen X / Margen Y.\nSi la rejilla de alineación (imantado) está activa, el marco se alinea con ella."
