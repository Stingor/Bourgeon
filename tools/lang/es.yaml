"Précision : comparée au FLEE de la cible pour déterminer si vous touchez.\n\nHIT = niveau de base + DEX. La part du niveau s'arrête au niveau 600 : au-delà, seule la DEX fait encore monter le HIT.": "Precisión: se compara con el FLEE del objetivo para decidir si aciertas.\n\nHIT = nivel base + DEX. La parte del nivel se detiene en el nivel 600: más allá, solo la DEX sigue subiendo el HIT."
"Esquive : comparée au HIT de la cible, réduit la probabilité d'être touché.\n\nFLEE = niveau de base + AGI. La part du niveau s'arrête au niveau 600 : au-delà, seule l'AGI fait encore monter le FLEE.": "Evasión: se compara con el HIT del objetivo, y baja la probabilidad de ser golpeado.\n\nFLEE = nivel base + AGI. La parte del nivel se detiene en el nivel 600: más allá, solo la AGI sigue subiendo el FLEE."
