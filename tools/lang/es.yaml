"Trace un rectangle à la souris, comme l'outil de capture de Windows. La zone est mémorisée : ensuite, la touche ci-dessous suffit. Une seconde touche rouvre le tracé en jeu, pour recadrer sans rouvrir ce panneau.\n\nL'image enregistrée est celle que tu vois — monde, interface native ET fenêtres Bourgeon. Le cadre et le témoin, eux, sont dessinés en dehors de la zone : ils n'apparaissent jamais dans le GIF.\n\nUn second appui sur la touche arrête avant la fin.": "Traza un rectángulo con el ratón, como la herramienta de recorte de Windows. La zona se recuerda: después basta con la tecla de abajo. Una segunda tecla reabre el trazado en el juego, para reencuadrar sin volver a abrir este panel.\n\nLa imagen grabada es la que ves — mundo, interfaz nativa Y ventanas de Bourgeon. El marco y el indicador, en cambio, se dibujan fuera de la zona: nunca aparecen en el GIF.\n\nPulsar la tecla por segunda vez detiene antes del final."
"Tracé en cours à l'écran…": "Trazando en pantalla…"
"Réglages": "Ajustes"
"La zone est réduite à cette largeur (proportions gardées) avant d'entrer dans le GIF. C'est le réglage qui pèse le plus lourd : la mémoire et la taille du fichier montent avec le CARRÉ de la largeur.": "La zona se reduce a esta anchura (se mantienen las proporciones) antes de entrar en el GIF. Es el ajuste que más pesa: la memoria y el tamaño del archivo crecen con el CUADRADO de la anchura."
"Le temps de refermer ce panneau et de te placer avant que ça tourne.": "El tiempo justo para cerrar este panel y colocarte antes de que corra."
