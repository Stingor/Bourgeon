"Fige le cadre et laisse passer les clics vers le jeu.\n\nMaintenir MAJ, CURSEUR SUR LA GRILLE, la déverrouille le temps d'un déplacement : pas besoin de revenir décocher ici.\n\nAilleurs à l'écran, MAJ garde son rôle habituel (attaque forcée) — la grille ne reprend la souris que sous le curseur.": "Fija el marco y deja pasar los clics al juego.\n\nMantener MAYÚS CON EL CURSOR SOBRE LA CUADRÍCULA lo desbloquea el tiempo de moverlo: no hace falta volver a desmarcar aquí.\n\nEn el resto de la pantalla, MAYÚS conserva su papel habitual (ataque forzado): la cuadrícula solo toma el ratón bajo el cursor."
"La taille du cadre se DÉDUIT de ces valeurs : c'est la tuile qui commande.\n\nTirer le cadre par sa poignée n'agit donc pas sur sa taille mais sur le nombre de COLONNES : l'élargir en ajoute, le rétrécir en retire. La hauteur, elle, suit le nombre de membres.": "El tamaño del marco se DEDUCE de estos valores: manda la casilla.\n\nArrastrar el marco por su tirador no lo redimensiona, sino que cambia el número de COLUMNAS: ensancharlo añade, estrecharlo quita. La altura sigue al número de miembros."
"Rien": "Nada"
"Chiffres et pourcentage": "Cifras y porcentaje"
"Chiffres": "Cifras"
"Points de vie": "Puntos de vida"
"Indépendante de la police des fenêtres : une grille se lit en périphérie de l'écran, pas de face.": "Independiente de la fuente de las ventanas: una cuadrícula se lee de reojo, no de frente."
"Infobulle au survol": "Información al pasar el cursor"
"Clic gauche : cibler le membre": "Clic izquierdo: seleccionar al miembro"
"Buffs et debuffs": "Buffs y debuffs"
"Pétrifié": "Petrificado"
"Étourdi": "Aturdido"
"Endormi": "Dormido"
"Pétrification": "Petrificándose"
"En feu": "En llamas"
"Emprisonné": "Aprisionado"
"Empoisonné": "Envenenado"
"Maudit": "Maldito"
"Silence": "Silenciado"
"Confus": "Confundido"
"Aveuglé": "Cegado"
"Saignement": "Sangrado"
"Poison mortel": "Veneno mortal"
"Terrifié": "Aterrorizado"
"Lignes d'icônes": "Filas de iconos"
"Une rangée unique s'allonge jusqu'à manger la place du nom ; en deux lignes, le même nombre d'états tient sur moitié moins de largeur.\n\nLe compte maximum se répartit entre les lignes — six icônes sur deux lignes font trois par ligne.": "Una sola fila se alarga hasta comerse el sitio del nombre; en dos filas, el mismo número de estados cabe en la mitad del ancho.\n\nLa cantidad máxima se reparte entre las filas: seis iconos en dos filas dan tres por fila."
"La barre se replie déjà sur sa largeur : ce réglage force en plus un nombre fixe par rangée, pour une barre haute et étroite plutôt que longue et plate.": "La barra ya se pliega según su ancho: este ajuste fuerza además un número fijo por fila, para una barra alta y estrecha en vez de larga y plana."
"Temps restant sous l'icône": "Tiempo restante bajo el icono"
"La case s'assombrit à mesure que l'état s'écoule.\n\n⚠ La durée d'origine n'est portée par AUCUN paquet : elle est exacte quand on a vu l'état commencer, et repart de « plein » quand on le découvre en route.": "La casilla se oscurece a medida que el estado transcurre.\n\n⚠ La duración original NO la lleva ningún paquete: es exacta cuando se vio empezar el estado, y arranca de « lleno » cuando se descubre a mitad."
"États de la cible": "Estados del objetivo"
"Afficher la barre": "Mostrar la barra"
"Écoulement": "Transcurso"
"Grisage de la case": "Sombreado de la casilla"
"Balayage horaire": "Barrido horario"
"Voile descendant": "Velo descendente"
"Voile": "Velo"
"La case s'assombrit à mesure que l'état s'écoule : on voit lesquels vont tomber sans lire un seul nombre.\n\n⚠ La durée d'origine n'est PORTÉE PAR AUCUN paquet. Elle est exacte quand on a vu l'état commencer ; découvert en route, il repart de « plein » et décroît ensuite au bon rythme.\n\nUn état permanent n'est jamais grisé : il n'a pas de part écoulée.": "La casilla se oscurece a medida que el estado transcurre: ves cuáles van a caer sin leer ni un número.\n\n⚠ La duración original NO la lleva ningún paquete. Es exacta cuando se vio empezar el estado; descubierto a mitad, arranca de « lleno » y luego decrece al ritmo correcto.\n\nUn estado permanente nunca se sombrea: no tiene parte transcurrida."
"État": "Estado"
"Sans durée": "Sin duración"
"Liseré": "Borde"
"Nombre au plus": "Cantidad máxima"
"Rangement": "Ordenación"
"Ordre d'arrivée": "Orden de llegada"
"Bientôt fini d'abord": "Los que acaban antes primero"
"Compte à rebours": "Cuenta atrás"
"Écart": "Separación"
"Une barre à elle, qu'on place et dimensionne où l'on veut : les états de la cible ne se regardent pas au même endroit que ses points de vie.\n\nElle suit le CIBLAGE : mode éteint, pas de barre.\n\n⚠ Ne montre RIEN sur un joueur qui n'est pas de votre groupe : ses états sont une information de jeu, et le serveur ne les donne pas. Les monstres, eux, sont lisibles.": "Una barra propia, que se coloca y dimensiona donde quieras: los estados del objetivo no se miran en el mismo sitio que sus puntos de vida.\n\nSigue la SELECCIÓN: modo apagado, sin barra.\n\n⚠ No muestra NADA sobre un jugador que no esté en tu party: sus estados son información de juego y el servidor no los da. Los monstruos, en cambio, sí se leen."
"Fige la barre et laisse passer les clics vers le jeu.\n\nMaintenir MAJ, CURSEUR SUR LA BARRE, la déverrouille le temps d'un déplacement. Ailleurs à l'écran, MAJ garde son rôle habituel (attaque forcée).\n\n⚠ Une barre VIDE est invisible : déverrouillez-la pour la placer quand la cible n'a aucun état.": "Fija la barra y deja pasar los clics al juego.\n\nMantener MAYÚS, CON EL CURSOR SOBRE LA BARRA, la desbloquea durante un movimiento. En el resto de la pantalla, MAYÚS conserva su papel habitual (ataque forzado).\n\n⚠ Una barra VACÍA es invisible: desbloquéala para colocarla cuando el objetivo no tenga ningún estado."
"Au-delà, les états en trop sont écartés — ce sont les DERNIERS du rangement ci-dessous, qui décide donc de ce qu'on perd.": "Más allá, los estados sobrantes se descartan: son los ÚLTIMOS de la ordenación de abajo, que decide por tanto lo que se pierde."
"« Bientôt fini d'abord » met en tête ce qu'il faudra relancer, ou ce qu'il suffit d'attendre.\n\nUn état SANS durée (permanent) n'a pas sa place dans un tri par durée : il va en fin dans les deux sens, pour ne pas chasser de l'écran ce qui presse.": "« Los que acaban antes primero » pone delante lo que habrá que relanzar, o lo que basta con esperar.\n\nUn estado SIN duración (permanente) no tiene sitio en una ordenación por duración: va al final en ambos sentidos, para no expulsar de la pantalla lo que urge."
"Sous chaque icône. Un état permanent n'en porte pas : un « 0 » sous un buff qui ne finit jamais le ferait croire terminé.": "Bajo cada icono. Un estado permanente no lo lleva: un « 0 » bajo un buff que nunca acaba lo haría parecer terminado."
"Sans fond, des icônes sombres sur une carte sombre se confondent avec le décor.": "Sin fondo, los iconos oscuros sobre un mapa oscuro se confunden con el decorado."
"Icônes au plus": "Iconos como máximo"
"Les icônes d'état du membre, à gauche de sa pastille.\n\n⚠ Une ligne SANS icône ne veut pas dire « aucun buff ». Le serveur ne diffuse ces états qu'aux joueurs qui VOIENT le personnage, et seulement au moment où ils COMMENCENT : un joueur déjà béni quand il entre à l'écran arrive sans rien.\n\nCe qui s'affiche ici est donc ce qui est TOMBÉ sous vos yeux, pas l'état complet du personnage.": "Los iconos de estado del miembro, a la izquierda de su distintivo.\n\n⚠ Una fila SIN icono no significa « sin buff ». El servidor solo difunde estos estados a los jugadores que VEN al personaje, y solo cuando EMPIEZAN: un jugador ya bendecido cuando entra en pantalla aparece sin nada.\n\nLo que ves aquí es por tanto lo que CAYÓ ante tus ojos, no el estado completo del personaje."
"Les icônes d'état du membre, calées à droite de sa tuile. Le nom se découpe sur ce qu'elles laissent.\n\n⚠ Une tuile SANS icône ne veut pas dire « aucun buff ». Le serveur ne diffuse ces états qu'aux joueurs qui VOIENT le personnage, et seulement au moment où ils COMMENCENT : un joueur déjà béni quand il entre à l'écran arrive sans rien.\n\nCe qui s'affiche ici est donc ce qui est TOMBÉ sous vos yeux, pas l'état complet du personnage.": "Los iconos de estado del miembro, alineados a la derecha de su casilla. El nombre se recorta con lo que dejan.\n\n⚠ Una casilla SIN icono no significa « sin buff ». El servidor solo difunde estos estados a los jugadores que VEN al personaje, y solo cuando EMPIEZAN: un jugador ya bendecido cuando entra en pantalla aparece sin nada.\n\nLo que ves aquí es por tanto lo que CAYÓ ante tus ojos, no el estado completo del personaje."
"Comme une tuile du HUD en grille : la ligne devient une cible cliquable, et un liseré blanc marque la cible courante.\n\nSans effet sur un membre hors ligne ou hors de portée — ses PV et sa position viennent de son sprite, et il n'y en a pas.\n\nDemande le mode Ciblage, qui a son propre panneau : c'est lui qui décide qu'une cible existe.": "Como una casilla del HUD en cuadrícula: la fila se vuelve un objetivo pulsable, y un borde blanco marca el objetivo actual.\n\nSin efecto sobre un miembro desconectado o fuera de alcance: sus PV y su posición vienen de su sprite, y no lo hay.\n\nRequiere el modo Selección, que tiene su propio panel: es él quien decide que existe un objetivo."
"Le texte d'une tuile est DÉCOUPÉ à ses bords : sur une grille serrée, il ne reste parfois que les premières lettres d'un nom. L'infobulle le redonne en entier, avec la classe, la carte et les PV/SP chiffrés.": "El texto de una casilla se RECORTA en sus bordes: en una cuadrícula apretada, a veces solo quedan las primeras letras de un nombre. La información emergente lo devuelve entero, con la clase, el mapa y las cifras de PV/SP."
"Interaction": "Interacción"
"Lancer les sorts de soutien sur la tuile survolée": "Lanzar hechizos de apoyo sobre la casilla bajo el cursor"
"Une compétence de soutien (soin, buff) part sur le membre dont la tuile est sous le curseur : la touche arme, la tuile désigne. Le liseré blanc montre qui sera visé.\n\nLa grille ne prend PAS le clic : marcher et frapper restent possibles curseur dessus.\n\nLes sorts d'ATTAQUE ne sont jamais concernés — viser un allié relève du PVP, que le jeu réserve au clic manuel.": "Una habilidad de apoyo (curación, mejora) se lanza sobre el miembro cuya casilla está bajo el cursor: la tecla la prepara, la casilla elige el objetivo. El borde blanco muestra a quién.\n\nLa cuadrícula NO toma el clic: andar y atacar siguen siendo posibles con el cursor encima.\n\nLas habilidades de ATAQUE nunca se ven afectadas: apuntar a un aliado es PVP, que el juego reserva al clic manual."
"(éteint)": "(apagado)"
"Cliquer les tuiles (cibler, menu du groupe)": "Clicar las casillas (fijar objetivo, menú de grupo)"
"Clic gauche : cibler le membre, comme un clic sur son personnage — sans effet si le mode Ciblage est éteint.\nClic droit : le menu du personnage, celui de son sprite. Sur un membre qu'aucun sprite ne représente, un menu de repli propose ce qui voyage par nom : chuchoter, expulser.\n\n⚠ La grille PREND alors la souris sur toute sa surface : impossible de marcher ou de frapper en cliquant dessous. C'est le prix des gestes sur les tuiles — décoché, la grille se contente d'afficher et laisse tout passer.": "Clic izquierdo: seleccionar al miembro, como al pulsar su personaje; sin efecto si el modo Selección está apagado.\nClic derecho: el menú del personaje, el de su sprite. Sobre un miembro que ningún sprite representa, un menú de reserva ofrece lo que viaja por nombre: susurrar, expulsar.\n\n⚠ La cuadrícula ENTONCES toma el ratón en toda su superficie: no podrás caminar ni golpear pulsando debajo. Es el precio de los gestos sobre las casillas: sin marcar, la cuadrícula solo muestra y deja pasar todo."
"Texte — hors de portée": "Texto — fuera de alcance"
"Le membre est EN JEU, simplement trop loin pour que le client connaisse ses PV : il peut revenir à portée d'un instant à l'autre. À ne pas confondre avec un membre déconnecté.": "El miembro está EN JUEGO, solo demasiado lejos para que el cliente conozca sus PV: puede volver a estar a alcance en cualquier momento. No confundir con un miembro desconectado."
"Texte — hors ligne": "Texto — sin conexión"
"Réglages Groupe / Amis": "Ajustes de Grupo / Amigos"
"Cibler": "Fijar objetivo"
"Ajouter à mes amis": "Añadir a mis amigos"
"Contenu d'une ligne": "Contenido de una fila"
"L'art du client, à gauche du nom. Éteinte, la ligne se resserre — utile sur une fenêtre étroite.": "El arte del propio cliente, a la izquierda del nombre. Apagado, la fila se estrecha: útil en una ventana angosta."
"Niveau devant le nom": "Nivel delante del nombre"
"Barre de vie": "Barra de vida"
"Le SP d'un autre joueur ne circule dans AUCUN paquet du jeu : il est demandé au serveur, membre par membre. Il n'apparaît donc que pour ceux qui sont à portée de vue, et coûte un peu de réseau — d'où le défaut éteint.": "El SP de otro jugador no viaja en NINGÚN paquete del juego: se pide al servidor, miembro a miembro. Por eso solo aparece para quienes están a la vista, y cuesta algo de red: de ahí que venga apagado."
"Nom complet": "Nombre completo"
"Nom court": "Nombre corto"
"Masquée": "Oculto"
"Le client écrit « Gonryun, the Hermit Land (Kunlun) » là où « Gonryun » suffit à se repérer — et le nom complet pousse le reste de la ligne hors d'une fenêtre étroite.\n\nMasquée, la ligne ne porte plus que le nom. L'infobulle au survol continue de donner la carte entière.": "El cliente escribe « Gonryun, the Hermit Land (Kunlun) » donde « Gonryun » basta para orientarse, y el nombre completo empuja el resto de la fila fuera de una ventana estrecha.\n\nOculto, la fila solo lleva el nombre. La información al pasar el ratón sigue dando el mapa entero."
"Au survol d'une ligne : la classe, la carte complète, la position et les PV/SP chiffrés — ce qui ne tient pas dans la ligne.": "Al pasar el cursor por una fila: la clase, el mapa completo, la posición y las cifras de PV/SP: lo que no cabe en la fila."
"Densité": "Densidad"
"Jauges collées l'une sous l'autre": "Barras pegadas una debajo de otra"
"Jauges": "Barras"
"Taille de l'icône": "Tamaño del icono"
"Espace entre les lignes": "Espacio entre filas"
"À zéro, les lignes se touchent : c'est le réglage qui gagne le plus de hauteur sur un groupe nombreux.": "A cero las filas se tocan: es el ajuste que más altura ahorra en un grupo numeroso."
"Largeur des jauges": "Anchura de las barras"
"Hauteur d'une jauge": "Altura de una barra"
"PV au-dessus, SP juste dessous, sans rien entre les deux.\n\nLe texte passe alors DANS les jauges : à côté, il pousserait la seconde d'une hauteur de ligne et elles ne seraient plus collées.": "PV arriba, SP justo debajo, sin nada entre medias.\n\nEl texto pasa entonces DENTRO de las barras: al lado empujaría la segunda una altura de línea y ya no estarían pegadas."
"Texte dans les jauges": "Texto dentro de las barras"
"Centré sur la jauge, avec une ombre pour rester lisible sur le vert comme sur le fond. La ligne ne s'allonge pas — mais il faut une jauge assez haute.": "Centrado en la barra, con sombra para seguir siendo legible tanto sobre el verde como sobre el fondo. La fila no se alarga, pero la barra debe ser bastante alta."
"Taille du texte des jauges": "Tamaño del texto de las barras"
"À zéro, celle de l'interface.": "A cero, el de la interfaz."
"Texte du SP": "Texto del SP"
"Texte des PV": "Texto de los PV"
"Détacher : Échap referme la fenêtre": "Soltar: Escape vuelve a cerrar la ventana"
"Épingler : Échap ne ferme plus": "Fijar: Escape ya no la cierra"

# Commandes de chat interceptees (features/systems/chat_commands.cc) :
# la reponse donnee au joueur qui tape une commande qui n'existe pas ici.
"Pas d'auto-attaque sur ce serveur, ici il faut jouer soi-même.": "En este servidor no hay auto-ataque: aquí se juega en persona."
"La Warp Agent est là pour vous servir.": "La Warp Agent está aquí para servirte."
"Recherche de PNJ, de monstre ou de carte : c'est la fenêtre Navigation.": "Buscar un NPC, un monstruo o un mapa: esa es la ventana Navegación."
"Ramassage automatique : @autoloot, @autolootitem <objet>, @autoloottype <type>. Pour savoir qui lâche quoi : @whodrops <objet>, ou la fiche du monstre.": "Recogida automática: @autoloot, @autolootitem <objeto>, @autoloottype <tipo>. Para saber quién suelta qué: @whodrops <objeto>, o la ficha del monstruo."

# --- Decor de l'ecran de connexion (session spectateur) ---
"Affiche une ville du serveur en direct derrière cet écran, tirée au hasard à chaque connexion. Décoche si ta machine ou ta connexion préfèrent s'en passer.": "Muestra en directo una ciudad del servidor detrás de esta pantalla, elegida al azar en cada conexión. Desmárcala si tu equipo o tu conexión prefieren prescindir de ella."
"Chargement du monde…": "Cargando el mundo..."
"Connexion en cours…": "Conectando..."
"Connexion…": "Conectando..."
"Décor de connexion abandonné : pas de session (serveur injoignable, ou session refusée).": "Fondo de acceso descartado: sin sesión (servidor inaccesible o sesión rechazada)."
"Décor en place.": "Fondo listo."
"Fermeture de la session…": "Cerrando la sesión..."
"La fenêtre de connexion n'est jamais apparue.": "La ventana de acceso nunca apareció."
"Le choix de connexion n'a pas été franchi.": "No se superó la selección de conexión."
"Le monde ne s'est pas chargé.": "El mundo no se cargó."
"Ouverture de la session spectateur…": "Abriendo la sesión de espectador..."
"Pas de réponse du serveur de personnages.": "Sin respuesta del servidor de personajes."
"Retour à l'écran de connexion…": "Volviendo a la pantalla de acceso..."
"Session spectateur fermée.": "Sesión de espectador cerrada."
"Ce compte est réservé au décor de l'écran de connexion.": "Esta cuenta está reservada al fondo de la pantalla de conexión."
"Session spectateur refusée par le serveur.": "Sesión de espectador rechazada por el servidor."
"Sortie du décor : le client n'a pas suivi.": "Salida del fondo: el cliente no siguió."
"Sortie refusée : aucun mode actif.": "Salida rechazada: ningún modo activo."
"Ville en fond": "Ciudad de fondo"
"Changer de vue": "Cambiar la vista"
"Tire une autre ville. Le lieu est choisi par le serveur à l'ouverture d'une session : en changer demande d'en rouvrir une, ce qui prend un instant.": "Elige otra ciudad. El lugar lo decide el servidor al abrir una sesión, así que cambiarlo implica abrir otra, lo que lleva un momento."

# Raccourcis entre les trois fenêtres d'objets (barre de titre).
"Raccourcis vers les autres fenêtres": "Accesos a las otras ventanas"
"Ouvrir cette fenêtre": "Abrir esta ventana"
"Refermer cette fenêtre": "Cerrar esta ventana"
"L'entrepôt répond encore à la demande précédente.": "El almacén aún responde a la petición anterior."
"Ajoute dans la barre de titre deux boutons vers les autres fenêtres d'objets — inventaire, chariot, entrepôt — pour les ouvrir et les refermer sans quitter celle-ci.\nLe bouton « Storage » DEMANDE l'entrepôt au serveur, comme @storage : il le refuse si votre compte n'en a pas le droit, si vous échangez, ou si l'entrepôt de guilde est ouvert.\nLe réglage est propre à chaque fenêtre.": "Añade en la barra de título dos botones hacia las otras ventanas de objetos — inventario, carro, almacén — para abrirlas y cerrarlas sin salir de esta.\nEl botón \"Storage\" PIDE el almacén al servidor, como @storage: lo rechaza si tu cuenta no tiene el permiso, si estás intercambiando, o si el almacén de gremio está abierto.\nEl ajuste es propio de cada ventana."
"Ce personnage ne pousse pas de chariot.": "Este personaje no lleva carro."
"saisi": "escrito"
"tombe": "tumba"
"tué": "matado"
"miroir": "espejo"
