# en: The anvil is NOT a material: it enters no recipe and is never consumed. The server only checks that you carry one (pc_search_inventory) and adds to the success rate:\n\n  Emperium Anvil  +10 %\n  Golden Anvil    +5 %\n  Oridecon Anvil  +2.5 %\n  Anvil           +0 %\n\nOnly the BEST one counts (a chain of « else if » server-side): stacking several brings nothing more.
"L'enclume n'est PAS un matériau : elle n'entre dans aucune recette et n'est jamais consommée. Le serveur vérifie seulement que tu en portes une (pc_search_inventory) et ajoute au taux de réussite :\n\n  Emperium Anvil  +10 %\n  Golden Anvil    +5 %\n  Oridecon Anvil  +2,5 %\n  Anvil           +0 %\n\nSeule la MEILLEURE compte (chaîne de « else if » côté serveur) : en cumuler plusieurs n'apporte rien de plus.": ""
