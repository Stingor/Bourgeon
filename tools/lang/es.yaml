# en: An effect id with no entry in the client's jump table (0x00bc2e04)\nfalls through to a DEFAULT `mov al,1 ; ret`: the node is created and ticked, but\nNEVER draws anything — natively understood, and without any error.\nThis is not a missing resource: it is code that does not exist.\nThe state is READ from the client's table, not copied from a list.
"Un effect id sans entrée dans la table de saut du client (0x00bc2e04)\ntombe sur un DEFAULT `mov al,1 ; ret` : le nœud est créé et tické, mais\nne dessine JAMAIS rien — nativement compris, et sans aucune erreur.\nCe n'est pas une ressource absente : c'est du code qui n'existe pas.\nL'état est LU dans la table du client, pas recopié d'une liste.": ""
