? "Raccourcis storage\n\n- Clic gauche sur un item : retrait (Maj = tout le stack ; 1 seul = direct ;\n  pile = menu contextuel : Vers l'inventaire 1 / tout / quantité)\n- Ctrl + clic gauche : (dé)marquer l'item comme favori (onglet Favoris)\n- Clic droit : menu contextuel (dont Ajouter / Retirer des favoris)\n- Ctrl + clic droit : description\n- Alt / Maj + clic droit : retrait rapide du stack complet vers l'inventaire\n- Glisser un item du viewer -> inventaire : retrait ; -> cart : storage vers cart\n- Glisser un item d'inventaire / cart sur le viewer : dépôt / cart vers storage\n- Glisser un item sur l'onglet Favoris : l'y ajoute ; sur un autre onglet : l'en retire\n- Entrée : valide la quantité (défaut = stack entier)\n- Survol d'un item : description (si activé dans Interface > Storage)\n- Clic sur un en-tête de colonne : tri ; combo Sous-type : filtre fin\n  (onglets de catégorie et sous-type : désactivables dans les options)\n- Glisser un en-tête de colonne : la déplacer (ordre retenu ; clic droit\n  sur un en-tête pour remettre l'ordre d'origine)\n- Colonnes, filtre et survol : Moonlight > Interface de jeu > Storage\n- Onglets de storage (option) : bascule vers un entrepôt alternatif\n- Clic droit sur un onglet de storage : le renommer / lui donner une icône\n- Glisser un item sur un onglet de storage : lui assigner SON icône\n- Bouton Quitter / X : ferme le storage"
: "Atajos del storage\n\n- Clic izquierdo en un objeto: retirar (Shift = todo el montón; uno solo = directo;\n  un montón = menú contextual: Al inventario 1 / todo / cantidad)\n- Ctrl + clic izquierdo: (des)marcar el objeto como favorito (pestaña Favoritos)\n- Clic derecho: menú contextual (incluido Añadir a / Quitar de favoritos)\n- Ctrl + clic derecho: descripción\n- Alt / Shift + clic derecho: retirada rápida de todo el montón al inventario\n- Arrastrar un objeto del visor -> inventario: retirada; -> cart: del storage al cart\n- Arrastrar un objeto del inventario / cart al visor: depósito / del cart al storage\n- Arrastrar un objeto a la pestaña Favoritos: lo añade ahí; a otra pestaña: lo quita\n- Intro: confirma la cantidad (por defecto = todo el montón)\n- Pasar el ratón por un objeto: descripción (si está activado en Interfaz > Storage)\n- Clic en un encabezado de columna: ordenar; combo Subtipo: filtrado fino\n  (pestañas de categoría y subtipo: se pueden desactivar en las opciones)\n- Arrastrar un encabezado de columna: moverla (el orden se conserva; clic derecho\n  en un encabezado para restablecer el orden original)\n- Columnas, filtro y ratón encima: Moonlight > Interfaz de juego > Storage\n- Pestañas de storage (opción): cambia a un storage alternativo\n- Clic derecho en una pestaña de storage: renombrarla / darle un icono\n- Arrastrar un objeto a una pestaña de storage: asignarle SU icono\n- Botón Salir / X: cierra el storage"
