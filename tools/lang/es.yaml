"Ce que tu veux VOIR. Décocher ne rend pas la barre du client : le remplacement reste global, seule la barre affichée disparaît.": "Lo que quieres VER. Desmarcar no devuelve la barra del cliente: el reemplazo sigue siendo global, solo desaparece la barra mostrada."
"La barre du client fait 60×6 pixels, sans nom de compétence ni durée. Elle n'est pas détruite mais masquée : c'est son horloge qui alimente celle-ci.": "La barra del cliente mide 60×6 píxeles, sin nombre de habilidad ni duración. No se destruye sino que se oculta: su reloj es lo que alimenta esta."
"Masquer la mienne au-dessus de ma tête": "Ocultar la mía sobre mi cabeza"
