"Ajoute au menu les actions et les identifiants réservés au staff, dont « Propriétés… » — tout ce que le client sait d'une entité.\nCoché, le menu s'ouvre alors sur TOUTES les entités sans attendre le réglage du dessus : monstres, NPC, unités de compétence, objets au sol. C'est justement sur les cibles inattendues qu'un inspecteur sert.\nCertaines entrées exigent en plus que l'AID du compte figure dans le clientinfo.xml du client : elles n'apparaissent que dans ce cas.": "Añade al menú las acciones y los identificadores reservados al staff, entre ellos \"Propiedades…\" — todo lo que el cliente sabe de una entidad.\nMarcado, el menú se abre entonces sobre TODAS las entidades sin esperar al ajuste de arriba: monstruos, NPC, unidades de habilidad, objetos del suelo. Es justo en los objetivos inesperados donde sirve un inspector.\nAlgunas entradas exigen además que el AID de la cuenta figure en el clientinfo.xml del cliente: solo aparecen en ese caso."
