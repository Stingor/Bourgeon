"Choisissez un objet à gauche.\n\nClic gauche : suivre l'objet dans l'Atlas.\nClic droit : ouvrir sa description.\nMaj + clic : poser son lien dans le chat.": "Elige un objeto a la izquierda.\n\nClic izquierdo: seguir el objeto en el Atlas.\nClic derecho: abrir su descripción.\nMayús + clic: poner su enlace en el chat."
