# en: Launch DOOM (1993) inside Ragnarok
"Lancer DOOM (1993) dans Ragnarok": ""
# en: The real DOOM (embedded doomgeneric engine), rendered in a window over the game.\n\nRequires doom1.wad (shareware) next to the client exe.\nClick the DOOM window to capture the keyboard: ZQSD (AZERTY), WASD or arrows to move, Ctrl to fire, Space/E to open, Shift to run, Esc for the menu.\nUnticking = pause. Quitting from the DOOM menu = final until the client restarts.
"Le vrai DOOM (moteur doomgeneric embarqué), rendu dans une fenêtre par-dessus le jeu.\n\nNécessite doom1.wad (shareware) à côté de l'exe du client.\nClique la fenêtre DOOM pour capturer le clavier : ZQSD (AZERTY), WASD ou flèches pour bouger, Ctrl tirer, Espace/E ouvrir, Shift courir, Échap menu.\nDécocher = pause. Quitter depuis le menu DOOM = définitif jusqu'au redémarrage du client.": ""
