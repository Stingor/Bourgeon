# Diagnostic du personnage (Staff Tools) — ficha técnica del personaje jugado
"Diagnostic du personnage": "Diagnóstico del personaje"
"Ouvrir la fiche technique": "Abrir la ficha técnica"
"Toutes les stats du personnage joué TELLES QUE LE CLIENT LES CONNAÎT, y compris les valeurs techniques que l'interface du jeu ne montre jamais : le délai d'attaque en millisecondes (amotion) derrière l'ASPD, le recul encaissé (dmotion) lu sur les paquets de coups, la vitesse de déplacement, et la cadence réelle du .act en train d'être joué.\n\nSous déguisement, elle montre le sprite RÉELLEMENT joué et la durée que ses animations donnent à l'attaque — c'est-à-dire ce que le personnage subit à l'écran, pas ce que la classe laisserait croire.": "Todas las estadísticas del personaje jugado TAL COMO LAS CONOCE EL CLIENTE, incluidos los valores técnicos que la interfaz del juego nunca muestra: el retardo de ataque en milisegundos (amotion) detrás del ASPD, el retroceso sufrido (dmotion) leído en los paquetes de golpe, la velocidad de desplazamiento y la cadencia real del .act que se está reproduciendo.\n\nBajo un disfraz muestra el sprite REALMENTE reproducido y la duración que sus animaciones dan al ataque, es decir, lo que el personaje sufre en pantalla y no lo que la clase daría a entender."
