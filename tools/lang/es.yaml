# en: Schedules this character's deletion.\n- They are NOT deleted right away: a server delay runs first\n  (the character stays and is marked « Deletion scheduled »).\n- During that delay you can CANCEL (« Cancel deletion » button).\n- Once the delay is over, « Delete » finalises it — IRREVERSIBLE.\n- Impossible if the character is in a GUILD or a PARTY: the server\n  refuses, leave them first.
"Planifie la suppression de ce personnage.\n- Il n'est PAS supprimé tout de suite : un délai serveur s'écoule d'abord\n  (le perso reste et se marque « Suppression programmée »).\n- Pendant ce délai tu peux ANNULER (bouton « Annuler suppression »).\n- Le délai écoulé, « Supprimer » finalise — IRRÉVERSIBLE.\n- Impossible si le perso est dans une GUILDE ou un GROUPE : le serveur\n  refuse, quitte-les d'abord.": ""
# en: Cancels the scheduled deletion: the character is kept.
