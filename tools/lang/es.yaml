"Ce qu'il vous rapporte": "Lo que te aporta"
"Ce que ce monstre vous donnerait VRAIMENT, et non la valeur de la base de données affichée plus haut.\n\nLe serveur applique tout ce qui pèse sur le gain : le taux du serveur, le malus de haut niveau, vos cartes et objets qui augmentent l'EXP contre cette race ou cette classe, un Battle Manual actif, le statut VIP et un éventuel événement d'EXP.\n\nEstimation pour un monstre que vous tuez SEUL, en lui ayant infligé la totalité des dégâts. En groupe, ou en partageant les dégâts, votre part est plus petite ; certaines ZONES ont au contraire un multiplicateur d'EXP qui leur est propre.": "Lo que este monstruo te daría DE VERDAD, y no el valor de la base de datos que se muestra arriba.\n\nEl servidor aplica todo lo que influye en la ganancia: la tasa del servidor, la penalización de alto nivel, tus cartas y objetos que aumentan la EXP contra esta raza o esta clase, un Battle Manual activo, el estado VIP y un posible evento de EXP.\n\nEstimación para un monstruo que matas SOLO, habiéndole infligido todo el daño. En grupo, o compartiendo el daño, tu parte es menor; algunas ZONAS, en cambio, tienen su propio multiplicador de EXP."
