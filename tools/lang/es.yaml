# en: Area spell: cast straight under the mouse
"Sort de zone : cast direct sous la souris": ""
# en: An AREA skill (Storm Gust, traps…) fires immediately on the cell under the cursor: no more confirmation click needed.\n\nIf no valid cell is aimed at (sky, interface), the classic targeting mode stays armed. The animation, the cast bar and the send remain the game's own: the server stays in charge of the cast.
"Une compétence de ZONE (Storm Gust, pièges…) part immédiatement sur la cellule sous le curseur : plus besoin du clic de confirmation.\n\nSi aucune cellule valide n'est visée (ciel, interface), le mode ciblage classique reste armé. L'animation, la barre de cast et l'envoi restent ceux du jeu : le serveur reste maître du lancement.": ""
# en: Targeted spell: cast straight on the hovered target
"Sort ciblé : cast direct sur la cible survolée": ""
# en: A TARGETED skill fires immediately if a compatible target is under the cursor: a monster for an offensive spell; a player, a monster or yourself for a support one.\n\nWith no compatible target under the cursor (or to aim at a player in PVP/GVG), the classic targeting mode stays armed — nothing is lost.
"Une compétence CIBLÉE part immédiatement si une cible compatible est sous le curseur : monstre pour un sort offensif ; joueur, monstre ou soi-même pour un soutien.\n\nSans cible compatible sous le curseur (ou pour viser un joueur en PVP/GVG), le mode ciblage classique reste armé — rien n'est perdu.": ""
# en: Repeat period while you HOLD the key: the skill chains at this rate, following the cursor.\n\nThe game itself ignores keyboard auto-repeat — a held key casts only once. This repetition is therefore added by the plugin. A high value = one cast per press.\n\nThe skill's real COOLDOWN is respected regardless: nothing is sent while it is not ready. This setting only matters for skills WITHOUT a cooldown, whose rhythm is set by the after-cast delay — which the server never tells the client.
"Période de répétition quand tu MAINTIENS la touche : la compétence s'enchaîne à ce rythme, en suivant le curseur.\n\nLe jeu, lui, ignore l'auto-répétition du clavier — un appui maintenu ne lance qu'une fois. Cette répétition est donc ajoutée par le plugin. Valeur haute = un lancement par pression.\n\nLe COOLDOWN réel de la compétence est de toute façon respecté : tant qu'elle n'est pas prête, rien n'est envoyé. Ce réglage ne sert qu'aux compétences SANS cooldown, dont le rythme est fixé par le délai d'après-incantation — que le serveur ne communique pas au client.": ""
# en: Item: repeat while the key is held
"Objet : répéter tant que la touche est maintenue": ""
# en: An action bar slot holding an ITEM (Old Blue Box, Dead Branch, potions…) is used over and over while you keep its key pressed, instead of once per press.\n\nIt stops on its own when you release, when the slot changes, or when none are left in the bag. Clicking the slot, on the other hand, repeats nothing: a single use, as before.\n\nBeware: every repetition CONSUMES an item — including the last one.
"Une case de la barre d'action qui porte un OBJET (Old Blue Box, Dead Branch, potions…) s'utilise en boucle tant que tu gardes sa touche enfoncée, au lieu d'une fois par pression.\n\nÇa s'arrête tout seul quand tu relâches, quand la case change, ou quand il n'en reste plus en sac. Cliquer la case, en revanche, ne répète rien : une seule utilisation, comme avant.\n\nAttention : chaque répétition CONSOMME un objet — dont le dernier.": ""
# en: Item rate (ms)
"Cadence objet (ms)": ""
# en: Repeat period for items. It is SEPARATE from the skill one because the brake is not the same: here it is the server that sets the minimum between two items.\n\nFor staff, that minimum is 20 ms — the server lowers the interval to this value above group level 40, instead of the usual 325 ms. The slider therefore goes that far.\n\nBelow it, nothing goes faster: the server refuses and answers \"please wait\" in the chat. In practice, the real limit is the client's frame rate.
"Période de répétition des objets. Elle est SÉPARÉE de celle des compétences parce que ce n'est pas le même frein : ici c'est le serveur qui fixe le minimum entre deux objets.\n\nPour le staff, ce minimum est de 20 ms — le serveur descend l'intervalle à cette valeur au-dessus du niveau de groupe 40, au lieu des 325 ms habituels. Le curseur va donc jusque-là.\n\nEn dessous, rien ne va plus vite : le serveur refuse et répond « veuillez patienter » dans le chat. En pratique, la vraie limite est la fréquence d'images du client.": ""
