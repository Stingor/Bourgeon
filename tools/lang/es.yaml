"Tous les ids présents dans la capture, au format id×nombre.\nAttendu : l'id concret de l'effet spawné. Une valeur DIFFÉRENTE\nsignifie que le nœud porte un autre id que celui résolu par Lua.\n-1 = famille CEffectMgr.": "Todos los ids presentes en la captura, en formato id×cantidad.\nEsperado: el id concreto del efecto invocado. Un valor DISTINTO\nsignifica que el nodo lleva otro id que el resuelto por Lua.\n-1 = familia CEffectMgr."
