"Remplace la fiche du pet, le menu de commandes qu'elle ouvrait et la fenêtre d'évolution, en une seule fenêtre flottante — ainsi que la liste d'éclosion. Les commandes ne sont pas réécrites : elles repassent par le dispatcher du client, donc son refus « pas de nourriture en sac » reste joué. S'y ajoute ce que le client gardait pour lui : le sens de variation de la faim, le nom de l'accessoire porté, les matériaux d'évolution qu'on possède déjà, les œufs vides que le serveur refusera d'éclore, et la raison pour laquelle une action est indisponible plutôt que sa disparition.": "Sustituye la ficha de la mascota, el menú de órdenes que abría y la ventana de evolución en una sola ventana flotante, además de la lista de eclosión. Las órdenes no se reescriben: siguen pasando por el despachador del cliente, así que su rechazo « no hay comida en la bolsa » se sigue mostrando. A eso se suma lo que el cliente se guardaba: hacia dónde va el hambre, el nombre del accesorio puesto, los materiales de evolución que ya tienes, los huevos vacíos que el servidor se negará a incubar, y el motivo por el que una acción no está disponible en lugar de hacerla desaparecer."

# Outillage NPC de l'administrateur (entity_context_menu.cc) : recharger le
# fichier de script, deplacer ici, decharger + sa modale de confirmation.
"Recharger son fichier de script": "Recargar su archivo de script"
"Recharge le FICHIER d'où vient ce NPC, pas seulement lui : tous les NPC déclarés dans ce fichier sont déchargés puis relus, et leurs événements OnInit rejoués.\nLes mapflags et les monstres posés directement par le script ne sont PAS retirés — ils s'ajouteront à ceux déjà en place.\nLe serveur dit dans le chat ce qu'il a fait.": "Recarga el ARCHIVO del que viene este NPC, no solo a él: todos los NPC declarados en ese archivo se descargan y se vuelven a leer, y sus eventos OnInit se ejecutan de nuevo.\nLos mapflags y los monstruos colocados directamente por el script NO se retiran — se sumarán a los que ya están.\nEl servidor dice en el chat lo que ha hecho."
"Déplacer ici": "Mover aquí"
"Pose le NPC sur votre case. Rien n'est enregistré : il retrouvera sa position d'origine au prochain rechargement de son fichier ou du serveur.": "Coloca el NPC en tu casilla. No se guarda nada: volverá a su posición original en la próxima recarga de su archivo o del servidor."
"Décharger ce NPC…": "Descargar este NPC…"
"Retire ce NPC du monde pour TOUS les joueurs connectés, avec ses duplicates. Il faudra recharger son fichier pour le faire revenir.": "Retira este NPC del mundo para TODOS los jugadores conectados, junto con sus duplicados. Habrá que recargar su archivo para que vuelva."
"Décharger ce NPC###bourgeon_ctxmenu_confirm": "Descargar este NPC###bourgeon_ctxmenu_confirm"
"Décharger %s ?": "¿Descargar %s?"
"Il disparaît immédiatement pour TOUS les joueurs\nconnectés, avec ses duplicates. Une conversation en\ncours avec lui reste ouverte sur un NPC qui n'existe plus.": "Desaparece de inmediato para TODOS los jugadores\nconectados, junto con sus duplicados. Una conversación ya\nabierta con él sigue abierta sobre un NPC que ya no existe."
"Pour le faire revenir : clic droit sur un autre NPC du même\nfichier puis « Recharger son fichier de script », ou\n@reloadnpcfile. Rien n'est perdu sur le disque.": "Para recuperarlo: clic derecho en otro NPC del mismo\narchivo y luego \"Recargar su archivo de script\", o\n@reloadnpcfile. No se pierde nada en el disco."
"Décharger": "Descargar"
"Style du personnage": "Estilo del personaje"
"Choisissez une pièce, puis réglez sa couleur.": "Elige una pieza y ajusta su color."
"Pièce": "Pieza"
"Teinte": "Tono"
"Réinitialiser cette pièce": "Restablecer esta pieza"
"Tout réinitialiser": "Restablecer todo"
"Supprimer mon style": "Eliminar mi estilo"
"Remet l'aperçu à zéro : les huit pièces, la teinte de base, la couleur de cheveux et la coiffure. Ton personnage ne change qu'à la validation.": "Restablece la vista previa: las ocho piezas, el color base, el color de cabello y el peinado. Tu personaje solo cambia al aplicar."
"Efface ta palette, chez toi ET sur le serveur. Ton personnage retrouve l'apparence qu'il avait avant, pour toi comme pour les autres. Ce n'est PAS un retour à ta dernière couleur partagée : celle-ci est perdue.": "Borra tu paleta, en tu cliente Y en el servidor. Tu personaje recupera el aspecto que tenía antes, para ti y para los demás. NO es una vuelta a tu último color compartido: ese se pierde."
"Corps introuvable.": "Cuerpo no encontrado."
"Sprite du corps illisible.": "Sprite del cuerpo ilegible."
"Ce corps n'a pas de palette : il n'est pas recolorable.": "Este cuerpo no tiene paleta: no se puede recolorear."
"Aucun dégradé détecté sur ce corps.": "No se detectó ningún degradado en este cuerpo."
"Cette pièce porte une couleur imposée (*) : le curseur en fait tourner la teinte.": "Esta pieza tiene un color impuesto (*): el deslizador gira su tono."
"Fait tourner la teinte de la pièce en gardant sa matière. Clique sa pastille pour lui imposer une couleur exacte à la place.": "Gira el tono de la pieza conservando su material. Haz clic en su muestra para imponerle un color exacto."
"Réglable : %d%% du corps": "Ajustable: %d%% del cuerpo"
"Sprite lu sur le personnage à l'écran.": "Sprite leído del personaje en pantalla."
"Sprite déduit de la classe (moins fiable).": "Sprite deducido de la clase (menos fiable)."
"Valider et partager mon style": "Aplicar y compartir mi estilo"
"Applique ce style à ton personnage — jusqu'ici, rien n'a changé hors de cet aperçu. Les autres joueurs te verront ainsi, et ta coiffure change pour de bon.": "Aplica este estilo a tu personaje: hasta ahora no ha cambiado nada fuera de esta vista previa. Los demás jugadores te verán así, y tu peinado cambia de forma definitiva."
"Envoyé.": "Enviado."
"Préréglages": "Preajustes"
"(ombre)": "(en sombra)"
"Zone d'ombre du sprite : la clarté de cette pièce plafonne à %d %%. Les réglages gardent le modelé du dégradé, donc une pièce peinte sombre le reste — tu peux changer sa teinte, pas l'éclairer.": "Zona de sombra del sprite: el brillo de esta pieza se limita al %d%%. Los ajustes conservan el modelado del degradado, así que una pieza pintada oscura sigue oscura: puedes cambiar su tono, no iluminarla."
"Revenir à mon style": "Volver a lo actual"
"Annule tes retouches en cours et revient à ce que ton personnage porte. Ton travail reste récupérable par « Dernier style non validé ».": "Descarta tus retoques en curso y vuelve a lo que lleva tu personaje. Tu trabajo sigue siendo recuperable con \"Último estilo sin aplicar\"."
"Rien à annuler : l'aperçu montre déjà ce que ton personnage porte.": "Nada que descartar: la vista previa ya muestra lo que lleva tu personaje."
"Repartir de zéro": "Empezar de cero"
"Page blanche : les huit pièces, la teinte de base, la couleur de cheveux et la première coiffure. Ce n'est PAS un retour à ce que tu portes. Ton personnage ne change qu'à la validation.": "Página en blanco: las ocho piezas, el color base, el color de cabello y el primer peinado. NO es un regreso a lo que llevas. Tu personaje solo cambia al aplicar."
"Dernier style non validé": "Último estilo sin aplicar"
"Ce que tu composais la dernière fois sans le valider. Gardé sur cet ordinateur, pour ce personnage.": "Lo que estabas componiendo la última vez sin aplicarlo. Guardado en este ordenador, para este personaje."
"Clic : charger. Maj+clic : lien dans le chat.": "Clic: cargar. Mayús+clic: enlace en el chat."
"Cheveux": "Cabello"
"Mon style": "Mi estilo"
"coupe": "corte"
"Certains numéros n'ont pas de sprite : leur case reste vide.": "Algunos números no tienen sprite: su casilla queda vacía."
"Couleur de cheveux": "Color de cabello"
"Style": "Estilo"
"Aperçu d'un style": "Vista previa de un estilo"
"Le style de %s, sur toi.": "El estilo de %s, en ti."
"Voir ce style": "Ver este estilo"
"Essayer dans l'éditeur": "Probar en el editor"
"Charge ce style dans l'éditeur. Ton personnage ne change qu'à la validation.": "Carga este estilo en el editor. Tu personaje solo cambia al aplicar."
"Partager dans le chat": "Compartir en el chat"
"Page %d/%d": "Página %d/%d"
"Remettre tout l'aperçu à zéro ? Tes réglages en cours seront perdus.": "¿Restablecer toda la vista previa? Se perderán tus ajustes actuales."
"Supprimer ton style, chez toi ET sur le serveur ? Ton personnage retrouve son apparence d'avant, pour toi comme pour les autres. C'est définitif.": "¿Eliminar tu estilo, en tu cliente Y en el servidor? Tu personaje recupera su aspecto anterior, para ti y para los demás. Es definitivo."
"Molette : tourner": "Rueda: girar"
"Copier le code": "Copiar el código"
"Coller un code": "Pegar un código"
"Code illisible ou d'une version trop ancienne.": "Código ilegible o de una versión demasiado antigua."
"Couleurs du corps, coiffure et couleur de cheveux (Alt+P)": "Colores del cuerpo, peinado y color de cabello (Alt+P)"
"Teinte de base": "Color base"
"d'origine": "original"
"palette": "paleta"
"Les couleurs officielles du styliste servent de point de départ ; tes réglages s'appliquent par-dessus. Changer de teinte de base peut redécouper les pièces.": "Los colores oficiales del estilista sirven de punto de partida; tus ajustes se aplican encima. Cambiar el color base puede redividir las piezas."

