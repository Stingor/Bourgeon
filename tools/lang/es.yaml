# en: Poring parade (login)
"Parade de Porings (login)": ""
# en: Porings on the login screen
"Porings sur l'écran de login": ""
# en: Sets a small band of Poring-family monsters wandering across the login screen: they hop from edge to edge, pause, and startle (with a sound) if you click them.\n\nPurely cosmetic. They fade above the login panel so as not to hinder typing. Only visible on the login screen.
"Fait flâner une petite bande de monstres de la famille Poring sur l'écran de login : ils sautillent d'un bord à l'autre, font des pauses, et sursautent (avec un son) si tu cliques dessus.\n\nPurement cosmétique. Ils s'estompent au-dessus du panneau de login pour ne pas gêner la saisie. Visible uniquement à l'écran de login.": ""
# en: Open Roggle
"Ouvrir Roggle": ""
# en: Peggle-like mini-game, drawn in ImGui over the game.\n\nAim with the mouse from the cannon at the top, click to fire the ball. Clear every ORANGE peg to win; the green bucket at the bottom catching the ball = a free ball.\nClosing the window or unticking = hide (the game is kept).
"Mini-jeu façon Peggle, dessiné en ImGui par-dessus le jeu.\n\nVise à la souris depuis le canon en haut, clique pour tirer la bille. Dégomme tous les pegs ORANGE pour gagner ; le seau vert en bas rattrape la bille = bille gratuite.\nFermer la fenêtre ou décocher = masquer (la partie est conservée).": ""
# en: Open Rojeweled
"Ouvrir Rojeweled": ""
# en: A Bejeweled-style match-3 whose gems are real RO monster sprites (Poring family: Poring, Drops, Metaling, Poporing, Marin, Deviling).\n\nClick two neighbouring monsters to swap them; line up 3+ to clear them (cascades score more). DX9 required (coloured tiles otherwise).
"Match-3 façon Bejeweled dont les gemmes sont de vrais sprites de monstres RO (famille Poring : Poring, Drops, Metaling, Poporing, Marin, Deviling).\n\nClique deux monstres voisins pour les échanger ; aligne-en 3+ pour les faire disparaître (les cascades rapportent plus). DX9 requis (sinon tuiles colorées).": ""
# en: Jump with the keyboard
"Sauter au clavier": ""
# en: Press the jump key (Space by default) to make your character leap: a small parabolic arc (up, then down), purely visual.\n\nThe server sees nothing — it is a plain height offset on the sprite, reapplied every frame (you can even jump while walking). Typing that key in the chat does NOT trigger a jump.
"Appuie sur la touche de saut (Espace par défaut) pour faire bondir ton personnage : un petit arc parabolique (montée puis retombée) purement visuel.\n\nLe serveur ne voit rien — c'est un simple décalage de hauteur du sprite, ré-appliqué chaque frame (tu peux même sauter en marchant). Taper cette touche dans le chat ne déclenche PAS de saut.": ""
# en: Duration (ms)
"Durée (ms)": ""
# en: Keyboard movement (Experimental)
"Déplacement au clavier (Expérimental)": ""
# en: Walk with ZQSD / arrows
"Marcher avec ZQSD / flèches": ""
# en: Moves your character with the keyboard: Z/S to go forward and back, Q/D to go left and right (the arrows do the same). Two keys together = diagonal.\n\nNothing is simulated client-side: the plugin sends the SAME walk request as a click on the ground, so the server stays in charge of movement (walls, speed, blocks). Typing in the chat will not send your character running.\n\nBeware if you have skill shortcuts on Z, Q, S or D: they will fire as well.
"Déplace ton personnage au clavier : Z/S pour avancer et reculer, Q/D pour aller à gauche et à droite (les flèches font pareil). Deux touches ensemble = diagonale.\n\nRien n'est simulé côté client : le plugin envoie la MÊME demande de marche que le clic au sol, donc le serveur reste maître du déplacement (murs, vitesse, blocages). Taper dans le chat ne fait pas courir le personnage.\n\nAttention si tu as des raccourcis de compétence sur Z, Q, S ou D : ils se déclencheront aussi.": ""
# en: Follow the camera rotation
"Suivre la rotation de la caméra": ""
# en: \"Up\" = the top of the screen, even after rotating the camera. Unticked: directions stay those of the map.
"« Haut » = le haut de l'écran, même après avoir fait pivoter la caméra. Décoché : les directions restent celles de la carte.": ""
# en: Stop on key release
"S'arrêter au relâchement": ""
# en: Cuts the walk as soon as you release the key, instead of letting the character finish the requested path.
"Coupe la marche dès que tu lâches la touche, au lieu de laisser le personnage finir le trajet demandé.": ""
