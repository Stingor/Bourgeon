# en: ON: the client's image tiles — the tab_* set in vertical layout, tabh_* in horizontal (all/use/wea/ammo/card/fav/cash/cos/etc). Categories without art of their own reuse their family's and then carry a sigil (Am, Cs, Et).\nOFF: text tabs — a classic TabBar horizontally, the label written vertically in vertical mode.
"ON : tuiles images du client — jeu tab_* en disposition verticale, tabh_* en horizontale (all/use/wea/ammo/card/fav/cash/cos/etc). Les catégories sans art propre réutilisent celui de leur famille et portent alors un sigle (Am, Cs, Et).\nOFF : onglets texte — TabBar classique en horizontal, libellé écrit à la verticale en vertical.": ""
