"Garde-fou large par défaut (la géométrie « traînée » est LÉGITIME :\nle natif la rend en additif + dégradé d'alpha). À baisser seulement si\nun effet déborde encore : Rayon = distance sommet/ancre.": "Margen amplio por defecto (la geometría de \"estela\" es LEGÍTIMA:\nel nativo la renderiza en aditivo con un degradado de alfa). Bájalo solo si\nun efecto se sigue desbordando: Radio = distancia vértice/ancla."
