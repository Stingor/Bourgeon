"Il faut quitter votre groupe actuel avant d'accepter.": "Debes dejar tu grupo actual antes de aceptar."
"Refusé par le serveur (code %u).": "Rechazado por el servidor (código %u)."
"Vous n'êtes dans aucun groupe de chasse.": "No estás en ningún grupo de caza."
"Nom du groupe": "Nombre del grupo"
