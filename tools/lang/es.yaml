# en: A replacement for the chatbox: same channels, same filters and same send path as the client. The native window stays open alongside until the switch is complete.
"Remplacement de la chatbox : mêmes canaux, mêmes filtres et même chemin d'envoi que le client. La fenêtre native reste ouverte à côté tant que la bascule complète n'est pas faite.": ""
# en: An address posted in the chat comes from another player, and the text shown bears no necessary relation to the real destination. The confirmation shows the FULL address before opening the browser.\n\nUnticking it, a click on a link opens the browser straight away.
"Une adresse postée dans le chat vient d'un autre joueur, et le texte affiché n'a aucun rapport obligé avec la destination réelle. La confirmation montre l'adresse COMPLÈTE avant d'ouvrir le navigateur.\n\nEn la décochant, un clic sur un lien ouvre directement le navigateur.": ""
# en: Hovering an image link shows its content, without opening the browser.\n\nImages are only loaded from known hosts (Discord, imgur, the Moonlight site). That is what makes the preview safe: on those servers, whoever posted the link cannot know who looked at it. A link to any other site stays an ordinary link, to be opened yourself.
"Survoler un lien d'image en montre le contenu, sans ouvrir le navigateur.\n\nLes images ne sont chargées que depuis des hébergeurs connus (Discord, imgur, le site Moonlight). C'est ce qui rend l'aperçu sûr : sur ces serveurs-là, celui qui a posté le lien ne peut pas savoir qui l'a regardé. Un lien vers n'importe quel autre site reste un lien ordinaire, à ouvrir soi-même.": ""
# en:   Your allowed sites:
"  Vos sites autorisés :": ""
# en: Font of the conversation feed. « System » keeps the one used by the rest of the interface.\n\nThe others are Latin: a Korean character would show as a square. No effect in game, where everything is in French or in English.
"Police du fil de discussion. « Système » garde celle du reste de l'interface.\n\nLes autres sont latines : un caractère coréen y apparaîtrait en carré. Sans effet en jeu, où tout est en français ou en anglais.": ""
# en: Shows the feed's images and emotes as thumbnails.\n\nUnticked, a link stays a clickable address and an emote its « :name: » — and nothing is downloaded.
"Affiche les images et les emotes du fil sous forme de vignettes.\n\nDécoché, un lien reste une adresse cliquable et une emote son « :nom: » — et rien n'est téléchargé.": ""
# en: Thumbnail height, from 24 to 128 pixels.\n\nBeyond one line height, the line grows to hold the image: the feed stays readable, it just breathes more.
"Hauteur des vignettes, de 24 à 128 pixels.\n\nAu-delà d'une hauteur de ligne, la ligne s'agrandit pour accueillir l'image : le fil reste lisible, il s'aère.": ""
# en: Makes a button appear at the bottom of the emote grid.\n\nIt writes one GIF per emote into « emotes_export », next to the executable, under the name the Discord relay expects. To be dropped afterwards into the site's images/smilies/.\n\nStaff only, and off every session: it is a one-off operation, not a setting.
"Fait apparaître un bouton au bas de la grille d'emotes.\n\nIl écrit un GIF par emote dans « emotes_export », à côté de l'exécutable, sous le nom que le relais Discord attend. À déposer ensuite dans images/smilies/ du site.\n\nRéservé au staff, et éteint à chaque session : c'est une manipulation ponctuelle, pas un réglage.": ""
# en: Opens a separate conversation window when a player whispers you.\n\nThese are the CLIENT's settings (Alt+I, « Friend Setup »): changing them here changes them there, and the other way round.\n\nUnticked, whispers stay plain lines in the chat.
"Ouvre une fenêtre de conversation séparée quand un joueur chuchote.\n\nCe sont les réglages du CLIENT (Alt+I, « Friend Setup ») : les changer ici les change là-bas, et inversement.\n\nDécochés, les chuchotements restent de simples lignes dans le chat.": ""
# en: Ignores the channel filters and prefixes every line with the type the client passed us (t00 to t24). A line visible here but missing from a tab was set aside by a filter; a line missing even here never reached us at all.
"Ignore les filtres de canal et préfixe chaque ligne du type que le client nous a transmis (t00 à t24). Une ligne visible ici mais absente d'un onglet a été écartée par un filtre ; une ligne absente même ici n'est jamais arrivée jusqu'à nous.": ""
# en: Lines seen through the hook: %u · kept: %u · in memory: %d
"Lignes vues par le détour : %u · retenues : %u · en mémoire : %d": ""
# en: Counted PER MESSAGE TYPE — speech, combat, guild, party, whisper… — and not for the chat as a whole.\n\nThat is what stops a dungeon from wiping your conversations: a burst of damage lines only evicts damage lines, and what was said ten minutes ago stays put.\n\nThe buffer is shared by every tab — the same line shows in several at once — but each type keeps its own room in it.
"Compté PAR TYPE de message — parole, combat, guilde, groupe, chuchotement… — et non pour l'ensemble du chat.\n\nC'est ce qui empêche un donjon d'effacer vos conversations : une rafale de lignes de dégâts n'évince que des lignes de dégâts, et ce qui a été dit il y a dix minutes reste là.\n\nLe tampon est commun à tous les onglets — une même ligne s'affiche dans plusieurs à la fois — mais chaque type y garde sa place.": ""
# en: Shows the last lines of the previous session again on reconnection, preceded by a separator.\n\nBEWARE: they are written in plain text into SaveData\\bourgeon_chat_history.yaml, WHISPERS INCLUDED. On a shared machine, anyone can read them.
"Réaffiche les dernières lignes de la session précédente à la reconnexion, précédées d'un séparateur.\n\nATTENTION : elles sont écrites en clair dans SaveData\\bourgeon_chat_history.yaml, CHUCHOTEMENTS COMPRIS. Sur une machine partagée, n'importe qui peut les lire.": ""
