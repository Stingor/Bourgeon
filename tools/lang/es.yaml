"Sort de zone : cast direct sous la souris": "Hechizo de zona: lanzar directamente bajo el ratón"
"Une compétence de ZONE (Storm Gust, pièges…) part immédiatement sur la cellule sous le curseur : plus besoin du clic de confirmation.\n\nSi aucune cellule valide n'est visée (ciel, interface), le mode ciblage classique reste armé. L'animation, la barre de cast et l'envoi restent ceux du jeu : le serveur reste maître du lancement.": "Una habilidad de ZONA (Storm Gust, trampas…) sale de inmediato sobre la celda bajo el cursor: ya no hace falta el clic de confirmación.\n\nSi no se apunta a ninguna celda válida (cielo, interfaz), el modo de apuntado clásico sigue armado. La animación, la barra de lanzamiento y el envío siguen siendo los del juego: el servidor sigue al mando del lanzamiento."
"Sort ciblé : cast direct sur la cible survolée": "Hechizo con objetivo: lanzar directamente sobre el objetivo señalado"
"Une compétence CIBLÉE part immédiatement si une cible compatible est sous le curseur : monstre ou joueur pour un sort offensif ; joueur, monstre ou soi-même pour un soutien.\n\nSans cible compatible sous le curseur, le mode ciblage classique reste armé — rien n'est perdu. C'est le SERVEUR qui juge si un joueur peut être attaqué (PVP/GVG).": "Una habilidad con OBJETIVO sale de inmediato si hay un objetivo compatible bajo el cursor: un monstruo o un jugador para un hechizo ofensivo; un jugador, un monstruo o tú mismo para uno de apoyo.\n\nSin objetivo compatible bajo el cursor, el modo de apuntado clásico sigue armado — no se pierde nada. Es el servidor quien juzga si un jugador puede ser atacado (PVP/GVG)."
"Période de répétition quand tu MAINTIENS la touche : la compétence s'enchaîne à ce rythme, en suivant le curseur.\n\nLe jeu, lui, ignore l'auto-répétition du clavier — un appui maintenu ne lance qu'une fois. Cette répétition est donc ajoutée par le plugin. Valeur haute = un lancement par pression.\n\nLe COOLDOWN réel de la compétence est de toute façon respecté : tant qu'elle n'est pas prête, rien n'est envoyé. Ce réglage ne sert qu'aux compétences SANS cooldown, dont le rythme est fixé par le délai d'après-incantation — que le serveur ne communique pas au client.": "Periodo de repetición mientras MANTIENES la tecla: la habilidad se encadena a este ritmo, siguiendo al cursor.\n\nEl juego, por su parte, ignora la repetición automática del teclado — una tecla mantenida solo lanza una vez. Esta repetición la añade, pues, el plugin. Un valor alto = un lanzamiento por pulsación.\n\nEl COOLDOWN real de la habilidad se respeta de todos modos: mientras no esté lista, no se envía nada. Este ajuste solo sirve para las habilidades SIN cooldown, cuyo ritmo lo fija el retardo posterior al lanzamiento — que el servidor nunca comunica al cliente."
"Objet : répéter tant que la touche est maintenue": "Objeto: repetir mientras se mantiene la tecla"
"Une case de la barre d'action qui porte un OBJET (Old Blue Box, Dead Branch, potions…) s'utilise en boucle tant que tu gardes sa touche enfoncée, au lieu d'une fois par pression.\n\nÇa s'arrête tout seul quand tu relâches, quand la case change, ou quand il n'en reste plus en sac. Cliquer la case, en revanche, ne répète rien : une seule utilisation, comme avant.\n\nAttention : chaque répétition CONSOMME un objet — dont le dernier.": "Una casilla de la barra de acción que lleva un OBJETO (Old Blue Box, Dead Branch, pociones…) se usa en bucle mientras mantengas su tecla pulsada, en vez de una vez por pulsación.\n\nSe detiene solo al soltar, al cambiar de casilla, o cuando no queda ninguno en la bolsa. Hacer clic en la casilla, en cambio, no repite nada: un solo uso, como antes.\n\nCuidado: cada repetición CONSUME un objeto — incluido el último."
"Cadence objet (ms)": "Cadencia de objeto (ms)"
"Période de répétition des objets. Elle est SÉPARÉE de celle des compétences parce que ce n'est pas le même frein : ici c'est le serveur qui fixe le minimum entre deux objets.\n\nPour le staff, ce minimum est de 20 ms — le serveur descend l'intervalle à cette valeur au-dessus du niveau de groupe 40, au lieu des 325 ms habituels. Le curseur va donc jusque-là.\n\nEn dessous, rien ne va plus vite : le serveur refuse et répond « veuillez patienter » dans le chat. En pratique, la vraie limite est la fréquence d'images du client.": "Periodo de repetición de los objetos. Está SEPARADO del de las habilidades porque el freno no es el mismo: aquí es el servidor quien fija el mínimo entre dos objetos.\n\nPara el staff, ese mínimo es de 20 ms — el servidor baja el intervalo a este valor por encima del nivel de grupo 40, en vez de los 325 ms habituales. Por eso el deslizador llega hasta ahí.\n\nPor debajo, nada va más rápido: el servidor se niega y responde \"por favor espera\" en el chat. En la práctica, el límite real es la tasa de fotogramas del cliente."
"Aucun WAD DOOM à côté du client !": "¡Ningún WAD de DOOM junto al cliente!"
"Place un WAD dans le dossier du client (même dossier que l'exe du\njeu) : doom.wad (Doom complet), doom2.wad, tnt.wad, plutonia.wad,\nfreedoom1.wad, freedoom2.wad, chex.wad, hacx.wad ou doom1.wad\n(shareware). Puis décoche/recoche la case dans le menu.": "Coloca un WAD en la carpeta del cliente (misma carpeta que el exe\ndel juego): doom.wad (Doom completo), doom2.wad, tnt.wad, plutonia.wad,\nfreedoom1.wad, freedoom2.wad, chex.wad, hacx.wad o doom1.wad\n(shareware). Luego desmarca y vuelve a marcar la casilla en el menú."
