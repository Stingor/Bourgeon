"Coché : le radar du client est retiré, celui-ci le remplace.\nDécoché : les deux coexistent, de quoi les comparer.\n\nRetirer le radar retire aussi ses cinq boutons — la grande carte et la\ncarte du monde restent accessibles par les icônes du menu.": "Marcado: se retira el radar del cliente y este lo reemplaza.\nSin marcar: ambos conviven, para poder compararlos.\n\nQuitar el radar quita también sus cinco botones — el mapa grande y\nel mapa del mundo siguen accesibles desde los iconos del menú."
