# en: Quantity
"Quantité": ""
# en: How many crafts go off ON THEIR OWN.\n\nNot to be confused with « chain automatically », which reopens the list after each craft: at 1 with that box ticked, one craft goes off alone, the list comes back, and the next click is yours.\n\nThe server accepts NO quantity: one list = one craft (clif_menuskill_clear). « ×20 » therefore means twenty full rounds — recast, new list, new request.\n\nThe matching automatic chaining must consequently be on, otherwise no list comes back and the series stops at the first round. The window says so if the case arises.\n\nSame effect as holding Enter, but the target is a NUMBER: you can let go of the keyboard, and it stops at the requested count rather than when you think to release.
"Combien de fabrications partent TOUTES SEULES.\n\nÀ ne pas confondre avec « relancer automatiquement », qui rouvre la liste après chaque fabrication : à 1 avec cette case cochée, une fabrication part seule, la liste revient, et le clic suivant est à toi.\n\nLe serveur n'accepte AUCUNE quantité : une liste = une fabrication (clif_menuskill_clear). « ×20 » signifie donc vingt tours complets — relance, nouvelle liste, nouvelle demande.\n\nIl faut par conséquent que la relance automatique correspondante soit active, sinon aucune liste ne revient et la série s'arrête au premier tour. La fenêtre le dit si le cas se présente.\n\nMême effet qu'Entrée maintenue, mais la cible est CHIFFRÉE : on peut lâcher le clavier, et ça s'arrête au compte demandé plutôt qu'au moment où l'on pense à relâcher.": ""
# en: Series with no effect: chaining by ITEM is disabled, no new list will come back after the first craft.
"Série sans effet : la relance par OBJET est désactivée, aucune nouvelle liste ne reviendra après la première fabrication.": ""
# en: Series with no effect: automatic recasting of the skill is disabled, no new list will come back after the first craft.
