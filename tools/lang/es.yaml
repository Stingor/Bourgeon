# en: Level 15 kit: the server puts 100 % straight away, with no roll at all. Neither your stats, nor the dish aimed at, nor your cooking mastery come into play.
"Kit de niveau 15 : le serveur pose directement 100 %, sans aucun tirage. Ni vos statistiques, ni le plat visé, ni votre maîtrise culinaire n'entrent en jeu.": ""
# en: The server's computation, replayed identically:\n  12 % per kit tier above the first (the heaviest term by far)\n  - 4 % per difficulty tier of the dish\n  + base level x 20 + DEX x 20, and LUK reducing a fixed malus\n  + a roll governed by COOKING MASTERY, then a second roll of -1 to -4 %\n\nThe figure accounts for both rolls: it is the exact average of all their outcomes.\n\nMastery rises on every successful dish and falls on every failure, by a step all the larger as the dish is difficult. The game shows it nowhere: it reaches us through a packet specific to the Moonlight server.\n\nCooking is the only craft the server rates do NOT multiply, and the only one requiring no skill.
"Calcul du serveur, rejoué à l'identique :\n  12 % par palier de kit au-dessus du premier (c'est le terme qui pèse le plus)\n  - 4 % par palier de difficulté du plat\n  + base level x 20 + DEX x 20, et LUK qui réduit un malus fixe\n  + un tirage gouverné par la MAÎTRISE CULINAIRE, puis un second tirage de -1 à -4 %\n\nLe chiffre tient compte des deux tirages : c'est la moyenne exacte de toutes leurs issues.\n\nLa maîtrise monte à chaque plat réussi et redescend à chaque échec, d'un pas d'autant plus grand que le plat est difficile. Le jeu ne l'affiche nulle part : elle arrive ici par un paquet propre au serveur Moonlight.\n\nLa cuisine est la seule fabrication que les réglages serveur ne multiplient PAS, et la seule qui n'exige aucune compétence.": ""
# en: Odds: not computed (cooking mastery not sent by the server).
"Chances : non calculées (maîtrise culinaire non transmise par le serveur).": ""
# en: Odds: not computed (the kit used was not identified; its level travels in no packet and is deduced from the item consumed).
"Chances : non calculées (le kit utilisé n'a pas été identifié ; son niveau ne circule dans aucun paquet et se déduit de l'objet consommé).": ""
# en: The server's computation, replayed identically:\n  3 % per level of Pharmacy (the heaviest term)\n  + 0.5 % per level of Potion Research\n  + job level x 20 + (INT / 2) x 10 + DEX x 10 + LUK x 10\n  + the product's bonus: +20 % for red/yellow/white potions, +10 % for alcohol, a roll on its own for bottles; a MALUS for slim potions and the coating bottle\n  then multiplied by the potion_produce_rate server setting.\n\nUnlike metals and forging, there is NO base roll here: a product with no bonus (Blue Potion, Anodyne, Aloebera) has a perfectly determined chance.\n\nNot accounted for: the bonus of a Vanilmirth homunculus with Instruct (+1 % per level) and the 30 % penalty of baby classes. The figure is therefore slightly pessimistic in those two cases.
"Calcul du serveur, rejoué à l'identique :\n  3 % par niveau de Pharmacy (le terme qui pèse le plus)\n  + 0,5 % par niveau de Potion Research\n  + job level x 20 + (INT / 2) x 10 + DEX x 10 + LUK x 10\n  + bonus du produit : +20 % pour les potions rouge/jaune/blanche, +10 % pour l'alcool, un tirage seul pour les bouteilles ; MALUS pour les potions slim et la bouteille de revêtement\n  puis multiplié par le réglage serveur potion_produce_rate.\n\nContrairement aux métaux et à la forge, il n'y a PAS de tirage de base ici : un produit sans bonus (Blue Potion, Anodyne, Aloebera) a une chance parfaitement déterminée.\n\nNon pris en compte : le bonus d'un homoncule Vanilmirth avec Instruct (+1 % par niveau) et la pénalité de 30 % des classes baby. Le chiffre est donc légèrement pessimiste dans ces deux cas.": ""
# en: Odds: not computed (the recipe file does not carry the potion_produce_rate server setting, which multiplies the result).
"Chances : non calculées (le fichier de recettes ne porte pas le réglage serveur potion_produce_rate, qui multiplie le résultat).": ""
# en: The server's computation, replayed identically:\n  job level x 20 + DEX x 10 + LUK x 10\n  + the recipe skill's bonus (45 to 65 % for Iron Tempering, 35 to 55 % for Steel, 15 to 35 % for Enchanted Stone)\n  + a random roll of 0.1 to 10 %\n\nThe figure shown accounts for that roll: it is the average of its 100 possible outcomes, hence the exact probability.\n\nDEX and LUK are the EFFECTIVE values, equipment and cards included — the ones your character sheet shows.\n\nA failure consumes the materials and produces nothing.
"Calcul du serveur, rejoué à l'identique :\n  job level x 20 + DEX x 10 + LUK x 10\n  + bonus de la compétence de la recette (45 à 65 % pour Iron Tempering, 35 à 55 % pour Steel, 15 à 35 % pour Enchanted Stone)\n  + un tirage aléatoire de 0,1 à 10 %\n\nLe chiffre affiché tient compte de ce tirage : c'est la moyenne de ses 100 issues possibles, donc la probabilité exacte.\n\nDEX et LUK sont les valeurs EFFECTIVES, équipement et cartes comprises — celles que montre ta feuille de personnage.\n\nUn échec consomme les matériaux sans rien produire.": ""
# en: The server's computation, replayed identically:\n  job level x 20 + DEX x 10 + LUK x 10\n  + the weapon's level (+40 % at lv1, +20 % lv2, +10 % lv3, NOTHING at lv4)\n  + 5 % per level of your forging skill\n  + 1 % per level of Weaponry Research\n  - 25 % if an elemental stone is placed (only one counts)\n  - 15 % per Star Crumb placed\n  + the BEST anvil carried (Emperium +10, Golden +5, Oridecon +2.5)\n  + a random roll of 0.1 to 10 %\n  then multiplied by the weapon_produce_rate server setting.\n\nThe figure accounts for the roll: it is the average of its 100 outcomes, hence the exact probability. It recomputes when you change the slots below.\n\nNot accounted for: the 30 % penalty of baby classes.
"Calcul du serveur, rejoué à l'identique :\n  job level x 20 + DEX x 10 + LUK x 10\n  + niveau de l'arme (+40 % en lv1, +20 % lv2, +10 % lv3, RIEN en lv4)\n  + 5 % par niveau de ta compétence de forge\n  + 1 % par niveau de Weaponry Research\n  - 25 % si une pierre élémentaire est posée (une seule compte)\n  - 15 % par Star Crumb posé\n  + enclume la MEILLEURE portée (Emperium +10, Golden +5, Oridecon +2,5)\n  + un tirage aléatoire de 0,1 à 10 %\n  puis multiplié par le réglage serveur weapon_produce_rate.\n\nLe chiffre tient compte du tirage : c'est la moyenne de ses 100 issues, donc la probabilité exacte. Il se recalcule quand tu changes les emplacements ci-dessous.\n\nNon pris en compte : la pénalité de 30 % des classes baby.": ""
