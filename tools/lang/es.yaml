"L'envoi a échoué (chemin natif, 0x%08X).": "El envío ha fallado (ruta nativa, 0x%08X)."
"Change le log en texte sélectionnable : glisser pour sélectionner,\nCtrl+A tout prendre, Ctrl+C copier. Les couleurs et les icônes\ndisparaissent le temps de la sélection — c'est du texte nu.": "Convierte el log en texto seleccionable: arrastra para seleccionar,\nCtrl+A para tomarlo todo, Ctrl+C para copiar. Los colores y los iconos\ndesaparecen mientras dura la selección — es texto desnudo."
"Clic droit : options du log de « %s »\nGlisser : vers une autre fenêtre, ou dehors\nClic molette : fermer": "Clic derecho: opciones de log de « %s »\nArrastrar: a otra ventana, o fuera\nClic central: cerrar"
"Conversation privée avec %s.\nGlisser : vers une autre fenêtre, ou dehors\nClic molette : fermer": "Conversación privada con %s.\nArrastrar: a otra ventana, o fuera\nClic central: cerrar"
"Conversation privée avec %s [%s].\nGlisser : vers une autre fenêtre, ou dehors\nClic molette : fermer": "Conversación privada con %s [%s].\nArrastrar: a otra ventana, o fuera\nClic central: cerrar"
"Ferme l'onglet affiché (%s).\nL'historique est conservé : rouvrir la conversation le retrouve.": "Cierra la pestaña mostrada (%s).\nEl historial se conserva: al reabrir la conversación reaparece."
"Emotes et emoji.\nUne emote part à %s aussitôt, seule ; un emoji s'ajoute à ta réponse.": "Emotes y emoji.\nUn emote se envía a %s al instante, sin más; un emoji se añade a tu respuesta."
"Répondre à %s": "Responder a %s"
"Clic droit : options du log de « %s »\nGlisser : réordonner, ou vers une autre fenêtre, ou dehors": "Clic derecho: opciones de log de « %s »\nArrastrar: reordenar, o a otra ventana, o fuera"
"Exporter en GIF": "Exportar en GIF"
"Ecrit un GIF par emote dans « emotes_export »,\na cote de l'executable. Pour Discord.": "Escribe un GIF por emote en « emotes_export »,\njunto al ejecutable. Para Discord."
"Destinataire du chuchotement.\nClic droit : les récents.": "Destinatario del susurro.\nClic derecho: los recientes."
"Où part ce que tu écris.\nEn tête de phrase, sans toucher au réglage :\n  %c groupe (ou Ctrl)   %c guilde (ou Alt)   %c alliés (ou Verr.Maj)\nLe préfixe RENVOIE au public quand c'est déjà le canal choisi.": "A dónde va lo que escribes.\nAl principio de la frase, sin tocar el ajuste:\n  %c party (o Ctrl)   %c guild (o Alt)   %c aliados (o Bloq Mayús)\nEl prefijo DEVUELVE al público cuando ese canal ya es el elegido."
"%s\nLecture seule.": "%s\nSolo lectura."
"Emotes et emoji.\nUne emote part SEULE, en clair (« :smile: ») : tout le monde la lit.\nUn emoji, lui, s'ajoute à ta phrase.": "Emotes y emoji.\nUn emote sale SOLO, en texto plano (« :smile: »): todo el mundo lo lee.\nUn emoji, en cambio, se añade a tu frase."
"Renommer le canal — Entrée pour valider.": "Renombrar el canal — Intro para confirmar."
"Rattacher à la fenêtre principale": "Volver a acoplar a la ventana principal"
"Détacher dans sa propre fenêtre": "Separar en su propia ventana"
"Le dernier onglet ne peut pas être détaché.": "La última pestaña no se puede separar."
"Fige la position et la taille de cette fenêtre-là. Les onglets, les menus et l'arrachage continuent de fonctionner —\nc'est la géométrie qui est verrouillée, pas la fenêtre.\n\nChaque fenêtre a le sien : une flottante qu'on détache naît libre.": "Congela la posición y el tamaño de esa ventana concreta. Las pestañas, los menús y el separarlas siguen funcionando —\nes la geometría lo que se bloquea, no la ventana.\n\nCada ventana tiene la suya: una flotante que separas nace libre."
"Nouvel onglet": "Nueva pestaña"
"Maximum atteint : %d canaux, onglets et fenêtres détachées confondus.\nC'est la limite du client, pas la nôtre.": "Máximo alcanzado: %d canales, pestañas y ventanas separadas en conjunto.\nEs el límite del cliente, no el nuestro."
"Fermer l'onglet": "Cerrar la pestaña"
"Fermer l'onglet ?###chat_close_confirm": "¿Cerrar la pestaña?###chat_close_confirm"
"Fermer la conversation ?###chat_close_confirm": "¿Cerrar la conversación?###chat_close_confirm"
"Fermer l'onglet « %s » ?": "¿Cerrar la pestaña \"%s\"?"
"Fermer la conversation avec %s ?": "¿Cerrar la conversación con %s?"
"Rien n'est perdu : le journal garde les messages, et\nrouvrir la conversation les remontrera.": "No se pierde nada: el registro conserva los mensajes, y\nvolver a abrir la conversación los mostrará de nuevo."
"Ses réglages partent avec lui : les filtres du log, son\napparence propre, son nom. Un onglet ne se rouvre pas —\nil faudra le recréer et le régler à nouveau.": "Sus ajustes se van con ella: los filtros del log, su\napariencia propia, su nombre. Una pestaña no se reabre —\nhabrá que crearla y configurarla de nuevo."
"Les messages, eux, RESTENT : ils vivent dans un journal\ncommun à toutes les fenêtres, et les autres onglets\ncontinuent de les afficher.": "Los mensajes, en cambio, PERMANECEN: viven en un registro\ncomún a todas las ventanas, y las demás pestañas\nsiguen mostrándolos."
"Il doit rester au moins un onglet dans la fenêtre principale.": "Al menos una pestaña debe quedar en la ventana principal."
"propre à cet onglet": "propio de esta pestaña"
"générale": "general"
"Tout cocher": "Marcarlo todo"
"Tout décocher": "Desmarcarlo todo"
"Vider cet onglet": "Vaciar esta pestaña"
"Masque ce que cet onglet affiche aujourd'hui ; la suite s'affichera normalement.\n\nRien n'est détruit : les autres onglets gardent ces lignes, l'historique enregistré aussi,\net « Réafficher tout » les ramène ici.": "Oculta lo que esta pestaña muestra ahora; lo que llegue después se mostrará normalmente.\n\nNo se destruye nada: las demás pestañas conservan esas líneas, el historial guardado también,\ny \"Volver a mostrarlo todo\" las trae de vuelta aquí."
"Réafficher tout": "Volver a mostrarlo todo"
"Annule le vidage : cet onglet remontre tout ce que ses filtres acceptent.\n\nSauf ce que l'éviction a évacué entre-temps — le tampon ne garde qu'un nombre de lignes borné.": "Deshace el vaciado: esta pestaña vuelve a mostrar todo lo que sus filtros aceptan.\n\nSalvo lo que el desalojo haya descartado mientras tanto — el búfer solo guarda un número limitado de líneas."
"Aucun destinataire récent": "Ningún destinatario reciente"
"Vider la liste": "Vaciar la lista"
"Remplacement de la chatbox : mêmes canaux, mêmes filtres et même chemin d'envoi que le client. La fenêtre native reste ouverte à côté tant que la bascule complète n'est pas faite.": "Un sustituto de la chatbox: mismos canales, mismos filtros y misma ruta de envío que el cliente. La ventana nativa sigue abierta al lado hasta que el cambio esté completo."
"Une adresse postée dans le chat vient d'un autre joueur, et le texte affiché n'a aucun rapport obligé avec la destination réelle. La confirmation montre l'adresse COMPLÈTE avant d'ouvrir le navigateur.\n\nEn la décochant, un clic sur un lien ouvre directement le navigateur.": "Una dirección publicada en el chat viene de otro jugador, y el texto mostrado no guarda relación necesaria con el destino real. La confirmación muestra la dirección COMPLETA antes de abrir el navegador.\n\nSi lo desmarcas, un clic en un enlace abre el navegador directamente."
"Survoler un lien d'image en montre le contenu, sans ouvrir le navigateur.\n\nLes images ne sont chargées que depuis des hébergeurs connus (Discord, imgur, le site Moonlight). C'est ce qui rend l'aperçu sûr : sur ces serveurs-là, celui qui a posté le lien ne peut pas savoir qui l'a regardé. Un lien vers n'importe quel autre site reste un lien ordinaire, à ouvrir soi-même.": "Pasar el ratón sobre un enlace de imagen muestra su contenido, sin abrir el navegador.\n\nLas imágenes solo se cargan desde servidores conocidos (Discord, imgur, el sitio de Moonlight). Eso es lo que hace segura la vista previa: en esos servidores, quien publicó el enlace no puede saber quién lo ha mirado. Un enlace a cualquier otro sitio sigue siendo un enlace corriente, que abres tú mismo."
"  Vos sites autorisés :": "  Tus sitios permitidos:"
"Police du fil de discussion. « Système » garde celle du reste de l'interface.\n\nLes autres sont latines : un caractère coréen y apparaîtrait en carré. Sans effet en jeu, où tout est en français ou en anglais.": "Fuente del hilo de conversación. « System » conserva la que usa el resto de la interfaz.\n\nLas demás son latinas: un carácter coreano aparecería como un cuadrado. Sin efecto en el juego, donde todo está en francés o en inglés."
"Affiche les images et les emotes du fil sous forme de vignettes.\n\nDécoché, un lien reste une adresse cliquable et une emote son « :nom: » — et rien n'est téléchargé.": "Muestra las imágenes y los emotes del hilo como miniaturas.\n\nSin marcar, un enlace sigue siendo una dirección clicable y un emote su « :nombre: » — y no se descarga nada."
"Hauteur des vignettes, de 24 à 128 pixels.\n\nAu-delà d'une hauteur de ligne, la ligne s'agrandit pour accueillir l'image : le fil reste lisible, il s'aère.": "Altura de las miniaturas, de 24 a 128 píxeles.\n\nPor encima de la altura de una línea, la línea crece para alojar la imagen: el hilo sigue siendo legible, solo respira más."
"Fait apparaître un bouton au bas de la grille d'emotes.\n\nIl écrit un GIF par emote dans « emotes_export », à côté de l'exécutable, sous le nom que le relais Discord attend. À déposer ensuite dans images/smilies/ du site.\n\nRéservé au staff, et éteint à chaque session : c'est une manipulation ponctuelle, pas un réglage.": "Hace aparecer un botón al pie de la rejilla de emotes.\n\nEscribe un GIF por emote en « emotes_export », junto al ejecutable, con el nombre que espera el relé de Discord. Para dejarlos luego en images/smilies/ del sitio.\n\nSolo staff, y apagado en cada sesión: es una operación puntual, no un ajuste."
"Ouvre une fenêtre de conversation séparée quand un joueur chuchote.\n\nCe sont les réglages du CLIENT (Alt+I, « Friend Setup ») : les changer ici les change là-bas, et inversement.\n\nDécochés, les chuchotements restent de simples lignes dans le chat.": "Abre una ventana de conversación aparte cuando un jugador te susurra.\n\nSon los ajustes del CLIENTE (Alt+I, « Friend Setup »): cambiarlos aquí los cambia allí, y al revés.\n\nSin marcar, los susurros siguen siendo líneas normales del chat."
"Ignore les filtres de canal et préfixe chaque ligne du type que le client nous a transmis (t00 à t24). Une ligne visible ici mais absente d'un onglet a été écartée par un filtre ; une ligne absente même ici n'est jamais arrivée jusqu'à nous.": "Ignora los filtros de canal y antepone a cada línea el tipo que nos pasó el cliente (t00 a t24). Una línea visible aquí pero ausente de una pestaña la apartó un filtro; una línea ausente incluso aquí nunca nos llegó."
"Lignes vues par le détour : %u · retenues : %u · en mémoire : %d": "Líneas vistas por el hook: %u · conservadas: %u · en memoria: %d"
"Compté PAR TYPE de message — parole, combat, guilde, groupe, chuchotement… — et non pour l'ensemble du chat.\n\nC'est ce qui empêche un donjon d'effacer vos conversations : une rafale de lignes de dégâts n'évince que des lignes de dégâts, et ce qui a été dit il y a dix minutes reste là.\n\nLe tampon est commun à tous les onglets — une même ligne s'affiche dans plusieurs à la fois — mais chaque type y garde sa place.": "Contado POR TIPO DE MENSAJE — habla, combate, guild, party, susurro… — y no para el chat en su conjunto.\n\nEso es lo que impide que una mazmorra borre tus conversaciones: una ráfaga de líneas de daño solo expulsa líneas de daño, y lo que se dijo hace diez minutos se queda.\n\nEl búfer lo comparten todas las pestañas — la misma línea aparece en varias a la vez — pero cada tipo conserva su propio sitio en él."
"Réaffiche les dernières lignes de la session précédente à la reconnexion, précédées d'un séparateur.\n\nATTENTION : elles sont écrites en clair dans SaveData\\bourgeon_chat_history.yaml, CHUCHOTEMENTS COMPRIS. Sur une machine partagée, n'importe qui peut les lire.": "Vuelve a mostrar las últimas líneas de la sesión anterior al reconectar, precedidas de un separador.\n\nCUIDADO: se escriben en texto plano en SaveData\\bourgeon_chat_history.yaml, SUSURROS INCLUIDOS. En una máquina compartida, cualquiera puede leerlos."
"Apparence de la chatbox ImGui": "Apariencia de la chatbox ImGui"
"Réglages généraux — un onglet peut avoir les siens": "Ajustes generales — una pestaña puede tener los suyos"
"Clic droit sur un onglet → « Apparence ». Un onglet qui n'a pas ses propres réglages SUIT ceux-ci : le changer ici le déplace aussi.": "Clic derecho en una pestaña → « Apariencia ». Una pestaña sin ajustes propios SIGUE estos: cambiarlo aquí también la mueve."
"Onglets, boutons et ligne de saisie. Séparée de la taille du chat : grossir le texte qu'on lit ne doit pas faire enfler la bande d'onglets, qui mangerait la fenêtre.": "Pestañas, botones y línea de entrada. Se mantiene aparte del tamaño del chat: agrandar el texto que lees no debe hinchar la tira de pestañas, que se comería la ventana."
