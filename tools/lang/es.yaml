"Attaque de base + attaque d'arme (batk + atk2), plafonnée à 32767.\nC'est le dégât AVANT défense de la cible.": "Ataque base + ataque del arma (batk + atk2), limitado a 32767.\nEs el daño ANTES de la defensa del objetivo."
"Attaque magique MAXIMALE. Sur ce serveur HOMSET_SAME_MATK est actif :\nle minimum est égal au maximum, il n'y a donc pas de fourchette.": "Ataque mágico MÁXIMO. En este servidor HOMSET_SAME_MATK está activo:\nel mínimo es igual al máximo, así que no hay rango."
"Précision = min(niveau, 600) + DEX.\nChance de toucher = 80 + HIT - FLEE de la cible, bornée à 5..100 %.": "Precisión = min(nivel, 600) + DEX.\nProbabilidad de acertar = 80 + HIT - FLEE del objetivo, limitada a 5..100 %."
"/!\\ CE N'EST PAS UN TAUX DE CRITIQUE. Le serveur envoie ici LUK/3 + 1\n(option HOMSET_DISPLAY_LUK). Un homoncule ne fait JAMAIS de critique :\nenable_critical ne couvre que les joueurs et les mercenaires.\nÀ lire comme un indicateur de LUK — donc ici LUK vaut environ (valeur - 1) x 3.": "/!\\ ESTO NO ES UNA TASA DE CRÍTICO. El servidor envía aquí LUK/3 + 1\n(opción HOMSET_DISPLAY_LUK). Un homúnculo NUNCA hace críticos:\nenable_critical solo cubre a jugadores y mercenarios.\nLéelo como un indicador de LUK — así que LUK vale aproximadamente (valor - 1) x 3."
"Somme de DEUX choses de natures différentes : DEF dure + VIT.\n• DEF dure = réduction en POURCENTAGE (dégâts x (100 - DEF) / 100).\n• VIT alimente la DEF douce, une réduction PLATE soustraite ensuite,\n  avec une part aléatoire : DEF2 + rnd(0, (DEF2/20)²).\nLe nombre affiché ne se lit donc ni en % ni en plat — c'est un total\nd'affichage hérité d'Aegis.": "Suma de DOS cosas de naturaleza distinta: DEF dura + VIT.\n• DEF dura = reducción en PORCENTAJE (daño x (100 - DEF) / 100).\n• VIT alimenta la DEF blanda, una reducción PLANA restada después,\n  con una parte aleatoria: DEF2 + rnd(0, (DEF2/20)²).\nEl número mostrado no se lee ni en % ni en plano — es un total\nde visualización heredado de Aegis."
"MDEF dure SEULE, en POURCENTAGE (dégâts magiques x (100 - MDEF) / 100).\n/!\\ La MDEF douce (INT + VIT/2), soustraite à plat après, n'est PAS\ncomptée ici — la résistance réelle est supérieure à ce chiffre.": "MDEF dura SOLA, en PORCENTAJE (daño mágico x (100 - MDEF) / 100).\n/!\\ La MDEF blanda (INT + VIT/2), restada en plano después, NO\nse cuenta aquí — la resistencia real es superior a esta cifra."
"Esquive = min(niveau, 600) + AGI. Elle se retranche directement de la\nprécision de l'attaquant. -10 % par assaillant au-delà du deuxième.\nL'esquive parfaite (LUK) n'est pas transmise pour un homoncule.": "Evasión = min(nivel, 600) + AGI. Se resta directamente de la\nprecisión del atacante. -10 % por atacante más allá del segundo.\nLa evasión perfecta (LUK) no se transmite para un homúnculo."
"Vitesse d'attaque = (2000 - amotion) / 10, calculée par le client.\nDélai d'attaque brut : %d ms — c'est LUI que le serveur envoie.": "Velocidad de ataque = (2000 - amotion) / 10, calculada por el cliente.\nRetardo de ataque bruto: %d ms — es ESO lo que envía el servidor."
"Portée d'attaque : %d": "Alcance de ataque: %d"
"En cases. 1 = corps à corps ; au-delà, l'homoncule frappe à distance sans se déplacer.": "En casillas. 1 = cuerpo a cuerpo; más allá, el homúnculo golpea a distancia sin moverse."
"Aucune compétence reçue du serveur.": "Ninguna habilidad recibida del servidor."
