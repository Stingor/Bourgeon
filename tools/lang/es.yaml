# en: Native per primitive\0Normal alpha\0Global additive\0
"Natif par primitive\0Alpha normal\0Additif global\0": ""
# en: Native per primitive: replays the SRCBLEND/DESTBLEND the game set for\neach primitive (record +0x18/+0x1c) — the only correct mode, since one\neffect mixes additive and alpha within the same frame.\nNormal alpha: additive primitives come out as BLACK SQUARES.\nGlobal additive: alpha primitives BURN OUT to white.\n/!\\ The native mode acts on the D3D9 device: inoperative under DX7.
"Natif par primitive : rejoue SRCBLEND/DESTBLEND que le jeu a posés pour\nchaque primitive (record +0x18/+0x1c) — le seul mode correct, car un\neffet mélange additif et alpha dans la même frame.\nAlpha normal : les primitives additives sortent en CARRÉS NOIRS.\nAdditif global : les primitives alpha CRAMENT en blanc.\n/!\\ Le mode natif agit sur le device D3D9 : inopérant sous DX7.": ""
# en: Debug capture (raw + anchor)
"Debug capture (brut + ancre)": ""
# en: Draws the RAW capture (native screen positions) + the anchor (cyan dot) and\nthe radius circle, WITHOUT reprojection. Untick \"Hide in game\" to\ncompare the outlines (green) with the native in-world effect.
"Dessine la capture BRUTE (positions écran natives) + l'ancre (point cyan) et\nle cercle du rayon, SANS reprojection. Décoche « Cacher en jeu » pour\ncomparer les contours (vert) à l'effet natif in-world.": ""
