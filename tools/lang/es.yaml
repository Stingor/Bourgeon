"La fourchette couvre toute la plage de maîtrise culinaire, de zéro au maximum : votre valeur exacte place le résultat quelque part entre ces deux bornes.\n\nElle n'a pas été transmise. C'est une donnée que le client ne peut pas deviner - elle vit côté serveur et ne circule dans aucun paquet du jeu d'origine ; ce serveur doit la pousser explicitement. Une maîtrise de zéro, elle, s'afficherait normalement : c'est une valeur comme une autre.": "El rango cubre todo el intervalo de la maestría de cocina, de cero al máximo: tu valor exacto sitúa el resultado en algún punto entre esos dos límites.\n\nNo se ha enviado. Es un dato que el cliente no puede adivinar - vive en el servidor y no viaja en ningún paquete del juego original; este servidor tiene que enviarlo explícitamente. Una maestría de cero se mostraría con normalidad: es un valor como otro cualquiera."
