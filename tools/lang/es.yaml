"Encadre l'emblème de guilde au-dessus des noms. Le client ne dessine ce cadre que sur une carte de siège (GvG) : ailleurs la commande bascule, mais rien ne change à l'écran. Bourgeon l'honore partout où il dessine lui-même l'emblème, comme la fiche de personnage.": "Enmarca el emblema de gremio sobre los nombres. El cliente solo dibuja este marco en un mapa de asedio (GvG): en otros sitios el comando cambia, pero nada cambia en pantalla. Bourgeon lo respeta allí donde dibuja el emblema él mismo, como la hoja de personaje."
"Rien à enregistrer : aucun onglet ne contient de ligne.": "Nada que guardar: ninguna pestaña contiene una línea."
"Journal enregistré : %d fichier(s) dans %s": "Registro guardado: %d archivo(s) en %s"
"Courbe des temps d'image": "Gráfica de tiempos de fotograma"
"Les 120 dernières images, de 0 à 33 ms. Un pic visible est un à-coup — c'est ce qu'un compteur moyenné cache.": "Los últimos 120 fotogramas, de 0 a 33 ms. Un pico visible es un tirón — justo lo que oculta un contador promediado."
"Ping serveur": "Ping del servidor"
"Mesuré sur l'échange d'heure que le client entretient déjà avec le serveur, toutes les quelques secondes : rien n'est envoyé en plus.\n« -- » tant qu'aucun échange n'a eu lieu.": "Medido sobre el intercambio de hora que el cliente ya mantiene con el servidor cada pocos segundos: no se envía nada adicional.\n« -- » mientras no haya habido intercambio."
"Verrouillé : l'overlay ne se déplace plus et laisse passer les clics au jeu en dessous.\nDéverrouillez-le pour le glisser ailleurs.": "Bloqueado: la superposición ya no se mueve y deja pasar los clics al juego de debajo.\nDesbloquéalo para arrastrarlo a otro sitio."
"Ombrage du texte": "Sombra del texto"
"Une ombre d'un pixel sous le texte. C'est elle qui le garde lisible si vous rendez le fond transparent.": "Una sombra de un píxel bajo el texto. Es lo que lo mantiene legible si dejas el fondo transparente."
"Fond": "Fondo"
"%.1f ms au serveur": "%.1f ms al servidor"
"%.1f ms/image": "%.1f ms/fotograma"
"%.0f FPS": "%.0f FPS"
"-- ms au serveur": "-- ms al servidor"
"Tous les onglets": "Todas las pestañas"
"Sprite propre à chaque arme": "Cada arma con su propio sprite"
"ON (défaut) : chaque arme garde son apparence d'origine quand tu en portes deux (assassin, kagerou/oboro) ou une seule en main gauche.\n\nOFF : le comportement d'ORIGINE du client, qui fond les deux armes en un sprite générique. À n'éteindre que pour comparer les deux rendus.": "ON (por defecto): cada arma conserva su aspecto cuando llevas dos (asesino, kagerou/oboro) o una sola en la mano izquierda.\n\nOFF: el comportamiento ORIGINAL del cliente, que funde ambas armas en un sprite genérico. Apágalo solo para comparar."
"Maj + clic : poser le lien de cet onglet dans le chat": "Mayús + clic: poner el enlace de esta pestaña en el chat"
"Ajouts de Bourgeon": "Añadidos de Bourgeon"
"Au prochain démarrage": "En el próximo inicio"
"Ces réglages sont enregistrés tout de suite, mais le client ne les lit qu'à son démarrage : ils prendront effet la prochaine fois que vous lancerez le jeu.": "Estos ajustes se guardan de inmediato, pero el cliente solo los lee al arrancar: surtirán efecto la próxima vez que inicies el juego."
"Quitter maintenant vous déconnecte : le client se ferme, et c'est à vous de le relancer.": "Salir ahora te desconecta: el cliente se cierra y tendrás que volver a iniciarlo tú."
"Enregistrer et quitter": "Guardar y salir"
"Enregistrer ces réglages": "Guardar estos ajustes"
"Enregistré. Actif au prochain démarrage du jeu.": "Guardado. Activo en el próximo inicio del juego."
"Le client ne lit ces quatre réglages qu'à son démarrage. Ils sont enregistrés tout de suite et prendront effet au prochain lancement.": "El cliente solo lee estos cuatro ajustes al arrancar. Se guardan de inmediato y surtirán efecto en el próximo inicio."
"En fenêtré, le jeu s'ouvre toujours sur l'écran principal de Windows.": "En modo ventana, el juego siempre se abre en la pantalla principal de Windows."
"Une même carte apparaît une fois PAR ÉCRAN branché : ce que vous choisissez ici, c'est l'écran sur lequel le jeu s'ouvrira.\nLe numéro est celui de vos Paramètres Windows ; le nom technique de la sortie s'affiche sous la souris.\nUniquement en plein écran : en fenêtré, le client place toujours sa fenêtre sur l'écran principal de Windows.": "Una misma tarjeta aparece una vez POR PANTALLA conectada: lo que eliges aquí es la pantalla en la que se abrirá el juego.\nEl número es el de tu Configuración de Windows; el nombre técnico de la salida aparece al pasar el ratón.\nSolo a pantalla completa: en modo ventana el cliente siempre coloca su ventana en la pantalla principal de Windows."
"%s  —  écran %d": "%s  —  pantalla %d"
"principal": "principal"
"Sans redémarrage": "Sin reiniciar"
"Le client lit ce réglage quand il CHARGE un sprite : les personnages et monstres déjà à l'écran gardent leur finesse.\nChangez de carte pour tout revoir.": "El cliente lee este ajuste cuando CARGA un sprite: los personajes y monstruos ya en pantalla conservan su resolución.\nCambia de mapa para verlo en todo."
"Lisse les textures vues de loin. Coût négligeable sur une carte moderne.\nLe filtre est figé dans chaque texture au moment où elle est créée : le changement se voit tout de suite sur l'interface, et sur le reste au fur et à mesure des rechargements.": "Suaviza las texturas vistas de lejos. Coste insignificante en una tarjeta moderna.\nEl filtro queda fijado en cada textura al crearse: el cambio se ve en la interfaz al instante, y en el resto a medida que se recargan."
"DirectX 7 ?": "¿DirectX 7?"
"DirectX 7 éteint une partie de Bourgeon.": "DirectX 7 apaga una parte de Bourgeon."
"Choisir DirectX 7 quand même": "Elegir DirectX 7 de todos modos"
"Rester en DirectX 9": "Quedarse en DirectX 9"
"Pour changer : Échap -> Réglages du jeu -> onglet « Graphismes », choisis « DirectX 9 » comme API graphique, puis applique — le client redémarrera. Le Setup du client fait la même chose.": "Para cambiarlo: Esc -> Ajustes del juego -> pestaña « Gráficos », elige « DirectX 9 » como API gráfica y aplica: el cliente se reiniciará. El Setup del cliente hace lo mismo."
