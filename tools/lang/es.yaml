"L'envoi passe par le service web du serveur, comme la fenêtre native.\nL'emblème se met à jour dès que le serveur a publié la nouvelle version.": "El envío pasa por el servicio web del servidor, como la ventana nativa.\nEl emblema se actualiza en cuanto el servidor ha publicado la nueva versión."
