# Diagnostic du personnage — sondas por dirección, cadencia medida
"action %d": "acción %d"
"images %s  × %.2f → de %.0f à %.0f ms selon la DIRECTION": "fotogramas %s  × %.2f → de %.0f a %.0f ms según la DIRECCIÓN"
"images %s  × %.2f → %.0f ms": "fotogramas %s  × %.2f → %.0f ms"
"Les huit directions de cette action n'ont pas le même nombre d'images. Comme la direction jouée est choisie par l'angle de la CAMÉRA, l'animation dure plus ou moins longtemps selon la façon dont on regarde le personnage — et comme l'état d'attaque bloque l'envoi des compétences, la cadence des skills change avec la caméra.\n\nC'est un défaut du fichier de sprite, pas du serveur.": "Las ocho direcciones de esta acción no tienen el mismo número de fotogramas. Como la dirección reproducida la elige el ángulo de la CÁMARA, la animación dura más o menos según cómo se mire al personaje, y como el estado de ataque bloquea el envío de habilidades, la cadencia de skills cambia con la cámara.\n\nEs un defecto del archivo de sprite, no del servidor."
"%.2f coup(s)/s — mesuré sur %d coups en %.1f s": "%.2f golpe(s)/s — medido sobre %d golpes en %.1f s"
"Cadence observée": "Cadencia observada"
"— (pas assez de coups récents)": "— (no hay suficientes golpes recientes)"
"Les coups que VOUS portez, comptés sur les paquets reçus et non sur les images affichées : le chiffre est donc comparable à ce que montre le journal de combat, et indépendant du nombre d'images par seconde.\n\nUn coup multiple compte pour UN : ce qui est mesuré est le rythme des envois, pas le nombre de lignes de dégâts.": "Los golpes que TÚ das, contados sobre los paquetes recibidos y no sobre los fotogramas mostrados: la cifra es comparable con lo que muestra el registro de combate e independiente de los fotogramas por segundo.\n\nUn golpe múltiple cuenta como UNO: lo que se mide es el ritmo de los envíos, no el número de líneas de daño."
"Classe RÉSOLUE (sprite)": "Clase RESUELTA (sprite)"
"Trois valeurs, trois sources qui ne mentent pas pareil :\n\n· Classe (serveur) = g_Own_JobId, ce que le serveur dit que vous ÊTES ;\n· Classe AFFICHÉE = acteur+0x25c, la classe portée par votre acteur — c'est elle que change un @disguise ;\n· Classe RÉSOLUE = la précédente passée par les masques d'option (monture, mado, invisibilité). C'est elle qui décide du fichier de sprite.\n\nSi les trois sont égales alors que le personnage n'a pas son apparence normale, la transformation ne passe par AUCUNE des trois : regarder alors le chemin du .act, plus bas — c'est la seule source qui ne puisse pas se tromper, puisque c'est le fichier réellement joué.": "Tres valores, tres fuentes que no mienten igual:\n\n· Clase (servidor) = g_Own_JobId, lo que el servidor dice que ERES;\n· Clase MOSTRADA = actor+0x25c, la clase que lleva tu actor: es la que cambia un @disguise;\n· Clase RESUELTA = la anterior pasada por las máscaras de opción (montura, mado, invisibilidad). Es la que elige el archivo de sprite.\n\nSi las tres coinciden mientras el personaje no tiene su aspecto normal, la transformación no pasa por NINGUNA de ellas: mira entonces la ruta del .act, más abajo, la única fuente que no puede equivocarse, porque es el archivo realmente reproducido."
"   ⛔ bloque l'envoi des compétences": "   ⛔ bloquea el envío de habilidades"
"%d — non étiqueté (pas de RE)%s": "%d — sin etiquetar (sin RE)%s"
"Actor_ProcessPendingAction_Tick (0x00d43400) n'émet CZ_USE_SKILL que si cet état vaut 0, 1, 4 ou ≥ 16. Dans tout autre état — 2 et 9 en tête, les attaques — la requête reste en file et est réessayée à la frame suivante.\n\nDonc : plus l'animation d'attaque est longue, plus le personnage reste dans un état bloquant, et moins vite les compétences partent. La durée de cette animation se lit plus bas, direction par direction.": "Actor_ProcessPendingAction_Tick (0x00d43400) solo emite CZ_USE_SKILL si este estado vale 0, 1, 4 o >= 16. En cualquier otro estado —2 y 9 los primeros, los ataques— la petición se queda en cola y se reintenta en el siguiente fotograma.\n\nPor tanto: cuanto más larga es la animación de ataque, más tiempo pasa el personaje en un estado que bloquea, y más lento salen las habilidades. La duración de esa animación se lee más abajo, dirección por dirección."
"Entrées du fichier": "Entradas del archivo"
"%d  (= %d action(s) × 8 directions)": "%d  (= %d acción(es) × 8 direcciones)"
"Un .act range action × 8 + direction : les huit directions sont huit entrées INDÉPENDANTES, chacune avec son propre nombre d'images.\n\n13 actions = 104 entrées = un jeu de sprites JOUEUR. Beaucoup moins (5 à 8 actions) = un sprite de MONSTRE, donc un déguisement.": "Un .act se indexa por acción × 8 + dirección: las ocho direcciones son ocho entradas INDEPENDIENTES, cada una con su propio número de fotogramas.\n\n13 acciones = 104 entradas = un juego de sprites de JUGADOR. Muchas menos (5 a 8 acciones) = un sprite de MONSTRUO, es decir, un disfraz."
"L'entrée %d est demandée alors que le fichier n'en a que %d : le client rend 1 image, l'animation se termine tout de suite.": "Se pide la entrada %d cuando el archivo solo tiene %d: el cliente devuelve 1 fotograma, así que la animación termina de inmediato."

# Diagnostic du personnage — histograma de estados, slot 0
"%.0f %% du temps — sur %u images en %.1f s": "%.0f %% del tiempo — sobre %u fotogramas en %.1f s"
"États bloquants": "Estados que bloquean"
"Part du temps passée dans un état de motion qui EMPÊCHE le client d'émettre la compétence en attente (tout sauf 0, 1, 4 et ≥ 16).\n\nÉlevé : c'est le client qui bride, et la cause est la durée de l'animation.\nBas alors que les compétences partent mal quand même : la requête POUVAIT partir — le frein est ailleurs (refus du serveur, portée, ciblage).\n\nÉchantillonné une fois par image, tant que cette fenêtre est ouverte. Le bouton « Remettre les mesures à zéro » redémarre le comptage : à faire juste avant chaque essai.": "Proporción del tiempo pasada en un estado de motion que IMPIDE al cliente emitir la habilidad en cola (todo salvo 0, 1, 4 y >= 16).\n\nAlto: el cliente es el que frena, y la causa es la duración de la animación.\nBajo aunque las habilidades salgan mal igualmente: la petición SÍ podía salir, el freno está en otra parte (rechazo del servidor, alcance, selección de objetivo).\n\nSe muestrea una vez por fotograma, mientras esta ventana está abierta. El botón «Poner los datos a cero» reinicia el recuento: hazlo justo antes de cada prueba."
"États dominants": "Estados dominantes"
"slot 0 (corps dessiné)": "slot 0 (cuerpo dibujado)"
"Le corps DESSINÉ n'est pas celui sur lequel l'animation compte ses images.": "El cuerpo DIBUJADO no es aquel sobre el que la animación cuenta sus fotogramas."
"Remettre les mesures à zéro": "Poner los datos a cero"

# Diagnostic du personnage — contadores de envíos
"%u skill(s) + %u attaque(s) — soit %.2f et %.2f par seconde": "%u skill(s) + %u ataque(s) — o sea %.2f y %.2f por segundo"
"Paquets ÉMIS": "Paquetes ENVIADOS"
"CZ_USE_SKILL (+ variante au sol) et CZ_REQUEST_ACT réellement partis du client, comptés sur le hook d'envoi — donc avant toute réponse du serveur.\n\n· BEAUCOUP d'émis pour PEU de coups reçus : le client fait son travail, c'est le serveur qui refuse (delay d'action, portée, cible) ;\n· PEU d'émis : rien ne part, et le frein est en amont — saisie, ciblage, ou un garde du client.\n\nRemis à zéro par le bouton du bas, en même temps que les autres mesures.": "CZ_USE_SKILL (y su variante al suelo) y CZ_REQUEST_ACT realmente enviados por el cliente, contados en el hook de envío, es decir, antes de cualquier respuesta del servidor.\n\n· MUCHOS enviados para POCOS golpes recibidos: el cliente cumple, es el servidor el que rechaza (retardo de acción, alcance, objetivo);\n· POCOS enviados: no sale nada, y el freno está antes: entrada, selección de objetivo o una guarda del cliente.\n\nSe pone a cero con el botón de abajo, junto con las demás medidas."

# Diagnostic du personnage — contorno de las zonas donde se puede hacer clic
"%d zones — 1 sous le curseur": "%d zonas — 1 bajo el cursor"
"%d zones — aucune sous le curseur": "%d zonas — ninguna bajo el cursor"
"Contour des zones cliquables": "Contorno de las zonas pulsables"
"Dessine les rectangles ÉCRAN dont le client se sert pour savoir sur QUOI la souris pointe — ce ne sont pas les positions au sol, et c'est le rectangle le plus « devant » qui gagne le clic, quel que soit son propriétaire.\n\nJaune épais = celui que le clic prendrait maintenant, avec son AID. Rose = le vôtre. Vert = acteur, bleu = PNJ de carte, orange = unité de compétence.\n\nÀ regarder quand une compétence part sur la mauvaise cible, ou ne part pas alors que le curseur semble bien placé.": "Dibuja los rectángulos de PANTALLA que el cliente usa para saber A QUÉ apunta el ratón: no son las posiciones en el suelo, y gana el clic el rectángulo que está más delante, sea de quien sea.\n\nAmarillo grueso = el que tomaría el clic ahora mismo, con su AID. Rosa = el tuyo. Verde = actor, azul = NPC de mapa, naranja = unidad de habilidad.\n\nConviene mirarlo cuando una habilidad va al objetivo equivocado, o no sale aunque el cursor parezca bien puesto."

# Diagnostic du personnage — precision de las zonas pulsables
"Zone cliquable minimale (px)": "Zona pulsable mínima (px)"
"Le client ÉLARGIT toute zone cliquable plus petite que ce nombre de pixels, pour qu'un petit sprite reste attrapable. Défaut de ce client : %d px.\n\nBaisser resserre le ciblage — deux entités voisines cessent de se disputer le même clic. Trop bas, les petits monstres deviennent difficiles à viser.\n\n⚠ Sans effet sur un GROS sprite : son rectangle vient de son dessin, pas de ce minimum.": "El cliente ENSANCHA toda zona pulsable más pequeña que este número de píxeles, para que un sprite pequeño siga siendo agarrable. Valor por defecto de este cliente: %d px.\n\nBajarlo ajusta la selección: dos entidades vecinas dejan de disputarse el mismo clic. Demasiado bajo, y los monstruos pequeños se vuelven difíciles de apuntar.\n\n⚠ Sin efecto sobre un sprite GRANDE: su rectángulo viene de su dibujo, no de este mínimo."

# Zones cliquables : le fantome au GID negatif (pick_quad_tweaks)
"Zones cliquables : détour non posé (client inattendu).": "Zonas pulsables: desvío no instalado (cliente inesperado)."
"Rétrécir la zone cliquable des GID négatifs": "Reducir la zona pulsable de los GID negativos"
"Un GID négatif n'existe pas dans le protocole : c'est un acteur FANTÔME, créé par le serveur (le clone d'@disguise de rAthena en envoie un, avec -bl->id).\n\nLe serveur ne connaît pas ce GID et jette sans un mot toute action envoyée vers lui. Mais sa zone cliquable, elle, est bien là et peut gagner le clic devant la vraie cible — la compétence part alors dans le vide, et le joueur ne voit qu'une cadence effondrée.\n\nCochée, sa zone est rétrécie autour de son centre : le fantôme cesse de voler le clic, sans rien changer pour les entités normales.\n\n⚠ Palliatif côté client. Le vrai correctif est de ne plus émettre ce clone côté serveur.": "Un GID negativo no existe en el protocolo: es un actor FANTASMA, creado por el servidor (el clon de @disguise de rAthena envía uno, con -bl->id).\n\nEl servidor no conoce ese GID y descarta sin avisar toda acción enviada hacia él. Pero su zona pulsable sí está ahí y puede ganar el clic por delante del objetivo real: la habilidad se pierde en el vacío y el jugador solo ve una cadencia hundida.\n\nMarcada, su zona se reduce alrededor de su centro: el fantasma deja de robar el clic, sin cambiar nada para las entidades normales.\n\n⚠ Paliativo del cliente. La solución real es dejar de emitir ese clon en el servidor."
"Taille restante (%)": "Tamaño restante (%)"
"Ce qui reste de la zone du fantôme, en pourcentage de sa taille d'origine, rétréci autour de son centre.\n\n0 % laisse un pixel : le fantôme devient pratiquement impossible à viser, ce qui est le but. Monter cette valeur ne sert qu'à le récupérer volontairement — pour l'observer avec le contour des zones cliquables, par exemple.": "Lo que queda de la zona del fantasma, en porcentaje de su tamaño original, reducida alrededor de su centro.\n\n0 % deja un píxel: el fantasma se vuelve prácticamente imposible de apuntar, que es el objetivo. Subir este valor solo sirve para recuperarlo a propósito: para observarlo con el contorno de las zonas pulsables, por ejemplo."
"Aucun GID négatif rencontré.": "Ningún GID negativo encontrado."
"Zones rétrécies : %u": "Zonas reducidas: %u"
"Forcer la zone cliquable minimale": "Forzar la zona pulsable mínima"
"Décochée, Bourgeon ne touche PAS à la valeur du client — c'est l'état à choisir pour mesurer le jeu tel quel, ou pour vérifier ce que fait un patch posé sur l'exécutable.\n\nCochée, la valeur du curseur est réécrite à chaque image.": "Sin marcar, Bourgeon NO toca el valor del cliente: es el estado que hay que elegir para medir el juego tal cual, o para comprobar qué hace realmente un parche aplicado al ejecutable.\n\nMarcada, el valor del deslizador se reescribe en cada fotograma."
"client : %d px": "cliente: %d px"

# Section Gameplay du panneau joueur (precision du ciblage, quick cast, GIF)
"Gameplay": "Gameplay"
"Précision du ciblage": "Precisión de la selección"
"Le jeu ÉLARGIT la surface qui répond au clic de chaque entité jusqu'à un minimum qui dépend de la résolution — sur ton écran : %d px pour les monstres et joueurs, %d px pour les PNJ. Un petit monstre se défend donc sur une surface bien plus grande que lui, et deux entités proches se disputent le même clic.": "El juego ENSANCHA la superficie que responde al clic de cada entidad hasta un mínimo que depende de la resolución — en tu pantalla: %d px para monstruos y jugadores, %d px para los PNJ. Un monstruo pequeño se defiende por tanto sobre una superficie mucho mayor que él, y dos entidades cercanas se disputan el mismo clic."
"Le jeu ÉLARGIT la surface qui répond au clic de chaque entité jusqu'à un minimum qui dépend de la résolution. Un petit monstre se défend donc sur une surface bien plus grande que lui, et deux entités proches se disputent le même clic.": "El juego ENSANCHA la superficie que responde al clic de cada entidad hasta un mínimo que depende de la resolución. Un monstruo pequeño se defiende por tanto sobre una superficie mucho mayor que él, y dos entidades cercanas se disputan el mismo clic."
"Zone cliquable minimale": "Zona pulsable mínima"
"Réglage d'origine du jeu": "Ajuste original del juego"
"Moitié": "Mitad"
"Quart": "Cuarto"
"Huitième": "Octavo"
"Seizième": "Dieciseisavo"
"Réduit ce minimum : le ciblage devient plus précis — deux entités voisines cessent de se disputer le même clic — mais les petits monstres deviennent plus exigeants à viser.\n\n« Moitié » est un bon départ. La proportion à la résolution est conservée, et le réglage s'applique aussi aux PNJ.\n\n⚠ Sans effet sur un GROS sprite : sa surface vient de son dessin, pas de ce minimum.": "Reduce ese mínimo: la selección se vuelve más precisa — dos entidades vecinas dejan de disputarse el mismo clic — pero los monstruos pequeños se vuelven más exigentes de apuntar.\n\n«Mitad» es un buen comienzo. La proporción con la resolución se conserva, y el ajuste también se aplica a los PNJ.\n\n⚠ Sin efecto sobre un sprite GRANDE: su superficie viene de su dibujo, no de este mínimo."
"En jaune : la surface qui répond au clic avec ton réglage. En gris : celle d'origine.": "Amarillo: la superficie que responde al clic con tu ajuste. Gris: la original."
"Période de répétition des objets, séparée de celle des compétences parce que le frein n'est pas le même : c'est le SERVEUR qui fixe l'intervalle minimal entre deux objets — 325 ms en temps normal, davantage en PvP sur les soins.\n\nRégler plus vite que lui ne consomme rien de plus : il refuse et répond « veuillez patienter » dans le chat. Ce curseur ne descend pas sous 100 ms.": "Período de repetición de los objetos, separado del de las habilidades porque el freno no es el mismo: es el SERVIDOR quien fija el intervalo mínimo entre dos objetos — 325 ms normalmente, más en PvP con las curas.\n\nPonerlo más rápido que el servidor no consume nada más: él rechaza y responde «espera, por favor» en el chat. Este control no baja de 100 ms."
"Taille du GIF": "Tamaño del GIF"
"Légère (320 px)": "Ligero (320 px)"
"Moyenne (480 px)": "Mediano (480 px)"
"Grande (640 px)": "Grande (640 px)"
"La taille du fichier : la zone filmée est réduite à cette largeur avant d'entrer dans le GIF.\n\nMoyenne passe partout. Grande donne un GIF plus net mais nettement plus lourd — le poids monte avec le CARRÉ de la taille.": "El tamaño del archivo: la zona filmada se reduce a este ancho antes de entrar en el GIF.\n\nMediano encaja en todas partes. Grande da un GIF más nítido pero mucho más pesado — el peso crece con el CUADRADO del tamaño."

