"Miroir en jeu de tout ce que le client journalise (LogInfo / LogDiag / LogError), à la place de la console Windows.\n\nLe texte est SÉLECTIONNABLE et copiable : sélection à la souris, Ctrl+A, Ctrl+C, ou le bouton « Copier tout ». L'affichage se restreint à une sous-chaîne et aux niveaux cochés — Info, Diag / Warn, Erreur.\n\nRéservé au staff, et le droit est revérifié à chaque frame : la fenêtre disparaît si le niveau de groupe change en cours de session.": "Espejo en el juego de todo lo que el cliente registra (LogInfo / LogDiag / LogError), en lugar de la consola de Windows.\n\nEl texto es SELECCIONABLE y copiable: selección con el ratón, Ctrl+A, Ctrl+C, o el botón \"Copiar todo\". La vista se restringe a una subcadena y a los niveles marcados — Info, Diag / Warn, Error.\n\nReservado al staff, y el permiso se vuelve a comprobar en cada fotograma: la ventana desaparece si el nivel de grupo cambia durante la sesión."
"Glyphes coréens (redémarrage)": "Glifos coreanos (reiniciar)"
"Charge les caractères coréens dans les polices. Utile UNIQUEMENT pour lire les chemins des fichiers du jeu dans le journal — rien en jeu ne s'affiche en coréen.\n\n⚠ Prend effet au PROCHAIN LANCEMENT : les polices sont préparées une seule fois au démarrage, et le moteur DirectDraw ne sait pas les refaire en cours de partie.\n\nÉteint, l'atlas de polices est vingt fois plus léger et le client démarre plus vite. Un caractère coréen y apparaîtrait en carré.": "Carga los caracteres coreanos en las fuentes. Útil SOLO para leer rutas de archivos del juego en el log — nada en el juego se muestra en coreano.\n\n⚠ Surte efecto en el PRÓXIMO ARRANQUE: las fuentes se preparan una vez al inicio, y el motor DirectDraw no puede reconstruirlas en pleno juego.\n\nDesactivado, el atlas de fuentes es veinte veces más ligero y el cliente arranca más rápido. Un carácter coreano aparecería entonces como un cuadrado."
"Sprites d'armes doubles": "Sprites de armas duales"
