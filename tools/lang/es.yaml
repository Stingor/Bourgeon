"en ligne": "en línea"
"absent": "ausente"
"Exclure": "Expulsar"
"Nom du personnage": "Nombre del personaje"
"Guilde et liste d'amis uniquement.\nInviter quelqu'un, c'est inviter tous ses personnages et tous ses comptes de jeu.": "Solo gremio y lista de amigos.\nInvitar a alguien es invitar a todos sus personajes y todas sus cuentas de juego."
"Quitter le groupe ? Si vous en êtes le dernier membre, il sera détruit avec ses invitations.": "¿Dejar el grupo? Si eres su último miembro, será destruido junto con sus invitaciones."
"Catalogue non reçu — en attente du serveur.": "Catálogo no recibido — esperando al servidor."
"MVP": "MVP"
"Âge": "Antigüedad"
"Source": "Fuente"
"Favori : alerte à l'ouverture de la fenêtre.": "Favorito: aviso al abrirse la ventana."
"Tombe en (%d,%d).": "Tumba en (%d,%d)."
"jamais vu": "nunca visto"
"de retour": "de vuelta"
"dans %s (exact)": "en %s (exacto)"
"fenêtre passée": "ventana pasada"
"possible (jusqu'à %s)": "posible (hasta %s)"
"saisir": "escribir"
"Saisir l'heure de mort observée.": "Escribir la hora de muerte observada."
"Heure de mort observée": "Hora de muerte observada"
"Un « - » de tête désigne la veille.": "Un \"-\" inicial indica el día anterior."
"Heure illisible.": "Hora ilegible."
"%s (%s) entre dans sa fenêtre.": "%s (%s) entra en su ventana."
"Activer le carnet de chasse MVP": "Activar el cuaderno de caza MVP"
"Éteint, le serveur cesse de t'envoyer ce que ton groupe observe — mais tes propres kills continuent de l'alimenter. Ce n'est donc pas un mode dégradé : tu nourris le groupe sans rien recevoir.": "Apagado, el servidor deja de enviarte lo que observa tu grupo — pero tus propias muertes lo siguen alimentando. No es pues un modo degradado: alimentas al grupo sin recibir nada."
"Ouvrir le carnet": "Abrir el cuaderno"
"ou une touche à lier : « Carnet de chasse MVP »": "o una tecla que vincular: \"Cuaderno de caza MVP\""
"Alerte sonore sur un favori": "Aviso sonoro en un favorito"
"Préavis d'alerte (min)": "Antelación del aviso (min)"
"Combien de minutes AVANT l'ouverture de la fenêtre de retour l'alerte se déclenche.\n\nLes favoris eux-mêmes sont enregistrés sur le serveur : ils suivent ton compte, donc tous tes personnages et tous tes postes. Seuls ce préavis et le son restent locaux.": "Cuántos minutos ANTES de que se abra la ventana de regreso salta el aviso.\n\nLos favoritos en sí están guardados en el servidor: siguen a tu cuenta, así que a todos tus personajes y todos tus equipos. Solo esta antelación y el sonido quedan en local."
"Tombes sur la minimap": "Tumbas en el minimapa"
"Marque l'endroit exact où chaque MVP connu de ton groupe est tombé, sur la carte concernée. Doré quand l'instant du retour a été mérité au Convex Mirror, orangé quand on n'a qu'une fenêtre.\n\nIndépendant du marqueur « Boss (Convex Mirror) » de la minimap, qui vient du client.": "Marca el lugar exacto donde cayó cada MVP conocido por tu grupo, en el mapa correspondiente. Dorado cuando el instante del regreso se ganó con un Convex Mirror, naranja cuando solo se tiene una ventana.\n\nIndependiente del marcador \"Boss (Convex Mirror)\" del minimapa, que viene del cliente."
"Réglages du carnet": "Ajustes del cuaderno"
"Sprite du MVP dans la liste": "Sprite del MVP en la lista"
"Reconnaître un monstre à sa silhouette va plus vite que lire son nom anglais dans une table de quatre-vingts lignes.\n\nSurvoler son nom donne la fiche compacte, un clic droit ouvre les mêmes actions que sur un lien de monstre du chat — fiche, bestiaire, « où le trouver », @mobinfo, @whereis. Et survoler la carte montre le plan avec la tombe pointée.": "Reconocer a un monstruo por su silueta es más rápido que leer su nombre en inglés en una tabla de ochenta filas.\n\nPasar por encima de su nombre da la ficha compacta, un clic derecho abre las mismas acciones que en un enlace de monstruo del chat — ficha, bestiario, \"dónde encontrarlo\", @mobinfo, @whereis. Y pasar por encima del mapa muestra el plano con la tumba señalada."
"Aucune tombe connue.": "No se conoce ninguna tumba."
"Taille du sprite (px)": "Tamaño del sprite (px)"
"C'est aussi la hauteur des rangs : la table s'étire avec.\n\n⚠ Un sprite n'est jamais AGRANDI au-delà de sa taille réelle — sa taille dit son gabarit, et l'étirer mentirait. Les MVP étant de grosses bêtes, le curseur agit sur presque tous ; un petit monstre, lui, s'arrête à sa taille native au lieu de devenir flou.": "También es la altura de las filas: la tabla se estira con ella.\n\n⚠ Un sprite nunca se AGRANDA más allá de su tamaño real — su tamaño dice su corpulencia, y estirarlo mentiría. Al ser los MVP bichos grandes, el deslizador actúa sobre casi todos; un monstruo pequeño se detiene en su tamaño nativo en lugar de volverse borroso."
"Animer les sprites": "Animar los sprites"
"Éteint par défaut : quatre-vingts silhouettes qui bougent en même temps font de la table un aquarium, et le regard n'accroche plus la ligne qu'on cherche.": "Apagado por defecto: ochenta siluetas moviéndose a la vez convierten la tabla en un acuario, y la vista deja de encontrar la fila que buscas."
"MVP : %s possible###bourgeon_mvp_tracker": "MVP: %s posible###bourgeon_mvp_tracker"
"MVP : %s dans %s###bourgeon_mvp_tracker": "MVP: %s en %s###bourgeon_mvp_tracker"
"Lignes détachées": "Líneas separadas"
"Glisser une ligne du carnet par sa poignée, à gauche, et la lâcher HORS de la fenêtre : elle reste à l'écran et survit à la fermeture du carnet. Les lignes s'aimantent entre elles. Clic droit sur une ligne pour la remettre au carnet.": "Arrastra una fila del cuaderno por su asa, a la izquierda, y suéltala FUERA de la ventana: se queda en pantalla y sobrevive al cierre del cuaderno. Las líneas se imantan entre sí. Clic derecho en una línea para devolverla al cuaderno."
"Ligne — texte": "Línea — texto"
"Ligne — fond": "Línea — fondo"
"Le canal alpha de chaque couleur EST son opacité — les deux sont réglables séparément, précisément pour obtenir ce qu'on veut d'une ligne discrète : un fond presque transparent sous un texte resté lisible.": "El canal alfa de cada color ES su opacidad — ambos se ajustan por separado, precisamente para lograr lo que necesita una línea discreta: un fondo casi transparente bajo un texto que sigue siendo legible."
"Tout remettre au carnet (%d)": "Devolverlas todas al cuaderno (%d)"
"possible": "posible"
"Glisser hors du carnet pour détacher la ligne.": "Arrastra fuera del cuaderno para separar la fila."
"Ce compte de jeu n'est rattaché à aucun compte Moonlight.": "Esta cuenta de juego no está vinculada a ninguna cuenta Moonlight."
"Vous êtes déjà dans un groupe : quittez-le d'abord.": "Ya estás en un grupo: sal de él primero."
"Seul le propriétaire du groupe peut faire cela.": "Solo el propietario del grupo puede hacer eso."
"Personnage introuvable : vérifiez l'orthographe.": "Personaje no encontrado: comprueba la ortografía."
"Pas sur vous-même.": "No sobre ti mismo."
"Le groupe est complet.": "El grupo está completo."
"Nom de groupe invalide (1 à 31 caractères).": "Nombre de grupo inválido (1 a 31 caracteres)."
"Aucune invitation en attente.": "No hay ninguna invitación pendiente."
"Cette personne appartient déjà à un autre groupe.": "Esta persona ya pertenece a otro grupo."
"Erreur de base de données : rien n'a été changé.": "Error de base de datos: no se cambió nada."
"Ce personnage est déjà dans votre groupe : son compte Moonlight y est, avec tous ses personnages.": "Este personaje ya está en tu grupo: su cuenta Moonlight está dentro, con todos sus personajes."
"Ce personnage n'est ni dans votre guilde ni dans vos amis.": "Este personaje no está ni en tu gremio ni en tu lista de amigos."
"Ajoute une barre de recherche au-dessus de la table, qui filtre sur le nom du MVP comme sur celui de la carte.\n\nLe filtre lui-même n'est pas enregistré : on filtre pour trouver quelque chose maintenant, pas pour rouvrir demain sur une table amputée sans se rappeler pourquoi.\n\n⚠ Les COLONNES, elles, se règlent au clic droit sur la ligne d'en-tête — on y montre « Délai », le temps de retour habituel, masqué par défaut.": "Añade una barra de búsqueda encima de la tabla, que filtra tanto por el nombre del MVP como por el del mapa.\n\nEl filtro en sí no se guarda: filtras para encontrar algo ahora, no para reabrir mañana con una tabla recortada sin recordar por qué.\n\n⚠ Las COLUMNAS se ajustan con clic derecho en la fila de cabecera — ahí se muestra \"Retardo\", el tiempo de regreso habitual, oculto por defecto."
"Filtrer : nom ou carte": "Filtrar: nombre o mapa"
"%d min": "%d min"
"Le délai écrit dans le script de spawn : au plus tôt, au plus tard.\n\nC'est une donnée publique, et la seule que le serveur ait le droit de publier — le tirage exact à l'intérieur de cette plage, lui, ne sort que si un membre l'a payé avec un Convex Mirror.": "El retardo escrito en el script de aparición: lo más pronto, lo más tarde.\n\nEs un dato público, y lo único que el servidor tiene derecho a publicar — el sorteo exacto dentro de ese rango solo sale si un miembro lo pagó con un Convex Mirror."
"Inviter dans mon carnet MVP": "Invitar a mi cuaderno MVP"
"Sprite dans les lignes détachées": "Sprite en las líneas separadas"
"Réglage à part de celui de la table, et c'est voulu : une ligne posée sur le décor du jeu cherche la discrétion, là où la table cherche à faire reconnaître un monstre d'un coup d'œil.": "Un ajuste propio, separado del de la tabla, y a propósito: una línea puesta sobre el escenario del juego busca discreción, mientras que la tabla busca que reconozcas a un monstruo de un vistazo."
"Le carnet de chasse MVP est éteint dans les réglages.": "El cuaderno de caza MVP está apagado en los ajustes."
"Il faut appartenir à un groupe de chasse pour y inviter quelqu'un — créez-en un depuis le carnet.": "Debes pertenecer a un grupo de caza para invitar a alguien — crea uno desde el cuaderno."
"Seuls vos amis et vos compagnons de guilde peuvent rejoindre votre carnet de chasse.": "Solo tus amigos y tus compañeros de gremio pueden unirse a tu cuaderno de caza."
"Déjà dans votre carnet : son compte Moonlight y est, avec tous ses personnages.": "Ya está en tu cuaderno: su cuenta Moonlight está dentro, con todos sus personajes."
"Invitation reçue": "Invitación recibida"
"Le groupe de chasse « %s » vous invite à partager son carnet MVP.": "El grupo de caza \"%s\" te invita a compartir su cuaderno MVP."
"Quittez d'abord votre groupe actuel pour pouvoir accepter.": "Sal primero de tu grupo actual para poder aceptar."
"Le carnet se remplit de ce que VOTRE GROUPE observe : ses kills, les tombes qu'il lit, les Convex Mirror qu'il porte. Sans groupe, aucune ligne ne se remplira.": "El cuaderno se llena con lo que observa TU GRUPO: sus muertes, las tumbas que lee, los Convex Mirror que lleva. Sin grupo, ninguna fila se llenará nunca."
"Créez-en un ci-dessus — vous pouvez y chasser seul, et inviter plus tard vos amis et vos compagnons de guilde.": "Crea uno arriba — puedes cazar solo en él, e invitar más tarde a tus amigos y compañeros de gremio."
"[MVP: %s (%s) — mort à %s]": "[MVP: %s (%s) — muerto a las %s]"
"[MVP: %s (%s) — retour %s–%s]": "[MVP: %s (%s) — vuelve %s–%s]"
"[MVP: %s (%s) — retour à %s]": "[MVP: %s (%s) — vuelve a las %s]"
"[MVP: %s (%s)]": "[MVP: %s (%s)]"
"Ajouter à mon carnet": "Añadir a mi cuaderno"
"Ce créneau n'est pas dans votre catalogue.": "Esta franja no está en tu catálogo."
"Ce lien ne porte pas d'heure de mort.": "Este enlace no lleva hora de muerte."
"Clic : ouvrir le carnet de chasse": "Clic: abrir el cuaderno de caza"
"Créez un groupe de chasse pour tenir un carnet.": "Crea un grupo de caza para llevar un cuaderno."
"Guider vers la tombe": "Guiar hasta la tumba"
"Mort à %s": "Muerto a las %s"
"Retour à %s (Convex Mirror)": "Vuelve a las %s (Convex Mirror)"
"Retour entre %s et %s": "Vuelve entre las %s y las %s"
"Tombe en %d, %d": "Tumba en %d, %d"
"Partager le respawn dans le chat": "Compartir el respawn en el chat"
"%s — d'après %s.\nCliquer pour saisir une heure.": "%s — según %s.\nHaz clic para escribir una hora."
"Votre groupe en sait déjà plus : il l'a vu de ses yeux.": "Tu grupo ya sabe más: lo vio con sus propios ojos."
"%s.\nCliquer pour saisir une heure.": "%s.\nHaz clic para escribir una hora."
" · passé": " · ventana pasada"
"%.0f s": "%.0f s"
"%lld,%lld k": "%lld,%lld k"
"%lld,%02lld M": "%lld,%02lld M"
"%s DPS  ·  il y a %.1f s": "%s DPS  ·  hace %.1f s"
"DPS": "DPS"
"DPS Meter — %s DPS###DPS Meter": "DPS Meter — %s DPS###DPS Meter"
"hors combat": "fuera de combate"
"PIC": "MÁX"
"MOY": "MED"
"TOTAL": "TOTAL"

# GreyWorld (Gameplay > GreyWorld) - el mundo despojado: decorados ocultos,
# celdas transitables a la vista, suelo liso, sin niebla.
"Le monde dépouillé, comme les GRF « greyworld » que la communauté RO se passe pour la WoE — mais réglable, réversible, et sans rien installer : plus rien ne cache les monstres, et le sol dit où l'on peut marcher.": "El mundo despojado, como los GRF « greyworld » que la comunidad de RO se pasa para la WoE — pero ajustable, reversible y sin instalar nada: ya nada tapa a los monstruos, y el suelo dice por dónde se puede caminar."
"Activer GreyWorld": "Activar GreyWorld"
"Un seul interrupteur pour les quatre leviers ci-dessous.\nRien n'est modifié dans tes fichiers : tout se fait à l'exécution, donc sur toutes les cartes, même celles ajoutées après coup.": "Un solo interruptor para las cuatro palancas de abajo.\nNo se modifica nada en tus archivos: todo ocurre en tiempo de ejecución, así que vale en todos los mapas, incluidos los añadidos después."
"Décors": "Decorados"
"Masquer les décors 3D": "Ocultar los decorados 3D"
"Arbres, murs, ponts, rochers, mobilier : tout ce que la carte pose par-dessus le sol.\nLes monstres et PNJ en 3D ne sont PAS concernés — ils passent par un autre chemin de rendu.": "Árboles, muros, puentes, rocas, mobiliario: todo lo que el mapa pone encima del suelo.\nLos monstruos y PNJ en 3D NO se ven afectados: van por otra vía de renderizado."
"Quadrillage du sol": "Cuadrícula del suelo"
"Afficher les cellules": "Mostrar las celdas"
"Une case par cellule de la carte, colorée selon ce qu'on peut y faire. Le dessin épouse le relief : c'est la fonction dont le client se sert déjà pour ton curseur de destination.": "Un recuadro por celda del mapa, coloreado según lo que se puede hacer en ella. El dibujo sigue el relieve: es la misma función que el cliente ya usa para tu cursor de destino."
"Portée (cellules)": "Alcance (celdas)"
"Demi-côté du carré dessiné autour de toi. C'est LE réglage qui coûte : le nombre de cases croît au carré (24 en vaut 2401, 60 en vaut 14 641). Baisse-le si tu perds des images par seconde.": "Medio lado del cuadrado dibujado a tu alrededor. Este ES el ajuste que cuesta: el número de recuadros crece al cuadrado (24 son 2401, 60 son 14 641). Bájalo si pierdes fotogramas por segundo."
"Cellule marchable": "Celda transitable"
"Mets son opacité à zéro pour ne garder que les obstacles : c'est aussi la façon la moins chère d'afficher le quadrillage, puisque les cases invisibles ne sont plus dessinées du tout.": "Pon su opacidad a cero para quedarte solo con los obstáculos: es además la forma más barata de mostrar la cuadrícula, ya que los recuadros invisibles dejan de dibujarse por completo."
"Mur": "Muro"
"Ni marche, ni tir : la cellule est fermée.": "Ni se camina, ni se dispara: la celda está cerrada."
"Infranchissable mais tirable": "Infranqueable pero atravesable por disparos"
"Un vide ou une dénivellation : on ne peut pas y aller, mais les sorts et les flèches passent.": "Un vacío o un desnivel: no se puede ir, pero los hechizos y las flechas pasan."
"Sol": "Suelo"
"Sol d'une seule couleur": "Suelo de un solo color"
"Repeint le terrain sans toucher à sa géométrie : l'occlusion par le relief reste correcte.": "Repinta el terreno sin tocar su geometría: la oclusión por el relieve sigue siendo correcta."
"Le « Sol uni » des Staff Tools est actif : c'est SA couleur qui s'affiche.": "El « Suelo liso » de las Staff Tools está activo: se muestra SU color."
"Dessin": "Dibujo"
"Carrelage (cadre de case)": "Embaldosado (marco de celda)"
"Cases dessinées": "Celdas dibujadas"
"Toutes les cases": "Todas las celdas"
"Contour des obstacles": "Contorno de los obstáculos"
"« Contour des obstacles » ne garde que les cases qui touchent un terrain différent : on lit la SILHOUETTE des murs, et il reste dix fois moins de cases à dessiner.\nC'est donc aussi le réglage le moins cher, avant même la portée — et il ne peut pas cacher un obstacle, puisqu'il garde toujours les bords.": "« Contorno de los obstáculos » solo conserva las celdas que tocan un terreno distinto: se lee la SILUETA de los muros, y quedan diez veces menos celdas que dibujar.\nEs por tanto también el ajuste más barato, incluso antes que el alcance — y no puede ocultar un obstáculo, ya que siempre conserva los bordes."


# Libellés venus de TABLES statiques (barre d'action, panneaux de réglages,
# grille d'icônes) : l'extracteur ne lit que les littéraux passés à Tr, seul
# l'export du jeu les remonte.
"Carnet de chasse MVP": "Registro de caza MVP"
"GreyWorld": "GreyWorld"
"Carreau plein (avec joint)": "Baldosa sólida (con junta)"
"Joint (%)": "Junta (%)"
"Largeur de la bordure, en pourcentage du côté de la case. À zéro, les carreaux se touchent et le quadrillage disparaît.": "Anchura del borde, en porcentaje del lado de la celda. A cero las baldosas se tocan y la cuadrícula desaparece."
"Anneau (curseur du jeu)": "Anillo (el cursor del juego)"
"L'anneau et le cadre sont des textures du client — celle de ton curseur de destination et celle des sorts de zone.\n« Carreau plein » emploie la nôtre : la case devient un aplat, un peu plus petit qu'elle, et c'est le sol laissé visible tout autour qui trace la bordure.": "El anillo y el marco son texturas del cliente: la de tu cursor de destino y la de los hechizos de área.\n« Baldosa sólida » usa la nuestra: la celda pasa a ser un plano algo más pequeño que ella, y es el suelo que queda visible alrededor el que dibuja el borde."
"Aplatir le relief": "Aplanar el relieve"
"Met toute la carte à une seule altitude — la moyenne de son relief — comme le fait un GRF greyworld, sols et personnages ensemble.\nLes décors ne sont alors plus chargés du tout : ils garderaient leur hauteur d'origine et flotteraient au-dessus du sol, et même invisibles ils arrêteraient ton curseur.\n🔴 Tout cela est figé au chargement de la carte. Cocher ou décocher demande donc au serveur de te faire recharger, sur la case où tu es : tu vois l'écran de chargement, tu ne bouges pas.\nLe niveau de l'eau n'est pas touché : sur une carte qui en a, le sol peut passer dessous.": "Pone todo el mapa a una sola altitud - la media de su relieve - como hace un GRF greyworld, suelo y personajes a la vez.\nLos decorados dejan entonces de cargarse por completo: conservarían su altura original y flotarían sobre el suelo, y aun invisibles detendrían tu cursor.\n🔴 Todo esto queda fijado al cargar el mapa. Marcar o desmarcar pide por tanto al servidor que te recargue, en la misma casilla en la que estás: ves la pantalla de carga, no te mueves.\nEl nivel del agua no se toca: en un mapa que la tenga, el suelo puede quedar por debajo."
"Rechargement de la carte demandé…": "Recarga del mapa solicitada…"
"Le serveur n'a pas rechargé la carte : les décors ne suivront qu'au prochain changement de carte.": "El servidor no ha recargado el mapa: los decorados no seguirán hasta el próximo cambio de mapa."
"Il refuse tant que tu sors du combat, ou qu'une fenêtre lui reste ouverte (PNJ, échange, entrepôt) — il te le dit alors dans le chat.\nC'est la commande « @refreshmap » : tu peux la taper toi-même, et n'importe quel warp fait la même chose.": "Se niega mientras sales de combate, o mientras tiene una ventana abierta (PNJ, intercambio, almacén) - entonces te lo dice en el chat.\nEs el comando « @refreshmap »: puedes escribirlo tú mismo, y cualquier warp hace lo mismo."
"Les sorts de zone dessinent au sol les cases qu'ils toucheront. Le client sait déjà le faire pour les monstres ; ici tu décides s'il le fait aussi pour le sort que tu tiens en main, et pour ceux des autres joueurs.": "Los hechizos de área dibujan en el suelo las casillas que tocarán. El cliente ya lo hace con los monstruos; aquí decides si lo hace también con el hechizo que tienes en la mano y con los de otros jugadores."
"Montrer la zone du sort que je tiens en main": "Mostrar el área del hechizo que tengo en la mano"
"Dès qu'un sort de zone est armé et attend ton clic, sa zone suit le curseur : tu vois où il tombera avant de le lâcher.\nPersonne d'autre ne la voit — rien n'est envoyé au serveur.": "En cuanto un hechizo de área está preparado y espera tu clic, su área sigue al cursor: ves dónde caerá antes de soltarlo.\nNadie más la ve: no se envía nada al servidor."
"Largeur de la bordure, en pourcentage du côté de la case. À zéro, les carreaux se touchent et la zone devient un aplat d'un seul tenant.": "Ancho del borde, en porcentaje del lado de la casilla. A cero las baldosas se tocan y el área se vuelve un bloque continuo."
"Couleur et opacité": "Color y opacidad"
"L'opacité est le curseur « A » du sélecteur. À zéro, plus rien n'est dessiné — et rien n'est soumis au rendu non plus.": "La opacidad es el deslizador « A » del selector. A cero no se dibuja nada, y tampoco se envía nada al renderizador."
"Montrer la zone des sorts en cours d'incantation": "Mostrar el área de los hechizos que se están lanzando"
"Celle des JOUEURS — la tienne comprise — pendant qu'ils incantent. C'est le serveur qui l'annonce, et elle est déjà visible par tout le monde autour : tu ne dévoiles rien en l'affichant.\nLes monstres, eux, la montrent déjà et ce réglage n'y change rien : un MVP qui annonce son sort est une information de jeu, pas un confort.": "La de los JUGADORES —la tuya incluida— mientras lanzan. La anuncia el servidor y ya es visible para todos los que están alrededor: mostrarla no revela nada.\nLos monstruos ya muestran la suya y este ajuste no lo cambia: un MVP que anuncia su hechizo es información de juego, no una comodidad."
"Tous les sorts n'ont pas de zone déclarée : c'est le serveur qui dit lesquels en ont une, et de quelle taille.": "No todos los hechizos tienen un área declarada: el servidor decide cuáles la tienen y de qué tamaño."
