"Interrupteur GLOBAL — ces fenêtres s'activent ENSEMBLE, pas de mixe (tout ImGui ou tout natif) :\n  • Inventaire (et le sertissage de cartes)\n  • Cart\n  • Storage (Kafra, guilde, premium)\n  • Barres d'action\n  • Échange joueur-joueur\n  • Courrier (RODEX)\n  • Shop joueur (vending, buying store et achat chez un vendeur)\n  • Feuille de personnage (Alt+F), grimoire compris : l'icône « Skill » et\n    Alt+S ouvrent son onglet Grimoire au lieu de la fenêtre native\n  • Cash shop et shops PNJ\n  • Banque de zeny (Ctrl+B), ouverte aussi par le sac de zeny du footer\n    de l'inventaire\n  • Refine d'arme (compétence Upgrade Weapon du Whitesmith)\n  • Fiche de monstre (compétence Sense), avec sprite animé, drops et\n    lieux d'apparition\n  • Menu du clic droit sur une entité\nLa case des autres sections reflète donc le même état.\n\n": "Interruptor GLOBAL — estas ventanas se encienden JUNTAS, sin mezclas (todo ImGui o todo nativo):\n  • Inventario (e inserción de cards)\n  • Cart\n  • Storage (Kafra, guild, premium)\n  • Barras de acción\n  • Intercambio entre jugadores\n  • Correo (RODEX)\n  • Shop de jugador (vending, buying store y compra a un vendedor)\n  • Ficha de personaje (Alt+F), grimorio incluido: el icono « Skill » y\n    Alt+S abren su pestaña Grimorio en vez de la ventana nativa\n  • Cash shop y shops de NPC\n  • Banco de zeny (Ctrl+B), que también abre la bolsa de zeny del pie del\n    inventario\n  • Refine de armas (la habilidad Upgrade Weapon del Whitesmith)\n  • Ficha de monstruo (la habilidad Sense), con sprite animado, drops y\n    lugares de aparición\n  • Menú del clic derecho sobre una entidad\nLa casilla de las demás secciones refleja, pues, el mismo estado.\n\n"
"Liste courante": "Lista actual"
"Les réglages propres à chaque fenêtre restent dans leur section ci-dessous (Inventaire, Cart, Storage, Banque, Refine, Fabrication, Barre d'action). Ils sont grisés tant que cette case est décochée : sans elle, ces fenêtres n'existent pas.": "Los ajustes propios de cada ventana se quedan en su sección de abajo (Inventario, Cart, Storage, Banco, Refine, Fabricación, Barra de acción). Están en gris mientras esta casilla esté desmarcada: sin ella, esas ventanas no existen."
