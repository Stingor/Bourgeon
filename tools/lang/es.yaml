"Un effect id sans entrée dans la table de saut du client (0x00bc2e04)\ntombe sur un DEFAULT `mov al,1 ; ret` : le nœud est créé et tické, mais\nne dessine JAMAIS rien — nativement compris, et sans aucune erreur.\nCe n'est pas une ressource absente : c'est du code qui n'existe pas.\nL'état est LU dans la table du client, pas recopié d'une liste.": "Un effect id sin entrada en la tabla de saltos del cliente (0x00bc2e04)\ncae en un DEFAULT `mov al,1 ; ret`: el nodo se crea y se actualiza, pero\nno dibuja NUNCA nada — comprendido de forma nativa, y sin ningún error.\nNo es un recurso ausente: es código que no existe.\nEl estado se LEE de la tabla del cliente, no se copia de una lista."
