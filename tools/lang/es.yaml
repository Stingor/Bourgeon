"Le bouton carré posé près de la minimap, qui ouvre le Vote Shop.\nExactement le réglage de la commande /cashshop : c'est le client qui le\nretient, dans SaveData\\OptionInfo.lua.\nIcônes déplaçables activées, il se déplace comme les autres icônes.": "El botón cuadrado situado junto al minimapa, que abre el Vote Shop.\nEs exactamente el ajuste del comando /cashshop: es el cliente quien lo\nrecuerda, en SaveData\\OptionInfo.lua.\nCon los iconos movibles activados, se arrastra como cualquier otro icono."
