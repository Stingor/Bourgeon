"Permet la vente d'items améliorés (refine > 0),\ncartes, munitions et items slotés chez les PNJ marchands.\nDésactiver pour protéger ces items. (@sellstuff)": "Permite vender a los NPC mercaderes objetos refinados (refine > 0),\ncards, munición y objetos con ranuras.\nDesactívalo para proteger esos objetos. (@sellstuff)"
"Sell Item": "Sell Item"
"Permet la vente des items du groupe IG_SELLITEM chez les PNJ marchands.\nDésactiver pour les protéger. (@sellitem)\n\nGroupe SELLITEM :\nGreen Potion (506)\nWhite Slim Potion (547)\nLucky Candy (570)\nOld Blue Box (603)\nYggdrasil Berry (607)\nYggdrasil Seed (608)\nOld Card Album (616)\nOld Violet Box (617)\nGift Box (644)\nPoison Bottle (678)\nGold (969)\nTemporal Crystal (6607)\nCoagulated Spell (6608)\nJitterbug's Tooth (6719)\nFire Bottle (7135)\nAcid Bottle (7136)\nCoating Bottle (7139)\nFragment of Agony (7436)\nFragment of Misery (7437)\nFragment of Hatred (7438)\nPiece of Memory Red (7439)\nIce Scale (7562)\nCursed Water (12020)\nElemental Converter Fire (12114)\nElemental Converter Water (12115)\nElemental Converter Earth (12116)\nElemental Converter Wind (12117)\nMystical Card Album (12246)": "Permite vender a los NPC mercaderes los objetos del grupo IG_SELLITEM.\nDesactívalo para protegerlos. (@sellitem)\n\nGrupo SELLITEM:\nGreen Potion (506)\nWhite Slim Potion (547)\nLucky Candy (570)\nOld Blue Box (603)\nYggdrasil Berry (607)\nYggdrasil Seed (608)\nOld Card Album (616)\nOld Violet Box (617)\nGift Box (644)\nPoison Bottle (678)\nGold (969)\nTemporal Crystal (6607)\nCoagulated Spell (6608)\nJitterbug's Tooth (6719)\nFire Bottle (7135)\nAcid Bottle (7136)\nCoating Bottle (7139)\nFragment of Agony (7436)\nFragment of Misery (7437)\nFragment of Hatred (7438)\nPiece of Memory Red (7439)\nIce Scale (7562)\nCursed Water (12020)\nElemental Converter Fire (12114)\nElemental Converter Water (12115)\nElemental Converter Earth (12116)\nElemental Converter Wind (12117)\nMystical Card Album (12246)"
"No Ask": "No Ask"
"Refuse automatiquement les invitations\nde trade, de guilde et d'alliance. (@noask)": "Rechaza automáticamente las invitaciones de intercambio,\nde guild y de alianza. (@noask)"
"Active ou désactive le sprite alternatif des Angel wings et Devil wings (Moonlight 2005 vibe - @wings)": "Activa o desactiva el sprite alternativo de las Angel wings y Devil wings (Moonlight 2005 vibe - @wings)"
"Kill Steal Protection — empêche d'autres joueurs de voler vos kills MVP.\nSelf = toi seulement, Party = ta party, Guild = ta guilde. (@noks)": "Kill Steal Protection — impide que otros jugadores te roben tus muertes de MVP.\nSelf = solo tú, Party = tu party, Guild = tu guild. (@noks)"
"Autoloot des items ayant au minimum le prix de revente configuré.": "Autoloot de los objetos que valgan al menos el precio de reventa configurado."
"Cochez les types d'items à lootter automatiquement.\nHealing=0 Usable=2 Etc=3 Armor=4 Weapon=5\nCard=6 PetEgg=7 PetArmor=8 Ammo=10 Cash=11": "Marca los tipos de objeto que se recogen automáticamente.\nHealing=0 Usable=2 Etc=3 Armor=4 Weapon=5\nCard=6 PetEgg=7 PetArmor=8 Ammo=10 Cash=11"
"Autoloot rares": "Autoloot de raros"
"Autolooting: Toutes les Cards\nOld Blue Box (603)\nYggdrasil Berry (607)\nYggdrasil Seed (608)\nOld Card Album (616)\nOld Purple Box (617)\nGift Box (644)\nGold (969)\nTemporal Crystal (6607)\nCoagulated Spell (6608)\nJitterbug's Tooth (6719)\nFragment of Agony (7436)\nFragment of Misery (7437)\nFragment of Hatred (7438)\nPiece_Of_Memory_Red (7439)\nTreasure Box (7444)\nCursed Water (12020)\nElemental Converter Fire (12114)\nElemental Converter Water (12115)\nElemental Converter Earth (12116)\nElemental Converter Wind (12117)\nMystical Card Album (12246)\nSentimental Fragment (22687)\nCursed Fragment (23016)": "Autoloot: todas las Card\nOld Blue Box (603)\nYggdrasil Berry (607)\nYggdrasil Seed (608)\nOld Card Album (616)\nOld Purple Box (617)\nGift Box (644)\nGold (969)\nTemporal Crystal (6607)\nCoagulated Spell (6608)\nJitterbug's Tooth (6719)\nFragment of Agony (7436)\nFragment of Misery (7437)\nFragment of Hatred (7438)\nPiece_Of_Memory_Red (7439)\nTreasure Box (7444)\nCursed Water (12020)\nElemental Converter Fire (12114)\nElemental Converter Water (12115)\nElemental Converter Earth (12116)\nElemental Converter Wind (12117)\nMystical Card Album (12246)\nSentimental Fragment (22687)\nCursed Fragment (23016)"
"Autoloot MVP": "Autoloot MVP"
"Loot automatiquement les MVP\nquelque soit leur taux de drop. (@autolootmvp)": "Recoge automáticamente los MVP\nsea cual sea su tasa de drop. (@autolootmvp)"
"Autoloot MVP rewards (actif par défaut)": "Autoloot de las recompensas MVP (activado por defecto)"
"Les drops de récompense des MVP sont lootés\nautomatiquement par défaut.\nDécocher pour désactiver. (@autolootmvpreward)": "Los drops de recompensa MVP se recogen\nautomáticamente por defecto.\nDesmarca para desactivarlo. (@autolootmvpreward)"
"Loot automatiquement les items par ID.\nMax 50 IDs. (@autolootid <id>)": "Recoge automáticamente los objetos por ID.\nMáximo 50 ID. (@autolootid <id>)"
"Affiche un bouton Add/Remove Alootid\nprès du curseur au clic droit sur un item dans l'affichage natif.": "Muestra un botón Add/Remove Alootid\njunto al cursor al hacer clic derecho en un objeto en la vista nativa."
"%s (non sauvegardé)": "%s (sin guardar)"
"Lettres, chiffres, F1-F12 et Espace (avec Ctrl/Alt/Maj si tu veux).\nUne touche déjà prise par un preset d'équipement ou par la barre de skills est refusée.": "Letras, cifras, F1-F12 y Espacio (con Ctrl/Alt/Shift si quieres).\nUna tecla ya ocupada por un preset de equipo o por la barra de habilidades se rechaza."
"DPS Meter": "DPS Meter"
"Lancer DOOM (1993) dans Ragnarok": "Lanzar DOOM (1993) dentro de Ragnarok"
"Le vrai DOOM (moteur doomgeneric embarqué), rendu dans une fenêtre par-dessus le jeu.\n\nNécessite un WAD à côté de l'exe du client : doom.wad (Doom complet), doom2.wad, tnt.wad, plutonia.wad, freedoom1.wad, freedoom2.wad, chex.wad, hacx.wad ou doom1.wad (shareware). Si plusieurs sont présents, la fenêtre te fait choisir au lancement.\nClique la fenêtre DOOM pour capturer le clavier : ZQSD (AZERTY), WASD ou flèches pour bouger, Ctrl tirer, Espace/E ouvrir, Shift courir, Échap menu.\nDécocher = pause. Quitter depuis le menu DOOM = définitif jusqu'au redémarrage du client.": "El DOOM de verdad (motor doomgeneric integrado), renderizado en una ventana sobre el juego.\n\nRequiere un WAD junto al exe del cliente: doom.wad (Doom completo), doom2.wad, tnt.wad, plutonia.wad, freedoom1.wad, freedoom2.wad, chex.wad, hacx.wad o doom1.wad (shareware). Si hay varios, la ventana te deja elegir al lanzarlo.\nHaz clic en la ventana de DOOM para capturar el teclado: ZQSD (AZERTY), WASD o flechas para moverte, Ctrl para disparar, Espacio/E para abrir, Shift para correr, Esc para el menú.\nDesmarcar = pausa. Salir desde el menú de DOOM = definitivo hasta reiniciar el cliente."
"État : %s": "Estado: %s"
"Parade de Porings (login)": "Desfile de Porings (login)"
"Porings sur l'écran de login": "Porings en la pantalla de login"
"Fait flâner une petite bande de monstres de la famille Poring sur l'écran de login : ils sautillent d'un bord à l'autre, font des pauses, et sursautent (avec un son) si tu cliques dessus.\n\nPurement cosmétique. Ils s'estompent au-dessus du panneau de login pour ne pas gêner la saisie. Visible uniquement à l'écran de login.": "Suelta una pequeña banda de monstruos de la familia Poring por la pantalla de login: saltan de un borde a otro, se detienen, y se sobresaltan (con sonido) si haces clic en ellos.\n\nPuramente estético. Se desvanecen por encima del panel de login para no estorbar al escribir. Solo visibles en la pantalla de login."
"Ouvrir Roggle": "Abrir Roggle"
"Mini-jeu façon Peggle, dessiné en ImGui par-dessus le jeu.\n\nVise à la souris depuis le canon en haut, clique pour tirer la bille. Dégomme tous les pegs ORANGE pour gagner ; le seau vert en bas rattrape la bille = bille gratuite.\nFermer la fenêtre ou décocher = masquer (la partie est conservée).": "Mini-juego estilo Peggle, dibujado en ImGui sobre el juego.\n\nApunta con el ratón desde el cañón de arriba, haz clic para disparar la bola. Limpia todas las clavijas NARANJAS para ganar; el cubo verde de abajo atrapando la bola = una bola gratis.\nCerrar la ventana o desmarcar = ocultar (la partida se conserva)."
"Ouvrir Rojeweled": "Abrir Rojeweled"
"Match-3 façon Bejeweled dont les gemmes sont de vrais sprites de monstres RO (famille Poring : Poring, Drops, Metaling, Poporing, Marin, Deviling).\n\nClique deux monstres voisins pour les échanger ; aligne-en 3+ pour les faire disparaître (les cascades rapportent plus). DX9 requis (sinon tuiles colorées).": "Un match-3 estilo Bejeweled cuyas gemas son sprites reales de monstruos de RO (familia Poring: Poring, Drops, Metaling, Poporing, Marin, Deviling).\n\nHaz clic en dos monstruos vecinos para intercambiarlos; alinea 3 o más para eliminarlos (las cascadas puntúan más). Se requiere DX9 (baldosas de color en caso contrario)."
"Butin qui jaillit": "Botín que salta"
"Faire jaillir les objets lâchés": "Hacer saltar los objetos soltados"
"Un objet lâché par un monstre jaillit DE LUI, s'élève et retombe sur sa case en rebondissant, au lieu de descendre tout droit comme le fait le client.\n\nPurement visuel : la case où l'objet se pose — celle qu'on ramasse — ne change pas d'un pouce, et le serveur n'en sait rien. Les objets déjà au sol en arrivant sur une carte ne bougent pas non plus : seul un objet qui vient d'être lâché jaillit.": "Un objeto soltado por un monstruo salta DE ÉL, se eleva y vuelve a caer en su casilla rebotando, en vez de caer en línea recta como hace el cliente.\n\nPuramente visual: la casilla donde el objeto se posa — la que se recoge — no cambia ni un ápice, y el servidor no se entera. Los objetos que ya están en el suelo al entrar en un mapa tampoco se mueven: solo salta un objeto recién soltado."
"Hauteur du jet": "Altura del salto"
"Écart si aucune entité": "Desvío si no hay entidad"
"Durée du vol (ms)": "Duración del vuelo (ms)"
"Sauter au clavier": "Saltar con el teclado"
"Appuie sur la touche de saut (Espace par défaut) pour faire bondir ton personnage : un petit arc parabolique (montée puis retombée) purement visuel.\n\nLe serveur ne voit rien — c'est un simple décalage de hauteur du sprite, ré-appliqué chaque frame (tu peux même sauter en marchant). Taper cette touche dans le chat ne déclenche PAS de saut.": "Pulsa la tecla de salto (Espacio por defecto) para que tu personaje salte: un pequeño arco parabólico (arriba, luego abajo), puramente visual.\n\nEl servidor no ve nada — es un simple desplazamiento en altura sobre el sprite, reaplicado en cada fotograma (incluso puedes saltar mientras caminas). Escribir esa tecla en el chat NO provoca ningún salto."
"Durée (ms)": "Duración (ms)"
"Déplacement au clavier (Expérimental)": "Movimiento con el teclado (Experimental)"
"Marcher avec ZQSD / flèches": "Caminar con ZQSD / flechas"
"Déplace ton personnage au clavier : Z/S pour avancer et reculer, Q/D pour aller à gauche et à droite (les flèches font pareil). Deux touches ensemble = diagonale.\n\nRien n'est simulé côté client : le plugin envoie la MÊME demande de marche que le clic au sol, donc le serveur reste maître du déplacement (murs, vitesse, blocages). Taper dans le chat ne fait pas courir le personnage.\n\nAttention si tu as des raccourcis de compétence sur Z, Q, S ou D : ils se déclencheront aussi.": "Mueve a tu personaje con el teclado: Z/S para avanzar y retroceder, Q/D para ir a la izquierda y a la derecha (las flechas hacen lo mismo). Dos teclas a la vez = diagonal.\n\nNada se simula en el cliente: el plugin envía la MISMA petición de caminar que un clic en el suelo, así que el servidor sigue al mando del movimiento (muros, velocidad, bloqueos). Escribir en el chat no hará correr a tu personaje.\n\nCuidado si tienes atajos de habilidad en Z, Q, S o D: también se lanzarán."
"Suivre la rotation de la caméra": "Seguir la rotación de la cámara"
"« Haut » = le haut de l'écran, même après avoir fait pivoter la caméra. Décoché : les directions restent celles de la carte.": "\"Arriba\" = la parte alta de la pantalla, incluso tras girar la cámara. Sin marcar: las direcciones siguen siendo las del mapa."
"S'arrêter au relâchement": "Detener al soltar la tecla"
"Coupe la marche dès que tu lâches la touche, au lieu de laisser le personnage finir le trajet demandé.": "Corta la marcha en cuanto sueltas la tecla, en vez de dejar que el personaje termine el camino pedido."
"Interface de jeu": "Interfaz de juego"
"Langue": "Idioma"
"Langue de l'interface": "Idioma de la interfaz"
"Police": "Fuente"
"Langue de l'interface Bourgeon. Le jeu lui-même (noms d'objets, descriptions, messages du serveur) n'est pas concerné.\nUne langue grisée est connue mais son fichier de traduction est absent de SaveData\\lang\\.": "Idioma de la interfaz de Bourgeon. El juego en sí (nombres de objetos, descripciones, mensajes del servidor) no se ve afectado.\nUn idioma en gris es conocido pero falta su archivo de traducción en SaveData\\lang\\."
"%zu textes sans traduction": "%zu textos sin traducir"
"Écrit les textes rencontrés depuis le lancement et absents du catalogue dans SaveData\\lang\\<langue>.missing.yaml, prêts à traduire. N'y figure que ce qui a été AFFICHÉ : ouvre les fenêtres concernées avant d'exporter.": "Escribe los textos encontrados desde el arranque y ausentes del catálogo en SaveData\\lang\\<idioma>.missing.yaml, listos para traducir. Solo aparece ahí lo que se ha MOSTRADO: abre las ventanas correspondientes antes de exportar."
"Grille d'alignement": "Rejilla de alineación"
"Affiche une grille plein écran pour aligner ton interface (comme les add-ons d'interface de WoW).": "Muestra una rejilla a pantalla completa para alinear tu interfaz (como los add-ons de interfaz de WoW)."
"Taille grille": "Tamaño de la rejilla"
"Aimanter à la grille": "Ajustar a la rejilla"
"Les barres et les icônes s'alignent sur les cellules de la grille pendant le déplacement et le redimensionnement.": "Las barras y los iconos se alinean con las celdas de la rejilla al moverlos y redimensionarlos."
"Couleur grille": "Color de la rejilla"
"Afficher le bouton « Signaler un bug »": "Mostrar el botón \"Reportar un bug\""
"Affiche le bouton de rapport de bug dans les fenêtres de description (item/skill) et le dialogue PNJ, et active l'action clavier « Signaler un bug » (Ctrl+Alt+B par défaut, réglable dans les raccourcis). Décoche pour tout désactiver.": "Muestra el botón de reporte de bug en las ventanas de descripción (objeto/habilidad) y en el diálogo de NPC, y activa la acción de teclado \"Reportar un bug\" (Ctrl+Alt+B por defecto, reasignable en los atajos). Desmarca para desactivarlo todo."
"Aperçu — ces réglages appartiennent à l'interface moderne, qui est désactivée.": "Vista previa — estos ajustes pertenecen a la interfaz moderna, que está desactivada."
"Activer l'interface moderne": "Activar la interfaz moderna"
"Réglages généraux": "Ajustes generales"
"Chat Discord (Gonryun only)": "Chat de Discord (solo Gonryun)"
"Relaie le canal Discord du serveur dans le chat du jeu, et tes messages vers Discord — uniquement sur la carte Gonryun.": "Retransmite el canal de Discord del servidor al chat del juego, y tus mensajes a Discord — solo en el mapa de Gonryun."
"Ton avatar Discord : le panneau utilisateur du site génère l'image de ton personnage à la bonne dimension pour Discord, en un clic.": "Tu avatar de Discord: el panel de usuario del sitio genera la imagen de tu personaje al tamaño adecuado para Discord, en un clic."
"Générer mon avatar Discord": "Generar mi avatar de Discord"
"Chatbox ImGui": "Chatbox ImGui"
"Couleurs du chat": "Colores del chat"
"Barre de préréglages": "Barra de presets"
"(patch du fond de chat indisponible)": "(parche de fondo del chat no disponible)"
"Remplace la fenêtre « Monster Info » qu'ouvre la compétence Sense. Elle ajoute ce que le paquet du skill ne transporte pas : nom fiable, EXP, ATK/MATK, stats de base, modes, drops, lieux d'apparition et compétences. Le nom d'un monstre dans la table des sources d'une fiche d'objet l'ouvre d'un clic.": "Sustituye la ventana \"Monster Info\" que abre la habilidad Sense. Añade lo que el paquete de la habilidad no lleva: nombre fiable, EXP, ATK/MATK, stats base, modos, drops, lugares de aparición y habilidades. El nombre de un monstruo en la tabla de fuentes de una ficha de objeto la abre en un clic."
"Remplace le menu du clic droit sur une entité. Les actions ne sont pas réécrites : elles repassent par le dispatcher du client, donc ses vérifications et ses confirmations restent jouées. Le menu du client n'existait que sur un joueur, son pet, son homoncule et son mercenaire — ici il peut aussi s'ouvrir sur les monstres et les NPC.": "Sustituye el menú del clic derecho sobre una entidad. Las acciones no se reescriben: vuelven a pasar por el dispatcher del cliente, así que sus comprobaciones y confirmaciones siguen ejecutándose. El menú del cliente solo existía sobre un jugador, su mascota, su homúnculo y su mercenario — aquí también puede abrirse sobre monstruos y NPC."
"Règles du serveur": "Reglas del servidor"
"Règlements généraux": "Reglas generales"
"Les règles du serveur doivent être appliquées à la lettre.\nToute personne ne respectant pas la charte sera sanctionnée dans les plus brefs délais.": "Las reglas del servidor deben seguirse al pie de la letra.\nQuien no respete la carta será sancionado lo antes posible."
"Les joueurs doivent se respecter et garder un langage propre et courtois.": "Los jugadores deben respetarse entre sí y mantener un lenguaje limpio y cortés."
"Les propos visant à rejeter un nouveau joueur sont interdits.": "Están prohibidos los comentarios destinados a alejar a un jugador nuevo."
"L'utilisation de programmes tels que bots ou hacks = ban définitif sans hésitation.": "Usar programas como bots o hacks = ban permanente, sin dudarlo."
"Le flood est strictement interdit.": "El flood está estrictamente prohibido."
"Vous êtes entièrement responsable de votre compte.": "Eres el único responsable de tu propia cuenta."
"Le staff ne rend pas les items perdus (vente NPC, deslotage raté, refine raté).": "El staff no devuelve los objetos perdidos (venta a un NPC, de-slotting fallido, refine fallido)."
"Le staff peut exceptionnellement rendre un item perdu si les logs prouvent un bug serveur.": "El staff puede devolver excepcionalmente un objeto perdido si los logs demuestran un bug del servidor."
"Ne partagez jamais votre compte ou votre mot de passe.": "Nunca compartas tu cuenta ni tu contraseña."
"La demande de support pour créer un serveur privé est non recommandée.": "No se recomienda pedir soporte para montar un servidor privado."
"Le plagiat volontaire d'un membre du staff est puni.": "Hacerse pasar deliberadamente por un miembro del staff está castigado."
"Tout ce qui se rapporte au serveur est la propriété exclusive des administrateurs.": "Todo lo relacionado con el servidor es propiedad exclusiva de los administradores."
"Le langage SMS est à proscrire.": "Conviene evitar el lenguaje SMS."
"L'exploitation d'un bug ou abus = sanction. Prévenez immédiatement un administrateur.": "Explotar un bug o abusar de él = sanción. Avisa a un administrador de inmediato."
"Si vous abusez du Vote Shop en votant avec plusieurs comptes forum… \ngare à vous c'est comme avec les impôts, \ntant qu'on est pas contrôlé c'est la fête, mais quand ils vous tombent dessus...": "Si abusas del Vote Shop votando con varias cuentas del foro… \nojo, es como los impuestos: \nmientras no te auditen es una fiesta, pero cuando te caen encima..."
"Sur le serveur de jeu": "En el servidor de juego"
