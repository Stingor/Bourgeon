"Affiche en regard ce que JE porte au même emplacement. La fenêtre s'élargit.": "Muestra al lado lo que YO llevo en la misma ranura. La ventana se ensancha."
"Copie SUR MOI l'équipement de ce joueur (@cloneequip). Le serveur refuse sur soi-même.": "Copia SOBRE MÍ el equipo de este jugador (@cloneequip). El servidor lo rechaza sobre uno mismo."
