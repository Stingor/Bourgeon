"Chance qu'une attaque normale porte.\n\n80 % + votre HIT - le FLEE du monstre, bornée entre 5 % et 100 %.\n\nVotre HIT vaut votre NIVEAU DE BASE + votre DEX : la moitié du calcul vient donc de votre niveau, pas de vos points. Le serveur plafonne la part du niveau (600 actuellement), au-delà seule la DEX compte encore.\n\nNe tient compte ni des compétences, ni des cartes conditionnelles.": "Probabilidad de que un ataque normal acierte.\n\n80 % + tu HIT - el FLEE del monstruo, acotado entre el 5 % y el 100 %.\n\nTu HIT es tu NIVEL BASE + tu DEX: la mitad del cálculo viene, pues, de tu nivel, no de tus puntos. El servidor limita la parte del nivel (600 actualmente), más allá de la cual solo cuenta la DEX.\n\nNo tiene en cuenta ni las habilidades ni las cards condicionales."
"Chance qu'une attaque soit un coup critique. Ce n'est PAS un multiplicateur de dégâts.\n\nVotre CRIT moins 0,2 point par LUK du monstre. Un critique remplace le jet de précision (il ne rate jamais) et ignore la DEF.": "Probabilidad de que un ataque sea un golpe crítico. Esto NO es un multiplicador de daño.\n\nTu CRIT menos 0,2 puntos por cada LUK del monstruo. Un crítico sustituye a la tirada de precisión (nunca falla) e ignora la DEF."
"Chance qu'une de ses attaques vous atteigne réellement, esquive parfaite déduite.\n\n80 % + son HIT - votre FLEE, bornée entre 5 % et 100 %, puis amputée de votre esquive parfaite, qui annule l'attaque avant tout jet (elle bloque même un critique).\n\nVotre FLEE vaut votre NIVEAU DE BASE + votre AGI : monter de niveau vous fait esquiver davantage, sans dépenser un point. Le serveur plafonne la part du niveau (600 actuellement), au-delà seule l'AGI compte encore.\n\nVotre FLEE chute par ailleurs de 10 % par monstre au-delà du deuxième qui vous prend pour cible : en pack, le chiffre réel est plus élevé.": "Probabilidad de que uno de sus ataques te alcance de verdad, descontada la evasión perfecta.\n\n80 % + su HIT - tu FLEE, acotado entre el 5 % y el 100 %, y luego recortado por tu evasión perfecta, que anula el ataque antes de cualquier tirada (bloquea incluso un crítico).\n\nTu FLEE es tu NIVEL BASE + tu AGI: subir de nivel te hace esquivar más sin gastar un punto. El servidor limita la parte del nivel (600 actualmente), más allá de la cual solo cuenta la AGI.\n\nTu FLEE también baja un 10 % por cada monstruo más allá del segundo que te tenga como objetivo: en un grupo, la cifra real es más alta."
