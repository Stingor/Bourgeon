# en: CEZ2STREffect instances are normally set aside (different pipeline).\nTick to check whether an uncaptured effect belongs to that family:\nif it then appears under \"captured effect_id\", it does.\n/!\\ May cause double drawing elsewhere: diagnostics only.
"Les instances CEZ2STREffect sont normalement écartées (autre pipeline).\nCoche pour vérifier si un effet non capturé appartient à cette famille :\ns'il apparaît alors dans « effect_id capturés », c'est le cas.\n/!\\ Peut provoquer un double dessin ailleurs : diagnostic uniquement.": ""
# en: Useful to isolate a regression: tick, then check whether NATIVE rendering\n(z-order of headgear/costumes) becomes correct again.\nTicked = the aura/status family is no longer captured nor composed\nonto the doll (Perm_Frost & co will vanish from the preview).
"Sert à isoler une régression : coche, puis regarde si le rendu NATIF\n(z-order des chapeaux/costumes) redevient correct.\nCoché = la famille aura/statut n'est plus ni capturée ni composée\nsur le doll (Perm_Frost & co disparaîtront de l'aperçu).": ""
