"produce_db contient des recettes dont aucune classe de ce serveur n'apprend la compétence. Elles sont masquées par défaut : le serveur les refuserait. Le critère est l'arbre des compétences, pas le mode renewal — ce serveur est pre-renewal et ouvre pourtant les classes de 3e, dont les recettes sont bien jouables.": "produce_db contiene recetas cuya habilidad no aprende ninguna clase de este servidor. Están ocultas por defecto: el servidor las rechazaría. El criterio es el árbol de habilidades, no el modo renewal; este servidor es pre-renewal y aun así abre las clases de 3.ª, cuyas recetas sí son jugables."
