"Le client annonce déjà le sort dans une bulle au-dessus de la tête — pour les joueurs, pas pour les monstres. « Si pas déjà annoncé » ne l'écrit donc que là où l'information manque.\nLe nom lui-même vient du paquet d'incantation, que le client jette sans le transmettre à sa barre : sans paquet capté, seul le temps s'affiche.": "El cliente ya anuncia la habilidad en un bocadillo sobre la cabeza — para los jugadores, no para los monstruos. «Solo si no se anuncia ya» lo escribe entonces solo donde falta la información.\nEl nombre en sí viene del paquete de lanzamiento, que el cliente descarta sin pasarlo a su barra: sin paquete captado, solo se muestra el tiempo."
"Si pas déjà annoncé": "Solo si no se anuncia ya"
"Sous une bulle, l'étiquette passe à droite de la barre : la bulle occupe exactement la place au-dessus.": "Bajo un bocadillo, la etiqueta pasa a la derecha de la barra: el bocadillo ocupa exactamente el sitio de encima."
"Toujours": "Siempre"

# Blocage du clic gauche sur les NPC a identifiant fixe (entity_context_menu.cc).
"Le NPC %u": "El NPC %u"
"%s : vous avez bloqué le clic gauche sur ce NPC. Clic droit dessus pour le débloquer.": "%s: has bloqueado el clic izquierdo en este NPC. Clic derecho para desbloquearlo."
"%s : le clic gauche est de nouveau actif.": "%s: el clic izquierdo vuelve a funcionar."
"%s : le clic gauche ne fait plus rien sur lui. Clic droit pour le débloquer ou lui parler.": "%s: el clic izquierdo ya no hace nada sobre él. Clic derecho para desbloquearlo o para hablarle."
"Bloquer le clic gauche###ctxmenu_npcblock": "Bloquear el clic izquierdo###ctxmenu_npcblock"
"Comme le clic gauche : le personnage s'approche et ramasse. Le serveur revalide la distance et le droit de butin.": "Como el clic izquierdo: el personaje se acerca y lo recoge. El servidor revalida la distancia y el derecho al botín."
"Objet illisible : il vient sans doute d'être ramassé.": "Objeto ilegible: seguramente acaba de ser recogido."
"Objet non identifié : le jeu ne dit pas encore ce que c'est.": "Objeto no identificado: el juego aún no dice qué es."
"Linker cet objet": "Enlazar este objeto"
"Ramassage automatique###ctxmenu_aloot": "Recogida automática###ctxmenu_aloot"
"La liste @alootid du compte — la même que dans la description et les liens : ces objets vont droit dans l'inventaire quand ils tombent pour vous.": "La lista @alootid de la cuenta — la misma que en la descripción y los enlaces: esos objetos van directos al inventario cuando caen para ti."
"Coché, le clic gauche sur ce NPC ne fait plus rien du tout : ni dialogue, ni déplacement. Le menu du clic droit reste disponible, « Interagir » compris, et viser une zone avec un sort continue de marcher par-dessus lui.\nRéglage du client, gardé sur cette machine : il ne suit pas le personnage, et un script déclenché en MARCHANT dessus s'exécutera toujours.": "Marcado, el clic izquierdo sobre este NPC ya no hace nada: ni diálogo, ni desplazamiento. El menú del clic derecho sigue disponible, «Interactuar» incluido, y apuntar una zona con una habilidad sigue funcionando por encima de él.\nAjuste del cliente, guardado en esta máquina: no sigue al personaje, y un script activado al CAMINAR sobre él se ejecutará igualmente."
"Blocage du clic sur les NPC de service###ctxmenu_npcblock_opt": "Bloqueo del clic en los NPC de servicio###ctxmenu_npcblock_opt"
"Les NPC de la capitale (kafra, job master, styliste, warpers…) se tiennent au milieu du passage et s'ouvrent quand on cherchait à marcher. Clic droit sur l'un d'eux, puis « Bloquer le clic gauche » : il devient une zone morte, le clic ne déclenche plus rien.\nDécoché ici, la case n'est plus proposée et les NPC déjà bloqués redeviennent cliquables — la liste, elle, est conservée.": "Los NPC de la capital (kafra, job master, estilista, warpers…) se plantan en medio del paso y se abren cuando solo querías caminar. Clic derecho en uno de ellos, luego «Bloquear el clic izquierdo»: se convierte en una zona muerta, el clic ya no activa nada.\nDesmarcado aquí, la casilla deja de ofrecerse y los NPC ya bloqueados vuelven a ser clicables — la lista, en cambio, se conserva."
"Aucun NPC bloqué.": "Ningún NPC bloqueado."
"Débloquer": "Desbloquear"
"NPC %u": "NPC %u"

