# en: The learnt level of the Upgrade Weapon skill IS the cap: the server refuses any weapon already at that refine (and never beyond +10).
"Le niveau appris de la compétence Upgrade Weapon EST le plafond : le serveur refuse toute arme déjà à ce refine (et jamais au-delà de +10).": ""
# en: The EXACT probability of this attempt, not an estimate.\n\nThe server computes per = Rate/100 + (job_level - 50) / 2, then succeeds if per > rnd()%%100. Since the roll is uniform over 0..99, the probability is exactly per.\n\nThe base Rate comes from the server's refine table (weapon level × refine aimed at). A job level below 50 gives a NEGATIVE bonus: this is not a mistake, the server really does that.
"Probabilité EXACTE de cette tentative, pas une estimation.\n\nLe serveur calcule per = Rate/100 + (job_level - 50) / 2, puis réussit si per > rnd()%%100. Comme le tirage est uniforme sur 0..99, la probabilité vaut exactement per.\n\nLe Rate de base vient de la table de refine du serveur (niveau d'arme × refine visé). Un job level inférieur à 50 donne un bonus NÉGATIF : ce n'est pas une erreur, le serveur fait bien cela.": ""
# en: Attempt sent — waiting for the server…
"Tentative envoyée — en attente du serveur…": ""
