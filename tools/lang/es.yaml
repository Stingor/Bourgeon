"Valeurs BRUTES lues à instance+0x04, pour établir leur encodage :\néquipe un costume dont tu connais l'ordinal, puis déséquipe-le et\nregarde quelle valeur disparaît.": "Valores EN BRUTO leídos en instancia+0x04, para establecer su codificación:\nequipa un traje cuyo ordinal conozcas, luego quítatelo y\nmira qué valor desaparece."
