"Dans la fenêtre du storage, attrapez le TITRE d'une colonne et faites-la glisser à gauche ou à droite. L'ordre choisi est retenu d'une session à l'autre, et vaut pour les deux dispositions d'onglets.\nLe clic droit sur un en-tête propose la même remise à plat que le bouton ci-dessous.": "En la ventana del storage, agarra el TÍTULO de una columna y arrástrala a la izquierda o a la derecha. El orden elegido se conserva de una sesión a otra y vale para las dos disposiciones de pestañas.\nEl clic derecho en un encabezado ofrece el mismo restablecimiento que el botón de abajo."
