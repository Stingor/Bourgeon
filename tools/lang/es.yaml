"Décoché : la carte est cliquable — la glisser la déplace, les poignées\ndes deux coins du bas la redimensionnent en gardant son carré, la\nmolette zoome, et le bouton de réglages reste affiché.\n\nCoché : la souris passe au travers, la carte n'est plus qu'un décor.\nMaintenir Maj au-dessus la réveille alors le temps du geste, bouton\nde réglages compris.": "Sin marcar: el mapa es clicable — arrástralo para moverlo, los tiradores\nde las dos esquinas inferiores lo redimensionan manteniéndolo cuadrado,\nla rueda hace zoom y el botón de ajustes queda visible.\n\nMarcado: el ratón lo atraviesa, el mapa es solo decorado.\nMantener Mayús encima lo despierta mientras dure el gesto, botón de\najustes incluido."
