"Pour qui préfère la suivre dans son interface. La barre « Cast » se règle avec les autres barres, dans la section « Basic Info ».": "Para quien prefiere seguirla en su interfaz. La barra «Cast» se ajusta con las demás barras, en la sección «Basic Info»."
