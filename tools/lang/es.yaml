# ── Ventana Party/Amigos, HUD de rejilla, y tres titulos de modal ────────────
"Afficher la grille de groupe": "Mostrar la rejilla de party"
"Remplace le HUD de groupe du client par une grille de tuiles : la barre de vie EST le fond de la tuile, et sa couleur dit l'état du membre. Le HUD d'origine est masqué tant que cette grille est active.": "Sustituye el HUD de party del cliente por una rejilla de casillas: la barra de vida ES el fondo de la casilla, y su color indica el estado del miembro. El HUD original queda oculto mientras esta rejilla está activa."
"Verrouiller la position": "Bloquear la posición"
"Fige le cadre et laisse passer les clics vers le jeu.\n\nMaintenir MAJ le déverrouille le temps d'un déplacement : pas besoin de revenir décocher ici.\n\nÀ savoir : MAJ+clic est l'attaque forcée du jeu. Tant que la touche est tenue, un clic sur le cadre le déplace au lieu de frapper ce qu'il y a dessous.": "Fija el marco y deja pasar los clics al juego.\n\nMantener MAYÚS lo desbloquea durante un desplazamiento: no hace falta volver aquí a desmarcarlo.\n\nA tener en cuenta: MAYÚS+clic es el ataque forzado del juego. Mientras la tecla esté pulsada, un clic sobre el marco lo desplaza en vez de golpear lo que haya debajo."
"Disposition": "Disposición"
"1 colonne donne une liste, comme le HUD d'origine ; 2 ou 3 donnent la grille compacte des raid frames.": "1 columna da una lista, como el HUD original; 2 o 3 dan la rejilla compacta de los raid frames."
"Largeur des tuiles": "Ancho de las casillas"
"Hauteur des tuiles": "Alto de las casillas"
"Contenu": "Contenido"
"Icône de classe": "Icono de clase"
"L'art du client. C'est ce qui rend une grille lisible d'un coup d'œil : on reconnaît le soigneur à sa silhouette, pas à son nom.": "El arte del propio cliente. Es lo que hace legible una rejilla de un vistazo: reconoces al sanador por su silueta, no por su nombre."
"M'inclure dans la grille": "Incluirme en la rejilla"
"Garder les membres hors ligne": "Mantener a los miembros desconectados"
"Afficher le niveau": "Mostrar el nivel"
"Afficher les PV chiffrés": "Mostrar los PV en cifras"
"Barre de SP": "Barra de SP"
"Le SP d'un autre joueur ne circule dans AUCUN paquet du jeu : il est demandé au serveur membre par membre. Il n'apparaît donc que pour ceux qui sont à portée de vue.": "El SP de otro jugador no viaja en NINGÚN paquete del juego: se le pide al servidor miembro por miembro. Solo aparece, por tanto, para quienes están a la vista."
"Hauteur de la barre de SP": "Alto de la barra de SP"
"Le panneau qui porte les tuiles. Sans lui, une grille sombre sur une carte sombre devient impossible à distinguer du décor.": "El panel que sostiene las casillas. Sin él, una rejilla oscura sobre un mapa oscuro se vuelve imposible de distinguir del decorado."
"Fond d'une tuile": "Fondo de una casilla"
"Vie — haute": "Vida — alta"
"Vie — moyenne": "Vida — media"
"Vie — basse": "Vida — baja"
"Liseré de ma tuile": "Borde de mi casilla"
"Seuil « vie moyenne »": "Umbral de vida media"
"Seuil « vie basse »": "Umbral de vida baja"
"En dessous de ces pourcentages, la tuile change de couleur. C'est ce qui permet de repérer un blessé sans lire un seul chiffre.": "Por debajo de estos porcentajes, la casilla cambia de color. Es lo que permite detectar a un herido sin leer una sola cifra."
"Hors ligne": "Desconectado"
"Hors de portée": "Fuera de alcance"
"Client Update Required###bourgeon_integrity_outdated": "Client Update Required###bourgeon_integrity_outdated"
"Repartir de zéro###bourgeon_style_reset": "Empezar de cero###bourgeon_style_reset"
"Supprimer mon style###bourgeon_style_delete": "Eliminar mi estilo###bourgeon_style_delete"
"Oublier ce corps###bourgeon_style_forget_body": "Olvidar este cuerpo###bourgeon_style_forget_body"
"Groupe / Amis": "Party / Amigos"
"Groupe (grille)": "Party (cuadrícula)"
"[État: %s]": "[Estado: %s]"
"La case s'assombrit à mesure que l'état s'écoule : on voit d'un coup d'œil lesquels sont près de tomber.\n\n⚠ Un état sans échéance n'est jamais voilé : il n'a pas de part écoulée, et le griser à moitié le ferait croire à mi-course.": "La casilla se oscurece a medida que el estado transcurre: se ve de un vistazo cuáles están a punto de caer.\n\n⚠ Un estado sin vencimiento nunca se sombrea: no tiene parte transcurrida, y sombrearlo a medias lo haría parecer a mitad de camino."
"Le cadre « États » est décoché dans Cadres, ci-dessus.": "El marco «Estados» está desmarcado en Marcos, arriba."
"Le cadre se replie déjà sur sa largeur : ce réglage force en plus un nombre fixe par rangée, pour un cadre haut et étroit plutôt que long et plat.": "El marco ya salta de línea según su anchura; este ajuste fuerza además un número fijo por fila, para un marco alto y estrecho en vez de largo y plano."
"Haut gauche": "Arriba a la izquierda"
"Haut droite": "Arriba a la derecha"
"Bas gauche": "Abajo a la izquierda"
"Bas droite": "Abajo a la derecha"
"Le coin du cadre d'où les icônes se rangent, et donc le sens dans lequel la barre grandit.\n\n⚠ Ancrée du mauvais côté, la rangée RECULE quand un état tombe et toutes les icônes glissent. Une barre posée à droite de l'écran veut pousser vers la gauche, celle du bas vers le haut.": "La esquina del marco desde la que se colocan los iconos, y por tanto el sentido en que crece la barra.\n\n⚠ Anclada del lado equivocado, la fila RETROCEDE cuando cae un estado y todos los iconos se desplazan. Una barra puesta a la derecha de la pantalla quiere empujar hacia la izquierda, y la de abajo hacia arriba."
"Remplit l'affichage de faux états, aux durées étagées, le temps de le régler — sans attendre d'en avoir de vrais.\n\nNe se garde pas d'une session à l'autre.": "Llena la visualización con estados falsos, de duraciones escalonadas, mientras la ajustas — sin esperar a tener algunos de verdad.\n\nNo se conserva de una sesión a otra."
"Remplit la barre de faux états, aux durées étagées, le temps de la régler — sans attendre d'en avoir de vrais.\n\nNe se garde pas d'une session à l'autre.": "Llena la barra con estados falsos, de duraciones escalonadas, mientras la ajustas — sin esperar a tener algunos de verdad.\n\nNo se conserva de una sesión a otra."
"Barre d'états moderne": "Barra de estados moderna"
"Remplace la barre d'icônes du client par la nôtre : durée, grisage de la part écoulée, infobulle complète, tri et lignes.\n\nÉteinte, la barre d'origine revient telle quelle.": "Sustituye la barra de iconos del cliente por la nuestra: duración, sombreado de la parte transcurrida, información completa, orden y filas.\n\nApagada, vuelve la barra original tal cual."
"Vaut pour les DEUX barres : la moderne comme celle du client.": "Vale para las DOS barras: la moderna y la del cliente."
"Verrouillée, la barre est figée et laisse passer les clics. Maintenez MAJ au-dessus d'elle pour la déplacer sans la déverrouiller.": "Bloqueada, la barra queda fija y deja pasar los clics. Mantén MAYÚS sobre ella para moverla sin desbloquearla."
"Lignes": "Filas"
"Nombre maximum": "Cantidad máxima"
"La barre se replie DÉJÀ sur sa largeur ; ce réglage force en plus un nombre fixe par rangée, pour une barre haute et étroite plutôt que longue et plate.": "La barra YA salta de línea según su anchura; este ajuste fuerza además un número fijo por fila, para una barra alta y estrecha en vez de larga y plana."
"« Bientôt fini d'abord » met en tête ce qu'il faudra relancer.\n\n⚠ Un état sans durée n'a pas de place dans un tri par durée : il va toujours en fin, quel que soit le sens.": "«Que acaba antes primero» pone al principio lo que habrá que relanzar.\n\n⚠ Un estado sin duración no tiene sitio en un orden por duración: va siempre al final, sea cual sea el sentido."
"La case s'assombrit à mesure que l'état s'écoule : on voit d'un coup d'œil ce qui est près de tomber.\n\n⚠ Un état sans échéance n'est jamais voilé — il n'a pas de part écoulée, et le griser à moitié le ferait croire à mi-course.": "La casilla se oscurece a medida que el estado transcurre: se ve de un vistazo lo que está a punto de caer.\n\n⚠ Un estado sin vencimiento nunca se sombrea — no tiene parte transcurrida, y sombrearlo a medias lo haría parecer a mitad de camino."
"La tête du personnage à la place de l'icône de classe, comme la fenêtre des membres de guilde.\n\nPour qui est à l'écran, elle vient de son sprite et suit un changement de coiffure aussitôt. Pour les autres, le serveur la donne sur demande — un joueur HORS LIGNE n'en a pas, et dans l'onglet Amis la ligne reste alors sans vignette.": "La cabeza del personaje en lugar del icono de clase, como la ventana de miembros de guild.\n\nPara quien está en pantalla viene de su sprite y sigue al instante un cambio de peinado. Para los demás el servidor la facilita bajo petición — un jugador DESCONECTADO no tiene, y en la pestaña Amigos la fila se queda entonces sin miniatura."
"Aucune": "Ninguna"
"Tête du personnage": "Cabeza del personaje"
"Fenêtre": "Ventana"
"Empêche le redimensionnement, PAS le déplacement : la fenêtre se déplace toujours par sa barre de titre.\n\nUne fois la largeur réglée, viser le bord au lieu du titre la dérègle d'un pixel et recompose les lignes sous la souris.": "Impide el redimensionado, NO el desplazamiento: la ventana sigue moviéndose por su barra de título.\n\nUna vez ajustado el ancho, apuntar al borde en lugar del título lo descuadra un píxel y recompone las filas bajo el ratón."
"Affiche le groupe en grille de tuiles, à la place du HUD du client. Le réglage est le même que dans Interface de jeu.": "Muestra el grupo como una cuadrícula de casillas, en lugar del HUD del cliente. Es el mismo ajuste que en Interfaz de juego."
