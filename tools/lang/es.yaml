# en: In-game mirror of everything the client logs (LogInfo / LogDiag / LogError), in place of the Windows console.\n\nThe text is SELECTABLE and copyable: mouse selection, Ctrl+A, Ctrl+C, or the \"Copy all\" button. A filter field narrows the display to a substring.\n\nStaff only, and the right is rechecked every frame: the window disappears if the group level changes mid-session.
"Miroir en jeu de tout ce que le client journalise (LogInfo / LogDiag / LogError), à la place de la console Windows.\n\nLe texte est SÉLECTIONNABLE et copiable : sélection à la souris, Ctrl+A, Ctrl+C, ou le bouton « Copier tout ». Un champ de filtre restreint l'affichage à une sous-chaîne.\n\nRéservé au staff, et le droit est revérifié à chaque frame : la fenêtre disparaît si le niveau de groupe change en cours de session.": ""
# en: Korean glyphs (restart)
"Glyphes coréens (redémarrage)": ""
# en: Loads Korean characters into the fonts. Useful ONLY to read game file paths in the log — nothing in game is displayed in Korean.\n\n⚠ Takes effect on the NEXT LAUNCH: fonts are prepared once at startup, and the DirectDraw engine cannot rebuild them mid-game.\n\nOff, the font atlas is twenty times lighter and the client starts faster. A Korean character would then show as a square.
"Charge les caractères coréens dans les polices. Utile UNIQUEMENT pour lire les chemins des fichiers du jeu dans le journal — rien en jeu ne s'affiche en coréen.\n\n⚠ Prend effet au PROCHAIN LANCEMENT : les polices sont préparées une seule fois au démarrage, et le moteur DirectDraw ne sait pas les refaire en cours de partie.\n\nÉteint, l'atlas de polices est vingt fois plus léger et le client démarre plus vite. Un caractère coréen y apparaîtrait en carré.": ""
