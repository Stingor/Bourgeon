"Le client n'ouvrait de menu que sur un joueur, son pet, son homoncule ou son mercenaire. Coché, le menu s'ouvre aussi sur les monstres et les NPC.": "El cliente solo abría un menú sobre un jugador, su mascota, su homúnculo o su mercenario. Marcado, el menú también se abre sobre monstruos y NPC."
"Le menu sur son propre personnage ne porte que « Copier mon nom » (plus les identifiants sous « Outils du staff »). Décoché, le clic droit sur soi-même repart au client sans rien ouvrir ni rien avaler.\nSans « Sur toutes les entités », ce menu ne s'ouvre de toute façon jamais : le client n'en a jamais eu sur soi.": "El menú sobre tu propio personaje solo lleva \"Copiar mi nombre\" (más los identificadores bajo \"Herramientas del staff\"). Desmarcado, el clic derecho sobre ti mismo vuelve al cliente sin abrir nada ni tragarse el clic.\nSin \"En cualquier entidad\" ese menú no se abre nunca de todas formas: el cliente nunca tuvo uno sobre uno mismo."
