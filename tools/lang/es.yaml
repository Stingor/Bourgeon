"Adresses de retour des fonctions qui soumettent des primitives, avec leur\nnombre d'appels sur la dernière frame.\nMéthode : relève la liste effet ÉTEINT, puis effet ACTIF —\nl'adresse qui APPARAÎT est celle qui dessine l'effet.": "Direcciones de retorno de las funciones que envían primitivas, con su\nnúmero de llamadas en el último fotograma.\nMétodo: toma la lista con el efecto APAGADO, luego con él ACTIVO —\nla dirección que APARECE es la que dibuja el efecto."
