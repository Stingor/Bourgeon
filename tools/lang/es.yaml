"Verrouiller les barres": "Bloquear las barras"
"Verrouillée : les barres ne bougent plus et laissent passer les clics au jeu.\nDéverrouillée : glissez-les pour les déplacer, tirez le coin pour redimensionner.": "Bloqueadas: las barras ya no se mueven y dejan pasar los clics al juego.\nDesbloqueadas: arrástralas para moverlas, tira de una esquina para redimensionar."
"Aimanter les barres (snap)": "Imantar las barras"
"Quand tu glisses une barre près d'une autre, ses bords s'alignent et se collent automatiquement (~10px).\nÉloigne-la pour la détacher. Les barres restent indépendantes.": "Cuando arrastras una barra cerca de otra, sus bordes se alinean y se pegan automáticamente (~10px).\nAléjala para separarla. Las barras siguen siendo independientes."
