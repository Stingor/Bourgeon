# en: Shows the category tabs (All, Favourites, Consumables, Weapons...) and the « Subtype » combo that depends on them.\nUntick for a single list, with no type filter: the view goes back to « All » (nothing stays hidden behind) and « Tab images » loses its purpose. « Vertical tabs », for its part, keeps deciding the orientation of the STORAGE tabs.\nFavourites stay markable (Ctrl + left click, context menu): only the tab isolating them disappears.
"Affiche les onglets de catégorie (Tout, Favoris, Consos, Armes...) et le combo « Sous-type » qui en dépend.\nDécoche pour une liste unique, sans filtre de type : la vue repasse à « Tout » (rien ne reste masqué derrière) et « Images d'onglet » n'a plus d'objet. « Onglets verticaux », lui, continue de décider de l'orientation des onglets de STORAGE.\nLes favoris restent marquables (Ctrl + clic gauche, menu contextuel) : seul l'onglet qui les isole disparaît.": ""
# en: Storage tabs
"Onglets de storage": ""
# en: Shows one tab per storage you have access to (main and alternates): a click switches from one to the other without going through @storage / @storagealtN.\nThe tabs sit PERPENDICULAR to the category ones — in a column on the left if the categories are horizontal, in a row at the top if they are vertical.\nThe list comes from the server: it only shows what your account is allowed to open, and only appears from two storages onwards.\nEach tab carries its NUMBER by default; right-click it to give it a name of your own and an item icon (or drag an item from the storage onto it to take its own).
"Affiche un onglet par entrepôt auquel vous avez accès (principal et alternatifs) : un clic bascule de l'un à l'autre sans repasser par @storage / @storagealtN.\nLes onglets se placent PERPENDICULAIREMENT à ceux des catégories — en colonne à gauche si les catégories sont horizontales, en rangée en haut si elles sont verticales.\nLa liste vient du serveur : elle ne montre que ce que votre compte a le droit d'ouvrir, et n'apparaît qu'à partir de deux entrepôts.\nChaque onglet porte son NUMÉRO par défaut ; clic droit dessus pour lui donner un nom à vous et une icône d'item (ou glissez-y un item du storage pour reprendre la sienne).": ""
