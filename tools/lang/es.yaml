# Grabador de zona: captura de una imagen fija (tecla de captura).
"Capturer une image :": "Capturar una imagen:"
"Un PNG de la MÊME zone, pris à l'instant de l'appui : ni décompte, ni durée, rien à arrêter.\n\nL'image sort à la taille réelle de la zone — la « largeur max » ci-dessus ne concerne que le GIF, où elle sert à contenir le poids d'une animation.\n\nElle contient elle aussi ce que tu vois, fenêtres Bourgeon comprises. Ce panneau, donc, s'il est ouvert : c'est en jeu, panneau fermé, que la touche sert.": "Un PNG de la MISMA zona, tomado en el instante de pulsar: sin cuenta atrás, sin duración, nada que detener.\n\nLa imagen sale al tamaño real de la zona — la «anchura máxima» de arriba solo afecta al GIF, donde sirve para contener el peso de una animación.\n\nElla también contiene lo que ves, ventanas de Bourgeon incluidas. Este panel, pues, si está abierto: la tecla sirve en el juego, con el panel cerrado."
"la capture d'image de la zone": "la captura de imagen de la zona"
"Capture impossible : un enregistrement est en cours": "Captura imposible: hay una grabación en curso"
