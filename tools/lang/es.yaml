"Déverrouillé, une poignée apparaît à l'emplacement du bandeau : glisse-la où tu veux. Un exemple s'affiche tant que rien n'a été ramassé.\nVerrouillé, le bandeau ne capte plus aucun clic.": "Desbloqueado, aparece un asa en el sitio del banner: arrástrala donde quieras. Se muestra un ejemplo mientras no hayas recogido nada.\nBloqueado, el banner ya no capta ningún clic."
"Fond libre": "Fondo libre"
