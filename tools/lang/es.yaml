# en: Replaces the \"Monster Info\" window opened by the Sense skill. It adds what the skill packet does not carry: reliable name, EXP, ATK/MATK, base stats, modes, drops, spawn locations and skills. A monster's name in the source table of an item sheet opens it in one click.
