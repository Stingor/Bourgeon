# Bourgeon - catalogue de traduction : es
#
# Cle = le texte source francais, valeur = la traduction.
# Key = the French source string, value = your translation.
#
# Une valeur laissee VIDE garde le francais : on peut livrer a tout moment.
# An EMPTY value keeps the French text: the file is usable at any stage.
#
# Ne PAS toucher aux cles : elles doivent rester identiques, octet pour octet,
# aux chaines du code -- un accent retouche et la ligne cesse de correspondre.
# Do NOT edit the keys: a single changed byte silently breaks the match.
#
# Les \n, \t et \" sont des ECHAPPEMENTS : les reporter tels quels.
# Les termes de jeu restent en anglais : storage, cart, shop, alootid.

