"Tu as quitté DOOM depuis son menu. Le moteur ne peut pas\nredémarrer dans le même processus — relance le client pour rejouer.": "Has salido de DOOM desde su propio menú. El motor no puede reiniciarse\ndentro del mismo proceso — relanza el cliente para volver a jugar."
