"ON : storage ImGui moderne (icônes, onglets, tri, drag-drop). La fenêtre native ne s'ouvre plus du tout.\nOFF : storage natif classique, aucun viewer.": "ON: storage ImGui moderno (iconos, pestañas, ordenación, arrastrar y soltar). La ventana nativa ya no se abre en absoluto.\nOFF: storage nativo clásico, sin visor."
"Survoler un item affiche un aperçu SIMPLIFIÉ (nom, illustration, texte) dans un panneau au skin RO, posé au curseur et effacé dès que la souris quitte la ligne.\nLa description COMPLÈTE reste accessible au Ctrl + clic droit / menu contextuel.": "Pasar el ratón sobre un objeto muestra una vista previa SIMPLIFICADA (nombre, ilustración, texto) en un panel con skin RO, colocada en el cursor y borrada en cuanto el ratón sale de la fila.\nLa descripción COMPLETA sigue disponible con Ctrl + clic derecho / menú contextual."
"Dispose les catégories en liste verticale à gauche, comme la fenêtre native.\nOFF (défaut) : onglets horizontaux en haut.\nDécide aussi de l'orientation des onglets de storage, qui restent toujours PERPENDICULAIRES aux catégories.": "Dispone las categorías como una lista vertical a la izquierda, como la ventana nativa.\nOFF (por defecto): pestañas horizontales arriba.\nTambién decide la orientación de las pestañas de storage, que siempre quedan PERPENDICULARES a las categorías."
"Images d'onglet": "Imágenes de las pestañas"
"ON : tuiles images du client — jeu tab_* en disposition verticale, tabh_* en horizontale (all/use/wea/ammo/card/fav/cash/cos/etc). Les catégories sans art propre réutilisent celui de leur famille et portent alors un sigle (Am, Cs, Et).\nOFF : onglets texte — TabBar classique en horizontal, libellé écrit à la verticale en vertical.": "ON: las baldosas de imagen del cliente — el juego tab_* en disposición vertical, tabh_* en horizontal (all/use/wea/ammo/card/fav/cash/cos/etc). Las categorías sin arte propio reutilizan el de su familia y llevan además un signo (Am, Cs, Et).\nOFF: pestañas de texto — un TabBar clásico en horizontal, la etiqueta escrita en vertical en modo vertical."
"Affiche la barre de recherche par nom au-dessus de la liste.\nDécoche pour gagner une ligne (le filtre est alors vidé).": "Muestra la barra de búsqueda por nombre encima de la lista.\nDesmarca para ganar una línea (el filtro se vacía entonces)."
"Filtres par type d'item": "Filtros por tipo de objeto"
"Affiche les onglets de catégorie (Tout, Favoris, Consos, Armes...) et le combo « Sous-type » qui en dépend.\nDécoche pour une liste unique, sans filtre de type : la vue repasse à « Tout » (rien ne reste masqué derrière) et « Images d'onglet » n'a plus d'objet. « Onglets verticaux », lui, continue de décider de l'orientation des onglets de STORAGE.\nLes favoris restent marquables (Ctrl + clic gauche, menu contextuel) : seul l'onglet qui les isole disparaît.": "Muestra las pestañas de categoría (Todo, Favoritos, Consumibles, Armas...) y el combo « Subtipo » que depende de ellas.\nDesmarca para una lista única, sin filtro de tipo: la vista vuelve a « Todo » (nada queda oculto detrás) e « Imágenes de las pestañas » pierde su sentido. « Pestañas verticales », por su parte, sigue decidiendo la orientación de las pestañas de STORAGE.\nLos favoritos se pueden seguir marcando (Ctrl + clic izquierdo, menú contextual): solo desaparece la pestaña que los aísla."
"Onglets de storage": "Pestañas de storage"
"Affiche un onglet par entrepôt auquel vous avez accès (principal et alternatifs) : un clic bascule de l'un à l'autre sans repasser par @storage / @storagealtN.\nLes onglets se placent PERPENDICULAIREMENT à ceux des catégories — en colonne à gauche si les catégories sont horizontales, en rangée en haut si elles sont verticales.\nLa liste vient du serveur : elle ne montre que ce que votre compte a le droit d'ouvrir, et n'apparaît qu'à partir de deux entrepôts.\nChaque onglet porte son NUMÉRO par défaut ; clic droit dessus pour lui donner un nom à vous et une icône d'item (ou glissez-y un item du storage pour reprendre la sienne).": "Muestra una pestaña por cada storage al que tengas acceso (principal y alternativos): un clic pasa de uno a otro sin usar @storage / @storagealtN.\nLas pestañas quedan PERPENDICULARES a las de categoría — en columna a la izquierda si las categorías son horizontales, en fila arriba si son verticales.\nLa lista viene del servidor: solo muestra lo que tu cuenta tiene permitido abrir, y solo aparece a partir de dos storages.\nCada pestaña lleva su NÚMERO por defecto; haz clic derecho en ella para darle un nombre propio y un icono de objeto (o arrastra un objeto del storage sobre ella para tomar el suyo)."
"Valeur estimée du storage": "Valor estimado del storage"
"Somme des prix de revente NPC (× quantité) des items AFFICHÉS — elle suit donc l'onglet, le sous-type et le filtre.": "Suma de los precios de reventa a NPC (× cantidad) de los objetos MOSTRADOS — así que sigue la pestaña, el subtipo y el filtro."
"Index storage (slot) — un item récemment ajouté a un index élevé.": "Índice de storage (casilla) — un objeto añadido recientemente tiene un índice alto."
