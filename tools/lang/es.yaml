"Case native « Safe check for over 10 mil zeny » : demande une confirmation dès qu'un prix dépasse le seuil du serveur.": "Casilla nativa « Safe check for over 10 mil zeny »: pide una confirmación en cuanto un precio pasa el umbral del servidor."
