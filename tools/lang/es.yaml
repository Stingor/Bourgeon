"ON : inventaire ImGui moderne (grille d'icônes, onglets, recherche, double-clic utiliser/équiper, clic-droit, drag) et la fenêtre native est cachée.\nOFF (défaut) : inventaire natif classique, aucun viewer.\n\nInclut la fenêtre de SERTISSAGE de cartes (double-clic sur une carte) : elle remplace le popup natif « Insert Card ». La liste des équipements compatibles reste calculée par le serveur, donc identique au natif.": "ON: inventario ImGui moderno (rejilla de iconos, pestañas, búsqueda, doble clic para usar/equipar, clic derecho, arrastrar), y la ventana nativa se oculta.\nOFF (por defecto): inventario nativo clásico, sin visor.\n\nIncluye la ventana de INSERCIÓN de cards (doble clic en una card): sustituye al popup nativo « Insert Card ». La lista de equipo compatible la sigue calculando el servidor, así que es idéntica a la nativa."
"ON (défaut) : onglets en colonne à gauche de la grille, comme la fenêtre native (images tab_*).\nOFF : rangée horizontale au-dessus de la grille (images tabh_*).": "ON (por defecto): pestañas en columna a la izquierda de la rejilla, como la ventana nativa (imágenes tab_*).\nOFF: fila horizontal encima de la rejilla (imágenes tabh_*)."
"Placement libre des items": "Colocación libre de los objetos"
"Glisse un item sur une case vide pour l'y fixer ; sur une case occupée, les deux s'échangent. Les items sans case attribuée remplissent les trous restants, donc un nouvel objet ramassé ne bouscule plus ta disposition.\n\nL'onglet « Tout » n'est PAS concerné : il mélange les catégories, donc une case n'y désigne pas le même emplacement que dans l'onglet d'origine de l'item. Il garde le remplissage automatique.\n\nNécessite « Verrouiller la taille » : les cases sont repérées par un index absolu, qu'un changement de largeur décalerait.": "Arrastra un objeto a una casilla vacía para fijarlo ahí; sobre una ocupada, los dos se intercambian. Los objetos sin casilla asignada rellenan los huecos restantes, así que un objeto recién recogido ya no altera tu disposición.\n\nLa pestaña « Todo » NO está afectada: mezcla categorías, así que una casilla ahí no designa el mismo sitio que en la pestaña propia del objeto. Conserva el relleno automático.\n\nRequiere « Bloquear el tamaño »: las casillas se identifican por un índice absoluto, que un cambio de anchura desplazaría."
