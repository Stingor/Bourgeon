"- Arrows / mouse wheel adjust value (Shift = larger step)\n- Ctrl-Click for direct input.": "- Las flechas / la rueda del ratón ajustan el valor (Shift = paso mayor)\n- Ctrl-Clic para introducirlo directamente."
"Police de toute l'UI ImGui. Le gras et l'italique suivent la famille choisie, ainsi que la chatbox réglée sur « Système ».\n\nMalgun Gothic est la seule à couvrir le coréen : avec une autre, les chemins de fichiers du jeu (réglage de débogage) sortent en carrés.\nProggyClean est la police intégrée d'ImGui, minuscule et sans accents élégants.": "Fuente de toda la UI ImGui. La negrita y la cursiva siguen la familia elegida, igual que la chatbox puesta en « System ».\n\nMalgun Gothic es la única que cubre el coreano: con otra, las rutas de archivo del juego (ajuste de depuración) salen como cuadrados.\nProggyClean es la fuente integrada de ImGui, diminuta y con acentos sencillos."
"Agrandit TOUTE l'interface Bourgeon — texte, fenêtres, boutons, cadres — sans toucher au jeu lui-même. Pour les grands écrans très définis (ultrawide, 4K), où une interface calibrée en pixels devient minuscule.\n\nLes fenêtres déjà ouvertes gardent la taille qu'on leur avait donnée : les redimensionner une fois suffit.\n\nSans effet en DirectX 7 (le réglage y est grisé) : ce mode ne sait pas redessiner les lettres à une autre taille, il ne ferait que les étirer.": "Agranda TODA la interfaz de Bourgeon — texto, ventanas, botones, marcos — sin tocar el juego en sí. Para pantallas grandes de alta definición (ultrapanorámicas, 4K), donde una interfaz calibrada en píxeles se vuelve diminuta.\n\nLas ventanas ya abiertas conservan el tamaño que les diste: basta con redimensionarlas una vez.\n\nSin efecto en DirectX 7 (allí el ajuste aparece atenuado): ese modo no sabe redibujar las letras a otro tamaño, solo las estiraría."
"Sauvegarde les couleurs/luminosité/opacité actuelles sous un nom.\n« Appliquer » recharge un préréglage ; on peut se faire plusieurs thèmes.": "Guarda con un nombre los colores/brillo/opacidad actuales.\n« Aplicar » recarga un preset; puedes crearte varios temas."
