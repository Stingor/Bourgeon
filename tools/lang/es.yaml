# en: -> emitted but REJECTED by us (bug)
"-> émis mais REJETÉ par nous (bug)": ""
# en: draws    = EzEffect_Draw calls on OUR node\ninserts  = primitives submitted during that draw (before our filters)\ncaptured = what we keep after shape filtering\n\n0 draw          -> the node does not exist: problem UPSTREAM of rendering.\ndraws, 0 ins.   -> the sub-render emits nothing: missing resource\n                   (the loader fails silently) or condition not met.\nins. but 0 cap. -> the game emits and WE reject: that one is our bug.
"dessins  = appels d'EzEffect_Draw sur NOTRE nœud\ninserts  = primitives soumises pendant ce dessin (avant nos filtres)\ncapturés = ce qu'on garde après filtres de forme\n\n0 dessin        -> le nœud n'existe pas : problème AMONT du rendu.\ndessins, 0 ins. -> le sous-rendu n'émet rien : ressource absente\n                   (le chargeur échoue en silence) ou condition non remplie.\nins. mais 0 cap.-> le jeu émet et NOUS rejetons : là c'est notre bug.": ""
