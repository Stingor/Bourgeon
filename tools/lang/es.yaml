"Ce que le CLIENT ne peut pas savoir : le fichier de script d'un NPC, le spawn d'un monstre, qui a lancé une unité de compétence, à qui est réservé un objet au sol.\nRéservé au staff, et c'est le SERVEUR qui le vérifie.": "Lo que el CLIENTE no puede saber: el archivo de script de un NPC, el spawn de un monstruo, quién lanzó una unidad de habilidad, para quién está reservado un objeto del suelo.\nReservado al staff, y es el SERVIDOR quien lo comprueba."
