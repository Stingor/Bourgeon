"Repeint tout le terrain .gnd d'une couleur unie, sans toucher au reste\nde la scène : la géométrie et le z-buffer du sol restent intacts, donc\nl'occlusion par le terrain reste correcte.\nL'eau, le ciel et le brouillard ne sont PAS affectés.\nDX9 uniquement (le chemin de rendu DX7 est une autre famille de fonctions).": "Repinta todo el terreno .gnd de un color uniforme, sin tocar el resto\nde la escena: la geometría y el z-buffer del suelo quedan intactos, así que\nla oclusión por el terreno sigue siendo correcta.\nEl agua, el cielo y la niebla NO se ven afectados.\nSolo DX9 (la ruta de renderizado DX7 es otra familia de funciones)."
"(DX7 : non supporté)": "(DX7: no soportado)"
