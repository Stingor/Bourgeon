"Normale": "Normal"
"Basse": "Baja"
"Règle la part de temps PROCESSEUR que Windows accorde au jeu face aux autres programmes.\n\nHaute : le jeu passe avant le reste. Utile seulement si la machine est déjà chargée ; sur un PC au repos, aucun gain.\nNormale : à égalité avec les autres programmes. C'est le défaut.\nBasse : le jeu ne tourne que quand rien d'autre ne réclame le processeur — à réserver aux calculs de fond, il devient vite saccadé.\n\nSans effet sur la carte graphique : des ralentissements dus au GPU ne bougeront pas d'un cran.\nLe réglage ne vaut que fenêtre active — en arrière-plan, le client se met de lui-même en priorité basse.\nConservé d'une session à l'autre.": "Ajusta la parte de tiempo de PROCESADOR que Windows concede al juego frente a los demás programas.\n\nAlta: el juego va primero. Solo sirve si la máquina ya está cargada; en un PC en reposo, ninguna mejora.\nNormal: en igualdad con los demás programas. Es el valor por defecto.\nBaja: el juego solo se ejecuta cuando nada más reclama el procesador — resérvala para cálculos en segundo plano, se vuelve entrecortado enseguida.\n\nSin efecto sobre la tarjeta gráfica: las ralentizaciones causadas por la GPU no cambiarán.\nEl ajuste solo vale con la ventana activa — en segundo plano, el cliente baja a prioridad baja por sí mismo.\nSe conserva de una sesión a otra."
"Skin": "Skin"
"Par défaut": "Por defecto"
"Remplace les images de l'interface du client.\nLe changement recharge toutes les textures : un temps d'arrêt d'une fraction de seconde est normal.": "Sustituye las imágenes de la interfaz del cliente.\nAplicarlo recarga todas las texturas: una pausa de una fracción de segundo es normal."
"Aucun skin installé — seule l'apparence d'origine est disponible.": "Ningún skin instalado — solo está disponible el aspecto original."
"Les réglages graphiques (résolution, mode d'écran, filtrage) restent dans la fenêtre du client.": "Los ajustes gráficos (resolución, modo de pantalla, filtrado) siguen en la ventana del cliente."

