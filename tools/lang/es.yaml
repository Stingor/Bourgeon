"Le boss révélé par un Convex Mirror.\nHors du cadrage, l'icône se colle au bord de la carte\npour en donner la direction ; elle disparaît tant que le\nboss est mort (le client n'a plus de position à donner).": "El jefe revelado por un Convex Mirror.\nFuera de encuadre, el icono se pega al borde del mapa\npara indicar su dirección; desaparece mientras el jefe\nestá muerto (el cliente ya no tiene una posición que dar)."
