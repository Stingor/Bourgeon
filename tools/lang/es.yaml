# en: Storage shortcuts\n\n- Left click on an item: withdraw (Shift = the whole stack; a single one = direct;\n  a stack = context menu: To inventory 1 / all / quantity)\n- Ctrl + left click: (un)mark the item as a favourite (Favourites tab)\n- Right click: context menu (including Add to / Remove from favourites)\n- Ctrl + right click: description\n- Alt / Shift + right click: quick withdrawal of the whole stack to the inventory\n- Drag an item from the viewer -> inventory: withdrawal; -> cart: storage to cart\n- Drag an item from the inventory / cart onto the viewer: deposit / cart to storage\n- Drag an item onto the Favourites tab: adds it there; onto another tab: removes it\n- Enter: confirms the quantity (default = the whole stack)\n- Hovering an item: description (if enabled in Interface > Storage)\n- Click a column header: sorting; Subtype combo: fine filtering\n  (category and subtype tabs: can be turned off in the settings)\n- Columns, filter and hover: Moonlight > Game interface > Storage\n- Storage tabs (option): switch to an alternate storage\n- Right click a storage tab: rename it / give it an icon\n- Drag an item onto a storage tab: assign it ITS icon\n- Quit button / X: closes the storage
? "Raccourcis storage\n\n- Clic gauche sur un item : retrait (Maj = tout le stack ; 1 seul = direct ;\n  pile = menu contextuel : Vers l'inventaire 1 / tout / quantité)\n- Ctrl + clic gauche : (dé)marquer l'item comme favori (onglet Favoris)\n- Clic droit : menu contextuel (dont Ajouter / Retirer des favoris)\n- Ctrl + clic droit : description\n- Alt / Maj + clic droit : retrait rapide du stack complet vers l'inventaire\n- Glisser un item du viewer -> inventaire : retrait ; -> cart : storage vers cart\n- Glisser un item d'inventaire / cart sur le viewer : dépôt / cart vers storage\n- Glisser un item sur l'onglet Favoris : l'y ajoute ; sur un autre onglet : l'en retire\n- Entrée : valide la quantité (défaut = stack entier)\n- Survol d'un item : description (si activé dans Interface > Storage)\n- Clic sur un en-tête de colonne : tri ; combo Sous-type : filtre fin\n  (onglets de catégorie et sous-type : désactivables dans les options)\n- Colonnes, filtre et survol : Moonlight > Interface de jeu > Storage\n- Onglets de storage (option) : bascule vers un entrepôt alternatif\n- Clic droit sur un onglet de storage : le renommer / lui donner une icône\n- Glisser un item sur un onglet de storage : lui assigner SON icône\n- Bouton Quitter / X : ferme le storage"
