"Pas de réponse : la fabrication a probablement ÉCHOUÉ. La cuisine ne renvoie aucun message quand elle rate - seulement un effet visuel. Les matériaux sont consommés et la maîtrise culinaire baisse. Regarde les chances annoncées avant de recommencer. (Une demande refusée à la revalidation aurait le même silence, mais n'aurait rien consommé.)": "Sin respuesta: la fabricación probablemente ha FALLADO. La cocina no envía ningún mensaje cuando falla - solo un efecto visual. Los materiales se consumen y la maestría de cocina baja. Mira las probabilidades anunciadas antes de volver a empezar. (Una petición rechazada al revalidar sería igual de silenciosa, pero no habría consumido nada.)"
"Pas de réponse : la fabrication a probablement ÉCHOUÉ - ces compétences ne renvoient aucun message, ni en cas de succès ni en cas d'échec. Autre possibilité : une demande refusée à la revalidation des matériaux, qui elle n'aurait rien consommé.": "Sin respuesta: la fabricación probablemente ha FALLADO - estas habilidades no envían ningún mensaje, ni en caso de éxito ni de fallo. La otra posibilidad es una petición rechazada al revalidar los materiales, que no habría consumido nada."
