# en: ON: modern ImGui inventory (icon grid, tabs, search, double-click to use/equip, right click, drag), and the native window is hidden.\nOFF (default): classic native inventory, no viewer.\n\nIncludes the card SOCKETING window (double-click a card): it replaces the native « Insert Card » popup. The list of compatible equipment is still computed by the server, so it is identical to the native one.
"ON : inventaire ImGui moderne (grille d'icônes, onglets, recherche, double-clic utiliser/équiper, clic-droit, drag) et la fenêtre native est cachée.\nOFF (défaut) : inventaire natif classique, aucun viewer.\n\nInclut la fenêtre de SERTISSAGE de cartes (double-clic sur une carte) : elle remplace le popup natif « Insert Card ». La liste des équipements compatibles reste calculée par le serveur, donc identique au natif.": ""
