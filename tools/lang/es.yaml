"Coché, le preset rétablit exactement l'apparence enregistrée : il remet ses costumes et retire ceux qui n'en font pas partie.\n\nDécoché (défaut), il ne touche pas aux costumes portés.\n\nLes costumes portés au moment de l'enregistrement sont gardés dans le preset quoi qu'il arrive : cocher la case plus tard suffit, sans le ré-enregistrer.": "Marcado, el preset restablece exactamente la apariencia guardada: vuelve a poner sus costumes y quita los que no forman parte de él.\n\nDesmarcado (por defecto), no toca los costumes que llevas puestos.\n\nLos costumes que llevabas al guardar se conservan en el preset de todos modos: basta con marcar la casilla más tarde, sin volver a guardarlo."
