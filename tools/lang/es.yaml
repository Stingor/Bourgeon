# en: Replaces the right-click menu on an entity. The actions are not rewritten: they go back through the client's dispatcher, so its checks and confirmations still play. The client's menu only existed on a player, their pet, their homunculus and their mercenary — here it can also open on monsters and NPCs.
"Remplace le menu du clic droit sur une entité. Les actions ne sont pas réécrites : elles repassent par le dispatcher du client, donc ses vérifications et ses confirmations restent jouées. Le menu du client n'existait que sur un joueur, son pet, son homoncule et son mercenaire — ici il peut aussi s'ouvrir sur les monstres et les NPC.": ""
# en: Server rules
"Règles du serveur": ""
# en: General rules
"Règlements généraux": ""
# en: The server rules must be followed to the letter.\nAnyone not respecting the charter will be sanctioned as soon as possible.
"Les règles du serveur doivent être appliquées à la lettre.\nToute personne ne respectant pas la charte sera sanctionnée dans les plus brefs délais.": ""
# en: Players must respect each other and keep their language clean and courteous.
"Les joueurs doivent se respecter et garder un langage propre et courtois.": ""
# en: Remarks meant to push away a new player are forbidden.
"Les propos visant à rejeter un nouveau joueur sont interdits.": ""
# en: Using programs such as bots or hacks = permanent ban, no hesitation.
"L'utilisation de programmes tels que bots ou hacks = ban définitif sans hésitation.": ""
# en: Flooding is strictly forbidden.
"Le flood est strictement interdit.": ""
# en: You are entirely responsible for your own account.
"Vous êtes entièrement responsable de votre compte.": ""
# en: The staff does not give back lost items (NPC sale, failed de-slotting, failed refine).
"Le staff ne rend pas les items perdus (vente NPC, deslotage raté, refine raté).": ""
# en: The staff may exceptionally give back a lost item if the logs prove a server bug.
"Le staff peut exceptionnellement rendre un item perdu si les logs prouvent un bug serveur.": ""
# en: Never share your account or your password.
"Ne partagez jamais votre compte ou votre mot de passe.": ""
# en: Asking for support to set up a private server is not recommended.
"La demande de support pour créer un serveur privé est non recommandée.": ""
# en: Deliberately impersonating a staff member is punished.
"Le plagiat volontaire d'un membre du staff est puni.": ""
# en: Everything related to the server is the exclusive property of the administrators.
"Tout ce qui se rapporte au serveur est la propriété exclusive des administrateurs.": ""
# en: Text-speak is to be avoided.
"Le langage SMS est à proscrire.": ""
# en: Exploiting a bug or abusing it = sanction. Warn an administrator immediately.
"L'exploitation d'un bug ou abus = sanction. Prévenez immédiatement un administrateur.": ""
# en: If you abuse the cash shop by voting with several forum accounts… \nwatch out, it is like taxes: \nas long as you are not audited it is a party, but when they come down on you...
"Si vous abusez du cashshop en votant avec plusieurs comptes forum… \ngare à vous c'est comme avec les impôts, \ntant qu'on est pas contrôlé c'est la fête, mais quand ils vous tombent dessus...": ""
