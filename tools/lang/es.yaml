# en: Free item placement
"Placement libre des items": ""
# en: Drag an item onto an empty slot to pin it there; onto an occupied one, the two swap. Items with no assigned slot fill the remaining gaps, so a newly picked-up object no longer disturbs your layout.\n\nThe « All » tab is NOT concerned: it mixes categories, so a slot there does not designate the same place as in the item's own tab. It keeps automatic filling.\n\nRequires « Lock size »: slots are identified by an absolute index, which a change of width would shift.
"Glisse un item sur une case vide pour l'y fixer ; sur une case occupée, les deux s'échangent. Les items sans case attribuée remplissent les trous restants, donc un nouvel objet ramassé ne bouscule plus ta disposition.\n\nL'onglet « Tout » n'est PAS concerné : il mélange les catégories, donc une case n'y désigne pas le même emplacement que dans l'onglet d'origine de l'item. Il garde le remplissage automatique.\n\nNécessite « Verrouiller la taille » : les cases sont repérées par un index absolu, qu'un changement de largeur décalerait.": ""
