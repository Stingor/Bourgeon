# en: Chance that a normal attack lands.\n\n80 % + your HIT - the monster's FLEE, bounded between 5 % and 100 %.\n\nYour HIT is your BASE LEVEL + your DEX: half the computation therefore comes from your level, not from your points. The server caps the level's share (600 at present), beyond which only DEX still counts.\n\nIt accounts for neither skills nor conditional cards.
"Chance qu'une attaque normale porte.\n\n80 % + votre HIT - le FLEE du monstre, bornée entre 5 % et 100 %.\n\nVotre HIT vaut votre NIVEAU DE BASE + votre DEX : la moitié du calcul vient donc de votre niveau, pas de vos points. Le serveur plafonne la part du niveau (600 actuellement), au-delà seule la DEX compte encore.\n\nNe tient compte ni des compétences, ni des cartes conditionnelles.": ""
# en: Chance that an attack is a critical hit. This is NOT a damage multiplier.\n\nYour CRIT minus 0.2 point per LUK of the monster. A critical replaces the accuracy roll (it never misses) and ignores DEF.
"Chance qu'une attaque soit un coup critique. Ce n'est PAS un multiplicateur de dégâts.\n\nVotre CRIT moins 0,2 point par LUK du monstre. Un critique remplace le jet de précision (il ne rate jamais) et ignore la DEF.": ""
# en: Chance that one of its attacks actually reaches you, perfect dodge deducted.\n\n80 % + its HIT - your FLEE, bounded between 5 % and 100 %, then cut by your perfect dodge, which cancels the attack before any roll (it blocks even a critical).\n\nYour FLEE is your BASE LEVEL + your AGI: levelling up makes you dodge more without spending a point. The server caps the level's share (600 at present), beyond which only AGI still counts.\n\nYour FLEE also drops by 10 % per monster beyond the second one targeting you: in a pack, the real figure is higher.
"Chance qu'une de ses attaques vous atteigne réellement, esquive parfaite déduite.\n\n80 % + son HIT - votre FLEE, bornée entre 5 % et 100 %, puis amputée de votre esquive parfaite, qui annule l'attaque avant tout jet (elle bloque même un critique).\n\nVotre FLEE vaut votre NIVEAU DE BASE + votre AGI : monter de niveau vous fait esquiver davantage, sans dépenser un point. Le serveur plafonne la part du niveau (600 actuellement), au-delà seule l'AGI compte encore.\n\nVotre FLEE chute par ailleurs de 10 % par monstre au-delà du deuxième qui vous prend pour cible : en pack, le chiffre réel est plus élevé.": ""
