# en: Drag a rectangle with the mouse, like the Windows snipping tool. The area is remembered: after that, the key below is enough.\n\nThe recorded image is the one you see — world, native interface AND Bourgeon windows. The frame and the indicator, however, are drawn outside the area: they never appear in the GIF.\n\nPressing the key a second time stops before the end.
