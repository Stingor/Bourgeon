"L'espace entre deux lignes. À 0 elles se touchent.": "El espacio entre dos líneas. A 0 se tocan."
"La marge au-dessus et au-dessous du contenu d'une ligne.\nSans effet tant que le cadre RO est affiché : sa hauteur est imposée par la taille de ses tuiles.": "El margen encima y debajo del contenido de una línea.\nSin efecto mientras se muestre el marco RO: su altura la impone el tamaño de sus baldosas."
"Le cadre clair du client. Décoché, le fond libre ci-dessous prend sa place.": "El marco claro del cliente. Desmarcado, el fondo libre de abajo ocupa su lugar."
