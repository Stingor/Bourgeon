"Joue les images de l'animation (ex. le balayage de la posture Combat). Décoche pour figer une pose calme (image 0).": "Reproduce los fotogramas de la animación (p. ej. el barrido de la postura de Combate). Desmarca para congelar una pose tranquila (fotograma 0)."
