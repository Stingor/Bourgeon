"inconnus": "desconocidos"
"Activer le mode Ciblage + HUD": "Activar el modo Objetivo + HUD"
"La cible est la dernière entité cliquée. Le HUD s'allume dessus et y reste quand on cesse de l'attaquer ; la flèche de ciblage du jeu la suit aussi longtemps. Tout s'éteint si la cible change, si elle s'éloigne hors de vue, ou par « Masquer la fenêtre de cible » dans le menu contextuel de l'entité.\n\nDécoché, TOUT ce qui suit s'arrête : le HUD, la flèche, les raccourcis de ciblage, le clic sans attaque, les cadres qui agissent et les sorts qui partent sur la cible.": "El objetivo es la última entidad en la que has hecho clic. El HUD se enciende sobre ella y se queda ahí cuando dejas de atacarla; la flecha de objetivo del juego la sigue el mismo tiempo. Todo se apaga si el objetivo cambia, si se aleja fuera de vista, o con \"Ocultar la ventana de objetivo\" en el menú contextual de la entidad.\n\nDesmarcado, TODO lo que sigue se detiene: el HUD, la flecha, los atajos de objetivo, el clic sin ataque, los marcos que actúan y los hechizos que van al objetivo."
"Fige les cadres et laisse passer les clics vers le jeu. À décocher pour les déplacer : on saisit un cadre n'importe où, ses BORDS le redimensionnent.": "Fija los marcos y deja pasar los clics al juego. Desmárcalo para moverlos: agarra un marco por cualquier sitio, sus BORDES lo redimensionan."
"Mode placement (garder les cadres sans cible)": "Modo colocación (mantener los marcos sin objetivo)"
"Sans cible il n'y a rien à attraper : ce mode garde les cadres à l'écran le temps de les poser. À décocher une fois le HUD en place.": "Sin objetivo no hay nada que agarrar: este modo mantiene los marcos en pantalla mientras los colocas. Desmárcalo cuando el HUD esté en su sitio."
"Liseré autour des cadres": "Borde alrededor de los marcos"
"Aimanter les cadres entre eux": "Imantar los marcos entre sí"
"Pendant un déplacement, les bords s'alignent sur ceux des autres cadres. CTRL + déplacement emmène en bloc tous les cadres qui se touchent.": "Al arrastrar, los bordes se alinean con los de los demás marcos. CTRL + arrastrar mueve en bloque todos los marcos que se tocan."
"Orientation": "Orientación"
"0 = de face, comme le portrait du personnage.": "0 = de frente, como el retrato del personaje."
"Action": "Acción"
"Un monstre est un sprite, un joueur est un assemblage (corps, tête, coiffes, cape) monté par le composeur de pantin. Les classes rendues par un modèle 3D (Emperium, gardiens, coffres) n'ont pas de sprite : le cadre le dit.": "Un monstruo es un sprite, un jugador es un montaje (cuerpo, cabeza, tocados, capa) armado por el compositor de muñeco. Las clases dibujadas con un modelo 3D (Emperium, guardianes, cofres) no tienen sprite: el marco lo dice."
"Ciblage": "Objetivo"
"Flèche de ciblage du jeu sur la cible": "Flecha de objetivo del juego sobre el objetivo"
"Le petit triangle blanc au-dessus de l'entité. Le jeu ne l'affiche que tant que la souris engage la cible : il disparaît dès qu'on regarde ailleurs, et le ciblage au clavier ne l'allume pas du tout. Coché, il suit la cible du HUD aussi longtemps qu'elle.": "El pequeño triángulo blanco sobre la entidad. El juego solo lo muestra mientras el ratón mantiene el objetivo: desaparece en cuanto miras a otro lado, y el objetivo con el teclado no lo enciende en absoluto. Marcado, sigue al objetivo del HUD todo el tiempo que dure."
"Le clic cible sans attaquer": "El clic selecciona sin atacar"
"Cliquer une entité la prend pour cible, mais n'engage rien : le personnage ne se déplace pas vers elle et ne frappe pas.\n\nPour attaquer, DOUBLE-CLIQUE — ou passe par « Attaquer » du menu contextuel. Le délai du double-clic est celui de Windows.\n\nLes compétences ne sont pas concernées, ni les ordres au pet, à l'homoncule ou au mercenaire, ni s'asseoir.": "Hacer clic en una entidad la toma como objetivo, pero no engancha nada: tu personaje ni se desplaza hacia ella ni la golpea.\n\nPara atacar, HAZ DOBLE CLIC — o usa \"Atacar\" en el menú contextual. El retardo del doble clic es el de Windows.\n\nLas habilidades no se ven afectadas, ni las órdenes a tu mascota, homúnculo o mercenario, ni sentarse."
"Les sorts ciblés partent sur la cible": "Los hechizos con objetivo van al objetivo"
"Une compétence ciblée demande normalement deux gestes : la touche arme la visée, le clic désigne qui. Coché, c'est la cible du HUD qui répond — la souris n'a plus à être sur l'entité.\n\nElle garde la priorité quand elle désigne vraiment quelqu'un : ce réglage comble un vide, il ne détourne pas une visée. Les sorts de zone ne sont pas concernés, ils visent une case.\n\nComme tout QuickCast, maintenir la touche relance la compétence sur la cible.": "Una habilidad con objetivo pide normalmente dos gestos: la tecla arma la puntería, el clic dice a quién. Marcado, responde el objetivo del HUD — el ratón ya no tiene que estar sobre la entidad.\n\nEl ratón conserva la prioridad cuando señala a alguien de verdad: este ajuste llena un vacío, no desvía una puntería. Los hechizos de zona no están afectados, apuntan a una casilla.\n\nComo todo QuickCast, mantener la tecla relanza la habilidad sobre el objetivo."
"Les cadres agissent comme la cible": "Los marcos actúan como el objetivo"
"Sans effet : les cadres ne sont pas verrouillés, le clic sert à les déplacer.": "Sin efecto: los marcos no están bloqueados, el clic sirve para moverlos."
"Cliquer un cadre du HUD revient à cliquer l'entité elle-même : attaque, compétence ciblée armée — c'est le même chemin du client qui est rejoué.\n\nUn SEUL clic attaque, même si « le clic cible sans attaquer » est coché : ce réglage lève l'ambiguïté d'un clic dans le monde, et il n'y en a aucune sur un cadre — la cible est déjà désignée.\n\n⚠ Un cadre qui agit REPREND LA SOURIS au jeu tant que le curseur est dessus : ni clic vers le sol derrière, ni rotation de caméra. Il ne le fait que quand il y a une cible ET que le clic aurait un sens — un sort de zone vise une case, le cadre lui laisse alors le passage.\n\nSans effet tant que les cadres ne sont pas verrouillés : le clic sert alors à les poser.": "Hacer clic en un marco del HUD equivale a hacer clic en la entidad misma: ataque, habilidad con objetivo armada — se reproduce el mismo camino del cliente.\n\nUn SOLO clic ataca, aunque \"El clic selecciona sin atacar\" esté marcado: ese ajuste resuelve la ambigüedad de un clic en el mundo, y en un marco no hay ninguna — el objetivo ya está designado.\n\n⚠ Un marco que actúa LE QUITA EL RATÓN al juego mientras el cursor está encima: ni clic hacia el suelo de detrás, ni rotación de cámara. Solo lo hace cuando hay un objetivo Y el clic tendría sentido — un hechizo de zona apunta a una casilla, y entonces el marco le deja paso.\n\nSin efecto mientras los marcos no estén bloqueados: el clic sirve entonces para colocarlos."
"Ciblage au clavier": "Objetivo con el teclado"
"Deux actions à lier dans l'écran des raccourcis : « Cible suivante » et « Cible précédente ». Elles passent d'un monstre à l'autre parmi ceux qui sont à l'écran, du plus proche au plus loin. Tab et Maj+Tab conviennent bien, et restent au chat tant que la barre de saisie a le focus.": "Dos acciones que enlazar en la pantalla de atajos: \"Objetivo siguiente\" y \"Objetivo anterior\". Pasan de un monstruo en pantalla al siguiente, del más cercano al más lejano. Tab y Mayús+Tab van bien, y siguen siendo del chat mientras la barra de escritura tenga el foco."
"Boucler après la dernière cible": "Volver al primero tras el último objetivo"
"Cadres": "Marcos"
"Race / élément": "Raza / elemento"
"États": "Estados"
"Réinitialiser la disposition": "Restablecer la disposición"
"Repose les cinq cadres à leur place d'origine, en haut à gauche. Les couleurs et les interrupteurs ne bougent pas.": "Devuelve los cinco marcos a su sitio original, arriba a la izquierda. Los colores y los interruptores no cambian."
"Cible suivante": "Objetivo siguiente"
"Cible précédente": "Objetivo anterior"
"Cible la plus proche": "Objetivo más cercano"
"Cycler entre les fenêtres": "Alternar entre las ventanas"
"Reprendre au plus proche après (ms)": "Volver al más cercano tras (ms)"
"Passé ce délai sans cycler, le prochain appui repart du monstre le plus proche au lieu de continuer où le cycle en était.\n\nC'est ce qui sépare les deux usages du cyclage : enchaîner les appuis pour PARCOURIR ce qu'il y a autour, ou appuyer une fois pour PRENDRE une cible. Sans ce délai, le second héritait de la position laissée par le premier — on rappuyait après un combat et on repartait au cinquième monstre.\n\n0 = jamais : le cycle se souvient indéfiniment.": "Pasado este retardo sin ciclar, la siguiente pulsación vuelve a empezar por el monstruo más cercano en lugar de continuar donde iba el ciclo.\n\nEso es lo que separa los dos usos del ciclado: pulsar seguido para RECORRER lo que hay alrededor, o pulsar una vez para TOMAR un objetivo. Sin este retardo el segundo heredaba la posición dejada por el primero — volvías a pulsar tras un combate y empezabas por el quinto monstruo.\n\n0 = nunca: el ciclo recuerda indefinidamente."
"Trois actions à lier dans l'écran des raccourcis : « Cible suivante », « Cible précédente » et « Cible la plus proche ». Les deux premières passent d'un monstre à l'autre parmi ceux qui sont à l'écran, du plus proche au plus loin ; la troisième prend directement le plus proche, sans rien parcourir. Tab et Maj+Tab conviennent bien, et restent au chat tant que la barre de saisie a le focus.": "Tres acciones que vincular en la pantalla de atajos: \"Objetivo siguiente\", \"Objetivo anterior\" y \"Objetivo más cercano\". Las dos primeras pasan de un monstruo a otro entre los que están en pantalla, del más cercano al más lejano; la tercera toma directamente el más cercano, sin recorrer nada. Tab y Mayús+Tab van bien, y siguen siendo del chat mientras la barra de escritura tenga el foco."
"Quatre actions à lier dans l'écran des raccourcis : « Cible suivante », « Cible précédente », « Cible la plus proche » et « Effacer la cible ». Les deux premières passent d'un monstre à l'autre parmi ceux qui sont à l'écran, du plus proche au plus loin ; la troisième prend directement le plus proche, sans rien parcourir ; la quatrième lâche la cible. Tab et Maj+Tab conviennent bien, et restent au chat tant que la barre de saisie a le focus.": "Cuatro acciones que vincular en la pantalla de atajos: \"Objetivo siguiente\", \"Objetivo anterior\", \"Objetivo más cercano\" y \"Quitar el objetivo\". Las dos primeras pasan de un monstruo a otro entre los que están en pantalla, del más cercano al más lejano; la tercera toma directamente el más cercano, sin recorrer nada; la cuarta suelta el objetivo. Tab y Mayús+Tab van bien, y siguen siendo del chat mientras la barra de escritura tenga el foco."
"Effacer la cible": "Quitar el objetivo"
"Échap efface la cible": "Escape quita el objetivo"
"Échap lâche d'abord la cible, et n'ouvre le menu du jeu que s'il n'y en avait pas.\n\nLa touche n'est prise que si le déciblage a vraiment eu lieu : sans cible, Échap fait ce qu'il a toujours fait.\n\nElle passe en dernier, après les fenêtres qu'Échap referme et la barre de chat — un même appui ne fait jamais deux choses.": "Escape suelta primero el objetivo, y solo abre el menú del juego si no había ninguno.\n\nLa tecla se toma únicamente si de verdad se ha quitado el objetivo: sin objetivo, Escape hace lo que siempre ha hecho.\n\nPasa en último lugar, después de las ventanas que Escape cierra y de la barra de chat — una misma pulsación nunca hace dos cosas."
"Masquer la fenêtre de cible": "Ocultar la ventana de objetivo"
"Pour cette cible seulement : elle revient dès que tu en désignes une autre.": "Solo para este objetivo: vuelve en cuanto elijas otro."

# Outillage JOUEUR du staff (entity_context_menu.cc) : le port du NPC cache
# #gmclicdroit dans le sous-menu « Outils du staff » — faire venir, asseoir,
# points d'event, mute, jail, nuke, ban, + les deux modales.
"Le faire venir ici": "Traerlo aquí"
"Il MARCHE jusqu'à vous — il n'est pas téléporté : le trajet reste visible pour lui comme pour les autres.\nSur votre carte seulement, et seulement s'il existe un chemin. Le serveur le relève d'abord s'il est assis.": "CAMINA hasta ti — no se teletransporta: el trayecto queda visible para él y para los demás.\nSolo en tu mapa, y solo si existe un camino. El servidor lo pone de pie primero si está sentado."
"L'asseoir ou le relever": "Sentarlo o levantarlo"
"Une bascule : le serveur regarde dans quelle position il est et pose l'autre.": "Un interruptor: el servidor mira en qué postura está y pone la otra."
"Points d'event…": "Puntos de evento…"
"Donne ou retire des points d'event (la monnaie kafra), au plus 50 à la fois.\nLe solde actuel n'est PAS ici : il se lit dans « Propriétés… », que le serveur renseigne.": "Da o quita puntos de evento (la moneda kafra), 50 como máximo cada vez.\nEl saldo actual NO está aquí: se lee en \"Propiedades…\", que rellena el servidor."
"Le rendre muet (60 min)": "Silenciarlo (60 min)"
"Ajoute 60 minutes de silence. Appliqué deux fois, il prolonge — ce n'est pas un interrupteur.": "Añade 60 minutos de silencio. Aplicado dos veces, se prolonga — no es un interruptor."
"Lui rendre la parole": "Devolverle la palabra"
"Le foudroyer": "Fulminarlo"
"@nuke : une explosion sur sa case. Il meurt, avec la pénalité de mort habituelle.": "@nuke: una explosión en su casilla. Muere, con la penalización de muerte habitual."
"Bannir le compte…": "Banear la cuenta…"
"@block : bannissement DÉFINITIF du compte, pas du personnage. Tous ses personnages tombent avec lui.": "@block: baneo DEFINITIVO de la CUENTA, no del personaje. Todos sus personajes caen con él."
"Outils du staff": "Herramientas del staff"
"Bannir ce compte###bourgeon_ctxmenu_confirm": "Banear esta cuenta###bourgeon_ctxmenu_confirm"
"Points d'event###bourgeon_ctxmenu_confirm": "Puntos de evento###bourgeon_ctxmenu_confirm"
"Bannir le compte de %s ?": "¿Banear la cuenta de %s?"
"C'est le COMPTE qui tombe, pas ce personnage : tous\nles autres personnages du même compte deviennent\ninaccessibles, et le bannissement n'a pas de fin.": "Es la CUENTA la que cae, no este personaje: todos\nlos demás personajes de la misma cuenta quedan\ninaccesibles, y el baneo no tiene fin."
"Pour le lever : @unblock <nom du personnage>.\nPour une sanction qui expire, préférez @ban.": "Para levantarlo: @unblock <nombre del personaje>.\nPara una sanción que expira, mejor @ban."
"Bannir": "Banear"
"Points d'event de %s": "Puntos de evento de %s"
"à donner###ctxmenu_points": "a dar###ctxmenu_points"
"Négatif pour retirer. Ctrl+clic sur la barre pour taper\nla valeur. Le serveur reborne, et refuse de faire\ndescendre le solde sous zéro.\nLe solde actuel se lit dans « Propriétés… ».": "Negativo para quitar. Ctrl+clic en la barra para escribir\nel valor. El servidor vuelve a limitar, y se niega a bajar\nel saldo por debajo de cero.\nEl saldo actual se lee en \"Propiedades…\"."
"L'emprisonner ou le libérer": "Encarcelarlo o liberarlo"
"Une bascule : le serveur regarde s'il est déjà en prison et fait l'inverse.\nUn joueur emprisonné vit sur sec_pri — hors de cette carte, cette entrée ne peut que l'y envoyer. Sans durée : pour une peine bornée, @jailfor.": "Un interruptor: el servidor mira si ya está en la cárcel y hace lo contrario.\nUn jugador encarcelado vive en sec_pri — fuera de ese mapa esta entrada solo puede enviarlo allí. Sin duración: para una pena limitada, @jailfor."

