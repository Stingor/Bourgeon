name: Discord Commit Notification

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      count:
        description: "Nombre de commits à rejouer"
        required: false
        default: "10"

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Build commit list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/commits?per_page=${{ inputs.count }}&sha=master" \
              | jq '[.[] | {id: .sha, message: .commit.message, timestamp: .commit.author.date, author: {name: .commit.author.name}}]' \
              > /tmp/commits.json
          else
            jq '.commits' "$GITHUB_EVENT_PATH" > /tmp/commits.json
          fi
          jq -c '.[]' /tmp/commits.json > /tmp/commits.jsonl

      - name: Send commits to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -euo pipefail

          # Discord limite une description d'embed à 4096 caractères :
          # on découpe en plusieurs messages plutôt que d'échouer en 400.
          MAX_DESC=3800
          # borne par commit, en gardant de la marge pour les préfixes "> "
          MAX_MSG=3000

          send_embed() {
            local description="$1"
            local title="$2"
            [ -n "$description" ] || return 0

            jq -n --arg description "$description" --arg title "$title" '{
              embeds: [{
                title: $title,
                description: $description,
                color: 5814783
              }]
            }' > /tmp/payload.json

            curl -fsSL -H "Content-Type: application/json" \
                 -X POST \
                 -d @/tmp/payload.json \
                 "$DISCORD_WEBHOOK"
            sleep 1
          }

          title="Nouveaux commits poussés (Bourgeon Plugins):"
          msg=""

          while IFS= read -r commit; do
            ts=$(echo "$commit" | jq -r .timestamp)
            # le titre seul va dans le lien : un lien markdown ne supporte
            # pas les retours à la ligne
            subject=$(echo "$commit" | jq -r '.message | split("\n")[0] | .[0:200]')
            # corps en citation : une ligne indentée serait recollée à la
            # précédente par Discord, "> " préserve les retours à la ligne
            body=$(echo "$commit" | jq -r --argjson max "$MAX_MSG" '
              .message
              | (if (length > $max) then .[0:$max] + "\n…" else . end)
              | rtrimstr("\n")
              | split("\n")
              | .[1:]
              | map(select(test("^\\s*Co-Authored-By:"; "i") | not))
              | map("\n> " + .)
              | join("")
            ')
            # lignes de citation vides laissées en fin par les trailers filtrés
            while [[ "$body" == *$'\n> ' ]]; do
              body="${body%$'\n> '}"
            done
            sha=$(echo "$commit" | jq -r .id)
            url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${sha}"
            formatted=$(TZ="Europe/Paris" date -d "$ts" "+%d/%m/%Y %H:%M")
            line="- \`${formatted}\` — [${subject}](${url})${body}"

            if [ -n "$msg" ] && [ $(( ${#msg} + ${#line} + 1 )) -gt "$MAX_DESC" ]; then
              send_embed "$msg" "$title"
              title="… (suite)"
              msg=""
            fi

            msg="${msg}${line}"$'\n'
          done < /tmp/commits.jsonl

          send_embed "$msg" "$title"

      - name: Send commits to changelog
        run: |
          while IFS= read -r commit; do
            body=$(echo "$commit" | jq -c '{
              hash: .id,
              message: .message,
              timestamp: .timestamp,
              author: .author.name
            }')
            curl -fsSL -X POST "https://moonlight-destiny.fr/changelog_api.php" \
              -H "Authorization: Bearer ${{ secrets.CHANGELOG_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "$body"
          done < /tmp/commits.jsonl
