name: Catalogues de langue

# Deux pannes de traduction que rien d'autre ne signale, et qui ont en commun de
# ne PAS se voir à la relecture du code français.
#
# 1. Le prix du choix « le français EST la clé » (cf. src/utils/i18n.h) : retoucher
#    un libellé français tue SILENCIEUSEMENT sa traduction. `Tr` ne trouve plus la
#    clé et retombe en français — pas de crash, pas de warning, rien.
#
# 2. Un texte TRADUIT passé en position de format à ImGui. Les fonctions de texte
#    sont printf-like : un pour-cent dans la traduction y devient une
#    spécification, et printf lit un argument que personne n'a poussé. Le français
#    d'origine peut n'en porter aucun — c'est le catalogue qui crée le défaut, et
#    il s'édite hors compilation. L'anglais porte déjà « 100 % straight away ».
#
# Ils ne compilent rien : ils lisent le source et les catalogues. Quelques secondes.

on:
  push:
    paths:
      - "src/**"
      - "tools/lang/*.yaml"
      - "tools/lang/check_catalog.ps1"
      - "tools/lang/check_format_strings.py"
      - ".github/workflows/i18n.yml"
  pull_request:
    paths:
      - "src/**"
      - "tools/lang/*.yaml"
      - "tools/lang/check_catalog.ps1"
      - "tools/lang/check_format_strings.py"
      - ".github/workflows/i18n.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      # 🔴 PAS de `actions/checkout` : ce dépôt n'autorise que les actions lui
      # appartenant, et `actions/checkout` appartient à GitHub. C'est la même
      # contrainte qui fait passer main.yml par l'API REST plutôt que par le
      # dépôt lui-même. Le clone se fait donc à la main — c'est cinq lignes.
      #
      # On récupère le SHA POUSSÉ et non la tête de la branche : entre le
      # déclenchement et le clone, un autre push peut être passé, et on
      # vérifierait alors un état que personne n'a demandé. GitHub autorise le
      # fetch par SHA, c'est exactement ce que fait actions/checkout.
      #
      # `--depth 1` : on ne lit que l'arbre de travail, l'historique ne sert à
      # rien ici et le dépôt est gros.
      #
      # ⚠ Le jeton n'apparaît pas en clair dans les logs : GitHub n'y résout pas
      # les variables d'environnement, et masque de toute façon GITHUB_TOKEN.
      - name: Recuperer le depot
        id: checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      # `pwsh` est préinstallé sur les runners ubuntu ; le script est portable
      # (chemins par [IO.Path]::Combine, lecture explicite en UTF-8).
      - name: en.yaml
        shell: pwsh
        run: ./tools/lang/check_catalog.ps1 -Catalog tools/lang/en.yaml

      # Un échec sur l'anglais ne doit pas masquer l'état de l'espagnol : on veut
      # les DEUX rapports en une seule exécution, sinon on corrige, on repousse,
      # et on découvre le second problème au tour suivant.
      #
      # ⚠ `always()` SEUL relancerait aussi quand le clone a échoué — le script
      # sortirait alors sur une erreur de fichier introuvable, qui ne veut rien
      # dire. D'où la condition sur l'étape de clone.
      - name: es.yaml
        if: always() && steps.checkout.outcome == 'success'
        shell: pwsh
        run: ./tools/lang/check_catalog.ps1 -Catalog tools/lang/es.yaml

      # Même raison que pour l'espagnol : on veut le rapport COMPLET en une
      # exécution. Ce contrôle-ci est indépendant des deux précédents — il ne lit
      # aucun catalogue, seulement la façon dont le source appelle ImGui.
      #
      # python3 est préinstallé sur les runners ubuntu. Le script porte ses propres
      # témoins et refuse de rendre un verdict s'ils échouent : un détecteur devenu
      # aveugle sortirait « OK » sur un dépôt cassé, ce qui est pire que rien.
      - name: Chaines de format
        if: always() && steps.checkout.outcome == 'success'
        run: python3 tools/lang/check_format_strings.py src
